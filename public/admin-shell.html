<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Admin OVC</title>
<style>
html,body{height:100%;margin:0;background:#08080f;color:#f1f1f1;font-family:Inter,Arial,sans-serif}.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.loader b{font-size:14px}.loader span{font-size:12px;color:#888}.err{max-width:560px;margin:20vh auto;background:#0f0f1a;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:22px;line-height:1.5}
</style>
</head>
<body>
<div class="loader"><b>Carregando Centro de Comando OVC</b><span>Preparando ferramentas administrativas...</span></div>
<script>
(async function(){
  try {
    const r = await fetch('/admin/index.html', { cache: 'no-store' });
    if (!r.ok) throw new Error('Falha ao carregar admin original: HTTP ' + r.status);
    let html = await r.text();
    const tools = '<script src="/admin-tools.js?v=20260528-2"><\/script>';
    html = html.replace('</body>', tools + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="err"><h1>Admin indisponível</h1><p>' + String(e.message || e) + '</p><p>Acesse <a style="color:#f87171" href="/admin/index.html">/admin/index.html</a> como contingência.</p></div>';
  }
})();
</script>
</body>
</html>
