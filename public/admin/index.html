<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin OVC — Centro de Comando</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg-main: #08080f;
    --bg-card: #0f0f1a;
    --bg-sidebar: #0a0a14;
    --bg-input: #111120;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #c81e1e;
    --accent-hover: #e02222;
    --accent-subtle: rgba(200,30,30,0.08);
    --yellow: #ffc800;
    --green: #16a34a;
    --green-subtle: rgba(22,163,74,0.15);
    --red-subtle: rgba(200,30,30,0.15);
    --yellow-subtle: rgba(255,200,0,0.15);
    --text-primary: #f1f1f1;
    --text-secondary: #888;
    --text-tertiary: #555;
    --font: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg-main);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

  /* LOGIN */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-main);
    background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,30,30,0.06) 0%, transparent 70%);
  }
  .login-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 8px;
  }
  .login-logo span.ovc {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.08em;
  }
  .login-logo span.accent { color: var(--accent); }
  .login-tagline {
    text-align: center;
    font-size: 12px;
    color: var(--text-tertiary);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .login-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .login-input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 150ms ease;
    margin-bottom: 20px;
  }
  .login-input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 150ms ease, transform 80ms ease;
    letter-spacing: 0.02em;
  }
  .login-btn:hover { background: var(--accent-hover); }
  .login-btn:active { transform: scale(0.99); }
  .login-error {
    text-align: center;
    color: var(--accent);
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }

  /* LAYOUT */
  .app-layout {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-primary);
  }
  .sidebar-logo .acc { color: var(--accent); }
  .sidebar-tagline {
    font-size: 11px;
    color: var(--text-tertiary);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .sidebar-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-tertiary);
    padding: 20px 20px 6px;
  }
  .sidebar-nav { flex: 1; padding: 8px 0; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 13.5px;
    font-weight: 400;
    transition: background 150ms ease, color 150ms ease;
    border-left: 2px solid transparent;
    user-select: none;
  }
  .nav-item:hover {
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
  }
  .nav-item.active {
    border-left: 2px solid var(--accent);
    background: var(--accent-subtle);
    color: var(--text-primary);
    font-weight: 500;
  }
  .nav-icon { font-size: 16px; opacity: 0.8; }
  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  .sidebar-version {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 10px;
  }
  .btn-sair {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 12px;
    padding: 8px;
    cursor: pointer;
    transition: all 150ms ease;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .btn-sair:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

  /* MAIN */
  .main-content {
    flex: 1;
    overflow-y: auto;
    background: var(--bg-main);
  }
  .page-header {
    padding: 32px 36px 24px;
    border-bottom: 1px solid var(--border);
  }
  .page-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .page-sub {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-top: 3px;
  }
  .page-body { padding: 28px 36px; }

  /* CARDS */
  .metrics-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .metric-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    position: relative;
    transition: box-shadow 150ms ease, border-color 150ms ease;
  }
  .metric-card:hover {
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    border-color: var(--border-hover);
  }
  .metric-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
  }
  .metric-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1;
  }
  .metric-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 20px;
    opacity: 0.25;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 8px;
  }
  .badge-green { background: var(--green-subtle); color: var(--green); }
  .badge-red { background: var(--red-subtle); color: var(--accent); }
  .badge-yellow { background: var(--yellow-subtle); color: var(--yellow); }

  /* PANEL */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    transition: box-shadow 150ms ease;
  }
  .panel:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--bg-sidebar); }
  th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    font-weight: 500;
    padding: 10px 16px;
    text-align: left;
    white-space: nowrap;
  }
  td {
    padding: 11px 16px;
    font-size: 13px;
    color: var(--text-primary);
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr { transition: background 150ms ease; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .status-success { background: var(--green-subtle); color: var(--green); }
  .status-error { background: var(--red-subtle); color: var(--accent); }
  .status-duplicate { background: var(--yellow-subtle); color: var(--yellow); }
  .status-pending { background: var(--yellow-subtle); color: var(--yellow); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    border: none;
    transition: all 150ms ease;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.1); }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }
  .btn-destructive { background: rgba(200,30,30,0.1); color: var(--accent); border: 1px solid rgba(200,30,30,0.2); }
  .btn-destructive:hover { background: rgba(200,30,30,0.2); }
  .btn-sm { font-size: 11px; padding: 5px 10px; }
  .btn-green { background: rgba(22,163,74,0.15); color: var(--green); border: 1px solid rgba(22,163,74,0.2); }
  .btn-green:hover { background: rgba(22,163,74,0.25); }

  /* INPUTS */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .form-input, .form-select {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 150ms ease;
    appearance: none;
  }
  .form-input:focus, .form-select:focus { border-color: rgba(200,30,30,0.5); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }

  /* SWITCH */
  .switch-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    transition: background 200ms ease;
  }
  .switch.on { background: var(--accent); }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: transform 200ms ease;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .switch.on::after { transform: translateX(18px); }
  .switch-label { font-size: 13px; color: var(--text-primary); }

  /* MISC */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-tertiary);
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
  .empty-text { font-size: 13px; }
  .loading { text-align: center; padding: 40px; color: var(--text-tertiary); font-size: 13px; }
  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .text-secondary { color: var(--text-secondary); }
  .text-small { font-size: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .gap-8 { display: flex; gap: 8px; flex-wrap: wrap; }
  .mt-16 { margin-top: 16px; }
  .mt-8 { margin-top: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; }
  .p-24 { padding: 24px; }
  .p-16 { padding: 16px 24px; }
  .response-box {
    background: #060610;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 12px;
    color: var(--green);
    font-family: 'Courier New', monospace;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 12px;
  }
  .pagination {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .pagination-info { font-size: 12px; color: var(--text-tertiary); flex: 1; }
  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .alert-info { background: rgba(255,200,0,0.08); border: 1px solid rgba(255,200,0,0.2); color: var(--yellow); }
  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// — SUPABASE CONFIG —
const SUPABASE_URL = 'https://bfsegqdgscudtdgwdyci.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Unww7VA8g1mlixn65Mq0EA_WhG0L-S_';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SENHA = 'ovc-admin-2026-secreto';

// — UTILS —
function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function truncate(str, n=60) { return str && str.length > n ? str.slice(0,n)+'…' : (str||'—'); }

// — ICONS —
const Icon = ({ name, size=16 }) => {
  const icons = {
    dashboard: '⬛',
    pipeline: '⚙️',
    posts: '📄',
    instagram: '📸',
    rss: '📡',
    engagement: '💬',
    logs: '📋',
    config: '🔧',
    logout: '↩',
    play: '▶',
    pause: '⏸',
    refresh: '↻',
    add: '+',
    check: '✓',
    x: '✕',
    alert: '⚠',
    ok: '●',
    error: '●',
  };
  return <span style={{fontSize:size}}>{icons[name]||'·'}</span>;
};

// ——————————————————————————————————————————
// MÓDULO 1 — LOGIN
// ——————————————————————————————————————————
function Login({ onLogin }) {
  const [pwd, setPwd] = useState('');
  const [err, setErr] = useState('');
  const handle = () => {
    if (pwd === SENHA) { onLogin(); }
    else { setErr('Senha incorreta. Tente novamente.'); }
  };
  const onKey = e => { if (e.key === 'Enter') handle(); };
  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-logo">
          <span className="ovc">O <span className="accent">VALOR</span> CAPITAL</span>
        </div>
        <div className="login-tagline">Centro de Comando</div>
        <label className="login-label">Senha de acesso</label>
        <input
          className="login-input"
          type="password"
          placeholder="••••••••••••••••••••"
          value={pwd}
          onChange={e => { setPwd(e.target.value); setErr(''); }}
          onKeyDown={onKey}
          autoFocus
        />
        <button className="login-btn" onClick={handle}>Entrar</button>
        <div className="login-error">{err}</div>
      </div>
    </div>
  );
}

// ——————————————————————————————————————————
// MÓDULO 2 — DASHBOARD GLOBAL
// ——————————————————————————————————————————
function Dashboard() {
  const [data, setData] = useState(null);
  const [recentPosts, setRecentPosts] = useState([]);
  const [recentLogs, setRecentLogs] = useState([]);
  const [running, setRunning] = useState(false);
  const [runResult, setRunResult] = useState('');
  const [forcing, setForcing] = useState(false);

  const load = useCallback(async () => {
    try {
      const res = await fetch('/api/status');
      if (res.ok) {
        const j = await res.json();
        setData(j);
        setRunning(j.running);
      }
    } catch(_) {}
    const { data: posts } = await sb.from('posts').select('*').order('created_at', {ascending:false}).limit(10);
    setRecentPosts(posts||[]);
    const { data: logs } = await sb.from('logs').select('*').order('created_at', {ascending:false}).limit(10);
    setRecentLogs(logs||[]);
  }, []);

  useEffect(() => { load(); const t = setInterval(load, 30000); return () => clearInterval(t); }, [load]);

  const forceRun = async () => {
    if (forcing) return;
    setForcing(true);
    setRunResult('Executando pipeline...');
    try {
      const res = await fetch('/api/run', { method:'POST' });
      const j = await res.json();
      setRunResult(JSON.stringify(j, null, 2));
      load();
    } catch(e) {
      setRunResult('Erro: ' + e.message);
    }
    setForcing(false);
  };

  const postsHoje = data?.posts_hoje ?? recentPosts.filter(p => {
    const d = new Date(p.created_at);
    const hoje = new Date();
    return d.toDateString() === hoje.toDateString();
  }).length;

  const postsSemana = data?.posts_semana ?? recentPosts.length;

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Dashboard Global</div>
        <div className="page-sub">Visão em tempo real do ecossistema OVC</div>
      </div>
      <div className="page-body">
        <div className="metrics-row">
          <div className="metric-card">
            <div className="metric-label">Posts Hoje</div>
            <div className="metric-value">{postsHoje}</div>
            <div className="metric-icon">📤</div>
            <span className="badge badge-green">limite: 60</span>
          </div>
          <div className="metric-card">
            <div className="metric-label">Posts na Semana</div>
            <div className="metric-value">{postsSemana}</div>
            <div className="metric-icon">📊</div>
          </div>
          <div className="metric-card">
            <div className="metric-label">Automação</div>
            <div className="metric-value" style={{fontSize:22, paddingTop:6}}>{running ? 'ATIVA' : 'PAUSADA'}</div>
            <div className="metric-icon">{running ? '🟢' : '🔴'}</div>
            <span className={`badge ${running ? 'badge-green' : 'badge-red'}`}>{running ? 'Rodando' : 'Parada'}</span>
          </div>
          <div className="metric-card">
            <div className="metric-label">Execução Manual</div>
            <div style={{marginTop:8}}>
              <button className="btn btn-primary" onClick={forceRun} disabled={forcing}>
                {forcing ? '⏳ Executando...' : '▶ Forçar agora'}
              </button>
            </div>
            <div className="metric-icon">⚡</div>
          </div>
        </div>

        {runResult && <div className="response-box">{runResult}</div>}

        <div className="grid-2 mt-16">
          <div className="panel">
            <div className="panel-header">
              <span className="panel-title">Últimos 10 Posts</span>
              <button className="btn btn-secondary btn-sm" onClick={load}>↻ Atualizar</button>
            </div>
            {recentPosts.length === 0 ? (
              <div className="empty-state"><div className="empty-icon">📄</div><div className="empty-text">Nenhum post encontrado</div></div>
            ) : (
              <table>
                <thead><tr><th>Título</th><th>Status</th><th>Data</th></tr></thead>
                <tbody>
                  {recentPosts.map(p => (

// MÓDULO 3 — PIPELINE / AUTOMAÇÃO
// ——————————————————————————————————————————
function Pipeline() {
  const [automation, setAutomation] = useState(null);
  const [maxPosts, setMaxPosts] = useState(60);
  const [interval, setInterval2] = useState(10);
  const [execucoes, setExecucoes] = useState([]);
  const [forcing, setForcing] = useState(false);
  const [lastResult, setLastResult] = useState('');
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  const load = useCallback(async () => {
    const { data: cfgs } = await sb.from('config').select('*');
    if (cfgs) {
      const auto = cfgs.find(c => c.key === 'AUTOMATION');
      const mp = cfgs.find(c => c.key === 'MAX_POSTS_DIA');
      const iv = cfgs.find(c => c.key === 'INTERVALO');
      setAutomation(auto ? auto.value === 'on' : false);
      if (mp) setMaxPosts(parseInt(mp.value)||60);
      if (iv) setInterval2(parseInt(iv.value)||10);
    }
    const { data: logs } = await sb.from('logs').select('*').order('created_at', {ascending:false}).limit(20);
    setExecucoes(logs||[]);
  }, []);

  useEffect(() => { load(); }, [load]);

  const toggleAutomation = async () => {
    const newVal = !automation;
    setAutomation(newVal);
    await sb.from('config').upsert({ key: 'AUTOMATION', value: newVal ? 'on' : 'off', updated_at: new Date().toISOString() }, { onConflict: 'key' });
    setMsg('Automação ' + (newVal ? 'ativada' : 'pausada'));
    setTimeout(() => setMsg(''), 3000);
  };

  const saveConfig = async () => {
    setSaving(true);
    await sb.from('config').upsert({ key: 'MAX_POSTS_DIA', value: String(maxPosts), updated_at: new Date().toISOString() }, { onConflict: 'key' });
    await sb.from('config').upsert({ key: 'INTERVALO', value: String(interval), updated_at: new Date().toISOString() }, { onConflict: 'key' });
    setSaving(false);
    setMsg('Configurações salvas');
    setTimeout(() => setMsg(''), 3000);
  };

  const forceRun = async () => {
    if (forcing) return;
    setForcing(true);
    setLastResult('Iniciando execução...');
    try {
      const res = await fetch('/api/run', { method: 'POST' });
      const j = await res.json();
      setLastResult(JSON.stringify(j, null, 2));
      load();
    } catch(e) { setLastResult('Erro: ' + e.message); }
    setForcing(false);
  };

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Pipeline / Automação</div>
        <div className="page-sub">Controle do pipeline editorial automatizado</div>
      </div>
      <div className="page-body">
        {msg && <div className="alert alert-info">{msg}</div>}

        <div className="panel mb-20">
          <div className="panel-header"><span className="panel-title">Status da Automação</span></div>
          <div className="p-24">
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:16}}>
              <div className="switch-wrap" onClick={toggleAutomation}>
                <div className={`switch ${automation ? 'on' : ''}`}></div>
                <span className="switch-label">
                  {automation === null ? 'Carregando...' : automation ? '🟢 Automação ATIVA' : '🔴 Automação PAUSADA'}
                </span>
              </div>
              <button className="btn btn-primary" onClick={forceRun} disabled={forcing}>
                {forcing ? '⏳ Executando...' : '▶ Forçar execução agora'}
              </button>
            </div>
            {lastResult && <div className="response-box">{lastResult}</div>}
          </div>
        </div>

        <div className="panel mb-20">
          <div className="panel-header"><span className="panel-title">Parâmetros</span></div>
          <div className="p-24">
            <div className="form-row">
              <div className="form-group">
                <label className="form-label">MAX Posts por Dia</label>
                <input className="form-input" type="number" min={1} max={60} value={maxPosts} onChange={e => setMaxPosts(Number(e.target.value))} />
              </div>
              <div className="form-group">
                <label className="form-label">Intervalo entre execuções (minutos)</label>
                <input className="form-input" type="number" min={1} value={interval} onChange={e => setInterval2(Number(e.target.value))} />
              </div>
            </div>
            <button className="btn btn-primary" onClick={saveConfig} disabled={saving}>
              {saving ? 'Salvando...' : 'Salvar parâmetros'}
            </button>
          </div>
        </div>

        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">Execuções Recentes (Logs)</span>
            <button className="btn btn-secondary btn-sm" onClick={load}>↻ Atualizar</button>
          </div>
          {execucoes.length === 0 ? (
            <div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">Nenhuma execução registrada</div></div>
          ) : (
            <table>
              <thead><tr><th>Nível</th><th>Mensagem</th><th>Data</th></tr></thead>
              <tbody>
                {execucoes.map(e => (
                  <tr key={e.id}>
                    <td><span className={`status-pill status-${e.level === 'error' ? 'error' : e.level === 'success' ? 'success' : 'pending'}`}>{e.level}</span></td>
                    <td>{truncate(e.message, 70)}</td>
                    <td className="text-secondary text-small">{fmt(e.created_at)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// MÓDULO 4 — POSTAGENS
// ——————————————————————————————————————————
function Postagens() {
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [page, setPage] = useState(0);
  const PER = 50;

  const load = useCallback(async () => {
    setLoading(true);
    let q = sb.from('posts').select('*', { count: 'exact' }).order('created_at', { ascending: false }).range(page*PER, (page+1)*PER-1);
    if (filter !== 'all') q = q.eq('status', filter);
    const { data, error } = await q;
    setPosts(data||[]);
    setLoading(false);
  }, [filter, page]);

  useEffect(() => { load(); }, [load]);

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Postagens</div>
        <div className="page-sub">Histórico de todos os posts processados</div>
      </div>
      <div className="page-body">
        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">Filtrar por status</span>
            <div className="gap-8">
              {['all','success','error','duplicate'].map(f => (
                <button key={f} className={`btn btn-sm ${filter===f ? 'btn-primary' : 'btn-secondary'}`} onClick={() => { setFilter(f); setPage(0); }}>
                  {f === 'all' ? 'Todos' : f}
                </button>
              ))}
              <button className="btn btn-secondary btn-sm" onClick={load}>↻</button>
            </div>
          </div>
          {loading ? (
            <div className="loading">Carregando...</div>
          ) : posts.length === 0 ? (
            <div className="empty-state"><div className="empty-icon">📄</div><div className="empty-text">Nenhum post encontrado</div></div>
          ) : (
            <>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>#</th><th>Título</th><th>Hash</th><th>Status</th><th>Data</th></tr>
                  </thead>
                  <tbody>
                    {posts.map(p => (
                      <tr key={p.id}>
                        <td className="text-secondary text-small">{p.id}</td>
                        <td>{truncate(p.titulo, 55)}</td>
                        <td className="text-secondary text-small" style={{fontFamily:'monospace'}}>{p.hash ? p.hash.slice(0,10)+'…' : '—'}</td>
                        <td><span className={`status-pill status-${p.status}`}><span className="dot"></span>{p.status}</span></td>
                        <td className="text-secondary text-small">{fmt(p.created_at)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="pagination">
                <span className="pagination-info">Página {page+1} · {PER} por página</span>
                <button className="btn btn-secondary btn-sm" onClick={() => setPage(p => Math.max(0,p-1))} disabled={page===0}>← Anterior</button>
                <button className="btn btn-secondary btn-sm" onClick={() => setPage(p => p+1)} disabled={posts.length < PER}>Próxima →</button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function FontesRSS() {

  const load = async () => {
    setLoading(true);
    const { data } = await sb.from('rss_sources').select('*').order('created_at', {ascending:false});
    setFontes(data||[]);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const addFonte = async (name, url) => {
    const n = name || form.name;
    const u = url || form.url;
    if (!n || !u) { setMsg('Preencha nome e URL.'); return; }
    setSaving(true);
    const { error } = await sb.from('rss_sources').insert({ name:n, url:u, active:true, created_at: new Date().toISOString() });

    else { setMsg('Erro: ' + error.message); }
    setSaving(false);
    setTimeout(() => setMsg(''), 4000);
  };

  const toggleFonte = async (id, active) => {
    await sb.from('rss_sources').update({ active: !active }).eq('id', id);
    load();
  };

  const seedDefaults = async () => {
    setSaving(true);
    for (const d of DEFAULT_RSS) {
      const exists = fontes.find(f => f.url === d.url);
      if (!exists) await sb.from('rss_sources').insert({ name:d.name, url:d.url, active:true, created_at: new Date().toISOString() });

    setMsg('Fontes padrão adicionadas.');

                <label className="form-label">Nome da fonte</label>
                <input className="form-input" placeholder="Ex: CNN Brasil" value={form.name} onChange={e => setForm(f=>({...f, name:e.target.value}))} />
              </div>
              <div className="form-group">
                <label className="form-label">URL do feed RSS</label>
                <input className="form-input" placeholder="https://..." value={form.url} onChange={e => setForm(f=>({...f, url:e.target.value}))} />
              </div>
            </div>
            <button className="btn btn-primary" onClick={() => addFonte()} disabled={saving}>+ Adicionar fonte</button>
          </div>
        </div>

        <div className="panel">

            <button className="btn btn-secondary btn-sm" onClick={load}>↻ Atualizar</button>
          </div>
          {loading ? <div className="loading">Carregando...</div> : fontes.length === 0 ? (
            <div className="empty-state"><div className="empty-icon">📡</div><div className="empty-text">Nenhuma fonte cadastrada. Use o botão acima para adicionar as fontes padrão.</div></div>
          ) : (
            <table>
              <thead><tr><th>Nome</th><th>URL</th><th>Status</th><th>Último Fetch</th><th>Ações</th></tr></thead>

                        {f.active ? 'Desativar' : 'Ativar'}
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

              <div style={{fontSize:12, color:'var(--text-tertiary)', marginBottom:10}}>Registrar ação executada:</div>
              {CONTAS_GRUPO.map(conta => (
                <div key={conta} style={{display:'flex', alignItems:'center', gap:8, marginBottom:8, flexWrap:'wrap'}}>
                  <span className="tag" style={{minWidth:160}}>{conta}</span>
                  {['like','save','comentário'].map(acao => {
                    const key = `${p.id}-${acao}-${conta}`;
                    const done = acoes[key];
                    return (
                      <button key={acao} className={`btn btn-sm ${done ? 'btn-green' : 'btn-secondary'}`} onClick={() => registrarAcao(p.id, acao, conta)}>
                        {done ? '✓ ' : ''}{acao}
                      </button>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ——————————————————————————————————————————
// MÓDULO 8 — LOGS
// ——————————————————————————————————————————
function Logs() {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [dateFrom, setDateFrom] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    let q = sb.from('logs').select('*').order('created_at', {ascending:false}).limit(200);
    if (filter !== 'all') q = q.eq('level', filter);
    if (dateFrom) q = q.gte('created_at', dateFrom);
    const { data } = await q;
    setLogs(data||[]);
    setLoading(false);
  }, [filter, dateFrom]);

  useEffect(() => { load(); const t = setInterval(load, 15000); return () => clearInterval(t); }, [load]);

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Logs do Sistema</div>
        <div className="page-sub">Histórico de todas as operações — atualização automática a cada 15s</div>
      </div>
      <div className="page-body">
        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">Filtros</span>
            <div className="gap-8">
              {['all','info','success','error'].map(f => (
                <button key={f} className={`btn btn-sm ${filter===f ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setFilter(f)}>
                  {f === 'all' ? 'Todos' : f}
                </button>
              ))}
              <input type="date" className="form-input" style={{width:'auto', padding:'5px 10px', fontSize:12}} value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
              <button className="btn btn-secondary btn-sm" onClick={load}>↻</button>
            </div>
          </div>
          {loading ? <div className="loading">Carregando...</div> : logs.length === 0 ? (
            <div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">Nenhum log encontrado</div></div>
          ) : (
            <table>
              <thead><tr><th>#</th><th>Nível</th><th>Mensagem</th><th>Data</th></tr></thead>
              <tbody>
                {logs.map(l => (
                  <tr key={l.id}>
                    <td className="text-secondary text-small">{l.id}</td>
                    <td>
                      <span className={`status-pill status-${l.level === 'error' ? 'error' : l.level === 'success' ? 'success' : 'pending'}`}>
                        <span className="dot"></span>{l.level}
                      </span>
                    </td>
                    <td style={{maxWidth:500, wordBreak:'break-word'}}>{l.message}</td>
                    <td className="text-secondary text-small">{fmt(l.created_at)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// ——————————————————————————————————————————
// MÓDULO 9 — CONFIGURAÇÕES
// ——————————————————————————————————————————
function Configuracoes() {
  const [cfg, setCfg] = useState({ MAX_POSTS_DIA:'60', INTERVALO:'10', AI_MODEL:'gpt-4o-mini', FALLBACK:'skip' });
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  const load = async () => {
    setLoading(true);
    const { data } = await sb.from('config').select('*');
    if (data) {
      const map = {};
      data.forEach(c => { map[c.key] = c.value; });
      setCfg(c => ({...c, ...map}));
    }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const save = async () => {
    setSaving(true);
    for (const [key, value] of Object.entries(cfg)) {
      await sb.from('config').upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    }
    setSaving(false);
    setMsg('Configurações salvas com sucesso.');
    setTimeout(() => setMsg(''), 4000);
  };

  if (loading) return <div className="loading">Carregando...</div>;

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Configurações</div>
        <div className="page-sub">Parâmetros globais do ecossistema OVC</div>
      </div>
      <div className="page-body">
        {msg && <div className="alert alert-info">{msg}</div>}

        <div className="panel">
          <div className="panel-header"><span className="panel-title">Parâmetros do pipeline</span></div>
          <div className="p-24">
            <div className="form-row">
              <div className="form-group">
                <label className="form-label">MAX Posts por Dia</label>
                <input className="form-input" type="number" min={1} max={60} value={cfg.MAX_POSTS_DIA} onChange={e => setCfg(c=>({...c, MAX_POSTS_DIA:e.target.value}))} />
              </div>
              <div className="form-group">
                <label className="form-label">Intervalo entre execuções (min)</label>
                <input className="form-input" type="number" min={1} value={cfg.INTERVALO} onChange={e => setCfg(c=>({...c, INTERVALO:e.target.value}))} />
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label className="form-label">Modelo de IA</label>
                <select className="form-select" value={cfg.AI_MODEL} onChange={e => setCfg(c=>({...c, AI_MODEL:e.target.value}))}>
                  <option value="gpt-4o-mini">gpt-4o-mini (padrão)</option>
                  <option value="gpt-4o">gpt-4o</option>
                  <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Comportamento de fallback</label>
                <select className="form-select" value={cfg.FALLBACK} onChange={e => setCfg(c=>({...c, FALLBACK:e.target.value}))}>
                  <option value="skip">skip — pular post com erro</option>
                  <option value="retry">retry — tentar novamente</option>
                  <option value="log">log — registrar e continuar</option>
                </select>
              </div>
            </div>
            <div className="divider"></div>
            <button className="btn btn-primary" onClick={save} disabled={saving}>
              {saving ? 'Salvando...' : 'Salvar todas as configurações'}
            </button>
          </div>
        </div>

        <div className="panel mt-16">
          <div className="panel-header"><span className="panel-title">Supabase e Infraestrutura</span></div>
          <div className="p-24">
            <div style={{display:'grid', gap:10}}>
              <div style={{display:'flex', gap:12, alignItems:'center'}}>
                <span className="tag">Supabase Project</span>
                <span style={{fontSize:12, color:'var(--text-secondary)', fontFamily:'monospace'}}>bfsegqdgscudtdgwdyci</span>
              </div>
              <div style={{display:'flex', gap:12, alignItems:'center'}}>
                <span className="tag">Deploy</span>
                <span style={{fontSize:12, color:'var(--text-secondary)'}}>Vercel → GitHub (auto push)</span>
              </div>
              <div style={{display:'flex', gap:12, alignItems:'center'}}>
                <span className="tag">Cron</span>
                <span style={{fontSize:12, color:'var(--text-secondary)'}}>GitHub Actions · */10 * * * *</span>
              </div>
              <div style={{display:'flex', gap:12, alignItems:'center'}}>
                <span className="tag">Portal</span>
                <span style={{fontSize:12, color:'var(--accent)'}}>
                  <a href="https://www.ovalorcapital.com.br" target="_blank" rel="noopener noreferrer" style={{color:'inherit', textDecoration:'none'}}>ovalorcapital.com.br ↗</a>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ——————————————————————————————————————————
// APP ROOT
// ——————————————————————————————————————————
const PAGES = [
  { id:'dashboard', label:'Dashboard', icon:'📊', component: Dashboard },
  { id:'pipeline', label:'Pipeline', icon:'⚙️', component: Pipeline },
  { id:'posts', label:'Postagens', icon:'📄', component: Postagens },
  { id:'instagram', label:'Contas Instagram', icon:'📸', component: ContasInstagram },
  { id:'rss', label:'Fontes RSS', icon:'📡', component: FontesRSS },
  { id:'engajamento', label:'Engajamento', icon:'💬', component: Engajamento },
  { id:'logs', label:'Logs', icon:'📋', component: Logs },
  { id:'config', label:'Configurações', icon:'🔧', component: Configuracoes },
];

function App() {
  const [logged, setLogged] = useState(false);
  const [page, setPage] = useState('dashboard');

  if (!logged) return <Login onLogin={() => setLogged(true)} />;

  const Current = PAGES.find(p => p.id === page)?.component || Dashboard;

  return (
    <div className="app-layout">
      <aside className="sidebar">
        <div className="sidebar-header">
          <div className="sidebar-logo">O <span className="acc">VALOR</span> CAP.</div>
          <div className="sidebar-tagline">Centro de Comando</div>
        </div>
        <nav className="sidebar-nav">
          <div className="sidebar-section-label">Navegação</div>
          {PAGES.map(p => (
            <div
              key={p.id}
              className={`nav-item ${page === p.id ? 'active' : ''}`}
              onClick={() => setPage(p.id)}
            >
              <span>{p.icon}</span>
              <span>{p.label}</span>
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="sidebar-version">Admin OVC v3.0 · 2026</div>
          <button className="btn-sair" onClick={() => setLogged(false)}>↩ Sair</button>
        </div>
      </aside>
      <main className="main-content">
        <Current />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
