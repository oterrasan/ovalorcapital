<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDC - Centro de Comando • O Valor Capital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .nav-item { transition: all 0.2s; }
    .nav-item:hover { background-color: #f8fafc; }
  </style>
</head>
<body class="bg-white">

  <div class="flex h-screen">

    <!-- Sidebar -->
    <div class="w-72 bg-white border-r border-slate-200 p-6 flex flex-col">
      <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">VC</div>
        <h1 class="text-2xl font-semibold">CDC</h1>
      </div>

      <div class="space-y-1">
        <div onclick="showPage('dashboard')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-2xl cursor-pointer bg-slate-100 font-medium">
          <i class="fa-solid fa-house w-5"></i> Dashboard
        </div>
        <div onclick="showPage('fila')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-2xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-list-check w-5"></i> Fila de Aprovação
        </div>
        <div onclick="showPage('fontes')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-2xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-rss w-5"></i> Fontes
        </div>
        <div onclick="showPage('contas')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-2xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-users w-5"></i> Contas
        </div>
        <div onclick="showPage('relatorios')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-2xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-chart-bar w-5"></i> Relatórios
        </div>
        <div onclick="showPage('logs')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-2xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-clock-rotate-left w-5"></i> Logs
        </div>
      </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="flex-1 p-10 overflow-auto" id="main-content">
      <h1 class="text-4xl font-semibold mb-8">Dashboard</h1>
      
      <div class="grid grid-cols-4 gap-6">
        <div class="bg-white border border-slate-200 rounded-3xl p-8">
          <p class="text-slate-500">Posts hoje</p>
          <p class="text-5xl font-semibold mt-3">28</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-3xl p-8">
          <p class="text-slate-500">Aguardando aprovação</p>
          <p class="text-5xl font-semibold mt-3 text-amber-600">11</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-3xl p-8">
          <p class="text-slate-500">Publicados esta semana</p>
          <p class="text-5xl font-semibold mt-3">94</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-3xl p-8">
          <p class="text-slate-500">Taxa de aprovação</p>
          <p class="text-5xl font-semibold mt-3 text-emerald-600">93%</p>
        </div>
      </div>

      <div class="mt-12 bg-white border border-slate-200 rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-6">Fila de Aprovação</h2>
        <div class="text-center py-12 text-slate-400">
          Nenhum post pendente no momento.
        </div>
      </div>
    </div>
  </div>

  <script>
    function showPage(page) {
      const content = document.getElementById('main-content');
      
      if (page === 'fila') {
        content.innerHTML = `
          <h1 class="text-4xl font-semibold mb-8">Fila de Aprovação</h1>
          <div class="bg-white border border-slate-200 rounded-3xl p-8">
            <p class="text-slate-400 text-center py-12">Nenhum post pendente no momento.</p>
          </div>`;
      } else if (page === 'fontes') {
        content.innerHTML = `<h1 class="text-4xl font-semibold mb-8">Fontes</h1><p class="text-slate-400">Em desenvolvimento...</p>`;
      } else if (page === 'contas') {
        content.innerHTML = `<h1 class="text-4xl font-semibold mb-8">Contas Conectadas</h1><p class="text-slate-400">Em desenvolvimento...</p>`;
      } else if (page === 'relatorios') {
        content.innerHTML = `<h1 class="text-4xl font-semibold mb-8">Relatórios</h1><p class="text-slate-400">Em desenvolvimento...</p>`;
      } else if (page === 'logs') {
        content.innerHTML = `<h1 class="text-4xl font-semibold mb-8">Logs</h1><p class="text-slate-400">Em desenvolvimento...</p>`;
      } else {
        content.innerHTML = `
          <h1 class="text-4xl font-semibold mb-8">Dashboard</h1>
          <div class="grid grid-cols-4 gap-6">
            <div class="bg-white border border-slate-200 rounded-3xl p-8">
              <p class="text-slate-500">Posts hoje</p>
              <p class="text-5xl font-semibold mt-3">28</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-3xl p-8">
              <p class="text-slate-500">Aguardando aprovação</p>
              <p class="text-5xl font-semibold mt-3 text-amber-600">11</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-3xl p-8">
              <p class="text-slate-500">Publicados esta semana</p>
              <p class="text-5xl font-semibold mt-3">94</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-3xl p-8">
              <p class="text-slate-500">Taxa de aprovação</p>
              <p class="text-5xl font-semibold mt-3 text-emerald-600">93%</p>
            </div>
          </div>`;
      }
    }
  </script>
</body>
</html>
