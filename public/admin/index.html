<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Admin OVC - Centro de Comando</title>
<style>
html,body{height:100%;margin:0;background:#08080f;color:#f1f1f1;font-family:Inter,Arial,sans-serif}.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.loader b{font-size:14px}.loader span{font-size:12px;color:#888}.err{max-width:560px;margin:20vh auto;background:#0f0f1a;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:22px;line-height:1.5}
</style>
</head>
<body>
<div class="loader"><b>Carregando Centro de Comando OVC</b><span>Preparando admin unico...</span></div>
<script>
(async function(){
  try {
    const r = await fetch('/admin-source.txt', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    const parsed = new DOMParser().parseFromString(html, 'text/html');

    document.title = parsed.title || document.title;
    parsed.head.querySelectorAll('link,style,meta').forEach(node => {
      if (node.tagName === 'META' && node.getAttribute('charset')) return;
      document.head.appendChild(node.cloneNode(true));
    });

    const scripts = Array.from(parsed.querySelectorAll('script'));
    const bodyClone = parsed.body.cloneNode(true);
    bodyClone.querySelectorAll('script').forEach(s => s.remove());
    document.body.innerHTML = bodyClone.innerHTML;

    const loadScript = src => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Falha ao carregar ' + src));
      document.head.appendChild(s);
    });

    for (const s of scripts.filter(s => s.src)) {
      await loadScript(s.src);
    }

    for (const s of scripts.filter(s => !s.src)) {
      const type = (s.type || '').toLowerCase();
      const code = type === 'text/babel'
        ? Babel.transform(s.textContent, { presets: ['react'] }).code
        : s.textContent;
      const out = document.createElement('script');
      out.textContent = code;
      document.body.appendChild(out);
    }

    await loadScript('/admin-tools.js?v=20260528-4');
  } catch (e) {
    document.body.innerHTML = '<div class="err"><h1>Admin indisponivel</h1><p>Nao foi possivel carregar o Centro de Comando agora. Atualize a pagina em alguns segundos.</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
