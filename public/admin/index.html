<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - O Valor Capital</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #f5f5f5; }
.screen { display: none; }
.screen.active { display: block; }
.login-box { max-width: 400px; margin: 100px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
.login-box h1 { margin-bottom: 20px; }
.login-box input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
.login-box button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
.error { color: #d32f2f; margin-top: 15px; }
.topbar { background: #1a1a1a; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
.btn-logout { padding: 8px 20px; background: #d32f2f; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
.container { display: flex; height: calc(100vh - 80px); }
.sidebar { width: 250px; background: white; padding: 20px; border-right: 1px solid #e0e0e0; }
.tab-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: #f5f5f5; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-weight: 600; }
.tab-btn.active { background: #0066cc; color: white; }
.main { flex: 1; padding: 40px; overflow-y: auto; }
.tab { display: none; }
.tab.active { display: block; }
label { display: block; margin: 20px 0 8px; font-weight: 600; }
input[type="text"], textarea, select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.checkbox-group { margin: 20px 0; }
.actions { display: flex; gap: 15px; margin-top: 30px; }
.btn-primary, .btn-secondary { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #0066cc; color: white; }
.btn-secondary { background: #f0f0f0; color: #333; }
.status { margin-top: 20px; padding: 12px; border-radius: 6px; text-align: center; }
.status.success { background: #e8f5e9; color: #2e7d32; }
.status.error { background: #ffebee; color: #c62828; }
#image-preview img { max-width: 300px; margin-top: 10px; border-radius: 8px; }
.article-card { padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 15px; }
.article-card h3 { margin-bottom: 10px; color: #0066cc; }
.article-card .meta { font-size: 13px; color: #666; margin-bottom: 10px; }
.article-card button { margin-right: 10px; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn-approve { background: #4caf50; color: white; }
.btn-reject { background: #f44336; color: white; }
  </style>
</head>
<body>
  <div id="login" class="screen active">
    <div class="login-box">
      <h1>🔐 Admin OVC</h1>
      <input type="password" id="token" placeholder="Token de acesso">
      <button onclick="login()">Entrar</button>
      <div id="error" class="error"></div>
    </div>
  </div>

  <div id="admin" class="screen">
    <nav class="topbar">
      <h1>📝 Portal O Valor Capital</h1>
      <button onclick="logout()" class="btn-logout">Sair</button>
    </nav>

    <div class="container">
      <div class="sidebar">
        <button onclick="showTab('criar')" class="tab-btn active">➕ Criar Artigo</button>
        <button onclick="showTab('pendentes')" class="tab-btn">⏳ Pendentes (<span id="count-pendentes">0</span>)</button>
        <button onclick="showTab('publicados')" class="tab-btn">✅ Publicados (<span id="count-publicados">0</span>)</button>
        <button onclick="showTab('instagram')" class="tab-btn">📱 Instagram</button>
      </div>

      <div class="main">
        <div id="tab-criar" class="tab active">
          <h2>Criar Novo Artigo</h2>
          
          <label>Título *</label>
          <input type="text" id="titulo" placeholder="Título do artigo">

          <div class="row">
            <div>
              <label>Categoria *</label>
              <select id="categoria" onchange="updateSubcategorias()"></select>
            </div>
            <div>
              <label>Subcategoria</label>
              <select id="subcategoria"></select>
            </div>
          </div>

          <label>Resumo</label>
          <textarea id="resumo" rows="3" placeholder="Resumo do artigo"></textarea>

          <label>Conteúdo * (Editor Visual)</label>
          <div id="conteudo" style="height: 400px; background: white;"></div>
          <input type="hidden" id="conteudo-html">

          <label>Imagem de Capa * (será redimensionada automaticamente)</label>
          <input type="file" id="imagem" accept="image/*" onchange="previewImage(event)">
          <div id="image-preview"></div>

          <label>Autor</label>
          <input type="text" id="autor" value="Redação OVC">

          <div class="checkbox-group">
            <label>
              <input type="checkbox" id="publicar-instagram" onchange="toggleInstagram()">
              Publicar no Instagram (máx 10/dia)
            </label>
          </div>

          <div id="instagram-fields" style="display:none">
            <label>Legenda Instagram</label>
            <textarea id="legenda-instagram" rows="4" placeholder="Texto para o Instagram"></textarea>
          </div>

          <div class="actions">
            <button onclick="createArticle()" class="btn-primary">📤 Criar Artigo</button>
            <button onclick="generateWithAI()" class="btn-secondary">🤖 Gerar com IA</button>
          </div>

          <div id="status" class="status"></div>
        </div>

        <div id="tab-pendentes" class="tab">
          <h2>Artigos Pendentes</h2>
          <div id="list-pendentes"></div>
        </div>

        <div id="tab-publicados" class="tab">
          <h2>Artigos Publicados</h2>
          <div id="list-publicados"></div>
        </div>

        <div id="tab-instagram" class="tab">
          <h2>Fila Instagram</h2>
          <div id="instagram-info"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
const API_BASE = window.location.origin;
let token = null;

const CATEGORIES = {
  "Política": ["Executivo", "Legislativo", "Judiciário", "Projetos de lei", "Eleições", "Agenda regulatória", "Geral"],
  "Economia": ["Monetária", "Fiscal", "Conjuntura", "Internacional", "Minuto Fiscal", "Geral"],
  "Negócios": ["Empreender", "Tributação PJ", "Gestão Financeira", "Crédito", "Vendas & Preço", "Contratos & Societário", "LGPD & Compliance", "Startups", "Geral"],
  "Investimentos": ["Renda Fixa", "Renda Variável", "Fundos", "Previdência", "Alternativos", "Estratégias", "Calendário & Dividendos", "Educação do investidor", "Geral"],
  "Seguros": ["Saúde & Odonto", "Vida", "Auto", "Residencial", "Empresarial & RC", "Viagem", "KPIs", "Geral"],
  "Mercados": ["Bolsa", "Juros", "Câmbio", "Commodities", "Cripto", "IPOs", "Índices", "Cotações", "Geral"],
  "Educação": ["Trilha Zero", "Finanças Pessoais", "Carreira & Empregos", "Cursos", "Parcerias", "Glossário", "Workshops", "Geral"],
  "Indústria": ["Construção & Imobiliário", "Energia & Infra", "Agro", "Mineração", "Química", "Automotivo", "Logística", "Indústria 4.0", "Geral"],
  "Tecnologia": ["IA & Dados", "Fintechs", "Blockchain", "Cibersegurança", "Cloud", "Telecom", "Hardware", "Software", "Geral"],
  "Consumo": ["Varejo", "Alimentação", "Moda", "E-commerce", "Turismo", "Entretenimento", "Geral"],
  "Saúde": ["Medicina", "Farmacêutico", "Hospitalar", "Healthtech", "Regulação", "Geral"],
  "Jurídico": ["Tributário", "Trabalhista", "Cível", "Criminal", "Regulatório", "Compliance", "Geral"],
  "Internacional": ["EUA", "Europa", "China", "América Latina", "Geopolítica", "Comércio", "Geral"]
};

async function login() {
  token = document.getElementById('token').value;
  const response = await fetch(`${API_BASE}/api/auth/validate-token?token=${token}`);
  const data = await response.json();
  
  if (data.valid) {
    localStorage.setItem('adminToken', token);
    document.getElementById('login').classList.remove('active');
    document.getElementById('admin').classList.add('active');
    initAdmin();
  } else {
    document.getElementById('error').textContent = 'Token inválido';
  }
}

function logout() {
  localStorage.removeItem('adminToken');
  location.reload();
}

function initAdmin() {
  populateCategories();
  
  // Inicializar Quill Editor
  window.quillEditor = new Quill('#conteudo', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ 'header': [2, 3, false] }],
        ['bold', 'italic', 'underline'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['link', 'image'],
        ['clean']
      ]
    }
  });
  
  loadArticles();
  loadInstagramInfo();
}

function populateCategories() {
  const select = document.getElementById('categoria');
  select.innerHTML = '<option value="">Selecione...</option>';
  Object.keys(CATEGORIES).forEach(cat => {
    select.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
}

function updateSubcategorias() {
  const categoria = document.getElementById('categoria').value;
  const select = document.getElementById('subcategoria');
  select.innerHTML = '<option value="">Selecione...</option>';
  if (categoria && CATEGORIES[categoria]) {
    CATEGORIES[categoria].forEach(sub => {
      select.innerHTML += `<option value="${sub}">${sub}</option>`;
    });
  }
}

function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (tab !== 'criar') loadArticles();
}

function toggleInstagram() {
  document.getElementById('instagram-fields').style.display = 
    document.getElementById('publicar-instagram').checked ? 'block' : 'none';
}

function previewImage(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      document.getElementById('image-preview').innerHTML = 
        `<img src="${event.target.result}" alt="Preview">`;
    };
    reader.readAsDataURL(file);
  }
}

async function createArticle() {
  const titulo = document.getElementById('titulo').value;
  const categoria = document.getElementById('categoria').value;
  const subcategoria = document.getElementById('subcategoria').value;
  const resumo = document.getElementById('resumo').value;
  const conteudo = window.quillEditor.root.innerHTML;
  const autor = document.getElementById('autor').value;
  const publicar_instagram = document.getElementById('publicar-instagram').checked;
  const legenda_instagram = document.getElementById('legenda-instagram').value;
  
  const fileInput = document.getElementById('imagem');
  if (!fileInput.files[0]) {
    showStatus('Selecione uma imagem', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = async function(e) {
    const imagem = e.target.result;

    const response = await fetch(`${API_BASE}/api/articles/create`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ titulo, categoria, subcategoria, resumo, conteudo, autor, imagem, publicar_instagram, legenda_instagram })
    });

    const data = await response.json();
    if (data.success) {
      showStatus('Artigo criado com sucesso!', 'success');
      clearForm();
      loadArticles();
    } else {
      showStatus(data.error, 'error');
    }
  };
  reader.readAsDataURL(fileInput.files[0]);
}

function clearForm() {
  document.getElementById('titulo').value = '';
  document.getElementById('categoria').value = '';
  document.getElementById('subcategoria').value = '';
  document.getElementById('resumo').value = '';
  window.quillEditor.setContents([]);
  document.getElementById('imagem').value = '';
  document.getElementById('image-preview').innerHTML = '';
  document.getElementById('publicar-instagram').checked = false;
  document.getElementById('legenda-instagram').value = '';
  toggleInstagram();
}

function showStatus(msg, type) {
  const status = document.getElementById('status');
  status.textContent = msg;
  status.className = `status ${type}`;
  setTimeout(() => status.className = 'status', 5000);
}

async function loadArticles() {
  const [pendentes, publicados] = await Promise.all([
    fetch(`${API_BASE}/api/articles/list?status=pendente`).then(r => r.json()),
    fetch(`${API_BASE}/api/articles/list?status=publicado`).then(r => r.json())
  ]);

  document.getElementById('count-pendentes').textContent = pendentes.articles?.length || 0;
  document.getElementById('count-publicados').textContent = publicados.articles?.length || 0;

  document.getElementById('list-pendentes').innerHTML = pendentes.articles?.map(a => `
    <div class="article-card">
      <h3>${a.titulo}</h3>
      <div class="meta">${a.categoria} • ${a.autor} • ${new Date(a.created_at).toLocaleDateString('pt-BR')}</div>
      <button class="btn-approve" onclick="approveArticle('${a.id}')">✅ Aprovar</button>
      <button class="btn-reject">❌ Rejeitar</button>
    </div>
  `).join('') || '<p>Nenhum artigo pendente</p>';

  document.getElementById('list-publicados').innerHTML = publicados.articles?.map(a => `
    <div class="article-card">
      <h3>${a.titulo}</h3>
      <div class="meta">${a.categoria} • ${new Date(a.published_at).toLocaleDateString('pt-BR')}</div>
      <a href="/artigos/${a.slug}" target="_blank">Ver artigo →</a>
    </div>
  `).join('') || '<p>Nenhum artigo publicado</p>';
}

async function approveArticle(id) {
  const response = await fetch(`${API_BASE}/api/articles/approve`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ id })
  });

  if (response.ok) {
    alert('Artigo aprovado!');
    loadArticles();
  }
}

async function loadInstagramInfo() {
  const response = await fetch(`${API_BASE}/api/instagram/schedule`);
  const data = await response.json();
  
  document.getElementById('instagram-info').innerHTML = `
    <p><strong>Posts hoje:</strong> ${data.posts_today} / 10</p>
    <p><strong>Disponíveis hoje:</strong> ${data.remaining_today}</p>
    <p><strong>Total na fila:</strong> ${data.queue_total}</p>
  `;
}

async function generateWithAI() {
  const tema = prompt('Digite o tema do artigo:');
  if (!tema) return;

  const categoria = document.getElementById('categoria').value;
  showStatus('Gerando artigo com IA...', 'success');

  const response = await fetch(`${API_BASE}/api/articles/generate`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ tema, categoria })
  });

  const data = await response.json();
  if (data.success) {
    document.getElementById('titulo').value = data.titulo;
    document.getElementById('resumo').value = data.resumo;
    window.quillEditor.root.innerHTML = data.conteudo;
    showStatus('Artigo gerado! Revise e adicione imagem.', 'success');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('adminToken');
  if (saved) {
    document.getElementById('token').value = saved;
    login();
  }
});
  </script>
</body>
</html>
