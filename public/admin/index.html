<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin OVC — Centro de Comando</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#08080f;--card:#0f0f1a;--sidebar:#0a0a14;--input:#111120;--border:rgba(255,255,255,0.06);--bh:rgba(255,255,255,0.12);--red:#c81e1e;--red-h:#e02222;--red-s:rgba(200,30,30,0.08);--yellow:#ffc800;--green:#16a34a;--green-s:rgba(22,163,74,0.15);--red-s2:rgba(200,30,30,0.15);--yellow-s:rgba(255,200,0,0.15);--orange:#e85d00;--t1:#f1f1f1;--t2:#888;--t3:#555;--font:'Inter',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(200,30,30,0.06) 0%,transparent 70%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,0.6)}
.login-logo{text-align:center;margin-bottom:8px}
.login-logo .ovc{font-size:22px;font-weight:700;color:var(--t1);letter-spacing:.08em}
.login-logo .accent{color:var(--red)}
.login-tag{text-align:center;font-size:11px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:36px}
.login-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);margin-bottom:6px}
.login-input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--t1);font-size:14px;outline:none;transition:border .15s}
.login-input:focus{border-color:var(--red)}
.login-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:24px;transition:background .15s}
.login-btn:hover{background:var(--red-h)}
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo .name{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--t1)}
.sidebar-logo .name .a{color:var(--red)}
.sidebar-logo .sub{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.nav{padding:12px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{color:var(--t1);background:rgba(255,255,255,0.03)}
.nav-item.active{color:var(--t1);background:rgba(200,30,30,0.08);border-left-color:var(--red)}
.nav-icon{font-size:15px;width:18px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border)}
.sidebar-footer .ver{font-size:11px;color:var(--t3)}
.logout-btn{background:none;border:none;color:var(--t2);font-size:12px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px;margin-top:8px}
.logout-btn:hover{color:var(--t1)}
.main{flex:1;overflow-y:auto;background:var(--bg)}
.page-header{padding:28px 32px 0;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:24px}
.page-title{font-size:20px;font-weight:700}
.page-sub{font-size:13px;color:var(--t2);margin-top:3px}
.page-body{padding:0 32px 32px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:13px;font-weight:600;color:var(--t1)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative}
.metric-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);margin-bottom:8px}
.metric-value{font-size:28px;font-weight:700;color:var(--t1)}
.metric-icon{position:absolute;top:20px;right:20px;font-size:20px;opacity:.4}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-green{background:var(--green-s);color:#4ade80}
.badge-red{background:var(--red-s2);color:#f87171}
.badge-yellow{background:var(--yellow-s);color:var(--yellow)}
.badge-gray{background:rgba(255,255,255,0.06);color:var(--t2)}
.badge-orange{background:rgba(232,93,0,0.15);color:#fb923c}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-h)}
.btn-secondary{background:rgba(255,255,255,0.06);color:var(--t1);border:1px solid var(--border)}.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#15803d}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.gap-8{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:13px}
tr:hover td{background:rgba(255,255,255,0.02)}
.text-secondary{color:var(--t2)}
.text-small{font-size:12px}
.loading{padding:40px;text-align:center;color:var(--t2)}
.empty-state{padding:48px;text-align:center}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:.4}
.empty-text{color:var(--t2);font-size:13px}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.status-pendente{background:var(--yellow-s);color:var(--yellow)}.status-pendente .dot{background:var(--yellow)}
.status-success{background:var(--green-s);color:#4ade80}.status-success .dot{background:#4ade80}
.status-error{background:var(--red-s2);color:#f87171}.status-error .dot{background:#f87171}
.status-duplicate{background:rgba(255,255,255,0.06);color:var(--t2)}.status-duplicate .dot{background:var(--t2)}
.status-scheduled{background:rgba(59,130,246,0.15);color:#60a5fa}.status-scheduled .dot{background:#60a5fa}
.pagination{padding:12px 16px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border)}
.pagination-info{font-size:12px;color:var(--t2);flex:1}
.toggle-wrap{display:flex;align-items:center;gap:10px}
.toggle{position:relative;width:40px;height:22px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:rgba(255,255,255,0.1);border-radius:22px;transition:.2s}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--red)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.form-input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--t1);font-size:13px;outline:none;transition:border .15s}
.form-input:focus{border-color:var(--red)}
.form-select{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--t1);font-size:13px;outline:none}
.form-textarea{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--t1);font-size:13px;outline:none;resize:vertical;min-height:120px;font-family:var(--font)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.preview-card{background:#0a0a14;border:1px solid var(--border);border-radius:12px;overflow:hidden;max-width:360px}
.preview-img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:12px}
.preview-caption{padding:12px;font-size:12px;color:var(--t2);line-height:1.5;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.alert-banner{background:rgba(200,30,30,0.1);border:1px solid rgba(200,30,30,0.3);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.alert-banner.yellow{background:var(--yellow-s);border-color:rgba(255,200,0,0.3)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-left:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.suggestion-card{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.perf-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-top:4px}
.perf-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const SUPABASE_URL = 'https://bfsegqdgscudtdgwdyci.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmc2VncWRnc2N1ZHRkZ3dkeWNpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTQ0NjM1MiwiZXhwIjoyMDkxMDIyMzUyfQ.WmkHzK33qqtlvtal92WXVeyIE1DGRZOrw_pZtPGeV50';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const ADMIN_PASS = 'ovc-admin-2026-secreto';

const fmt = d => { if(!d) return '—'; const dt = new Date(d); return dt.toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); };
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-BR', {timeZone:'America/Sao_Paulo'}) : '—';
const truncate = (s, n) => s && s.length > n ? s.slice(0, n) + '…' : (s || '');

// ── LOGIN ──
function Login({ onLogin }) {
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const submit = () => {
    if (pass === ADMIN_PASS) { onLogin(); }
    else setErr('Senha incorreta');
  };
  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-logo"><span className="ovc">O <span className="accent">VALOR</span> CAP.</span></div>
        <div className="login-tag">Centro de Comando</div>
        <div className="form-group">
          <label className="login-label">Senha</label>
          <input className="login-input" type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} autoFocus/>
        </div>
        {err && <div style={{color:'#f87171',fontSize:12,marginTop:4}}>{err}</div>}
        <button className="login-btn" onClick={submit}>Entrar</button>
      </div>
    </div>
  );
}

// ── DASHBOARD ──
function Dashboard() {
  const [status, setStatus] = useState({running:false,posts_hoje:0,max_posts:60,pendentes:0,erros:0});
  const [posts, setPosts] = useState([]);
  const [logs, setLogs] = useState([]);
  const [forcing, setForcing] = useState(false);
  const [runResult, setRunResult] = useState('');
  const [alertas, setAlertas] = useState([]);

  const load = useCallback(async () => {
    try {
      const r = await fetch('/api/manage');
      if (r.ok) setStatus(await r.json());
    } catch(_) {}
    const { data: p } = await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(10);
    setPosts(p||[]);
    const { data: l } = await sb.from('logs').select('*').order('created_at',{ascending:false}).limit(10);
    setLogs(l||[]);
    // Alertas: posts com erro recentes
    const { data: errs } = await sb.from('posts').select('*').eq('status','error').order('updated_at',{ascending:false}).limit(5);
    setAlertas(errs||[]);
  }, []);

  useEffect(() => { load(); const t = setInterval(load, 30000); return () => clearInterval(t); }, [load]);

  const forceRun = async () => {
    setForcing(true); setRunResult('Executando...');
    try {
      const r = await fetch('/api/run_portal', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({force:true})});
      const j = await r.json();
      setRunResult(JSON.stringify(j));
      load();
    } catch(e) { setRunResult('Erro: '+e.message); }
    setForcing(false);
  };

  const semana = posts.filter(p=>{
    const d=new Date(p.created_at);
    return (Date.now()-d.getTime())<7*24*60*60*1000;
  }).length;

  const novos = posts.filter(p=>p.status==='pendente').length;

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Dashboard Global</div>
        <div className="page-sub">Visão em tempo real do ecossistema OVC</div>
      </div>
      <div className="page-body">
        {alertas.length>0&&<div className="alert-banner"><span>⚠️</span><span>{alertas.length} post(s) com erro recente</span></div>}
        {novos>0&&<div className="alert-banner yellow"><span>🆕</span><span>{novos} novo(s) conteúdo(s) aguardando aprovação</span></div>}
        <div className="metrics">
          <div className="metric-card">
            <div className="metric-label">Posts Hoje</div>
            <div className="metric-value">{status.posts_hoje}</div>
            <div className="metric-icon">📅</div>
            <span className="badge badge-green">limite: {status.max_posts}</span>
          </div>
          <div className="metric-card">
            <div className="metric-label">Posts na Semana</div>
            <div className="metric-value">{semana}</div>
            <div className="metric-icon">📊</div>
          </div>
          <div className="metric-card">
            <div className="metric-label">Automação</div>
            <div className="metric-value" style={{fontSize:20,paddingTop:6}}>{status.running?'ATIVA':'PAUSADA'}</div>
            <div className="metric-icon">{status.running?'🟢':'🔴'}</div>
            <span className={`badge ${status.running?'badge-green':'badge-red'}`}>{status.running?'Rodando':'Parada'}</span>
          </div>
          <div className="metric-card">
            <div className="metric-label">Execução Manual</div>
            <div className="metric-value" style={{fontSize:14,paddingTop:8}}>
              <button className="btn btn-primary btn-sm" onClick={forceRun} disabled={forcing}>
                {forcing?'Executando...':'▶ Forçar agora'}
              </button>
            </div>
            <div className="metric-icon">⚡</div>
          </div>
        </div>
        {runResult&&<div className="alert-banner" style={{marginBottom:16}}><code style={{fontSize:11}}>{runResult}</code></div>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div className="panel">
            <div className="panel-header"><span className="panel-title">Últimos 10 Posts</span><button className="btn btn-secondary btn-sm" onClick={load}>↻</button></div>
            {posts.length===0?<div className="empty-state"><div className="empty-icon">📄</div><div className="empty-text">Nenhum post</div></div>:
            <table><thead><tr><th>Título</th><th>Status</th><th>Data</th></tr></thead>
            <tbody>{posts.map(p=><tr key={p.id}>
              <td>{truncate(p.titulo,40)}</td>
              <td><span className={`status-pill status-${p.status}`}><span className="dot"></span>{p.status}</span></td>
              <td className="text-secondary text-small">{fmt(p.created_at)}</td>
            </tr>)}</tbody></table>}
          </div>
          <div className="panel">
            <div className="panel-header"><span className="panel-title">Erros Recentes {alertas.length>0&&<span className="notif-dot"></span>}</span></div>
            {alertas.length===0?<div className="empty-state"><div className="empty-icon">✅</div><div className="empty-text">Nenhum erro recente</div></div>:
            <table><thead><tr><th>Post</th><th>Erro</th><th>Data</th></tr></thead>
            <tbody>{alertas.map(p=><tr key={p.id}>
              <td>{truncate(p.titulo,30)}</td>
              <td className="text-small" style={{color:'#f87171'}}>{truncate(p.error_msg,40)}</td>
              <td className="text-secondary text-small">{fmt(p.updated_at)}</td>
            </tr>)}</tbody></table>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── PIPELINE ──
function Pipeline() {
  const [auto, setAuto] = useState(null);
  const [maxPosts, setMaxPosts] = useState(60);
  const [intervalo, setIntervalo] = useState(10);
  const [logs, setLogs] = useState([]);
  const [forcing, setForcing] = useState(false);
  const [lastResult, setLastResult] = useState('');
  const [msg, setMsg] = useState('');

  const load = useCallback(async () => {
    const { data: cfgs } = await sb.from('config').select('*');
    if (cfgs) {
      const a = cfgs.find(c=>c.key==='AUTOMATION');
      const mp = cfgs.find(c=>c.key==='MAX_POSTS_DIA');
      const iv = cfgs.find(c=>c.key==='INTERVALO');
      setAuto(a?a.value==='on':false);
      if (mp) setMaxPosts(parseInt(mp.value)||300);
      if (iv) setIntervalo(parseInt(iv.value)||10);
    }
    const { data: l } = await sb.from('logs').select('*').order('created_at',{ascending:false}).limit(20);
    setLogs(l||[]);
  }, []);

  useEffect(()=>{load();},[load]);

  const toggleAuto = async () => {
    const n = !auto; setAuto(n);
    // DELETE + INSERT para evitar duplicata — garante que só existe 1 registro
    await sb.from('config').delete().eq('key','AUTOMATION');
    await sb.from('config').insert({key:'AUTOMATION',value:n?'on':'off',updated_at:new Date().toISOString()});
    setMsg('Automação '+(n?'✅ ATIVADA':'⏸ PAUSADA'));
    setTimeout(()=>{ setMsg(''); load(); },3000);
  };

  const saveConfig = async () => {
    await sb.from('config').upsert({key:'MAX_POSTS_DIA',value:String(maxPosts),updated_at:new Date().toISOString()},{onConflict:'key'});
    await sb.from('config').upsert({key:'INTERVALO',value:String(intervalo),updated_at:new Date().toISOString()},{onConflict:'key'});
    setMsg('Configurações salvas');
    setTimeout(()=>setMsg(''),3000);
  };

  const [batchRunning, setBatchRunning] = useState(false);
  const [batchLog, setBatchLog] = useState([]);

  const forceRun = async () => {
    setForcing(true); setLastResult('Executando...');
    try {
      const r = await fetch('/api/run_portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({force:true,count:3})});
      const j = await r.json();
      setLastResult(JSON.stringify(j,null,2));
      load();
    } catch(e){setLastResult('Erro: '+e.message);}
    setForcing(false);
  };

  const runBatch = async () => {
    setBatchRunning(true);
    setBatchLog(['🚀 Disparando 8 chamadas em paralelo (até 3 artigos cada)...']);
    var CHAMADAS = 8;
    var promises = [];
    for (var i = 0; i < CHAMADAS; i++) {
      promises.push(
        fetch('/api/run_portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch:true,count:3})})
          .then(function(r){ return r.json(); })
          .catch(function(e){ return {status:'erro',error:e.message}; })
      );
    }
    var resultados = await Promise.allSettled(promises);
    var totalArtigos = 0;
    var linhas = [];
    resultados.forEach(function(r, idx) {
      var j = r.status === 'fulfilled' ? r.value : {status:'erro'};
      if (j.artigos && j.artigos.length) {
        totalArtigos += j.artigos.length;

function Postagens() {
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [page, setPage] = useState(0);
  const [selected, setSelected] = useState([]);
  const [approving, setApproving] = useState(false);
  const [editPost, setEditPost] = useState(null);
  const [previewPost, setPreviewPost] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const [busca, setBusca] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [filterSub, setFilterSub] = useState('');
  const [filterDe, setFilterDe] = useState('');
  const [filterAte, setFilterAte] = useState('');
  const [filterMethod, setFilterMethod] = useState('');
  const [totalCount, setTotalCount] = useState(0);
  const [filtrosAbertos, setFiltrosAbertos] = useState(false);
  const [smartFilter, setSmartFilter] = useState('');
  const [showMetrics, setShowMetrics] = useState(false);
  const PER = 50;

  const BLOCKED_IMG_RE = [/perfil/i,/author/i,/avatar/i,/reporter/i,/profile/i,/headshot/i,/icon/i,/logo/i,/favicon/i,/sprite/i,/watermark/i,/\.svg$/i,/\.gif$/i,/\.ico$/i];
  function chkSemImg(p)  { return !p.imagem || p.imagem.trim() === ''; }
  function chkImgSusp(p) { return !!p.imagem && BLOCKED_IMG_RE.some(function(r){ return r.test(p.imagem); }); }
  function chkRisco(p)   { return (!p.conteudo || p.conteudo.length < 200) || p.categoria === 'geral' || !p.categoria; }

  const kpi = React.useMemo(function(){
    return {
      semImg:  posts.filter(chkSemImg).length,
      suspeita:posts.filter(chkImgSusp).length,
      risco:   posts.filter(chkRisco).length,
      pendente:posts.filter(function(p){ return p.status==='pendente'; }).length
    };
  }, [posts]);

  const displayPosts = React.useMemo(function(){
    if (smartFilter === 'sem_img')  return posts.filter(chkSemImg);
    if (smartFilter === 'suspeita') return posts.filter(chkImgSusp);
    if (smartFilter === 'risco')    return posts.filter(chkRisco);
    return posts;
  }, [posts, smartFilter]);

  const load = useCallback(async () => {
    setLoading(true); setSelected([]);
    let q = sb.from('posts').select('*',{count:'exact'}).order('created_at',{ascending:false}).range(page*PER,(page+1)*PER-1);
    if (filter!=='all') q=q.eq('status',filter);
    if (busca.trim()) q=q.ilike('titulo','%'+busca.trim()+'%');
    if (filterCat) q=q.like('user_tags','%"'+filterCat+'"%');
    if (filterSub.trim()) q=q.ilike('subcategoria','%'+filterSub.trim()+'%');
    if (filterMethod) q=q.eq('publish_method',filterMethod);
    if (filterDe) q=q.gte('created_at',filterDe+'T00:00:00');
    if (filterAte) q=q.lte('created_at',filterAte+'T23:59:59');
    const { data, count } = await q;
    // Normaliza: extrai categoria de user_tags (JSON array) pois não há coluna 'categoria' no Supabase
    var norm = (data||[]).map(function(p){
      var tags = []; try { tags = JSON.parse(p.user_tags||'[]'); } catch(_){}
      return Object.assign({}, p, { categoria: tags[0]||'' });
    });
    setPosts(norm);
    setTotalCount(count||0);
    const { data: acc } = await sb.from('ig_accounts').select('id,username').eq('active',true);
    setAccounts(acc||[]);
    setLoading(false);
  },[filter,page,busca,filterCat,filterSub,filterMethod,filterDe,filterAte]);

  useEffect(()=>{load();},[load]);

  const limparFiltros = () => { setBusca(''); setFilterCat(''); setFilterSub(''); setFilterDe(''); setFilterAte(''); setFilterMethod(''); setFilter('all'); setPage(0); };

  const toggleSelect = id => setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleAll = () => {
    const todos = posts.map(p=>p.id);
    setSelected(p=>p.length===todos.length?[]:todos);
  };

  const pubPortal = async id => {
    setApproving(true);
    try {
      const now = new Date().toISOString();
      const { error } = await sb.from('posts').update({
        status: 'publicado', approved: true,
        publish_method: 'portal', published_at: now, updated_at: now
      }).eq('id', id);
      if (error) alert('❌ Erro: ' + error.message);
      else { alert('✅ Publicado no Portal!'); load(); }
    } catch(e) { alert('❌ Erro: ' + e.message); }
    setApproving(false);
  };

  const [igPublishing, setIgPublishing] = useState(null);

  const publicarIG = async (post) => {
    // Buscar URL do serviço nas configurações
    const { data: cfg } = await sb.from('config').select('value').eq('key','IG_SERVICE_URL').single();
    const serviceUrl = cfg?.value;
    if (!serviceUrl) {
      alert('Configure a URL do serviço Instagram em Configurações → URL Serviço Instagram.');
      return;
    }
    if (!confirm(`Publicar "${post.titulo}" no Instagram?`)) return;
    setIgPublishing(post.id);
    try {
      const r = await fetch('/api/ig_publish', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          post_id: post.id,
          image_url: post.imagem,
          caption: post.conteudo ? post.conteudo.slice(0, 2200) : post.titulo
        })
      });
      const d = await r.json();
      if (d.ok) {
        alert('✅ Publicado no Instagram com sucesso!');
      } else {
        alert('❌ Erro: ' + (d.error || 'Falha ao publicar'));
      }
    } catch(e) {
      alert('❌ Erro de conexão com o serviço: ' + e.message);
    }
    setIgPublishing(null);
  };

  const [revisando, setRevisando] = useState(null);
  const [revisaoModal, setRevisaoModal] = useState({show:false, post:null, flags:{texto:false,imagem:false,fontes:false}, obs:''});

  const abrirRevisao = post => setRevisaoModal({show:true, post, flags:{texto:false,imagem:false,fontes:false}, obs:''});

  const devolverRevisao = async () => {
    const {post, flags, obs} = revisaoModal;
    if (!flags.texto && !flags.imagem && !flags.fontes && !obs.trim()) {
      alert('Selecione ao menos uma opção de revisão ou escreva uma observação.');
      return;
    }
    setRevisando(post.id);
    setRevisaoModal(m=>({...m, show:false}));
    try {
      // Salvar flags e observações no post
      const metricsAtual = typeof post.metrics === 'object' ? post.metrics : {};
      await sb.from('posts').update({
        status: 'pendente',
        approved: false,
        published_at: null,
        metrics: {...metricsAtual, revisao_obs: obs, revisao_flags: flags, revisao_at: new Date().toISOString()}
      }).eq('id', post.id);

      // Revisar texto com IA se solicitado
      if (flags.texto) {
        try {
          const r = await fetch('/api/editor_ia', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({texto: post.conteudo, acao:'melhorar', ia:'openai', publicar:false})
          });
          const d = await r.json();
          if (d.ok && d.corpo) {
            await sb.from('posts').update({
              titulo: d.titulo || post.titulo,
              conteudo: d.corpo,
              comentario_fixado: d.meta_descricao || post.comentario_fixado
            }).eq('id', post.id);
          }
        } catch(e) { console.warn('Revisão de texto falhou:', e.message); }
      }

      // Limpar imagem se solicitado — sistema buscará nova na próxima revisão
      if (flags.imagem) {
        await sb.from('posts').update({imagem: ''}).eq('id', post.id);
      }

      alert('✅ Post devolvido para revisão' + (flags.texto ? ' — texto reprocessado pela IA' : '') + '.');
      load();
    } catch(e) {
      alert('Erro ao devolver: ' + e.message);
    }
    setRevisando(null);
  };

  const revisarIA = async (post) => {
    if (!confirm('A IA vai revisar o conteúdo e buscar nova imagem para este post. Continuar?')) return;
    setRevisando(post.id);
    try {
      // Pedir revisão ao editor_ia
      const r = await fetch('/api/editor_ia', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          texto: post.conteudo,
          acao: 'melhorar',
          ia: 'gemini',
          buscarImagem: true,
          publicar: false
        })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erro ao revisar');
      // Abrir modal de edição com o resultado revisado
      setEditPost({
        ...post,
        titulo: d.titulo || post.titulo,
        conteudo: d.corpo || post.conteudo,
        imagem: d.imagem || post.imagem,
        _revisado: true
      });
    } catch(e) {
      alert('Erro ao revisar: ' + e.message);
    }
    setRevisando(null);
  };

  const despublicar = async id => {
    if (!confirm('Despublicar este post? Ele sairá do portal imediatamente.')) return;
    await sb.from('posts').update({status:'pendente', approved:false, published_at:null}).eq('id',id);
    load();
  };

  const deletarPost = async id => {
    if (!confirm('⚠️ Excluir permanentemente este post? Não há como desfazer.')) return;
    const {error} = await sb.from('posts').delete().eq('id',id);
    if (error) alert('Erro ao excluir: ' + error.message);
    else load();
  };

  const pubPortalBatch = async () => {
    if (!selected.length) return;
    if (!confirm(`Publicar ${selected.length} post(s) no Portal Web?`)) return;
    setApproving(true);
    const now = new Date().toISOString();
    let ok = 0;
    for (const id of selected) {
      const { error } = await sb.from('posts').update({
        status: 'publicado', approved: true,
        publish_method: 'portal', published_at: now, updated_at: now
      }).eq('id', id);
      if (!error) ok++;
    }
    alert(`✅ ${ok} publicado(s) no Portal!`);
    load(); setApproving(false);
  };

  const deletarBatch = async () => {
    if (!selected.length) return;
    if (!confirm(`⚠️ Excluir permanentemente ${selected.length} post(s)? Não há como desfazer.`)) return;
    setApproving(true);
    const { error } = await sb.from('posts').delete().in('id', selected);
    if (error) alert('Erro: ' + error.message);
    else alert(`🗑️ ${selected.length} post(s) excluído(s).`);
    load(); setApproving(false);
  };

  const saveEdit = async () => {
    const slugSub = (editPost.subcategoria||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    await sb.from('posts').update({
      titulo: editPost.titulo,
      conteudo: editPost.conteudo,
      comentario_fixado: editPost.comentario_fixado,
      imagem: editPost.imagem,
      ig_account_id: editPost.ig_account_id||null,
      scheduled_at: editPost.scheduled_at||null,
      user_tags: editPost.categoria ? JSON.stringify([editPost.categoria]) : (editPost.user_tags||'[]'),
      subcategoria: editPost.subcategoria||'',
      subcategoria_slug: slugSub,
      collaborators: editPost.collaborators||'[]',
      updated_at: new Date().toISOString()
    }).eq('id',editPost.id);
    setEditPost(null); load();
  };

  return (
    <div>
      <div className="page-header"><div className="page-title">Postagens</div><div className="page-sub">Aprovação, edição e histórico de posts</div></div>
      <div className="page-body">
        {previewPost&&(
          <div className="modal-bg" onClick={()=>setPreviewPost(null)}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
              <div className="modal-header"><span className="modal-title">Preview do Post</span><button className="btn btn-secondary btn-sm" onClick={()=>setPreviewPost(null)}>✕</button></div>
              <div className="modal-body" style={{display:'flex',gap:20,flexWrap:'wrap'}}>
                <div className="preview-card" style={{flex:'0 0 280px'}}>
                  {previewPost.imagem?<img src={previewPost.imagem} style={{width:'100%',aspectRatio:'4/5',objectFit:'cover'}} onError={e=>e.target.style.display='none'} alt=""/>:<div style={{width:'100%',aspectRatio:'4/5',background:'#1a1a2e',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Sem imagem</div>}
                  <div className="preview-caption">{previewPost.conteudo}</div>
                </div>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:12,color:'var(--t2)',marginBottom:8}}>Comentário fixado:</div>
                  <div style={{fontSize:13,color:'var(--t1)',background:'var(--input)',padding:12,borderRadius:8}}>{previewPost.comentario_fixado||'—'}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginTop:12,marginBottom:4}}>Conta:</div>
                  <div style={{fontSize:13}}>{previewPost.ig_accounts?.username||'Automática'}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginTop:12,marginBottom:4}}>Agendado para:</div>
                  <div style={{fontSize:13}}>{previewPost.scheduled_at?fmt(previewPost.scheduled_at):'Publicar imediatamente'}</div>
                </div>
              </div>
            </div>
          </div>
        )}
        {revisaoModal.show&&(
          <div className="modal-bg" onClick={()=>setRevisaoModal(m=>({...m,show:false}))}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:500}}>
              <div className="modal-header">
                <span className="modal-title">🔄 Devolver para Revisão</span>
                <button className="btn btn-secondary btn-sm" onClick={()=>setRevisaoModal(m=>({...m,show:false}))}>✕</button>
              </div>
              <div className="modal-body">
                <div style={{fontSize:13,color:'var(--t2)',marginBottom:16,padding:'8px 12px',background:'rgba(255,200,0,0.07)',borderRadius:8,border:'1px solid rgba(255,200,0,0.2)'}}>
                  <strong style={{color:'var(--t1)'}}>{revisaoModal.post?.titulo}</strong>
                </div>
                <div className="form-group">
                  <label className="form-label" style={{marginBottom:10}}>O que precisa ser revisado?</label>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {[
                      {key:'texto', icon:'📝', label:'Revisar texto', desc:'A IA reescreve o conteúdo com mais qualidade'},
                      {key:'imagem', icon:'🖼️', label:'Revisar imagem', desc:'Remove a imagem atual — sistema buscará outra'},
                      {key:'fontes', icon:'🔍', label:'Revisar fontes', desc:'Marcar para checar as informações manualmente'}
                    ].map(({key,icon,label,desc})=>(
                      <label key={key} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 12px',borderRadius:8,border:'1px solid var(--border)',cursor:'pointer',background:revisaoModal.flags[key]?'rgba(255,200,0,0.08)':'var(--card)',transition:'background 0.15s'}}>
                        <input type="checkbox" checked={revisaoModal.flags[key]}
                          onChange={e=>setRevisaoModal(m=>({...m,flags:{...m.flags,[key]:e.target.checked}}))}
                          style={{marginTop:2,accentColor:'var(--yellow)',width:16,height:16,flexShrink:0}}/>
                        <div>
                          <div style={{fontWeight:600,fontSize:13}}>{icon} {label}</div>
                          <div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>{desc}</div>
                        </div>
                      </label>
                    ))}
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Observações (opcional)</label>
                  <textarea className="form-textarea" style={{minHeight:80}} placeholder="Ex: título confuso, imagem fora de contexto, dado incorreto no 2º parágrafo..."
                    value={revisaoModal.obs}
                    onChange={e=>setRevisaoModal(m=>({...m,obs:e.target.value}))}/>
                </div>
              </div>
              <div className="modal-footer">
                <button className="btn btn-secondary" onClick={()=>setRevisaoModal(m=>({...m,show:false}))}>Cancelar</button>
                <button className="btn btn-primary" onClick={devolverRevisao} disabled={revisando===revisaoModal.post?.id}>
                  {revisando===revisaoModal.post?.id ? 'Processando...' : '🔄 Devolver para Revisão'}
                </button>
              </div>
            </div>
          </div>
        )}
        {editPost&&(
          <div className="modal-bg">
            <div className="modal">
              <div className="modal-header"><span className="modal-title">Editar Post</span><button className="btn btn-secondary btn-sm" onClick={()=>setEditPost(null)}>✕</button></div>
              <div className="modal-body">
                {editPost._revisado && <div style={{padding:'8px 12px',background:'rgba(139,92,246,0.1)',border:'1px solid rgba(139,92,246,0.3)',borderRadius:6,marginBottom:12,fontSize:12,color:'#a78bfa'}}>🤖 Conteúdo revisado pela IA — revise e salve se aprovar</div>}
                <div className="form-group"><label className="form-label">Título</label><input className="form-input" value={editPost.titulo||''} onChange={e=>setEditPost({...editPost,titulo:e.target.value})}/></div>
                <div className="form-group"><label className="form-label">Conteúdo</label><textarea className="form-textarea" style={{minHeight:220}} value={editPost.conteudo||''} onChange={e=>setEditPost({...editPost,conteudo:e.target.value})}/></div>
                <div className="form-group"><label className="form-label">Comentário Fixado</label><textarea className="form-textarea" style={{minHeight:60}} value={editPost.comentario_fixado||''} onChange={e=>setEditPost({...editPost,comentario_fixado:e.target.value})}/></div>
                <div className="form-group">
                  <label className="form-label">URL da Imagem</label>
                  <input className="form-input" value={editPost.imagem||''} onChange={e=>setEditPost({...editPost,imagem:e.target.value})}/>
                  {editPost.imagem && <img src={editPost.imagem} alt="" style={{marginTop:8,width:'100%',height:160,objectFit:'cover',borderRadius:6,display:'block'}} onError={e=>e.target.style.display='none'}/>}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  <div className="form-group"><label className="form-label">Conta Instagram</label>
                    <select className="form-select" value={editPost.ig_account_id||''} onChange={e=>setEditPost({...editPost,ig_account_id:e.target.value})}>
                      <option value="">Automática</option>
                      {accounts.map(a=><option key={a.id} value={a.id}>@{a.username}</option>)}
                    </select>
                  </div>
                  <div className="form-group"><label className="form-label">Agendar para</label><input className="form-input" type="datetime-local" value={editPost.scheduled_at?editPost.scheduled_at.slice(0,16):''} onChange={e=>setEditPost({...editPost,scheduled_at:e.target.value})}/></div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  <div className="form-group"><label className="form-label">Categoria</label><select className="form-select" value={editPost.categoria||''} onChange={e=>{const c=e.target.value;setEditPost({...editPost,categoria:c,subcategoria:''})}}><option value="">Selecionar...</option>{CATS_LIST.filter(c=>c).map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                  <div className="form-group"><label className="form-label">Subcategoria</label><select className="form-select" value={editPost.subcategoria||''} onChange={e=>setEditPost({...editPost,subcategoria:e.target.value})}><option value="">Selecionar...</option>{(SUBCATS_POST[editPost.categoria]||[]).map(s=><option key={s} value={s}>{s}</option>)}</select></div>
                </div>
                <div className="form-group"><label className="form-label">Marcar usuários (@usuario1,@usuario2)</label><input className="form-input" value={editPost.user_tags||''} onChange={e=>setEditPost({...editPost,user_tags:e.target.value})} placeholder="@usuario1, @usuario2"/></div>
                <div className="form-group"><label className="form-label">Colaboradores (@usuario1,@usuario2)</label><input className="form-input" value={editPost.collaborators||''} onChange={e=>setEditPost({...editPost,collaborators:e.target.value})} placeholder="@oterrasan, @blogdoterra"/></div>
              </div>
              <div className="modal-footer"><button className="btn btn-secondary" onClick={()=>setEditPost(null)}>Cancelar</button><button className="btn btn-primary" onClick={saveEdit}>Salvar</button></div>
            </div>
          </div>
        )}
        {/* ── KPI DASHBOARD ── */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:12,marginBottom:16}}>
          {[
            {label:'Sem imagem',     val:kpi.semImg,   cor:'#f59e0b', icon:'🖼️', sf:'sem_img'},
            {label:'Img suspeita',   val:kpi.suspeita, cor:'#8b5cf6', icon:'⚠️', sf:'suspeita'},
            {label:'Risco de erro',  val:kpi.risco,    cor:'#ef4444', icon:'🔴', sf:'risco'},
            {label:'Pendentes',      val:kpi.pendente, cor:'#ffc800', icon:'⏳', sf:'__pendente'},
            {label:'Total (página)', val:posts.length, cor:'#3b82f6', icon:'📄', sf:''},
          ].map(function(item){
            var ativo = smartFilter===item.sf && item.sf!=='';
            var shadow = ativo ? ('0 0 0 2px '+item.cor) : 'none';
            return (
              <div key={item.sf} onClick={function(){ if(item.sf==='__pendente'){setFilter('pendente');setSmartFilter('');setPage(0);}else if(item.sf){setSmartFilter(function(s){return s===item.sf?'':item.sf;});}}}
                style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 16px',cursor:item.sf?'pointer':'default',transition:'box-shadow 0.15s',boxShadow:shadow}}>
                <div style={{fontSize:20,marginBottom:4}}>{item.icon}</div>
                <div style={{fontSize:22,fontWeight:700,color:item.cor}}>{item.val}</div>
                <div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>{item.label}</div>
              </div>
            );
          })}
        </div>
        {/* ── SMART FILTER BAR ── */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12,alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--t3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>Filtros rápidos:</span>
          {[
            {sf:'sem_img',  label:'🖼️ Sem imagem',   count:kpi.semImg,   cor:'#f59e0b'},
            {sf:'suspeita', label:'⚠️ Img suspeita',  count:kpi.suspeita, cor:'#8b5cf6'},
            {sf:'risco',    label:'🔴 Risco de erro', count:kpi.risco,    cor:'#ef4444'},
          ].map(function(item){
            var ativo = smartFilter===item.sf;
            return (
              <button key={item.sf} onClick={function(){ setSmartFilter(function(s){ return s===item.sf?'':item.sf; }); }}
                style={{padding:'5px 12px',borderRadius:999,border:'1px solid '+(ativo?item.cor:'var(--border)'),background:ativo?item.cor+'22':'transparent',color:ativo?item.cor:'var(--t2)',fontSize:12,fontWeight:600,cursor:'pointer',transition:'all 0.15s'}}>
                {item.label} <span style={{fontWeight:700,color:ativo?item.cor:'var(--t3)'}}>{item.count}</span>
              </button>
            );
          })}
          <button onClick={function(){ setShowMetrics(function(x){ return !x; }); }}
            style={{padding:'5px 12px',borderRadius:999,border:'1px solid '+(showMetrics?'#3b82f6':'var(--border)'),background:showMetrics?'rgba(59,130,246,0.12)':'transparent',color:showMetrics?'#3b82f6':'var(--t2)',fontSize:12,fontWeight:600,cursor:'pointer',transition:'all 0.15s'}}>
            📊 Métricas
          </button>
          {smartFilter && <button onClick={function(){ setSmartFilter(''); }} style={{padding:'5px 10px',borderRadius:999,border:'1px solid var(--border)',background:'transparent',color:'var(--t3)',fontSize:11,cursor:'pointer'}}>✕ Limpar</button>}
          {smartFilter && <span style={{fontSize:11,color:'var(--t3)',marginLeft:4}}>Mostrando <strong style={{color:'var(--t1)'}}>{displayPosts.length}</strong> de {posts.length}</span>}
        </div>
        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">Postagens <span style={{fontSize:12,color:'var(--t3)',fontWeight:400}}>{totalCount} encontrado(s)</span></span>
            <div className="gap-8">
              {['all','pendente','publicado','error'].map(f=>(
                <button key={f} className={`btn btn-sm ${filter===f?'btn-primary':'btn-secondary'}`} onClick={()=>{setFilter(f);setPage(0);}}>
                  {f==='all'?'Todos':f}
                </button>
              ))}
              <button className="btn btn-secondary btn-sm" onClick={()=>setFiltrosAbertos(x=>!x)}>🔍 Filtros {filtrosAbertos?'▲':'▼'}</button>
              <button className="btn btn-secondary btn-sm" onClick={load}>↻</button>
            </div>
          </div>
          {filtrosAbertos&&(
            <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',background:'var(--card)',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:12}}>
              <div>
                <label style={{fontSize:11,color:'var(--t3)',display:'block',marginBottom:4}}>Buscar título</label>
                <input className="form-input" style={{height:32,fontSize:12}} placeholder="palavra-chave..." value={busca} onChange={e=>{setBusca(e.target.value);setPage(0);}}/>
              </div>
              <div>
                <label style={{fontSize:11,color:'var(--t3)',display:'block',marginBottom:4}}>Categoria</label>
                <select className="form-select" style={{height:32,fontSize:12}} value={filterCat} onChange={e=>{setFilterCat(e.target.value);setPage(0);}}>
                  {CATS_LIST.map(c=><option key={c} value={c}>{c||'Todas'}</option>)}
                </select>
              </div>
              <div>
                <label style={{fontSize:11,color:'var(--t3)',display:'block',marginBottom:4}}>Subcategoria</label>
                <input className="form-input" style={{height:32,fontSize:12}} placeholder="ex: Políticas..." value={filterSub} onChange={e=>{setFilterSub(e.target.value);setPage(0);}}/>
              </div>
              <div>
                <label style={{fontSize:11,color:'var(--t3)',display:'block',marginBottom:4}}>Origem</label>
                <select className="form-select" style={{height:32,fontSize:12}} value={filterMethod} onChange={e=>{setFilterMethod(e.target.value);setPage(0);}}>
                  <option value="">Todas</option>

                          <button className="btn btn-sm" style={{background:'rgba(225,48,108,0.15)',color:'#f472b6',border:'1px solid rgba(225,48,108,0.3)'}} onClick={()=>publicarIG(p)} disabled={!!igPublishing} title="Publicar no Instagram">📱 Instagram</button>

                          <span># {p.categoria || <span style={{color:'#ef4444'}}>sem categoria</span>}</span>

                          {p.metrics && typeof p.metrics==='object' && p.metrics.seo_score!=null && <span>📈 SEO {p.metrics.seo_score}</span>}
                          {p.metrics && typeof p.metrics==='object' && p.metrics.foco_keyword && <span>🔑 {p.metrics.foco_keyword}</span>}
                          {p.metrics && typeof p.metrics==='object' && p.metrics.revisao_obs && <span style={{color:'#fbbf24'}}>💬 {p.metrics.revisao_obs}</span>}
                          {chkRisco(p) && <span style={{color:'#ef4444',fontWeight:700}}>🔴 {!p.categoria?'sem categoria':p.categoria==='geral'?'cat=geral':'conteúdo curto'}</span>}

              </table>
            </div>

              <span className="pagination-info">Página {page+1}</span>
              <button className="btn btn-secondary btn-sm" onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={page===0}>← Anterior</button>
              <button className="btn btn-secondary btn-sm" onClick={()=>setPage(p=>p+1)} disabled={posts.length<PER}>Próxima →</button>

            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ── CONTAS INSTAGRAM ──
function ContasInstagram() {
  const [accounts, setAccounts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editAcc, setEditAcc] = useState(null);
  const [newAcc, setNewAcc] = useState(false);
  const [form, setForm] = useState({username:'',ig_user_id:'',token:'',active:true,distribuicao_automatica:true,limite_diario:25});

  const load = async () => {
    setLoading(true);
    const { data } = await sb.from('ig_accounts').select('*').order('created_at',{ascending:false});
    setAccounts(data||[]);
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  const saveAccount = async () => {
    if (editAcc) {
      await sb.from('ig_accounts').update({...form,updated_at:new Date().toISOString()}).eq('id',editAcc.id);
    } else {
      await sb.from('ig_accounts').insert([{...form,posts_hoje:0}]);
    }
    setEditAcc(null); setNewAcc(false);
    setForm({username:'',ig_user_id:'',token:'',active:true,distribuicao_automatica:true,limite_diario:25});
    load();
  };

  const toggleActive = async (acc) => {
    await sb.from('ig_accounts').update({active:!acc.active}).eq('id',acc.id);
    load();
  };

  const openEdit = acc => {
    setForm({username:acc.username||'',ig_user_id:acc.ig_user_id||'',token:acc.token||'',active:acc.active,distribuicao_automatica:acc.distribuicao_automatica,limite_diario:acc.limite_diario||25});
    setEditAcc(acc); setNewAcc(false);
  };

  const openNew = () => {
    setForm({username:'',ig_user_id:'',token:'',active:true,distribuicao_automatica:true,limite_diario:25});
    setNewAcc(true); setEditAcc(null);
  };

  return (
    <div>
      <div className="page-header"><div className="page-title">Contas Instagram</div><div className="page-sub">Gestão e monitoramento de contas</div></div>
      <div className="page-body">
        {(editAcc||newAcc)&&(
          <div className="modal-bg">
            <div className="modal">
              <div className="modal-header"><span className="modal-title">{editAcc?'Editar Conta':'Nova Conta'}</span><button className="btn btn-secondary btn-sm" onClick={()=>{setEditAcc(null);setNewAcc(false);}}>✕</button></div>
              <div className="modal-body">
                <div className="form-group"><label className="form-label">Username</label><input className="form-input" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} placeholder="ovalorcapital"/></div>
                <div className="form-group"><label className="form-label">IG User ID</label><input className="form-input" value={form.ig_user_id} onChange={e=>setForm({...form,ig_user_id:e.target.value})}/></div>
                <div className="form-group"><label className="form-label">Access Token</label><textarea className="form-textarea" style={{minHeight:80}} value={form.token} onChange={e=>setForm({...form,token:e.target.value})}/></div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  <div className="form-group"><label className="form-label">Limite Diário</label><input className="form-input" type="number" value={form.limite_diario} onChange={e=>setForm({...form,limite_diario:parseInt(e.target.value)||25})}/></div>
                  <div className="form-group" style={{paddingTop:20}}>
                    <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                      <input type="checkbox" checked={form.distribuicao_automatica} onChange={e=>setForm({...form,distribuicao_automatica:e.target.checked})}/>
                      <span style={{fontSize:13}}>Distribuição automática</span>
                    </label>
                  </div>
                </div>
              </div>
              <div className="modal-footer"><button className="btn btn-secondary" onClick={()=>{setEditAcc(null);setNewAcc(false);}}>Cancelar</button><button className="btn btn-primary" onClick={saveAccount}>Salvar</button></div>
            </div>
          </div>
        )}
        <div className="panel">
          <div className="panel-header"><span className="panel-title">Contas Cadastradas</span><button className="btn btn-primary btn-sm" onClick={openNew}>+ Nova Conta</button></div>
          {loading?<div className="loading">Carregando...</div>:accounts.length===0?<div className="empty-state"><div className="empty-icon">📱</div><div className="empty-text">Nenhuma conta cadastrada</div></div>:(
            <table><thead><tr><th>Username</th><th>Status</th><th>Posts Hoje</th><th>Limite</th><th>Distribuição</th><th>Última Atividade</th><th>Ações</th></tr></thead>
            <tbody>{accounts.map(a=>(
              <tr key={a.id}>
                <td style={{fontWeight:600}}>@{a.username}</td>
                <td><span className={`badge ${a.active?'badge-green':'badge-red'}`}>{a.active?'Ativa':'Inativa'}</span></td>
                <td>{a.posts_hoje||0}</td>
                <td>{a.limite_diario||25}</td>
                <td><span className={`badge ${a.distribuicao_automatica?'badge-green':'badge-gray'}`}>{a.distribuicao_automatica?'Sim':'Não'}</span></td>
                <td className="text-secondary text-small">{a.ultima_atividade?fmt(a.ultima_atividade):'Nunca'}</td>
                <td><div className="gap-8">
                  <button className="btn btn-secondary btn-sm" onClick={()=>openEdit(a)}>✏️</button>
                  <button className={`btn btn-sm ${a.active?'btn-secondary':'btn-green'}`} onClick={()=>toggleActive(a)}>{a.active?'Pausar':'Ativar'}</button>
                </div></td>
              </tr>
            ))}</tbody></table>
          )}
        </div>
      </div>
    </div>
  );
}

function FontesRSS() {
  const [sources, setSources] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({name:'',url:'',active:true});
  const [editSrc, setEditSrc] = useState(null);
  const [newSrc, setNewSrc] = useState(false);

  const load = async () => {
    setLoading(true);
    const { data } = await sb.from('rss_sources').select('*').order('created_at',{ascending:false});
    setSources(data||[]);
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  const save = async () => {
    if (editSrc) { await sb.from('rss_sources').update(form).eq('id',editSrc.id); }
    else { await sb.from('rss_sources').insert([form]); }
    setEditSrc(null); setNewSrc(false);
    setForm({name:'',url:'',active:true});
    load();
  };

  const toggle = async src => {
    await sb.from('rss_sources').update({active:!src.active}).eq('id',src.id);
    load();
  };

  const openEdit = src => { setForm({name:src.name,url:src.url,active:src.active}); setEditSrc(src); setNewSrc(false); };
  const openNew = () => { setForm({name:'',url:'',active:true}); setNewSrc(true); setEditSrc(null); };

  return (
    <div>
      <div className="page-header"><div className="page-title">Fontes RSS</div><div className="page-sub">Gerenciamento de fontes de conteúdo</div></div>
      <div className="page-body">
        {(editSrc||newSrc)&&(
          <div className="modal-bg">
            <div className="modal">
              <div className="modal-header"><span className="modal-title">{editSrc?'Editar Fonte':'Nova Fonte'}</span><button className="btn btn-secondary btn-sm" onClick={()=>{setEditSrc(null);setNewSrc(false);}}>✕</button></div>
              <div className="modal-body">
                <div className="form-group"><label className="form-label">Nome</label><input className="form-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
                <div className="form-group"><label className="form-label">URL do Feed RSS</label><input className="form-input" value={form.url} onChange={e=>setForm({...form,url:e.target.value})}/></div>
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                  <input type="checkbox" checked={form.active} onChange={e=>setForm({...form,active:e.target.checked})}/><span>Ativa</span>
                </label>
              </div>
              <div className="modal-footer"><button className="btn btn-secondary" onClick={()=>{setEditSrc(null);setNewSrc(false);}}>Cancelar</button><button className="btn btn-primary" onClick={save}>Salvar</button></div>
            </div>
          </div>
        )}
        <div className="panel">
          <div className="panel-header"><span className="panel-title">{sources.length} fontes cadastradas</span><button className="btn btn-primary btn-sm" onClick={openNew}>+ Nova Fonte</button></div>
          {loading?<div className="loading">Carregando...</div>:sources.length===0?<div className="empty-state"><div className="empty-icon">📡</div><div className="empty-text">Nenhuma fonte cadastrada</div></div>:(
            <table><thead><tr><th>Nome</th><th>URL</th><th>Status</th><th>Última leitura</th><th>Ações</th></tr></thead>
            <tbody>{sources.map(s=>(
              <tr key={s.id}>
                <td style={{fontWeight:600}}>{s.name}</td>
                <td className="text-secondary text-small">{truncate(s.url,50)}</td>
                <td><span className={`badge ${s.active?'badge-green':'badge-red'}`}>{s.active?'Ativa':'Inativa'}</span></td>
                <td className="text-secondary text-small">{s.last_fetched?fmt(s.last_fetched):'Nunca'}</td>

                  <button className="btn btn-secondary btn-sm" onClick={()=>openEdit(s)}>✏️</button>
                  <button className={`btn btn-sm ${s.active?'btn-secondary':'btn-green'}`} onClick={()=>toggle(s)}>{s.active?'Pausar':'Ativar'}</button>
                </div></td>
              </tr>
            ))}</tbody></table>
          )}
        </div>
      </div>
    </div>
  );
}

// ── LOGS ──
function Logs() {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [page, setPage] = useState(0);
  const PER = 50;

  const load = useCallback(async () => {
    setLoading(true);
    let q = sb.from('logs').select('*').order('created_at',{ascending:false}).range(page*PER,(page+1)*PER-1);
    if (filter!=='all') q=q.eq('level',filter);
    const { data } = await q;
    setLogs(data||[]);
    setLoading(false);
  },[filter,page]);

  useEffect(()=>{load();},[load]);

  return (
    <div>
      <div className="page-header"><div className="page-title">Logs</div><div className="page-sub">Histórico completo de execuções e erros</div></div>
      <div className="page-body">
        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">Registros</span>
            <div className="gap-8">
              {['all','info','warn','error'].map(f=>(
                <button key={f} className={`btn btn-sm ${filter===f?'btn-primary':'btn-secondary'}`} onClick={()=>{setFilter(f);setPage(0);}}>
                  {f==='all'?'Todos':f}
                </button>
              ))}
              <button className="btn btn-secondary btn-sm" onClick={load}>↻</button>
            </div>
          </div>
          {loading?<div className="loading">Carregando...</div>:logs.length===0?<div className="empty-state"><div className="empty-icon">📋</div><div className="empty-text">Nenhum log</div></div>:(
            <>
            <table><thead><tr><th>Nível</th><th>Mensagem</th><th>Data</th></tr></thead>
            <tbody>{logs.map(l=>(
              <tr key={l.id}>
                <td><span className={`badge ${l.level==='error'?'badge-red':l.level==='warn'?'badge-yellow':'badge-gray'}`}>{l.level}</span></td>
                <td style={{fontFamily:'monospace',fontSize:12}}>{l.message}</td>
                <td className="text-secondary text-small">{fmt(l.created_at)}</td>
              </tr>
            ))}</tbody></table>
            <div className="pagination">
              <span className="pagination-info">Página {page+1}</span>
              <button className="btn btn-secondary btn-sm" onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={page===0}>← Anterior</button>
              <button className="btn btn-secondary btn-sm" onClick={()=>setPage(p=>p+1)} disabled={logs.length<PER}>Próxima →</button>
            </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}
