<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDC - Centro de Comando • O Valor Capital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .nav-item { transition: all 0.2s; }
    .nav-item:hover { background-color: #f8fafc; }
    .card { transition: all 0.3s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-white text-slate-800">

  <div class="flex h-screen">

    <!-- Sidebar -->
    <div class="w-72 bg-white border-r border-slate-200 flex flex-col shadow-sm">
      <div class="p-8 border-b">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">VC</div>
          <div>
            <h1 class="text-3xl font-semibold tracking-tighter">CDC</h1>
            <p class="text-sm text-slate-500 -mt-1">Centro de Comando</p>
          </div>
        </div>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-1">
        <div onclick="showSection('dashboard')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer bg-slate-100 font-medium">
          <i class="fa-solid fa-house w-5"></i> Dashboard
        </div>
        <div onclick="showSection('fontes')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-rss w-5"></i> Fontes
        </div>
        <div onclick="showSection('fila')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-list-check w-5"></i> Fila de Aprovação
        </div>
        <div onclick="showSection('publicar')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-paper-plane w-5"></i> Publicar
        </div>
        <div onclick="showSection('contas')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-users w-5"></i> Contas Conectadas
        </div>
        <div onclick="showSection('relatorios')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-chart-bar w-5"></i> Relatórios
        </div>
        <div onclick="showSection('logs')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-clock-rotate-left w-5"></i> Logs
        </div>
        <div onclick="showSection('config')" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl cursor-pointer hover:bg-slate-50">
          <i class="fa-solid fa-gear w-5"></i> Configurações
        </div>
      </nav>
    </div>

    <!-- Conteúdo Principal -->
    <div class="flex-1 overflow-auto bg-slate-50" id="main-content">
      <!-- Dashboard inicial -->
      <div class="p-10">
        <h1 class="text-4xl font-semibold tracking-tight mb-10">Dashboard</h1>
        
        <div class="grid grid-cols-4 gap-6">
          <div class="bg-white rounded-3xl p-8 card">
            <p class="text-slate-500">Posts hoje</p>
            <p class="text-6xl font-semibold mt-4">28</p>
          </div>
          <div class="bg-white rounded-3xl p-8 card">
            <p class="text-slate-500">Aguardando aprovação</p>
            <p class="text-6xl font-semibold mt-4 text-amber-600">11</p>
          </div>
          <div class="bg-white rounded-3xl p-8 card">
            <p class="text-slate-500">Publicados esta semana</p>
            <p class="text-6xl font-semibold mt-4">94</p>
          </div>
          <div class="bg-white rounded-3xl p-8 card">
            <p class="text-slate-500">Taxa de aprovação</p>
            <p class="text-6xl font-semibold mt-4 text-emerald-600">96%</p>
          </div>
        </div>

        <div class="mt-12 bg-white rounded-3xl p-8 card">
          <h2 class="text-2xl font-semibold mb-6">Fila de Aprovação</h2>
          <div class="space-y-4" id="fila">
            <!-- Itens serão adicionados via JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showSection(section) {
      const content = document.getElementById('main-content');
      if (section === 'dashboard') {
        content.innerHTML = `<div class="p-10"><h1 class="text-4xl font-semibold tracking-tight mb-10">Dashboard</h1><div class="grid grid-cols-4 gap-6">... (mesmos cards acima) ...</div></div>`;
      } else if (section === 'fila') {
        content.innerHTML = `<div class="p-10"><h1 class="text-4xl font-semibold mb-8">Fila de Aprovação</h1><p class="text-slate-400">Em breve...</p></div>`;
      } else {
        content.innerHTML = `<div class="p-10"><h1 class="text-4xl font-semibold mb-8">${section.toUpperCase()}</h1><p class="text-slate-400">Módulo em desenvolvimento...</p></div>`;
      }
    }

    // Exemplo de fila
    setTimeout(() => {
      const fila = document.getElementById('fila');
      if (fila) {
        fila.innerHTML = `
          <div class="flex justify-between items-center bg-slate-50 p-6 rounded-2xl">
            <div>
              <p class="font-medium">STF forma maioria para derrubar lei de cotas raciais</p>
              <p class="text-sm text-slate-500">Fonte: Agência Brasil • 12 minutos atrás</p>
            </div>
            <div class="flex gap-3">
              <button onclick="alert('Post aprovado!')" class="px-6 py-2 bg-emerald-600 text-white rounded-2xl text-sm font-medium">Aprovar</button>
              <button onclick="alert('Post rejeitado')" class="px-6 py-2 bg-slate-300 rounded-2xl text-sm font-medium">Rejeitar</button>
            </div>
          </div>`;
      }
    }, 800);
  </script>
</body>
</html>
