                  <input className="form-input" type="number" min={1} max={20} value={p.quantidade}
                    onChange={e=>updatePedido(idx,'quantidade',parseInt(e.target.value)||1)}

                  <button className="btn btn-secondary btn-sm" style={{padding:'4px 8px',color:'#f87171'}}

              ))}

              <div style={{fontSize:11,color:'var(--t2)',marginTop:4}}>
                Total: {pedidos.reduce((s,p)=>s+(parseInt(p.quantidade)||0),0)} matÃ©rias solicitadas â€¢ MÃ¡x 20 por linha
              </div>
            </div>

            <button className="btn btn-primary" style={{padding:'10px 28px',fontSize:14,marginTop:8}} onClick={runManual} disabled={manualRunning}>
              {manualRunning ? 'â³ Gerando...' : `âš¡ Gerar ${pedidos.reduce((s,p)=>s+(parseInt(p.quantidade)||0),0)} matÃ©ria(s) agora`}
            </button>

            {/* NotificaÃ§Ãµes e resultado */}
            {manualResult && (
              <div style={{marginTop:16}}>
                {manualResult.notificacoes?.map((n,i)=>(
                  <div key={i} style={{
                    padding:'10px 14px', borderRadius:6, marginBottom:6,
                    background: n.tipo==='sucesso'?'rgba(22,163,74,0.1)':n.tipo==='aviso'?'rgba(255,200,0,0.1)':'rgba(200,30,30,0.1)',
                    border: `1px solid ${n.tipo==='sucesso'?'rgba(22,163,74,0.3)':n.tipo==='aviso'?'rgba(255,200,0,0.3)':'rgba(200,30,30,0.3)'}`,
                    fontSize:13
                  }}>{n.mensagem}</div>
                ))}
                {manualResult.resultados?.filter(r=>r.status==='ok').map((r,i)=>(
                  <div key={i} style={{fontSize:12,color:'var(--t2)',marginBottom:4,paddingLeft:8,borderLeft:'2px solid #4ade80',marginTop:4}}>
                    <span style={{textTransform:'capitalize',color:'#4ade80',marginRight:6}}>[{r.categoria}{r.subcategoria?' â†’ '+r.subcategoria:''}]</span>
                    {r.titulo}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="panel">
          <div className="panel-header"><span className="panel-title">ExecuÃ§Ãµes Recentes (Logs)</span><button className="btn btn-secondary btn-sm" onClick={load}>â†» Atualizar</button></div>
          {logs.length===0?<div className="empty-state"><div className="empty-icon">ðŸ“‹</div><div className="empty-text">Nenhuma execuÃ§Ã£o registrada</div></div>:
          <table><thead><tr><th>NÃ­vel</th><th>Mensagem</th><th>Data</th></tr></thead>
          <tbody>{logs.map(l=><tr key={l.id}>
            <td><span className={`badge ${l.level==='error'?'badge-red':l.level==='warn'?'badge-yellow':'badge-gray'}`}>{l.level}</span></td>
            <td className="text-small">{truncate(l.message,80)}</td>
            <td className="text-secondary text-small">{fmt(l.created_at)}</td>
          </tr>)}</tbody></table>}
        </div>
      </div>
    </div>
  );
}

function Postagens() {
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [page, setPage] = useState(0);
  const [selected, setSelected] = useState([]);
  const [approving, setApproving] = useState(false);
  const [editPost, setEditPost] = useState(null);
  const [previewPost, setPreviewPost] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const [busca, setBusca] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [filterSub, setFilterSub] = useState('');
  const [filterDe, setFilterDe] = useState('');
  const [filterAte, setFilterAte] = useState('');
  const [filterMethod, setFilterMethod] = useState('');
  const [totalCount, setTotalCount] = useState(0);
  const [filtrosAbertos, setFiltrosAbertos] = useState(false);
  const [smartFilter, setSmartFilter] = useState('');
  const [showMetrics, setShowMetrics] = useState(false);
  const PER = 50;

  const BLOCKED_IMG_RE = [/perfil/i,/author/i,/avatar/i,/reporter/i,/profile/i,/headshot/i,/icon/i,/logo/i,/favicon/i,/sprite/i,/watermark/i,/\.svg$/i,/\.gif$/i,/\.ico$/i,/placeholder/i,/picsum/i,/lorempixel/i,/dummyimage/i,/placehold\.it/i,/fakeimg/i,/loremflickr/i,/fillmurray/i,/placekitten/i];
  function chkSemImg(p)  { return !p.imagem || p.imagem.trim() === ''; }
  function chkImgSusp(p) { return !!p.imagem && BLOCKED_IMG_RE.some(function(r){ return r.test(p.imagem); }); }
  function chkImgOk(p)   { return !!p.imagem && p.imagem.trim() !== '' && !chkImgSusp(p); }
  function chkRisco(p)   { return (!p.conteudo || p.conteudo.length < 200) || p.categoria === 'geral' || !p.categoria; }

  const kpi = React.useMemo(function(){
    return {
      semImg:  posts.filter(chkSemImg).length,
      suspeita:posts.filter(chkImgSusp).length,
      imgOk:   posts.filter(chkImgOk).length,
      risco:   posts.filter(chkRisco).length,
      pendente:posts.filter(function(p){ return p.status==='pendente'; }).length
    };
  }, [posts]);

  const displayPosts = React.useMemo(function(){
    if (smartFilter === 'sem_img')  return posts.filter(chkSemImg);
    if (smartFilter === 'suspeita') return posts.filter(chkImgSusp);
    if (smartFilter === 'img_ok')   return posts.filter(chkImgOk);
    if (smartFilter === 'risco')    return posts.filter(chkRisco);
    return posts;
  }, [posts, smartFilter]);

  const load = useCallback(async () => {
    setLoading(true); setSelected([]);
    let q = sb.from('posts').select('*',{count:'exact'}).order('created_at',{ascending:false}).range(page*PER,(page+1)*PER-1);
    if (filter!=='all') q=q.eq('status',filter);
    if (busca.trim()) q=q.ilike('titulo','%'+busca.trim()+'%');
    if (filterCat) q=q.like('user_tags','%"'+filterCat+'"%');
    if (filterSub.trim()) q=q.ilike('subcategoria','%'+filterSub.trim()+'%');
    if (filterMethod) q=q.eq('publish_method',filterMethod);
    if (filterDe) q=q.gte('created_at',filterDe+'T00:00:00');
    if (filterAte) q=q.lte('created_at',filterAte+'T23:59:59');
    const { data, count } = await q;
    // Normaliza: extrai categoria de user_tags (JSON array) pois nÃ£o hÃ¡ coluna 'categoria' no Supabase
    var norm = (data||[]).map(function(p){
      var tags = []; try { tags = JSON.parse(p.user_tags||'[]'); } catch(_){}
      return Object.assign({}, p, { categoria: tags[0]||'' });
    });
    setPosts(norm);
    setTotalCount(count||0);
    const { data: acc } = await sb.from('ig_accounts').select('id,username').eq('active',true);
    setAccounts(acc||[]);
    setLoading(false);
  },[filter,page,busca,filterCat,filterSub,filterMethod,filterDe,filterAte]);

  useEffect(()=>{load();},[load]);

  const limparFiltros = () => { setBusca(''); setFilterCat(''); setFilterSub(''); setFilterDe(''); setFilterAte(''); setFilterMethod(''); setFilter('all'); setPage(0); };

  const toggleSelect = id => setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleAll = () => {
    const todos = posts.map(p=>p.id);
    setSelected(p=>p.length===todos.length?[]:todos);
  };

  const salvarImagemBanco = async function(post) {
    if (!post || !post.imagem) return;
    try { await sb.from('image_bank').upsert({url:post.imagem,titulo:post.titulo||'',post_id:post.id},{onConflict:'url',ignoreDuplicates:true}); } catch(e){}
  };

  const pubPortal = async id => {
    setApproving(true);
    try {
      const now = new Date().toISOString();
      const { error } = await sb.from('posts').update({
        status: 'publicado', approved: true,
        publish_method: 'portal', published_at: now, updated_at: now
      }).eq('id', id);
      if (error) alert('âŒ Erro: ' + error.message);
      else { const post=posts.find(function(p){return p.id===id;}); if(post) salvarImagemBanco(post); alert('âœ… Publicado no Portal!'); load(); }
    } catch(e) { alert('âŒ Erro: ' + e.message); }
    setApproving(false);
  };

  const [igPublishing, setIgPublishing] = useState(null);

  const publicarIG = async (post) => {
    // Buscar URL do serviÃ§o nas configuraÃ§Ãµes
    const { data: cfg } = await sb.from('config').select('value').eq('key','IG_SERVICE_URL').single();
    const serviceUrl = cfg?.value;
    if (!serviceUrl) {
      alert('Configure a URL do serviÃ§o Instagram em ConfiguraÃ§Ãµes â†’ URL ServiÃ§o Instagram.');
      return;
    }
    if (!confirm(`Publicar "${post.titulo}" no Instagram?`)) return;
    setIgPublishing(post.id);
    try {
      const r = await fetch('/api/ig_publish', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          post_id: post.id,
          image_url: post.imagem,
          caption: post.conteudo ? post.conteudo.slice(0, 2200) : post.titulo
        })
      });
      const d = await r.json();
      if (d.ok) {
        alert('âœ… Publicado no Instagram com sucesso!');
      } else {
        alert('âŒ Erro: ' + (d.error || 'Falha ao publicar'));
      }
    } catch(e) {
      alert('âŒ Erro de conexÃ£o com o serviÃ§o: ' + e.message);
    }
    setIgPublishing(null);
  };

  const [revisando, setRevisando] = useState(null);
  const [revisaoModal, setRevisaoModal] = useState({show:false, post:null, flags:{texto:false,imagem:false,fontes:false}, obs:''});

  const abrirRevisao = post => setRevisaoModal({show:true, post, flags:{texto:false,imagem:false,fontes:false}, obs:''});

  const devolverRevisao = async () => {
    const {post, flags, obs} = revisaoModal;
    if (!flags.texto && !flags.imagem && !flags.fontes && !obs.trim()) {
      alert('Selecione ao menos uma opÃ§Ã£o de revisÃ£o ou escreva uma observaÃ§Ã£o.');
      return;
    }
    setRevisando(post.id);
    setRevisaoModal(m=>({...m, show:false}));
    try {
      // Salvar flags e observaÃ§Ãµes no post
      const metricsAtual = typeof post.metrics === 'object' ? post.metrics : {};
      await sb.from('posts').update({
        status: 'pendente',
        approved: false,
        published_at: null,
        metrics: {...metricsAtual, revisao_obs: obs, revisao_flags: flags, revisao_at: new Date().toISOString()}
      }).eq('id', post.id);

      // Revisar texto com IA se solicitado
      if (flags.texto) {
        try {
          const r = await fetch('/api/editor_ia', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({texto: post.conteudo, acao:'melhorar', ia:'openai', publicar:false})
          });
          const d = await r.json();
          if (d.ok && d.corpo) {
            await sb.from('posts').update({
              titulo: d.titulo || post.titulo,
              conteudo: d.corpo,
              comentario_fixado: d.meta_descricao || post.comentario_fixado
            }).eq('id', post.id);
          }
        } catch(e) { console.warn('RevisÃ£o de texto falhou:', e.message); }
      }

      // Limpar imagem se solicitado â€” sistema buscarÃ¡ nova na prÃ³xima revisÃ£o
      if (flags.imagem) {
        await sb.from('posts').update({imagem: ''}).eq('id', post.id);
      }

      alert('âœ… Post devolvido para revisÃ£o' + (flags.texto ? ' â€” texto reprocessado pela IA' : '') + '.');
      load();
    } catch(e) {
      alert('Erro ao devolver: ' + e.message);
    }
    setRevisando(null);
  };

  const revisarIA = async (post) => {
    if (!confirm('A IA vai revisar o conteÃºdo e buscar nova imagem para este post. Continuar?')) return;
    setRevisando(post.id);
    try {
      // Pedir revisÃ£o ao editor_ia
      const r = await fetch('/api/editor_ia', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          texto: post.conteudo,
          acao: 'melhorar',
          ia: 'gemini',
          buscarImagem: true,
          publicar: false
        })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erro ao revisar');
      // Abrir modal de ediÃ§Ã£o com o resultado revisado
      setEditPost({
        ...post,
        titulo: d.titulo || post.titulo,
        conteudo: d.corpo || post.conteudo,
        imagem: d.imagem || post.imagem,
        _revisado: true
      });
    } catch(e) {
      alert('Erro ao revisar: ' + e.message);
    }
    setRevisando(null);
  };

  const despublicar = async id => {
    if (!confirm('Despublicar este post? Ele sairÃ¡ do portal imediatamente.')) return;
    await sb.from('posts').update({status:'pendente', approved:false, published_at:null}).eq('id',id);
    load();
  };

  const deletarPost = async id => {
    if (!confirm('âš ï¸ Excluir permanentemente este post? NÃ£o hÃ¡ como desfazer.')) return;
    const {error} = await sb.from('posts').delete().eq('id',id);
    if (error) alert('Erro ao excluir: ' + error.message);
    else load();
  };

  const pubPortalBatch = async () => {
    if (!selected.length) return;
    if (!confirm(`Publicar ${selected.length} post(s) no Portal Web?`)) return;
    setApproving(true);
    const now = new Date().toISOString();
    let ok = 0;
    for (const id of selected) {
      const { error } = await sb.from('posts').update({
        status: 'publicado', approved: true,
        publish_method: 'portal', published_at: now, updated_at: now
      }).eq('id', id);
      if (!error) { ok++; const post=posts.find(function(p){return p.id===id;}); if(post) salvarImagemBanco(post); }
    }
    alert(`âœ… ${ok} publicado(s) no Portal!`);
    load(); setApproving(false);
  };

  const deletarBatch = async () => {
    if (!selected.length) return;
    if (!confirm(`âš ï¸ Excluir permanentemente ${selected.length} post(s)? NÃ£o hÃ¡ como desfazer.`)) return;
    setApproving(true);
    const { error } = await sb.from('posts').delete().in('id', selected);
    if (error) alert('Erro: ' + error.message);
    else alert(`ðŸ—‘ï¸ ${selected.length} post(s) excluÃ­do(s).`);
    load(); setApproving(false);
  };

  const saveEdit = async () => {
    const slugSub = (editPost.subcategoria||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    await sb.from('posts').update({
      titulo: editPost.titulo,
      conteudo: editPost.conteudo,
      comentario_fixado: editPost.comentario_fixado,
      imagem: editPost.imagem,
      ig_account_id: editPost.ig_account_id||null,
      scheduled_at: editPost.scheduled_at||null,
      user_tags: editPost.categoria ? JSON.stringify([editPost.categoria]) : (editPost.user_tags||'[]'),
      subcategoria: editPost.subcategoria||'',
      subcategoria_slug: slugSub,
      collaborators: editPost.collaborators||'[]',
      updated_at: new Date().toISOString()
    }).eq('id',editPost.id);
    setEditPost(null); load();
  };

  return (
    <div>
      <div className="page-header"><div className="page-title">Postagens</div><div className="page-sub">AprovaÃ§Ã£o, ediÃ§Ã£o e histÃ³rico de posts</div></div>
      <div className="page-body">
        {previewPost&&(
          <div className="modal-bg" onClick={()=>setPreviewPost(null)}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
              <div className="modal-header"><span className="modal-title">Preview do Post</span><button className="btn btn-secondary btn-sm" onClick={()=>setPreviewPost(null)}>âœ•</button></div>
              <div className="modal-body" style={{display:'flex',gap:20,flexWrap:'wrap'}}>
                <div className="preview-card" style={{flex:'0 0 280px'}}>
                  {previewPost.imagem?<img src={previewPost.imagem} style={{width:'100%',aspectRatio:'4/5',objectFit:'cover'}} onError={e=>e.target.style.display='none'} alt=""/>:<div style={{width:'100%',aspectRatio:'4/5',background:'#1a1a2e',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Sem imagem</div>}
                  <div className="preview-caption">{previewPost.conteudo}</div>
                </div>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:12,color:'var(--t2)',marginBottom:8}}>ComentÃ¡rio fixado:</div>
                  <div style={{fontSize:13,color:'var(--t1)',background:'var(--input)',padding:12,borderRadius:8}}>{previewPost.comentario_fixado||'â€”'}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginTop:12,marginBottom:4}}>Conta:</div>
                  <div style={{fontSize:13}}>{previewPost.ig_accounts?.username||'AutomÃ¡tica'}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginTop:12,marginBottom:4}}>Agendado para:</div>
                  <div style={{fontSize:13}}>{previewPost.scheduled_at?fmt(previewPost.scheduled_at):'Publicar imediatamente'}</div>
                </div>
              </div>
            </div>
          </div>
        )}
        {revisaoModal.show&&(
          <div className="modal-bg" onClick={()=>setRevisaoModal(m=>({...m,show:false}))}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:500}}>
              <div className="modal-header">
                <span className="modal-title">ðŸ”„ Devolver para RevisÃ£o</span>
                <button className="btn btn-secondary btn-sm" onClick={()=>setRevisaoModal(m=>({...m,show:false}))}>âœ•</button>
              </div>
              <div className="modal-body">
                <div style={{fontSize:13,color:'var(--t2)',marginBottom:16,padding:'8px 12px',background:'rgba(255,200,0,0.07)',borderRadius:8,border:'1px solid rgba(255,200,0,0.2)'}}>
                  <strong style={{color:'var(--t1)'}}>{revisaoModal.post?.titulo}</strong>
                </div>
                <div className="form-group">

// â”€â”€ RELATÃ“RIOS â”€â”€
function Relatorios() {
  const [dados, setDados] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [periodo, setPeriodo] = React.useState(7);

  const load = React.useCallback(async () => {
    setLoading(true);
    const agora = new Date();
    const inicio = new Date(agora - periodo * 24 * 60 * 60 * 1000).toISOString();

    // Buscar TODOS os posts do perÃ­odo â€” sem limite
    let allPosts = [];
    let from = 0;
    const pageSize = 1000;
    while (true) {
      const q = sb.from('posts')
        .select('id,titulo,status,user_tags,subcategoria,created_at,published_at,publish_method')
        .order('created_at', {ascending: false})
        .range(from, from + pageSize - 1);
      if (periodo < 3650) q.gte('created_at', inicio);
      const { data: page } = await q;
      if (!page || page.length === 0) break;
      allPosts = allPosts.concat(page);
      if (page.length < pageSize) break;
      from += pageSize;
    }
    const posts = allPosts;

    // Buscar logs do perÃ­odo â€” sem limite
    let allLogs = [];
    let fromL = 0;
    while (true) {
      const q2 = sb.from('logs')
        .select('level,message,created_at')
        .order('created_at', {ascending: false})
        .range(fromL, fromL + 500 - 1);
      if (periodo < 3650) q2.gte('created_at', inicio);
      const { data: pageL } = await q2;
      if (!pageL || pageL.length === 0) break;
      allLogs = allLogs.concat(pageL);
      if (pageL.length < 500) break;
      fromL += 500;
    }
    const logs = allLogs;

    if (!posts) { setLoading(false); return; }

    // Calcular mÃ©tricas
    const total = posts.length;
    const publicados = posts.filter(p => p.status === 'publicado').length;
    const pendentes = posts.filter(p => p.status === 'pendente').length;
    const erros_count = (logs||[]).filter(l => l.level === 'error').length;

    // Posts por dia
    const porDia = {};
    posts.forEach(p => {
      const dia = p.created_at.slice(0,10);
      porDia[dia] = (porDia[dia] || 0) + 1;
    });

    // Posts por categoria
    const porCat = {};
    posts.forEach(p => {
      try {
        const tags = JSON.parse(p.user_tags || '[]');
        const cat = tags[0] || 'geral';
        porCat[cat] = (porCat[cat] || 0) + 1;
      } catch {}
    });

    // Posts por mÃ©todo de publicaÃ§Ã£o
    const porMetodo = {};
    posts.forEach(p => {
      const m = p.publish_method || 'portal';
      porMetodo[m] = (porMetodo[m] || 0) + 1;
    });

    // MÃ©dia diÃ¡ria
    const mediaDiaria = periodo > 0 ? (publicados / periodo).toFixed(1) : 0;

    // Ãšltimos erros
    const ultimosErros = (logs||[]).filter(l => l.level === 'error').slice(0, 10);

    setDados({ total, publicados, pendentes, erros_count, porDia, porCat, porMetodo, mediaDiaria, ultimosErros, posts: posts.slice(0,10) });
    setLoading(false);
  }, [periodo]);

  React.useEffect(() => { load(); }, [load]);

  if (loading) return <div className="loading">Carregando relatÃ³rios...</div>;
  if (!dados) return <div className="empty-state"><div className="empty-icon">ðŸ“Š</div><div className="empty-text">Sem dados</div></div>;

  const diaSort = Object.entries(dados.porDia).sort((a,b) => a[0].localeCompare(b[0]));
  const maxDia = Math.max(...Object.values(dados.porDia), 1);

  return (
    <div>
      <div className="page-header">
        <div className="page-title">RelatÃ³rios</div>

        {/* Seletor de perÃ­odo */}
        <div style={{display:'flex',gap:8,marginBottom:20}}>
          {[1,7,15,30,365,3650].map(d => (
            <button key={d} className={`btn btn-sm ${periodo===d?'btn-primary':'btn-secondary'}`} onClick={()=>setPeriodo(d)}>
              {d===1?'Hoje':d===3650?'Tudo':d===365?'1 ano':`${d} dias`}
            </button>
          ))}
          <button className="btn btn-sm btn-secondary" onClick={load} style={{marginLeft:'auto'}}>ðŸ”„ Atualizar</button>
        </div>

            {label:'Publicados', valor:dados.publicados, cor:'var(--green)', icon:'âœ…'},
            {label:'Pendentes', valor:dados.pendentes, cor:'var(--yellow)', icon:'â³'},

function Alertas() {
  const [alerts, setAlerts] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    const { data } = await sb.from('alerts').select('*').order('created_at',{ascending:false}).limit(50);
    setAlerts(data||[]);
    setLoading(false);
  },[]);

  useEffect(()=>{load(); const t=setInterval(load,20000); return()=>clearInterval(t);},[load]);

  const markRead = async (id) => {
    await sb.from('alerts').update({read:true}).eq('id',id);
    load();
  };

  const markAllRead = async () => {
    await sb.from('alerts').update({read:true}).eq('read',false);
    load();
  };

  const unread = alerts.filter(a=>!a.read).length;

  return (
    <div>
      <div className="page-header">
        <div className="page-title">ðŸš¨ Alertas {unread>0&&<span className="notif-dot" style={{display:'inline-block',marginLeft:8}}></span>}</div>

      </div>
      <div className="page-body">
        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">{unread} nÃ£o lido(s)</span>
            <div className="gap-8">
              {unread>0&&<button className="btn btn-secondary btn-sm" onClick={markAllRead}>Marcar todos como lidos</button>}
              <button className="btn btn-secondary btn-sm" onClick={load}>â†»</button>
            </div>
          </div>
          {loading?<div className="loading">Carregando...</div>:alerts.length===0?
            <div className="empty-state"><div className="empty-icon">âœ…</div><div className="empty-text">Nenhum alerta</div></div>:
            <table><thead><tr><th>Tipo</th><th>Mensagem</th><th>Data</th><th></th></tr></thead>
            <tbody>{alerts.map(a=>(
              <tr key={a.id} style={!a.read?{background:'rgba(200,30,30,0.04)'}:{}}>
                <td><span className={`badge ${a.type==='error'?'badge-red':a.type==='growth'?'badge-green':'badge-yellow'}`}>{a.type}</span></td>
                <td style={{fontWeight:a.read?400:600}}>{a.message}</td>
                <td className="text-secondary text-small">{fmt(a.created_at)}</td>
                <td>{!a.read&&<button className="btn btn-secondary btn-sm" onClick={()=>markRead(a.id)}>âœ“</button>}</td>
              </tr>
            ))}</tbody></table>
          }
        </div>
      </div>
    </div>
  );
}

// â”€â”€ REESCRITA OVC â”€â”€
function ReescritaOVC({onVerPendentes}) {
  const [aberto, setAberto] = useState(false);
  const [modo, setModo] = useState('url'); // 'url' | 'texto'
  const [urls, setUrls] = useState(Array(10).fill(''));
  const [res, setRes] = useState(Array(10).fill(null));
  const [texto, setTexto] = useState('');
  const [resTexto, setResTexto] = useState(null);
  const [rodando, setRodando] = useState(false);
  const [imgTexto, setImgTexto] = useState({mode:'auto', value:''});

  const enviarUrls = async () => {
    setRodando(true);
    const novosRes = Array(10).fill(null);
    setRes([...novosRes]);
    const ativos = urls.map((u,i)=>({u:u.trim(),i})).filter(x=>x.u);
    await Promise.all(ativos.map(async ({u,i})=>{
      novosRes[i]={estado:'enviando'};
      setRes([...novosRes]);
      try {
        const r = await fetch('/api/run_portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
        const j = await r.json();
        novosRes[i]={estado:j.ok===true?'ok':'erro',msg:j.titulo||j.error||j.status||''};
      } catch(e) { novosRes[i]={estado:'erro',msg:e.message}; }
      setRes([...novosRes]);
    }));
    setRodando(false);
  };

  const enviarTexto = async () => {
    if (!texto.trim()) return;
    setRodando(true);
    setResTexto({estado:'enviando'});
    try {
      const body = {texto:texto.trim()};
      if (imgTexto.mode==='url' && imgTexto.value) body.image_url = imgTexto.value;
      if (imgTexto.mode==='query' && imgTexto.value) body.image_query = imgTexto.value;
      const r = await fetch('/api/run_portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j = await r.json();
      setResTexto({estado:j.ok===true?'ok':'erro',msg:j.titulo||j.error||j.status||''});
    } catch(e) { setResTexto({estado:'erro',msg:e.message}); }
    setRodando(false);
  };

  const limpar = () => {
    setUrls(Array(10).fill('')); setRes(Array(10).fill(null));
    setTexto(''); setResTexto(null); setImgTexto({mode:'auto',value:''});
  };

  const tabStyle = (m) => ({
    padding:'6px 16px',fontSize:12,fontWeight:600,cursor:'pointer',border:'none',borderRadius:6,
    background: modo===m ? 'var(--red)' : 'rgba(255,255,255,0.06)',
    color: modo===m ? '#fff' : 'var(--t2)'
  });

  return (
    <>
      <button onClick={()=>setAberto(true)} style={{position:'fixed',top:16,right:20,zIndex:1000,background:'var(--red)',color:'#fff',border:'none',borderRadius:8,padding:'9px 16px',fontWeight:700,fontSize:13,cursor:'pointer',boxShadow:'0 4px 16px rgba(200,30,30,0.4)'}}>
        âœï¸ REESCRITA OVC
      </button>
      {aberto&&(
        <div className="modal-bg" onClick={()=>setAberto(false)}>
          <div className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <span className="modal-title">âœï¸ Reescrita OVC</span>
              <button className="btn btn-secondary btn-sm" onClick={()=>setAberto(false)}>âœ•</button>
            </div>
            <div style={{padding:'12px 20px 0',display:'flex',gap:6}}>
              <button style={tabStyle('url')} onClick={()=>setModo('url')}>ðŸ”— Por URL (atÃ© 10)</button>
              <button style={tabStyle('texto')} onClick={()=>setModo('texto')}>ðŸ“‹ Colar Texto</button>
            </div>
            <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:8}}>
              {modo==='url'&&<>
                <div style={{fontSize:12,color:'var(--t2)',marginBottom:4}}>Cada URL serÃ¡ reescrita no padrÃ£o OVC e enviada para Pendentes.<br/><span style={{color:'#f87171'}}>âš  Sites com Cloudflare (Folha, Veja, R7) bloqueiam â€” prefira UOL, AgÃªncia Brasil, MetrÃ³poles.</span></div>
                {urls.map(function(u,i){return(
                  <div key={i} style={{display:'flex',gap:8,alignItems:'center'}}>
                    <span style={{fontSize:11,color:'var(--t3)',width:18,textAlign:'right'}}>{i+1}</span>
                    <input className="form-input" style={{flex:1}} value={u} onChange={function(e){var n=[...urls];n[i]=e.target.value;setUrls(n);}} placeholder="https://..." disabled={rodando}/>
                    {res[i]&&<span title={res[i].msg||''} style={{fontSize:11,color:res[i].estado==='enviando'?'var(--yellow)':res[i].estado==='ok'?'#4ade80':'#f87171',maxWidth:130,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'inline-block',verticalAlign:'middle'}}>{res[i].estado==='enviando'?'â³':res[i].estado==='ok'?('âœ“ '+(res[i].msg||'OK').slice(0,25)):('âœ— '+(res[i].msg||'Erro').slice(0,25))}</span>}
                  </div>
                );})}
              </>}
              {modo==='texto'&&<>
                <div style={{fontSize:12,color:'var(--t2)',marginBottom:4}}>
                  Abra a matÃ©ria no browser â†’ selecione tudo (Ctrl+A) â†’ copie â†’ cole aqui.<br/>
                  <span style={{color:'#4ade80'}}>âœ“ Funciona com qualquer site, inclusive Folha, Veja, Terra, etc.</span>
                </div>
                <textarea
                  className="form-textarea"
                  style={{minHeight:200,fontSize:13,lineHeight:1.6,resize:'vertical'}}
                  value={texto}
                  onChange={e=>setTexto(e.target.value)}
                  placeholder="Cole aqui o texto completo da matÃ©ria..."
                  disabled={rodando}
                />
                <ImagemSelector value={imgTexto.value} onChange={setImgTexto} disabled={rodando}/>
                {resTexto&&<div style={{padding:'8px 12px',borderRadius:6,marginTop:8,background:resTexto.estado==='ok'?'rgba(74,222,128,0.1)':'rgba(248,113,113,0.1)',border:'1px solid '+(resTexto.estado==='ok'?'rgba(74,222,128,0.3)':'rgba(248,113,113,0.3)'),fontSize:13,color:resTexto.estado==='ok'?'#4ade80':'#f87171'}}>
                  {resTexto.estado==='enviando'?'â³ Processando...':resTexto.estado==='ok'?('âœ“ Salvo como pendente: '+resTexto.msg):('âœ— Erro: '+resTexto.msg)}
                </div>}
              </>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={limpar}>Limpar</button>
              {(modo==='url'?res.some(r=>r&&r.estado==='ok'):resTexto&&resTexto.estado==='ok')&&(
                <button className="btn btn-secondary" style={{color:'#4ade80',borderColor:'#4ade80'}} onClick={()=>{if(onVerPendentes)onVerPendentes();setAberto(false);}}>
                  ðŸ“‹ Ver pendentes â†’
                </button>
              )}
              {modo==='url'
                ?<button className="btn btn-primary" onClick={enviarUrls} disabled={rodando||urls.every(u=>!u.trim())}>{rodando?'â³ Enviando...':'â–¶ Reescrever URLs'}</button>
                :<button className="btn btn-primary" onClick={enviarTexto} disabled={rodando||!texto.trim()}>{rodando?'â³ Processando...':'â–¶ Reescrever texto'}</button>
              }
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function UploadImagens() {
  const [files, setFiles] = React.useState([]);
  const [uploading, setUploading] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [msgTipo, setMsgTipo] = React.useState('ok');
  const [galeria, setGaleria] = React.useState([]);
  const [loadingGaleria, setLoadingGaleria] = React.useState(true);
  const [posts, setPosts] = React.useState([]);
  const [drag, setDrag] = React.useState(false);
  const [atribuindo, setAtribuindo] = React.useState(null);
  const [postSelecionado, setPostSelecionado] = React.useState('');
  const [deletando, setDeletando] = React.useState(null);
  const [aba, setAba] = React.useState('banco');
  const [imagensArtigos, setImagensArtigos] = React.useState([]);
  const [loadingArtigos, setLoadingArtigos] = React.useState(false);

  const showMsg = (txt, tipo) => { setMsg(txt); setMsgTipo(tipo||'ok'); setTimeout(()=>setMsg(''),4000); };

  const carregarGaleria = React.useCallback(async () => {
    setLoadingGaleria(true);
    try {
      const { data, error } = await sb.storage.from('posts-images').list('uploads', {
        limit: 200, sortBy: { column: 'created_at', order: 'desc' }
      });
      if (error) {
        if (error.message && error.message.toLowerCase().includes('bucket')) {
          showMsg('âš ï¸ Bucket "posts-images" nÃ£o encontrado. Crie-o no Supabase â†’ Storage â†’ New Bucket â†’ nome: posts-images â†’ marcar pÃºblico.', 'aviso');
        }
        setGaleria([]);
      } else {
        const imgs = (data||[]).filter(f => /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(f.name)).map(f => ({
          name: f.name,
          path: 'uploads/' + f.name,
          url: sb.storage.from('posts-images').getPublicUrl('uploads/' + f.name).data.publicUrl,
          size: f.metadata?.size || 0,
          created: f.created_at
        }));
        setGaleria(imgs);
      }
    } catch(e) {
      showMsg('Erro ao carregar galeria: ' + e.message, 'erro');
    }
    setLoadingGaleria(false);
  }, []);

  const carregarImagensArtigos = React.useCallback(async () => {
    setLoadingArtigos(true);
    try {
      const { data } = await sb.from('posts').select('id,titulo,imagem,status').not('imagem','is',null).neq('imagem','').order('created_at',{ascending:false}).limit(600);
      if (data) {
        const seen = new Set();
        setImagensArtigos(data.filter(p => { if (!p.imagem || seen.has(p.imagem)) return false; seen.add(p.imagem); return true; }));
      }
    } catch(e) {}
    setLoadingArtigos(false);
  }, []);

  React.useEffect(() => {
    // Garante que o bucket existe (cria automaticamente se nÃ£o existir)
    fetch('/api/manage', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'setup_storage'})})
      .then(() => carregarGaleria());
    sb.from('posts').select('id,titulo,status').in('status',['pendente','pending']).order('created_at',{ascending:false}).limit(100).then(({data}) => {
      if(data) setPosts(data);
    });
    carregarImagensArtigos();
  }, [carregarGaleria, carregarImagensArtigos]);

  const processarArquivos = (lista) => {
    const validos = Array.from(lista).filter(f => f.type.startsWith('image/')).slice(0, 25);
    if (!validos.length) { showMsg('Selecione apenas imagens (PNG, JPEG, WebP, GIF).', 'erro'); return; }
    setFiles(validos);
    setMsg('');
  };

  const onDrop = (e) => { e.preventDefault(); setDrag(false); processarArquivos(e.dataTransfer.files); };
  const onDragOver = (e) => { e.preventDefault(); setDrag(true); };
  const onDragLeave = () => setDrag(false);

  const uploadAll = async () => {
    if (!files.length) { showMsg('Selecione ao menos 1 imagem.', 'erro'); return; }
    setUploading(true);
    let ok = 0, erros = 0;
    for (const file of files) {
      try {
        const ext = file.name.split('.').pop().toLowerCase();
        const path = 'uploads/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
        const { error: upErr } = await sb.storage.from('posts-images').upload(path, file, { contentType: file.type, upsert: true });
        if (upErr) throw new Error(upErr.message);
        ok++;
      } catch(e) {
        erros++;
      }
    }
    setFiles([]);
    setUploading(false);
    if (ok > 0) {
      showMsg('âœ… ' + ok + ' imagem(ns) enviada(s) com sucesso!', 'ok');
      carregarGaleria();
    }
    if (erros > 0) showMsg('âš ï¸ ' + erros + ' arquivo(s) falharam. Verifique se o bucket "posts-images" existe no Supabase.', 'aviso');
  };

  const copiarUrl = (url) => {
    navigator.clipboard.writeText(url).then(() => showMsg('âœ… URL copiada!', 'ok')).catch(() => showMsg('URL: ' + url, 'ok'));
  };

  const atribuirAoPost = async (imgUrl) => {
    if (!postSelecionado) { showMsg('Selecione um post primeiro.', 'erro'); return; }
    setAtribuindo(imgUrl);
    const { error } = await sb.from('posts').update({ imagem: imgUrl }).eq('id', postSelecionado);
    setAtribuindo(null);
    if (error) showMsg('Erro: ' + error.message, 'erro');
    else showMsg('âœ… Imagem atribuÃ­da ao post!', 'ok');
  };

  const deletarImagem = async (img) => {
    if (!confirm('Deletar "' + img.name + '"? Esta aÃ§Ã£o nÃ£o pode ser desfeita.')) return;
    setDeletando(img.path);
    const { error } = await sb.storage.from('posts-images').remove([img.path]);
    setDeletando(null);
    if (error) showMsg('Erro ao deletar: ' + error.message, 'erro');
    else { showMsg('Imagem deletada.', 'ok'); setGaleria(g => g.filter(x => x.path !== img.path)); }
  };

  const fmtSize = (b) => b > 1048576 ? (b/1048576).toFixed(1)+'MB' : b > 1024 ? (b/1024).toFixed(0)+'KB' : b+'B';

  return (
    <div>
      <div className="page-header">
        <div className="page-title">ðŸ–¼ï¸ Banco de Imagens</div>
        <div className="page-sub">FaÃ§a upload, gerencie e atribua imagens aos posts</div>
      </div>
      <div className="page-body">

        {/* Upload */}
        <div className="panel" style={{marginBottom:20}}>
          <div className="panel-header"><span className="panel-title">Upload de Imagens</span></div>
          <div style={{padding:20}}>
            <div
              onDrop={onDrop} onDragOver={onDragOver} onDragLeave={onDragLeave}
              onClick={() => document.getElementById('img-file-input').click()}
              style={{
                border: '2px dashed ' + (drag ? '#4ade80' : '#334155'),
                borderRadius: 10, padding: '36px 20px', textAlign: 'center',
                background: drag ? 'rgba(74,222,128,0.05)' : '#0f172a',
                cursor: 'pointer', transition: 'all 0.2s', marginBottom: 16
              }}
            >
              <div style={{fontSize:40, marginBottom:8}}>ðŸ“</div>

              <div style={{color:'var(--t3)',fontSize:12}}>PNG, JPEG, WebP, GIF â€” mÃ¡ximo 25 arquivos por vez</div>

// â”€â”€ EDITOR IA â”€â”€
function EditorIA() {
  const [entrada, setEntrada] = React.useState('');
  const [acao, setAcao] = React.useState('reescrever');
  const [promptLivre, setPromptLivre] = React.useState('');
  const [ia, setIa] = React.useState('openai');
  const [imagem, setImagem] = React.useState('');
  const [buscarImagem, setBuscarImagem] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [resultado, setResultado] = React.useState(null);
  const [erro, setErro] = React.useState('');
  const [salvando, setSalvando] = React.useState(false);
  const [salvo, setSalvo] = React.useState(null);

  const IAS = [
    {id:'openai', label:'ChatGPT', ativo:true},
    {id:'gemini', label:'Gemini',  ativo:false},
    {id:'groq',   label:'Groq',    ativo:false},
    {id:'grok',   label:'Grok',    ativo:false},
  ];

  const ACOES = [
    {id:'reescrever', label:'Reescrever no padrÃ£o OVC'},
    {id:'melhorar',   label:'Melhorar meu texto'},
    {id:'tema',       label:'Criar matÃ©ria do tema'},
    {id:'livre',      label:'Prompt livre'},
  ];

  const isUrl = entrada.trim().startsWith('http');

  async function gerar() {
    if (!entrada.trim()) { setErro('Cole um link, texto ou tema'); return; }
    if (acao === 'livre' && !promptLivre.trim()) { setErro('Digite seu prompt'); return; }
    setLoading(true); setErro(''); setResultado(null); setSalvo(null);
    try {
      const body = { acao, ia, imagem: imagem.trim(), buscarImagem, promptLivre, publicar: false };
      if (isUrl) body.url = entrada.trim();
      else body.texto = entrada.trim();
      const r = await fetch('/api/editor_ia', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erro ao gerar');
      setResultado(d);
    } catch(e) { setErro(e.message); }
    setLoading(false);
  }

  async function salvar() {
    if (!resultado) return;
    setSalvando(true);
    try {
      // Salvar diretamente no banco o conteÃºdo jÃ¡ gerado â€” NÃƒO chamar a IA de novo
      const postData = {
        titulo: resultado.titulo,
        conteudo: resultado.corpo,
        comentario_fixado: resultado.subtitulo || '',
        imagem: resultado.imagem || imagem.trim() || '',
        hash: Math.random().toString(36).slice(2) + Date.now().toString(36),
        status: 'pendente',
        approved: false,
        publish_method: 'portal',
        published_at: null,
        user_tags: JSON.stringify([resultado.categoria || 'geral']),
        subcategoria: resultado.subcategoria || '',
        subcategoria_slug: (resultado.subcategoria||'geral').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'),
        collaborators: '[]',
        metrics: {},
        priority: 1,
        retry_count: 0,
        max_retries: 3
      };
      const { data: post, error } = await sb.from('posts').insert([postData]).select().single();
      if (error) throw new Error(error.message);
      setSalvo({ ok: true, status: 'pendente', titulo: resultado.titulo, categoria: resultado.categoria, id: post?.id });
      setResultado(null); setEntrada(''); setImagem('');
    } catch(e) { setErro(e.message); }
    setSalvando(false);
  }

  return (
    <div>
      <div className="page-header">
        <div className="page-title">âš¡ Editor IA</div>
        <div className="page-sub">VocÃª manda o link ou texto. A IA processa no padrÃ£o OVC. VocÃª aprova.</div>
      </div>
      <div className="page-body">
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20}}>

          {/* Entrada */}
          <div>
            <div className="panel">
              <div className="panel-header"><span className="panel-title">Entrada</span></div>
              <div style={{padding:20}}>
                <div className="form-group">
                  <label className="form-label">Link ou texto da notÃ­cia</label>
                  <textarea className="form-textarea" style={{minHeight:130}} value={entrada} onChange={e=>setEntrada(e.target.value)} disabled={loading}
                    placeholder="Cole aqui a URL da notÃ­cia ou o texto completo..."/>
                  {isUrl && <div style={{fontSize:11,color:'#4ade80',marginTop:4}}>ðŸ”— URL detectada â€” serÃ¡ extraÃ­da automaticamente</div>}
                </div>

                <div className="form-group">
                  <label className="form-label">O que fazer</label>
                  <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                    {ACOES.map(a=>(
                      <button key={a.id} onClick={()=>setAcao(a.id)} className={`btn btn-sm ${acao===a.id?'btn-primary':'btn-secondary'}`}>{a.label}</button>
                    ))}
                  </div>
                </div>

                {acao === 'livre' && (
                  <div className="form-group">
                    <label className="form-label">Seu prompt</label>
                    <textarea className="form-textarea" style={{minHeight:70}} value={promptLivre} onChange={e=>setPromptLivre(e.target.value)} disabled={loading} placeholder="Digite sua instruÃ§Ã£o para a IA..."/>
                  </div>
                )}

                <div className="form-group">
                  <label className="form-label">Qual IA usar</label>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    {IAS.map(i=>(
                      <button key={i.id} onClick={()=>i.ativo&&setIa(i.id)}
                        className={`btn btn-sm ${ia===i.id?'btn-primary':'btn-secondary'}`}
                        style={{opacity:i.ativo?1:.4,cursor:i.ativo?'pointer':'not-allowed'}}
                        title={i.ativo?'':'Em breve'}>
                        {i.label}{!i.ativo?' ðŸ”’':''}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Imagem (opcional)</label>
                  <input className="form-input" value={imagem} onChange={e=>{setImagem(e.target.value);if(e.target.value)setBuscarImagem(false);}} disabled={loading} placeholder="Cole a URL da imagem aqui..."/>
                  <label style={{display:'flex',alignItems:'center',gap:8,marginTop:8,fontSize:13,cursor:'pointer',color:'var(--t2)'}}>
                    <input type="checkbox" checked={buscarImagem} onChange={e=>{setBuscarImagem(e.target.checked);if(e.target.checked)setImagem('');}} disabled={loading||!!imagem}/>
                    Buscar imagem automaticamente
                  </label>
                </div>

                <button className="btn btn-primary" style={{width:'100%',padding:'12px',opacity:loading?.6:1}} onClick={gerar} disabled={loading}>
                  {loading ? 'â³ Processando...' : 'âš¡ Gerar matÃ©ria'}
                </button>

                {erro && <div className="alert-banner" style={{marginTop:12}}><span>âš ï¸ {erro}</span></div>}
              </div>
            </div>
          </div>

          {/* Resultado */}
          <div>
            {resultado && (
              <div className="panel">
                <div className="panel-header"><span className="panel-title" style={{color:'#4ade80'}}>âœ… MatÃ©ria gerada</span></div>
                <div style={{padding:20}}>
                  {resultado.imagem && <img src={resultado.imagem} alt="" style={{width:'100%',height:160,objectFit:'cover',borderRadius:8,marginBottom:12,display:'block'}} onError={e=>e.target.style.display='none'}/>}
                  <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{resultado.titulo}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>Categoria: {resultado.categoria}{resultado.subtitulo?' Â· '+resultado.subtitulo:''}</div>
                  <div style={{background:'rgba(255,255,255,0.03)',borderRadius:8,padding:14,fontSize:13,lineHeight:1.7,maxHeight:320,overflowY:'auto',whiteSpace:'pre-wrap',marginBottom:16}}>{resultado.corpo}</div>
                  <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                    <button className="btn btn-green" onClick={()=>salvar()} disabled={salvando}>{salvando?'Salvando...':'ðŸ’¾ Salvar como pendente'}</button>
                    <button className="btn btn-secondary" onClick={()=>setResultado(null)}>âœ• Descartar</button>
                  </div>
                </div>
              </div>
            )}

            {salvo && (
              <div className="panel" style={{border:'1px solid rgba(22,163,74,.3)'}}>
                <div style={{padding:20}}>
                  <div style={{fontWeight:700,color:'#4ade80',marginBottom:8}}>{salvo.status==='publicado'?'âœ… Publicado no portal!':'âœ… Salvo como pendente â€” vÃ¡ em Postagens para aprovar'}</div>
                  <div style={{fontWeight:600}}>{salvo.titulo}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginTop:4}}>Categoria: {salvo.categoria}</div>
                </div>
              </div>
            )}

            {!resultado && !salvo && (
              <div className="panel" style={{minHeight:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <div style={{textAlign:'center',color:'var(--t2)'}}>
                  <div style={{fontSize:48,marginBottom:12}}>âš¡</div>
                  <div>Preencha os campos ao lado e clique em Gerar</div>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}


async function limparArtigosCorrompidos() {
  if (!confirm('Isso vai limpar todos os artigos com formataÃ§Ã£o corrompida no banco. Continuar?')) return;
  try {
    const r = await fetch('/api/run_portal', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'cleanup_titles', force:true})
    });
    const d = await r.json();
    alert('Limpeza concluÃ­da!\nTÃ­tulos corrigidos: ' + (d.fixedTitles||0) + '\nConteÃºdos corrigidos: ' + (d.fixedContent||0));
  } catch(e) {
    alert('Erro na limpeza: ' + e.message);
  }
}
