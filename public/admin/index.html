// ── RELATÓRIOS ──
function Relatorios() {
  const [dados, setDados] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [periodo, setPeriodo] = React.useState(7);

  const load = React.useCallback(async () => {
    setLoading(true);
    const agora = new Date();
    const inicio = new Date(agora - periodo * 24 * 60 * 60 * 1000).toISOString();

    // Buscar TODOS os posts do período — sem limite
    let allPosts = [];
    let from = 0;
    const pageSize = 1000;
    while (true) {
      const q = sb.from('posts')
        .select('id,titulo,status,user_tags,subcategoria,created_at,published_at,publish_method')
        .order('created_at', {ascending: false})
        .range(from, from + pageSize - 1);
      if (periodo < 3650) q.gte('created_at', inicio);
      const { data: page } = await q;
      if (!page || page.length === 0) break;
      allPosts = allPosts.concat(page);
      if (page.length < pageSize) break;
      from += pageSize;
    }
    const posts = allPosts;

    // Buscar logs do período — sem limite
    let allLogs = [];
    let fromL = 0;
    while (true) {
      const q2 = sb.from('logs')
        .select('level,message,created_at')
        .order('created_at', {ascending: false})
        .range(fromL, fromL + 500 - 1);
      if (periodo < 3650) q2.gte('created_at', inicio);
      const { data: pageL } = await q2;
      if (!pageL || pageL.length === 0) break;
      allLogs = allLogs.concat(pageL);
      if (pageL.length < 500) break;
      fromL += 500;
    }
    const logs = allLogs;

    if (!posts) { setLoading(false); return; }

    // Calcular métricas
    const total = posts.length;
    const publicados = posts.filter(p => p.status === 'publicado').length;
    const pendentes = posts.filter(p => p.status === 'pendente').length;
    const erros_count = (logs||[]).filter(l => l.level === 'error').length;

    // Posts por dia
    const porDia = {};
    posts.forEach(p => {
      const dia = p.created_at.slice(0,10);
      porDia[dia] = (porDia[dia] || 0) + 1;
    });

    // Posts por categoria
    const porCat = {};
    posts.forEach(p => {
      try {
        const tags = JSON.parse(p.user_tags || '[]');
        const cat = tags[0] || 'geral';
        porCat[cat] = (porCat[cat] || 0) + 1;
      } catch {}
    });

    // Posts por método de publicação
    const porMetodo = {};
    posts.forEach(p => {
      const m = p.publish_method || 'portal';
      porMetodo[m] = (porMetodo[m] || 0) + 1;
    });

    // Média diária
    const mediaDiaria = periodo > 0 ? (publicados / periodo).toFixed(1) : 0;

    // Últimos erros
    const ultimosErros = (logs||[]).filter(l => l.level === 'error').slice(0, 10);

    setDados({ total, publicados, pendentes, erros_count, porDia, porCat, porMetodo, mediaDiaria, ultimosErros, posts: posts.slice(0,10) });
    setLoading(false);
  }, [periodo]);

  React.useEffect(() => { load(); }, [load]);

  if (loading) return <div className="loading">Carregando relatórios...</div>;
  if (!dados) return <div className="empty-state"><div className="empty-icon">📊</div><div className="empty-text">Sem dados</div></div>;

  const catSort = Object.entries(dados.porCat).sort((a,b) => b[1]-a[1]);
  const diaSort = Object.entries(dados.porDia).sort((a,b) => a[0].localeCompare(b[0]));
  const maxDia = Math.max(...Object.values(dados.porDia), 1);

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Relatórios</div>
        <div className="page-sub">Visão completa da produção editorial</div>
      </div>
      <div className="page-body">

        {/* Seletor de período */}
        <div style={{display:'flex',gap:8,marginBottom:20}}>
          {[1,7,15,30,365,3650].map(d => (
            <button key={d} className={`btn btn-sm ${periodo===d?'btn-primary':'btn-secondary'}`} onClick={()=>setPeriodo(d)}>
              {d===1?'Hoje':d===3650?'Tudo':d===365?'1 ano':`${d} dias`}
            </button>
          ))}
          <button className="btn btn-sm btn-secondary" onClick={load} style={{marginLeft:'auto'}}>🔄 Atualizar</button>
        </div>

        {/* Cards de métricas */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:20}}>
          {[
            {label:'Total Gerado', valor:dados.total, cor:'var(--accent)', icon:'📝'},
            {label:'Publicados', valor:dados.publicados, cor:'var(--green)', icon:'✅'},
            {label:'Pendentes', valor:dados.pendentes, cor:'var(--yellow)', icon:'⏳'},
            {label:'Média/Dia', valor:dados.mediaDiaria, cor:'#8b5cf6', icon:'📈'},
          ].map(m => (
            <div key={m.label} className="panel" style={{padding:20,textAlign:'center'}}>
              <div style={{fontSize:28}}>{m.icon}</div>
              <div style={{fontSize:32,fontWeight:700,color:m.cor,margin:'8px 0'}}>{m.valor}</div>
              <div style={{fontSize:12,color:'var(--t2)'}}>{m.label}</div>
            </div>
          ))}
        </div>

        {/* Produção por dia */}
        <div className="panel" style={{marginBottom:20}}>
          <div className="panel-header"><span className="panel-title">📅 Produção por Dia</span></div>
          <div style={{padding:20}}>
            {diaSort.length === 0 ? <div className="empty-state" style={{padding:20}}><div className="empty-text">Sem dados no período</div></div> :
            diaSort.map(([dia, qtd]) => (
              <div key={dia} style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
                <div style={{width:90,fontSize:12,color:'var(--t2)',flexShrink:0}}>{dia}</div>
                <div style={{flex:1,background:'rgba(255,255,255,0.05)',borderRadius:4,height:24,position:'relative',overflow:'hidden'}}>
                  <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${(qtd/maxDia)*100}%`,background:'var(--accent)',borderRadius:4,transition:'width .3s'}}/>
                  <div style={{position:'absolute',left:8,top:0,bottom:0,display:'flex',alignItems:'center',fontSize:12,fontWeight:600}}>{qtd} posts</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Posts por categoria */}
        <div className="panel" style={{marginBottom:20}}>
          <div className="panel-header"><span className="panel-title">🏷️ Posts por Categoria</span></div>
          <div style={{padding:20}}>
            {catSort.length === 0 ? <div className="empty-text">Sem dados</div> :
            <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
              {catSort.map(([cat, qtd]) => (
                <div key={cat} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',background:'rgba(255,255,255,0.03)',borderRadius:6}}>
                  <span style={{textTransform:'capitalize',fontSize:13}}>{cat}</span>
                  <span style={{fontWeight:700,color:'var(--accent)'}}>{qtd}</span>
                </div>
              ))}
            </div>}
          </div>
        </div>

        {/* Erros recentes */}
        <div className="panel" style={{marginBottom:20}}>
          <div className="panel-header">
            <span className="panel-title">⚠️ Erros Recentes</span>
            <span className="badge badge-gray">{dados.erros_count} total</span>
          </div>
          <div style={{padding:20}}>
            {dados.ultimosErros.length === 0 ?
              <div style={{textAlign:'center',padding:20,color:'var(--green)'}}>✅ Nenhum erro no período</div> :
              dados.ultimosErros.map((e,i) => (
                <div key={i} style={{padding:'8px 12px',background:'rgba(200,30,30,0.08)',border:'1px solid rgba(200,30,30,0.2)',borderRadius:6,marginBottom:6}}>
                  <div style={{fontSize:11,color:'var(--t2)',marginBottom:2}}>{fmt(e.created_at)}</div>
                  <div style={{fontSize:12,color:'#ff8888'}}>{e.message}</div>
                </div>
              ))
            }
          </div>
        </div>

        {/* Últimos posts gerados */}
        <div className="panel">
          <div className="panel-header"><span className="panel-title">📋 Últimos Posts Gerados</span></div>
          <table>
            <thead><tr><th>Título</th><th>Categoria</th><th>Status</th><th>Data</th></tr></thead>
            <tbody>
              {dados.posts.map(p => {
                let cat = 'geral';
                try { cat = JSON.parse(p.user_tags||'[]')[0] || 'geral'; } catch {}
                return (
                  <tr key={p.id}>
                    <td style={{maxWidth:300}}>{truncate(p.titulo,50)}</td>
                    <td><span className="badge badge-gray" style={{textTransform:'capitalize'}}>{cat}</span></td>
                    <td><span className={`badge ${p.status==='publicado'?'badge-green':p.status==='pendente'?'badge-yellow':'badge-gray'}`}>{p.status}</span></td>
                    <td className="text-secondary text-small">{fmt(p.created_at)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

      </div>
    </div>
  );
}

// ── CONFIGURAÇÕES ──
function Configuracoes() {
  const [cfgs, setCfgs] = useState({});
  const [msg, setMsg] = useState('');

  useEffect(()=>{
    sb.from('config').select('*').then(({data})=>{
      if (data) {
        const obj = {};
        data.forEach(c=>obj[c.key]=c.value);
        setCfgs(obj);
      }
    });
  },[]);

  const save = async (key, value) => {
    await sb.from('config').upsert({key,value,updated_at:new Date().toISOString()},{onConflict:'key'});
    setMsg('Salvo');
    setTimeout(()=>setMsg(''),2000);
  };

  const Field = ({label,k,type='text'}) => (
    <div className="form-group">
      <label className="form-label">{label}</label>
      <div style={{display:'flex',gap:8}}>
        <input className="form-input" type={type} value={cfgs[k]||''} onChange={e=>setCfgs({...cfgs,[k]:e.target.value})}/>
        <button className="btn btn-primary btn-sm" onClick={()=>save(k,cfgs[k]||'')}>Salvar</button>
      </div>
    </div>
  );

  return (
    <div>
      <div className="page-header"><div className="page-title">Configurações</div><div className="page-sub">Parâmetros gerais do sistema</div></div>
      <div className="page-body">
        {msg&&<div className="alert-banner yellow" style={{marginBottom:16}}>✓ {msg}</div>}
        <div className="panel">
          <div className="panel-header"><span className="panel-title">Parâmetros do Pipeline</span></div>
          <div style={{padding:20}}>
            <Field label="Máximo de posts por dia" k="MAX_POSTS_DIA" type="number"/>
            <Field label="Meta diária de posts" k="DAILY_TARGET" type="number"/>
            <Field label="Intervalo entre execuções (minutos)" k="INTERVALO" type="number"/>
            <Field label="Intervalo mínimo entre posts (segundos)" k="MIN_INTERVAL" type="number"/>
            <Field label="Intervalo máximo entre posts (segundos)" k="MAX_INTERVAL" type="number"/>
            <Field label="Modelo IA" k="AI_MODEL"/>
            <Field label="URL Serviço Instagram (ex: https://ovc-instagram-bot.onrender.com)" k="IG_SERVICE_URL"/>
            <Field label="URL YouTube ao Vivo — OVC TV (ex: https://www.youtube.com/embed/VIDEO_OU_LIVE_ID)" k="YOUTUBE_LIVE_URL"/>
          </div>
        </div>
        <div className="panel">
          <div className="panel-header"><span className="panel-title">Publicação</span></div>
          <div style={{padding:20}}>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {[
                {k:'ENABLE_EXECUTOR',label:'Habilitar executor (quando API atingir limite)'},
                {k:'AUTO_RETRY',label:'Retry automático em posts com erro'},
              ].map(({k,label})=>(
                <label key={k} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                  <input type="checkbox" checked={cfgs[k]==='true'} onChange={e=>{const v=e.target.checked?'true':'false';setCfgs({...cfgs,[k]:v});save(k,v);}}/>
                  <span style={{fontSize:13}}>{label}</span>
                </label>
              ))}
            </div>
          </div>
        </div>
        <div className="panel">
          <div className="panel-header"><span className="panel-title">Automação</span></div>
          <div style={{padding:20}}>
            <div style={{color:'var(--t2)',fontSize:13}}>⚙️ O controle de automação está no módulo <strong>Pipeline</strong>. Use o toggle de lá para ligar ou desligar.</div>
          </div>
        </div>
      </div>
    </div>
  );
}


// ── NOVO POST (MANUAL) ──
function NovoPost() {
  const [accounts, setAccounts] = useState([]);
  const [form, setForm] = useState({
    titulo: '',
    conteudo: '',
    comentario_fixado: '',
    imagem: '',
    ig_account_id: '',
    scheduled_at: '',
    user_tags: '',
    collaborators: '',
    publicar_agora: false
  });
  const [saving, setSaving] = useState(false);
  const [preview, setPreview] = useState(false);
  const [msg, setMsg] = useState('');
  const [msgType, setMsgType] = useState('ok');

  useEffect(() => {
    sb.from('ig_accounts').select('id,username').eq('active',true).then(({data}) => setAccounts(data||[]));
  }, []);

  const hoje = new Date().toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'});

  const save = async (status) => {
    if (!form.conteudo.trim()) { setMsg('O conteúdo é obrigatório.'); setMsgType('err'); return; }
    setSaving(true);
    try {
      const crypto = window.crypto || window.msCrypto;
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      const hash = Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');

      const postData = {
        titulo: form.titulo || form.conteudo.split('\n')[0].slice(0,80),
        conteudo: form.conteudo,
        comentario_fixado: form.comentario_fixado,
        imagem: form.imagem || '',
        ig_account_id: form.ig_account_id || null,
        scheduled_at: form.scheduled_at || null,
        user_tags: form.user_tags || '[]',
        collaborators: form.collaborators || '[]',
        hash,
        status,
        metrics: {},
        updated_at: new Date().toISOString()
      };

      const { data: post, error } = await sb.from('posts').insert([postData]).select().single();
      if (error) throw new Error(error.message);

      if (status === 'pendente' && form.publicar_agora) {
        const r = await fetch('/api/manage', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({id: post.id})
        });
        const result = await r.json();
        if (result.ok) {
          setMsg('✅ Post publicado no Instagram com sucesso!');
          setMsgType('ok');
        } else {
          setMsg('⚠️ Post salvo mas erro ao publicar: ' + result.error);
          setMsgType('warn');
        }
      } else if (status === 'scheduled') {
        setMsg('✅ Post agendado com sucesso!');
        setMsgType('ok');
      } else {
        setMsg('✅ Post salvo como rascunho.');
        setMsgType('ok');
      }

      // Limpar form
      setForm({titulo:'',conteudo:'',comentario_fixado:'',imagem:'',ig_account_id:'',scheduled_at:'',user_tags:'',collaborators:'',publicar_agora:false});
    } catch(e) {
      setMsg('❌ Erro: ' + e.message);
      setMsgType('err');
    }
    setSaving(false);
  };

  const charCount = form.conteudo.length;
  const charColor = charCount > 1400 ? '#f87171' : charCount > 1200 ? '#ffc800' : '#4ade80';

  return (
    <div>
      <div className="page-header">
        <div className="page-title">✏️ Novo Post Manual</div>
        <div className="page-sub">Crie e publique um post diretamente no Instagram</div>
      </div>
      <div className="page-body">
        {msg && <div className={`alert-banner${msgType==='err'?' ':msgType==='warn'?' yellow':' yellow'}`} style={{marginBottom:16,background:msgType==='err'?'rgba(200,30,30,0.15)':msgType==='warn'?'rgba(255,200,0,0.15)':'rgba(22,163,74,0.15)',borderColor:msgType==='err'?'rgba(200,30,30,0.3)':msgType==='warn'?'rgba(255,200,0,0.3)':'rgba(22,163,74,0.3)'}}>
          <span>{msg}</span>
          <button style={{marginLeft:'auto',background:'none',border:'none',color:'var(--t2)',cursor:'pointer',fontSize:16}} onClick={()=>setMsg('')}>✕</button>
        </div>}

        <div style={{display:'grid',gridTemplateColumns:'1fr 380px',gap:20}}>
          {/* Formulário */}
          <div>
            <div className="panel">
              <div className="panel-header"><span className="panel-title">Conteúdo do Post</span></div>
              <div style={{padding:20}}>
                <div className="form-group">
                  <label className="form-label">Título / Tag da Chamada</label>
                  <input className="form-input" value={form.titulo} onChange={e=>setForm({...form,titulo:e.target.value})} placeholder="Ex: EXTRADIÇÃO AUTORIZADA"/>
                </div>
                <div className="form-group">
                  <label className="form-label" style={{display:'flex',justifyContent:'space-between'}}>
                    <span>Legenda / Conteúdo</span>
                    <span style={{color:charColor,fontSize:12}}>{charCount}/1500</span>
                  </label>
                  <textarea className="form-textarea" style={{minHeight:220}} value={form.conteudo} onChange={e=>setForm({...form,conteudo:e.target.value})} placeholder={`CHAMADA EM CAIXA ALTA.

Texto da notícia em prosa jornalística. Parágrafos curtos. Linguagem direta.

Redação OVC — ${hoje}

#hashtag1
#hashtag2
#ovalorcapital`}/>
                </div>
                <div className="form-group">
                  <label className="form-label">Comentário Fixado</label>
                  <textarea className="form-textarea" style={{minHeight:60}} value={form.comentario_fixado} onChange={e=>setForm({...form,comentario_fixado:e.target.value})} placeholder="Comentário agressivo e questionador (máx 200 chars)" maxLength={200}/>
                  <div style={{fontSize:11,color:'var(--t2)',marginTop:4}}>{form.comentario_fixado.length}/200</div>
                </div>
                <div className="form-group">
                  <label className="form-label">URL da Imagem</label>
                  <input className="form-input" value={form.imagem} onChange={e=>setForm({...form,imagem:e.target.value})} placeholder="https://..."/>
                  {form.imagem && <img src={form.imagem} style={{marginTop:8,width:'100%',maxHeight:200,objectFit:'cover',borderRadius:6}} onError={e=>e.target.style.display='none'} alt="preview"/>}
                </div>
              </div>
            </div>

            <div className="panel">
              <div className="panel-header"><span className="panel-title">Publicação</span></div>
              <div style={{padding:20}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  <div className="form-group">
                    <label className="form-label">Conta Instagram</label>
                    <select className="form-select" value={form.ig_account_id} onChange={e=>setForm({...form,ig_account_id:e.target.value})}>
                      <option value="">Distribuição automática</option>
                      {accounts.map(a=><option key={a.id} value={a.id}>@{a.username}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Agendar para (opcional)</label>
                    <input className="form-input" type="datetime-local" value={form.scheduled_at} onChange={e=>setForm({...form,scheduled_at:e.target.value})}/>
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Marcar usuários (separados por vírgula)</label>
                  <input className="form-input" value={form.user_tags} onChange={e=>setForm({...form,user_tags:e.target.value})} placeholder="@usuario1, @usuario2"/>
                </div>
                <div className="form-group">
                  <label className="form-label">Colaboradores (separados por vírgula)</label>
                  <input className="form-input" value={form.collaborators} onChange={e=>setForm({...form,collaborators:e.target.value})} placeholder="@oterrasan, @blogdoterra"/>
                </div>
              </div>
            </div>

            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              <button className="btn btn-primary" style={{fontSize:15,padding:'12px 28px'}} onClick={()=>{setForm({...form,publicar_agora:true});save('pendente');}} disabled={saving}>
                {saving?'Publicando...':'▶ Publicar agora no Instagram'}
              </button>
              {form.scheduled_at && <button className="btn btn-secondary" style={{fontSize:15,padding:'12px 28px'}} onClick={()=>save('scheduled')} disabled={saving}>
                🕐 Agendar
              </button>}
              <button className="btn btn-secondary" style={{fontSize:15,padding:'12px 28px'}} onClick={()=>save('pendente')} disabled={saving}>
                💾 Salvar como pendente
              </button>
              <button className="btn btn-secondary" onClick={()=>setPreview(!preview)}>
                {preview?'Fechar preview':'👁 Preview'}
              </button>
            </div>
          </div>

          {/* Preview */}
          <div>
            <div className="panel" style={{position:'sticky',top:20}}>
              <div className="panel-header"><span className="panel-title">Preview do Post</span></div>
              <div style={{padding:16}}>
                <div style={{background:'#0a0a14',borderRadius:8,overflow:'hidden',border:'1px solid var(--border)'}}>
                  {form.imagem
                    ? <img src={form.imagem} style={{width:'100%',aspectRatio:'4/5',objectFit:'cover'}} onError={e=>e.target.style.display='none'} alt=""/>
                    : <div style={{width:'100%',aspectRatio:'4/5',background:'#1a1a2e',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Sem imagem</div>
                  }
                  <div style={{padding:12,fontSize:12,color:'var(--t2)',lineHeight:1.6,whiteSpace:'pre-wrap',maxHeight:200,overflowY:'auto'}}>
                    {form.conteudo || <span style={{color:'var(--t3)'}}>Legenda aparece aqui...</span>}
                  </div>
                  {form.comentario_fixado && <div style={{padding:'8px 12px',borderTop:'1px solid var(--border)',fontSize:11,color:'#ffc800'}}>
                    💬 {form.comentario_fixado}
                  </div>}
                </div>
                <div style={{marginTop:12,fontSize:11,color:'var(--t2)'}}>
                  <div>Conta: {form.ig_account_id ? accounts.find(a=>a.id===form.ig_account_id)?.username||'—' : 'Automática'}</div>
                  {form.scheduled_at && <div>Agendado: {new Date(form.scheduled_at).toLocaleString('pt-BR')}</div>}
                  {form.user_tags && <div>Tags: {form.user_tags}</div>}
                  {form.collaborators && <div>Colabs: {form.collaborators}</div>}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── ALERTAS ──
function Alertas() {
  const [alerts, setAlerts] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    const { data } = await sb.from('alerts').select('*').order('created_at',{ascending:false}).limit(50);
    setAlerts(data||[]);
    setLoading(false);
  },[]);

  useEffect(()=>{load(); const t=setInterval(load,20000); return()=>clearInterval(t);},[load]);

  const markRead = async (id) => {
    await sb.from('alerts').update({read:true}).eq('id',id);
    load();
  };

  const markAllRead = async () => {
    await sb.from('alerts').update({read:true}).eq('read',false);
    load();
  };

  const unread = alerts.filter(a=>!a.read).length;

  return (
    <div>
      <div className="page-header">
        <div className="page-title">🚨 Alertas {unread>0&&<span className="notif-dot" style={{display:'inline-block',marginLeft:8}}></span>}</div>
        <div className="page-sub">Erros, falhas e notificações do sistema</div>
      </div>
      <div className="page-body">
        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">{unread} não lido(s)</span>
            <div className="gap-8">
              {unread>0&&<button className="btn btn-secondary btn-sm" onClick={markAllRead}>Marcar todos como lidos</button>}
              <button className="btn btn-secondary btn-sm" onClick={load}>↻</button>
            </div>
          </div>
          {loading?<div className="loading">Carregando...</div>:alerts.length===0?
            <div className="empty-state"><div className="empty-icon">✅</div><div className="empty-text">Nenhum alerta</div></div>:
            <table><thead><tr><th>Tipo</th><th>Mensagem</th><th>Data</th><th></th></tr></thead>
            <tbody>{alerts.map(a=>(
              <tr key={a.id} style={!a.read?{background:'rgba(200,30,30,0.04)'}:{}}>
                <td><span className={`badge ${a.type==='error'?'badge-red':a.type==='growth'?'badge-green':'badge-yellow'}`}>{a.type}</span></td>
                <td style={{fontWeight:a.read?400:600}}>{a.message}</td>
                <td className="text-secondary text-small">{fmt(a.created_at)}</td>
                <td>{!a.read&&<button className="btn btn-secondary btn-sm" onClick={()=>markRead(a.id)}>✓</button>}</td>
              </tr>
            ))}</tbody></table>
          }
        </div>
      </div>
    </div>
  );
}

// ── UPLOAD DE IMAGENS ──
function UploadImagens() {
  const [files, setFiles] = React.useState([]);
  const [uploading, setUploading] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [msgTipo, setMsgTipo] = React.useState('ok');
  const [galeria, setGaleria] = React.useState([]);
  const [loadingGaleria, setLoadingGaleria] = React.useState(true);
  const [posts, setPosts] = React.useState([]);
  const [drag, setDrag] = React.useState(false);
  const [atribuindo, setAtribuindo] = React.useState(null);
  const [postSelecionado, setPostSelecionado] = React.useState('');
  const [deletando, setDeletando] = React.useState(null);

  const showMsg = (txt, tipo) => { setMsg(txt); setMsgTipo(tipo||'ok'); setTimeout(()=>setMsg(''),4000); };

  const carregarGaleria = React.useCallback(async () => {
    setLoadingGaleria(true);
    try {
      const { data, error } = await sb.storage.from('posts-images').list('uploads', {
        limit: 200, sortBy: { column: 'created_at', order: 'desc' }
      });
      if (error) {
        if (error.message && error.message.toLowerCase().includes('bucket')) {
          showMsg('⚠️ Bucket "posts-images" não encontrado. Crie-o no Supabase → Storage → New Bucket → nome: posts-images → marcar público.', 'aviso');
        }
        setGaleria([]);
      } else {
        const imgs = (data||[]).filter(f => /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(f.name)).map(f => ({
          name: f.name,
          path: 'uploads/' + f.name,
          url: sb.storage.from('posts-images').getPublicUrl('uploads/' + f.name).data.publicUrl,
          size: f.metadata?.size || 0,
          created: f.created_at
        }));
        setGaleria(imgs);
      }
    } catch(e) {
      showMsg('Erro ao carregar galeria: ' + e.message, 'erro');
    }
    setLoadingGaleria(false);
  }, []);

  React.useEffect(() => {
    // Garante que o bucket existe (cria automaticamente se não existir)
    fetch('/api/manage', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'setup_storage'})})
      .then(() => carregarGaleria());
    sb.from('posts').select('id,titulo,status').in('status',['pendente','pending']).order('created_at',{ascending:false}).limit(100).then(({data}) => {
      if(data) setPosts(data);
    });
  }, [carregarGaleria]);

  const processarArquivos = (lista) => {
    const validos = Array.from(lista).filter(f => f.type.startsWith('image/')).slice(0, 25);
    if (!validos.length) { showMsg('Selecione apenas imagens (PNG, JPEG, WebP, GIF).', 'erro'); return; }
    setFiles(validos);
    setMsg('');
  };

  const onDrop = (e) => { e.preventDefault(); setDrag(false); processarArquivos(e.dataTransfer.files); };
  const onDragOver = (e) => { e.preventDefault(); setDrag(true); };
  const onDragLeave = () => setDrag(false);

  const uploadAll = async () => {
    if (!files.length) { showMsg('Selecione ao menos 1 imagem.', 'erro'); return; }
    setUploading(true);
    let ok = 0, erros = 0;
    for (const file of files) {
      try {
        const ext = file.name.split('.').pop().toLowerCase();
        const path = 'uploads/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
        const { error: upErr } = await sb.storage.from('posts-images').upload(path, file, { contentType: file.type, upsert: true });
        if (upErr) throw new Error(upErr.message);
        ok++;
      } catch(e) {
        erros++;
      }
    }
    setFiles([]);
    setUploading(false);
    if (ok > 0) {
      showMsg('✅ ' + ok + ' imagem(ns) enviada(s) com sucesso!', 'ok');
      carregarGaleria();
    }
    if (erros > 0) showMsg('⚠️ ' + erros + ' arquivo(s) falharam. Verifique se o bucket "posts-images" existe no Supabase.', 'aviso');
  };

  const copiarUrl = (url) => {
    navigator.clipboard.writeText(url).then(() => showMsg('✅ URL copiada!', 'ok')).catch(() => showMsg('URL: ' + url, 'ok'));
  };

  const atribuirAoPost = async (imgUrl) => {
    if (!postSelecionado) { showMsg('Selecione um post primeiro.', 'erro'); return; }
    setAtribuindo(imgUrl);
    const { error } = await sb.from('posts').update({ imagem: imgUrl }).eq('id', postSelecionado);
    setAtribuindo(null);
    if (error) showMsg('Erro: ' + error.message, 'erro');
    else showMsg('✅ Imagem atribuída ao post!', 'ok');
  };

  const deletarImagem = async (img) => {
    if (!confirm('Deletar "' + img.name + '"? Esta ação não pode ser desfeita.')) return;
    setDeletando(img.path);
    const { error } = await sb.storage.from('posts-images').remove([img.path]);
    setDeletando(null);
    if (error) showMsg('Erro ao deletar: ' + error.message, 'erro');
    else { showMsg('Imagem deletada.', 'ok'); setGaleria(g => g.filter(x => x.path !== img.path)); }
  };

  const fmtSize = (b) => b > 1048576 ? (b/1048576).toFixed(1)+'MB' : b > 1024 ? (b/1024).toFixed(0)+'KB' : b+'B';

  return (
    <div>
      <div className="page-header">
        <div className="page-title">🖼️ Banco de Imagens</div>
        <div className="page-sub">Faça upload, gerencie e atribua imagens aos posts</div>
      </div>
      <div className="page-body">

        {/* Upload */}
        <div className="panel" style={{marginBottom:20}}>
          <div className="panel-header"><span className="panel-title">Upload de Imagens</span></div>
          <div style={{padding:20}}>
            <div
              onDrop={onDrop} onDragOver={onDragOver} onDragLeave={onDragLeave}
              onClick={() => document.getElementById('img-file-input').click()}
              style={{
                border: '2px dashed ' + (drag ? '#4ade80' : '#334155'),
                borderRadius: 10, padding: '36px 20px', textAlign: 'center',
                background: drag ? 'rgba(74,222,128,0.05)' : '#0f172a',
                cursor: 'pointer', transition: 'all 0.2s', marginBottom: 16
              }}
            >
              <div style={{fontSize:40, marginBottom:8}}>📁</div>
              <div style={{color:'var(--t1)',fontWeight:600,marginBottom:4}}>Arraste imagens aqui ou clique para selecionar</div>
              <div style={{color:'var(--t3)',fontSize:12}}>PNG, JPEG, WebP, GIF — máximo 25 arquivos por vez</div>
              {files.length > 0 && <div style={{marginTop:12,color:'#4ade80',fontWeight:600}}>{files.length} arquivo(s) pronto(s) para envio</div>}
              <input id="img-file-input" type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>processarArquivos(e.target.files)}/>
            </div>

            {files.length > 0 && (
              <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
                {files.map((f,i) => (
                  <div key={i} style={{background:'#1e293b',padding:'4px 10px',borderRadius:20,fontSize:12,color:'var(--t2)'}}>
                    {f.name} <span style={{color:'var(--t3)'}}>({fmtSize(f.size)})</span>
                  </div>
                ))}
              </div>
            )}

            <button className="btn btn-primary" onClick={uploadAll} disabled={uploading||!files.length} style={{minWidth:160}}>
              {uploading ? '⏳ Enviando...' : '⬆️ Fazer Upload'}
            </button>

            {msg && (
              <div style={{
                marginTop:12, padding:'10px 14px', borderRadius:6, fontSize:13,
                background: msgTipo==='ok' ? 'rgba(22,163,74,0.1)' : msgTipo==='aviso' ? 'rgba(255,200,0,0.1)' : 'rgba(200,30,30,0.1)',
                border: `1px solid ${msgTipo==='ok' ? 'rgba(22,163,74,0.3)' : msgTipo==='aviso' ? 'rgba(255,200,0,0.3)' : 'rgba(200,30,30,0.3)'}`,
                color: msgTipo==='ok' ? '#4ade80' : msgTipo==='aviso' ? '#ffc800' : '#f87171'
              }}>{msg}</div>
            )}
          </div>
        </div>

        {/* Atribuir post selecionado */}
        <div className="panel" style={{marginBottom:20}}>
          <div className="panel-header"><span className="panel-title">Post ativo para atribuição</span></div>
          <div style={{padding:'12px 20px'}}>
            <select value={postSelecionado} onChange={e=>setPostSelecionado(e.target.value)} className="form-select">
              <option value="">— Selecione um post pendente para usar as imagens —</option>
              {posts.map(p => <option key={p.id} value={p.id}>{p.titulo}</option>)}
            </select>
            {postSelecionado && <div style={{fontSize:12,color:'#4ade80',marginTop:6}}>✓ Post selecionado — clique em "Usar" em qualquer imagem abaixo para atribuí-la</div>}
          </div>
        </div>

        {/* Galeria */}
        <div className="panel">
          <div className="panel-header">
            <span className="panel-title">{galeria.length} imagem(ns) no banco</span>
            <button className="btn btn-secondary btn-sm" onClick={carregarGaleria}>↻ Atualizar</button>
          </div>
          <div style={{padding:20}}>
            {loadingGaleria ? (
              <div className="loading">Carregando galeria...</div>
            ) : galeria.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">🖼️</div>
                <div className="empty-text">Nenhuma imagem no banco ainda</div>
                <div style={{fontSize:12,color:'var(--t3)',marginTop:8}}>
                  {msg.includes('Bucket') ? 'Crie o bucket "posts-images" no Supabase primeiro.' : 'Faça o upload das suas primeiras imagens acima.'}
                </div>
              </div>
            ) : (
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16}}>
                {galeria.map((img,i) => (
                  <div key={i} style={{background:'#1e293b',borderRadius:10,overflow:'hidden',border:'1px solid #334155',display:'flex',flexDirection:'column'}}>
                    <div style={{position:'relative',height:140,overflow:'hidden',background:'#0f172a'}}>
                      <img src={img.url} alt={img.name} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
                        onError={e=>{e.target.style.display='none'; e.target.nextSibling.style.display='flex';}}/>
                      <div style={{display:'none',position:'absolute',inset:0,alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:12}}>Erro ao carregar</div>
                    </div>
                    <div style={{padding:'8px 10px',flex:1,display:'flex',flexDirection:'column',gap:6}}>
                      <div style={{fontSize:11,color:'var(--t3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={img.name}>{img.name}</div>
                      {img.size > 0 && <div style={{fontSize:10,color:'var(--t3)'}}>{fmtSize(img.size)}</div>}
                      <div style={{display:'flex',gap:6,marginTop:'auto'}}>
                        <button className="btn btn-secondary btn-sm" style={{flex:1,fontSize:11}} onClick={()=>copiarUrl(img.url)}>📋 Copiar URL</button>
                        <button className="btn btn-primary btn-sm" style={{flex:1,fontSize:11}}
                          onClick={()=>atribuirAoPost(img.url)} disabled={atribuindo===img.url||!postSelecionado}
                          title={!postSelecionado?'Selecione um post acima':''}>
                          {atribuindo===img.url ? '...' : '✓ Usar'}
                        </button>
                      </div>
                      <button
                        style={{background:'transparent',border:'none',color:'#ef4444',fontSize:11,cursor:'pointer',padding:'2px 0',opacity:deletando===img.path?0.5:1}}
                        onClick={()=>deletarImagem(img)} disabled={deletando===img.path}>
                        {deletando===img.path ? 'Deletando...' : '🗑 Remover'}
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

      </div>
    </div>
  );
}


// ── EDITOR IA ──
function EditorIA() {
  const [entrada, setEntrada] = React.useState('');
  const [acao, setAcao] = React.useState('reescrever');
  const [promptLivre, setPromptLivre] = React.useState('');
  const [ia, setIa] = React.useState('openai');
  const [imagem, setImagem] = React.useState('');
  const [buscarImagem, setBuscarImagem] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [resultado, setResultado] = React.useState(null);
  const [erro, setErro] = React.useState('');
  const [salvando, setSalvando] = React.useState(false);
  const [salvo, setSalvo] = React.useState(null);

  const IAS = [
    {id:'openai', label:'ChatGPT', ativo:true},
    {id:'gemini', label:'Gemini',  ativo:false},
    {id:'groq',   label:'Groq',    ativo:false},
    {id:'grok',   label:'Grok',    ativo:false},
  ];

  const ACOES = [
    {id:'reescrever', label:'Reescrever no padrão OVC'},
    {id:'melhorar',   label:'Melhorar meu texto'},
    {id:'tema',       label:'Criar matéria do tema'},
    {id:'livre',      label:'Prompt livre'},
  ];

  const isUrl = entrada.trim().startsWith('http');

  async function gerar() {
    if (!entrada.trim()) { setErro('Cole um link, texto ou tema'); return; }
    if (acao === 'livre' && !promptLivre.trim()) { setErro('Digite seu prompt'); return; }
    setLoading(true); setErro(''); setResultado(null); setSalvo(null);
    try {
      const body = { acao, ia, imagem: imagem.trim(), buscarImagem, promptLivre, publicar: false };
      if (isUrl) body.url = entrada.trim();
      else body.texto = entrada.trim();
      const r = await fetch('/api/editor_ia', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erro ao gerar');
      setResultado(d);
    } catch(e) { setErro(e.message); }
    setLoading(false);
  }

  async function salvar(publicarDireto) {
    if (!resultado) return;
    setSalvando(true);
    try {
      // Salvar diretamente no banco o conteúdo já gerado — NÃO chamar a IA de novo
      const status = publicarDireto ? 'publicado' : 'pendente';
      const postData = {
        titulo: resultado.titulo,
        conteudo: resultado.corpo,
        comentario_fixado: resultado.subtitulo || '',
        imagem: resultado.imagem || imagem.trim() || '',
        hash: Math.random().toString(36).slice(2) + Date.now().toString(36),
        status,
        approved: publicarDireto,
        publish_method: 'portal',
        published_at: publicarDireto ? new Date().toISOString() : null,
        user_tags: JSON.stringify([resultado.categoria || 'geral']),
        subcategoria: resultado.subcategoria || '',
        subcategoria_slug: (resultado.subcategoria||'geral').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'),
        collaborators: '[]',
        metrics: {},
        priority: 1,
        retry_count: 0,
        max_retries: 3
      };
      const { data: post, error } = await sb.from('posts').insert([postData]).select().single();
      if (error) throw new Error(error.message);
      setSalvo({ ok: true, status, titulo: resultado.titulo, categoria: resultado.categoria, id: post?.id });
      setResultado(null); setEntrada(''); setImagem('');
    } catch(e) { setErro(e.message); }
    setSalvando(false);
  }

  return (
    <div>
      <div className="page-header">
        <div className="page-title">⚡ Editor IA</div>
        <div className="page-sub">Você manda o link ou texto. A IA processa no padrão OVC. Você aprova.</div>
      </div>
      <div className="page-body">
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20}}>

          {/* Entrada */}
          <div>
            <div className="panel">
              <div className="panel-header"><span className="panel-title">Entrada</span></div>
              <div style={{padding:20}}>
                <div className="form-group">
                  <label className="form-label">Link ou texto da notícia</label>
                  <textarea className="form-textarea" style={{minHeight:130}} value={entrada} onChange={e=>setEntrada(e.target.value)} disabled={loading}
                    placeholder="Cole aqui a URL da notícia ou o texto completo..."/>
                  {isUrl && <div style={{fontSize:11,color:'#4ade80',marginTop:4}}>🔗 URL detectada — será extraída automaticamente</div>}
                </div>

                <div className="form-group">
                  <label className="form-label">O que fazer</label>
                  <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                    {ACOES.map(a=>(
                      <button key={a.id} onClick={()=>setAcao(a.id)} className={`btn btn-sm ${acao===a.id?'btn-primary':'btn-secondary'}`}>{a.label}</button>
                    ))}
                  </div>
                </div>

                {acao === 'livre' && (
                  <div className="form-group">
                    <label className="form-label">Seu prompt</label>
                    <textarea className="form-textarea" style={{minHeight:70}} value={promptLivre} onChange={e=>setPromptLivre(e.target.value)} disabled={loading} placeholder="Digite sua instrução para a IA..."/>
                  </div>
                )}

                <div className="form-group">
                  <label className="form-label">Qual IA usar</label>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    {IAS.map(i=>(
                      <button key={i.id} onClick={()=>i.ativo&&setIa(i.id)}
                        className={`btn btn-sm ${ia===i.id?'btn-primary':'btn-secondary'}`}
                        style={{opacity:i.ativo?1:.4,cursor:i.ativo?'pointer':'not-allowed'}}
                        title={i.ativo?'':'Em breve'}>
                        {i.label}{!i.ativo?' 🔒':''}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Imagem (opcional)</label>
                  <input className="form-input" value={imagem} onChange={e=>{setImagem(e.target.value);if(e.target.value)setBuscarImagem(false);}} disabled={loading} placeholder="Cole a URL da imagem aqui..."/>
                  <label style={{display:'flex',alignItems:'center',gap:8,marginTop:8,fontSize:13,cursor:'pointer',color:'var(--t2)'}}>
                    <input type="checkbox" checked={buscarImagem} onChange={e=>{setBuscarImagem(e.target.checked);if(e.target.checked)setImagem('');}} disabled={loading||!!imagem}/>
                    Buscar imagem automaticamente
                  </label>
                </div>

                <button className="btn btn-primary" style={{width:'100%',padding:'12px',opacity:loading?.6:1}} onClick={gerar} disabled={loading}>
                  {loading ? '⏳ Processando...' : '⚡ Gerar matéria'}
                </button>

                {erro && <div className="alert-banner" style={{marginTop:12}}><span>⚠️ {erro}</span></div>}
              </div>
            </div>
          </div>

          {/* Resultado */}
          <div>
            {resultado && (
              <div className="panel">
                <div className="panel-header"><span className="panel-title" style={{color:'#4ade80'}}>✅ Matéria gerada</span></div>
                <div style={{padding:20}}>
                  {resultado.imagem && <img src={resultado.imagem} alt="" style={{width:'100%',height:160,objectFit:'cover',borderRadius:8,marginBottom:12,display:'block'}} onError={e=>e.target.style.display='none'}/>}
                  <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{resultado.titulo}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>Categoria: {resultado.categoria}{resultado.subtitulo?' · '+resultado.subtitulo:''}</div>
                  <div style={{background:'rgba(255,255,255,0.03)',borderRadius:8,padding:14,fontSize:13,lineHeight:1.7,maxHeight:320,overflowY:'auto',whiteSpace:'pre-wrap',marginBottom:16}}>{resultado.corpo}</div>
                  <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                    <button className="btn btn-green" onClick={()=>salvar(false)} disabled={salvando}>{salvando?'Salvando...':'💾 Salvar como pendente'}</button>
                    <button className="btn btn-primary" onClick={()=>salvar(true)} disabled={salvando}>🚀 Publicar direto</button>
                    <button className="btn btn-secondary" onClick={()=>setResultado(null)}>✕ Descartar</button>
                  </div>
                </div>
              </div>
            )}

            {salvo && (
              <div className="panel" style={{border:'1px solid rgba(22,163,74,.3)'}}>
                <div style={{padding:20}}>
                  <div style={{fontWeight:700,color:'#4ade80',marginBottom:8}}>{salvo.status==='publicado'?'✅ Publicado no portal!':'✅ Salvo como pendente — vá em Postagens para aprovar'}</div>
                  <div style={{fontWeight:600}}>{salvo.titulo}</div>
                  <div style={{fontSize:12,color:'var(--t2)',marginTop:4}}>Categoria: {salvo.categoria}</div>
                </div>
              </div>
            )}

            {!resultado && !salvo && (
              <div className="panel" style={{minHeight:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <div style={{textAlign:'center',color:'var(--t2)'}}>
                  <div style={{fontSize:48,marginBottom:12}}>⚡</div>
                  <div>Preencha os campos ao lado e clique em Gerar</div>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
