<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"O Valor Capital","url":"https://www.ovalorcapital.com.br","logo":"https://www.ovalorcapital.com.br/img/logo-ovc.webp","sameAs":["https://www.instagram.com/ovalorcapital"]}</script>

<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b}a{color:inherit;text-decoration:none}.ovc-header{background:#fff;border-bottom:2px solid #dc2626;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.08)}.header-inner{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;height:54px}.logo-wrap{display:flex;align-items:center;gap:8px;text-decoration:none}.logo-img{height:36px;width:auto}.site-name{font-size:15px;font-weight:700;color:#dc2626;white-space:nowrap}.ovc-ticker-bar{background:#1e293b;color:#e2e8f0;font-size:11px;padding:4px 0;overflow:hidden}.ovc-ticker-inner{display:flex;gap:24px;animation:tickerScroll 40s linear infinite;white-space:nowrap;padding-left:100%}.ovc-ticker-inner:hover{animation-play-state:paused}@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}.ticker-item{display:inline-flex;align-items:center;gap:4px}.ticker-item .lbl{opacity:.7}.ticker-item .val{font-weight:600}.ticker-item .chg.up{color:#4ade80}.ticker-item .chg.dn{color:#f87171}</style>
</head>
<body>
<header class="ovc-header">
  <div class="ovc-ticker-bar" id="ovcTickerBar"><div class="ovc-ticker-inner" id="ovcTicker"><span class="ticker-item"><span class="lbl">USD/BRL</span><span class="val" id="t-usd">—</span></span><span class="ticker-item"><span class="lbl">EUR/BRL</span><span class="val" id="t-eur">—</span></span><span class="ticker-item"><span class="lbl">BTC/USD</span><span class="val" id="t-btc">—</span></span><span class="ticker-item"><span class="lbl">IBOV</span><span class="val" id="t-ibov">—</span></span><span class="ticker-item"><span class="lbl">Impostômetro</span><span class="val" id="t-impost">calculando...</span></span></div></div>
  <div class="header-inner">
    <a href="/" class="logo-wrap" aria-label="O Valor Capital - Página Inicial">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAABkCAYAAAA8AQ3AAAAB..." alt="O Valor Capital" class="logo-img" width="120" height="36"/>
    </a>
    <nav class="ovc-supermenu" id="ovcSupermenu" aria-label="Navegação principal"></nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <a href="/inteligencia" style="background:#dc2626;color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap">IA</a>
      <button id="ovcAccessBtn" style="background:none;border:none;cursor:pointer;padding:4px" aria-label="Acessibilidade">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="12" cy="5" r="2"/><path d="M12 22V12m0 0l-4-4m4 4l4-4M8 22l4-10 4 10"/></svg>
      </button>
    </div>
  </div>
</header>
<div id="ovcAccessWrap" style="display:none;position:fixed;top:60px;right:16px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.1);min-width:180px">
  <p style="font-size:11px;color:#64748b;margin-bottom:8px;font-weight:600">ACESSIBILIDADE</p>
  <button onclick="document.body.style.fontSize='18px'" style="display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:6px 0;font-size:13px">🔍 Aumentar fonte</button>
  <button onclick="document.body.style.fontSize=''" style="display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:6px 0;font-size:13px">↩ Fonte normal</button>
  <button onclick="document.documentElement.classList.toggle('dark-mode')" style="display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:6px 0;font-size:13px">🌙 Modo escuro</button>
</div>
<main id="ovc-main">
  <section class="ovc-hero" id="ovcHero">
    <div class="hero-destaque" id="heroDestaque"></div>
    <div class="hero-lista" id="heroLista"></div>
  </section>
  <section class="ovc-grid" id="ovcGrid">
    <div class="ovc-story-stack" id="ovcStoryStack">
      <div id="catPolitica" class="cat-block"></div>
      <div id="catEconomia" class="cat-block"></div>
      <div id="catNegocios" class="cat-block"></div>
      <div id="catInvestimentos" class="cat-block"></div>
      <div id="catTecnologia" class="cat-block"></div>
      <div id="catSaude" class="cat-block"></div>
      <div id="catFamilia" class="cat-block"></div>
    </div>
    <aside class="ovc-right-rail" id="ovcRightRail">
      <section class="rail-trending" id="railTrending"></section>
      <section class="rail-banner" data-banner-sidebar></section>
      <section class="rail-newsletter" id="railNewsletter"></section>
    </aside>
  </section>
</main>
<div id="ovcImpostometro" style="display:none"></div>
<script>
(function(){
  var start=new Date(new Date().getFullYear(),0,1);
  var rate=114155;
  function fmt(n){return'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function tick(){
    var el=document.getElementById('t-impost');
    if(el){var v=Math.floor((Date.now()-start)/1000)*rate;el.textContent=fmt(v);}
    setTimeout(tick,1000);
  }
  tick();
})();
</script>
<script src="/js/site.js?v=6" defer></script>
<script src="/js/home.js?v=15" defer></script>
<script src="/js/ovc-cards.js?v=9" defer></script>
<script src="/js/banners.js?v=4" defer></script>
<script src="/js/newsletter-bar.js?v=5" defer></script>
<script>
document.getElementById('ovcAccessBtn').addEventListener('click',function(e){
  e.stopPropagation();
  var m=document.getElementById('ovcAccessWrap');
  m.style.display=m.style.display==='none'?'block':'none';
});
document.addEventListener('click',function(e){
  var m=document.getElementById('ovcAccessWrap');
  if(m&&m.style.display!=='none'&&!document.getElementById('ovcAccessWrap').contains(e.target))m.classList.remove('open');});
</script>
</body>
</html>
