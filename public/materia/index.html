<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Matéria | O Valor Capital</title>
<meta name="description" content="Leitura completa no O Valor Capital."/>
<link rel="icon" href="/assets/vc-logo.png"/>
<link rel="stylesheet" href="/css/home.css"/>
<link rel="stylesheet" href="/css/site.css"/>
<link rel="stylesheet" href="/css/noticias.css"/>
</head>
<body data-theme="light">
<div class="page-root">

<!-- HEADER via include (mesmo do portal) -->
<div id="ovc-header-placeholder"></div>

<main style="max-width:860px;margin:40px auto;padding:0 20px;">

  <!-- Breadcrumb -->
  <nav style="font-size:13px;color:#6b7280;margin-bottom:20px;">
    <a href="/" style="color:#6b7280;text-decoration:none;">Início</a>
    <span style="margin:0 6px;">›</span>
    <span id="ovc-materia-cat">Geral</span>
  </nav>

  <!-- Título e meta -->
  <h1 id="ovc-materia-titulo">Carregando...</h1>
  <p id="ovc-materia-subtitulo"></p>
  <div id="ovc-materia-data"></div>

  <!-- Imagem destaque -->
  <img id="ovc-materia-img" alt="Imagem da matéria"/>

  <!-- Corpo da matéria -->
  <article id="ovc-materia-body" style="margin-top:8px;">
    <p style="color:#6b7280;">Carregando conteúdo...</p>
  </article>

  <!-- Rodapé da matéria -->
  <div style="border-top:1px solid #1e293b;margin-top:32px;padding-top:24px;display:flex;align-items:center;gap:16px;">
    <img src="/assets/vc-logo.png" alt="OVC" style="width:40px;height:40px;object-fit:contain;"/>
    <div>
      <div style="font-weight:700;font-size:14px;">O Valor Capital</div>
      <div style="font-size:12px;color:#6b7280;">Liberdade econômica, família &amp; patrimônio · ovalorcapital.com.br</div>
    </div>
  </div>

</main>

</div>

<script src="/js/site.js" defer></script>
<script src="/js/noticias.js" defer></script>
</body>
</html>
