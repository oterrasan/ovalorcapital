<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Matéria | O Valor Capital</title>
<meta name="description" content="Leitura completa no O Valor Capital."/>
<link rel="icon" href="/assets/vc-logo.png"/>
<link rel="stylesheet" href="/css/home.css"/>
<link rel="stylesheet" href="/css/site.css"/>
<link rel="stylesheet" href="/css/noticias.css"/>
<style>
.materia-header{background:#08080f;border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 24px;display:flex;align-items:center;gap:16px;}
.materia-header-logo{font-weight:800;font-size:18px;color:#ffc800;text-decoration:none;letter-spacing:-.5px;}
.materia-header-nav{display:flex;gap:20px;margin-left:auto;}
.materia-header-nav a{color:#94a3b8;text-decoration:none;font-size:13px;font-weight:500;}
.materia-header-nav a:hover{color:#f1f1f1;}
.materia-wrap{max-width:860px;margin:40px auto;padding:0 20px;}
.materia-breadcrumb{font-size:13px;color:#6b7280;margin-bottom:24px;}
.materia-breadcrumb a{color:#6b7280;text-decoration:none;}
.materia-breadcrumb a:hover{color:#ffc800;}
#ovc-materia-cat{display:inline-block;background:#c81e1e;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
#ovc-materia-titulo{font-size:30px;font-weight:800;line-height:1.25;color:#f1f1f1;margin:0 0 12px;}
#ovc-materia-subtitulo{font-size:18px;color:#94a3b8;line-height:1.5;margin-bottom:12px;}
#ovc-materia-data{font-size:13px;color:#6b7280;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.08);}
#ovc-materia-img{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-bottom:28px;display:none;}
#ovc-materia-body p{font-size:17px;line-height:1.85;color:#e5e7eb;margin:0 0 20px;}
#ovc-materia-body p:first-child{font-weight:500;font-size:18px;}
.materia-footer-bar{border-top:1px solid rgba(255,255,255,0.08);margin-top:48px;padding-top:28px;display:flex;align-items:center;gap:16px;}
.materia-footer-logo{font-weight:800;font-size:15px;color:#ffc800;}
.materia-footer-sub{font-size:12px;color:#6b7280;margin-top:2px;}
.materia-back{display:inline-flex;align-items:center;gap:6px;color:#94a3b8;text-decoration:none;font-size:13px;margin-bottom:32px;}
.materia-back:hover{color:#ffc800;}
</style>
</head>
<body data-theme="dark" style="background:#08080f;color:#f1f1f1;min-height:100vh;">

<!-- Header mínimo funcional -->
<header class="materia-header">
  <a class="materia-header-logo" href="/">O VALOR CAPITAL</a>
  <nav class="materia-header-nav">
    <a href="/politica/">Política</a>
    <a href="/economia/">Economia</a>
    <a href="/investimentos/">Investimentos</a>
    <a href="/negocios/">Negócios</a>
    <a href="/seguros/">Seguros</a>
    <a href="/familia/">Família</a>
  </nav>
</header>

<div class="materia-wrap">

  <!-- Voltar -->
  <a class="materia-back" href="javascript:history.back()">← Voltar</a>

  <!-- Categoria -->
  <div id="ovc-materia-cat">Geral</div>

  <!-- Título -->
  <h1 id="ovc-materia-titulo">Carregando...</h1>

  <!-- Subtítulo -->
  <p id="ovc-materia-subtitulo"></p>

  <!-- Data e assinatura -->
  <div id="ovc-materia-data"></div>

  <!-- Imagem destaque -->
  <img id="ovc-materia-img" alt=""/>

  <!-- Corpo -->
  <article id="ovc-materia-body">
    <p style="color:#6b7280;">Carregando conteúdo...</p>
  </article>

  <!-- Rodapé -->
  <div class="materia-footer-bar">
    <div>
      <div class="materia-footer-logo">O VALOR CAPITAL</div>
      <div class="materia-footer-sub">Liberdade Econômica, Família &amp; Patrimônio · ovalorcapital.com.br</div>
    </div>
  </div>

</div>

<script src="/js/noticias.js" defer></script>
</body>
</html>
