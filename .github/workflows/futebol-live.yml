name: Radar do Futebol — Cobertura Contínua

# 30/08/2026 — schedule: REMOVIDO. Substituído pelo cron nativo da Vercel
# Pro (vercel.json na raiz, tipo=futebol, */5min — PR #567), que consolida
# este disparador com o job "futebol" de pipeline-cron.yml num só. Mantido
# só pra disparo manual (workflow_dispatch).
on:
  workflow_dispatch:

jobs:
  futebol-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Rodada 1 — Gerar matérias Futebol
        run: |
          curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"tipo":"futebol","count":2}' | head -c 300
        continue-on-error: true

      - name: Aguardar 5s
        run: sleep 5

      - name: Rodada 2 — Gerar matérias Futebol
        run: |
          curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"tipo":"futebol","count":2}' | head -c 300
        continue-on-error: true
