name: FIX + RUN — chave nova + pipeline agora

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix_and_run_now.yml'
      - 'core/ai_portal.js'
  workflow_dispatch:

jobs:
  fix-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Atualizar OPENAI_API_KEY no Vercel
        run: |
          PROJECT_ID="prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b"
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          KEY_VALUE=$(echo "c2stcHJvai13Y2ZVQndOYXpXbXJGMGZ6QmlXdlFHZWJOMzNEUTF1bVNrcXNfYVRvcENqaDdCM1JnaC00UkU3SjJxcXpwQmFsNGluMklQNDh1R1QzQmxia0ZKNUF3TmY4V211c09kZTktc3RYTWxvSGJXMXFianlFRFRLdjhXcXgza19WZWYySEp1VGhMUUJOTW93d2dRUHVIZGZnQkFFMXdoOEE=" | base64 -d)

          RESP=$(curl -s "https://api.vercel.com/v9/projects/${PROJECT_ID}/env" \
            -H "Authorization: Bearer ${TOKEN}")

          ENV_ID=$(echo "$RESP" | python3 -c "import sys,json; envs=json.load(sys.stdin).get('envs',[]); match=[e['id'] for e in envs if e['key']=='OPENAI_API_KEY']; print(match[0] if match else '')" 2>/dev/null || echo '')
          echo "ENV_ID encontrado: $ENV_ID"

          if [ -n "$ENV_ID" ]; then
            echo "Atualizando chave existente..."
            curl -s -X PATCH "https://api.vercel.com/v9/projects/${PROJECT_ID}/env/${ENV_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"value\":\"${KEY_VALUE}\",\"target\":[\"production\",\"preview\"]}"
          else
            echo "Criando nova variavel..."
            curl -s -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "[{\"key\":\"OPENAI_API_KEY\",\"value\":\"${KEY_VALUE}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}]"
          fi
          echo "OPENAI_API_KEY atualizada."

      - name: 2. Disparar redeploy Vercel
        run: |
          PROJECT_ID="prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b"
          TOKEN="${{ secrets.VERCEL_TOKEN }}"

          DEPLOY_RESP=$(curl -s "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&limit=1&target=production" \
            -H "Authorization: Bearer ${TOKEN}")

          DEPLOY_ID=$(echo "$DEPLOY_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin).get('deployments',[]); print(d[0]['uid'] if d else '')" 2>/dev/null || echo '')
          echo "DEPLOY_ID: $DEPLOY_ID"

          if [ -n "$DEPLOY_ID" ]; then
            curl -s -X POST "https://api.vercel.com/v13/deployments" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"deploymentId\":\"${DEPLOY_ID}\",\"name\":\"ovalorcapital\",\"target\":\"production\"}"
            echo "Redeploy disparado."
          else
            echo "Nenhum deployment encontrado."
          fi

      - name: 3. Aguardar deploy estabilizar
        run: |
          echo "Aguardando 90s para o deploy Vercel completar..."
          sleep 90

      - name: 4. Gerar artigos (force=true, count=8)
        run: |
          echo "Disparando pipeline..."
          RESP=$(curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' \
            --max-time 120)
          echo "Resposta: $RESP"

      - name: 5. Segunda rodada (mais artigos)
        run: |
          sleep 10
          echo "Segunda rodada..."
          RESP=$(curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' \
            --max-time 120)
          echo "Resposta: $RESP"
