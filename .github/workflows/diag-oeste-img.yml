name: Diagnóstico único — imagem Revista Oeste

on:
  push:
    paths:
      - '.github/workflows/diag-oeste-img.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar deps
        run: npm install axios cheerio rss-parser --no-save --silent

      - name: Comparar og:image bruto vs. filtrado do scraper
        run: |
          node -e "
          import('rss-parser').then(async (RSSParserMod) => {
            const RSSParser = RSSParserMod.default;
            const cheerioMod = await import('cheerio');
            const cheerio = cheerioMod.default || cheerioMod;
            const axios = (await import('axios')).default;
            const scraper = await import('./core/scraper.js');
            const parser = new RSSParser({ timeout: 8000 });
            const feed = await parser.parseURL('https://www.revistaoeste.com/feed/');
            const item = feed.items[0];
            console.log('LINK:', item.link);
            console.log('RSS_MEDIA_CONTENT:', JSON.stringify(item['media:content'] || item.enclosure || '(nenhum)'));
            const res = await axios.get(item.link, { timeout: 8000, headers: { 'User-Agent': 'Mozilla/5.0' } });
            const \$ = cheerio.load(res.data);
            const ogImage = \$('meta[property=\"og:image\"]').attr('content');
            console.log('OG_IMAGE_BRUTO:', ogImage || '(vazio)');
            if (ogImage) {
              try { console.log('OG_IMAGE_HOST:', new URL(ogImage).hostname); } catch(e) {}
            }
            const scraped = await scraper.scrape(item.link);
            console.log('SCRAPE_IMAGE_FILTRADO:', scraped.image || '(vazio — REJEITADO pelo filtro)');
          }).catch(e => { console.error('ERRO_FATAL:', e.message); process.exit(1); });
          "
