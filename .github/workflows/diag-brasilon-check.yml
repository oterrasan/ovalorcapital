name: Diagnóstico único — Brasil ON funcionando?

on:
  push:
    paths:
      - '.github/workflows/diag-brasilon-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar autoBrasilOn manualmente
        run: |
          RESP=$(curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"brasilon","force":true,"count":2}')
          echo "TRIGGER: $RESP"

      - name: Aguardar processamento
        run: sleep 15

      - name: Checar posts publicados em categoria brasil-on
        run: |
          RESP=$(curl -s "https://www.ovalorcapital.com.br/api/portal-posts?categoria=brasil-on&limit=5")
          echo "LISTAGEM: $RESP" | head -c 3000
