name: diag-radar-freshness-once
on:
  workflow_dispatch:
  push:
    branches: [claude/diag-politica-sources-once]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 6 sites pedidos por Roberto — reachability + sitemap + robots
        run: |
          sites=(
            "https://www.jota.info"
            "https://www.poder360.com.br"
            "https://ranking.org.br"
            "https://www.cartacapital.com.br"
            "https://www.brasildefato.com.br"
            "https://www.camara.leg.br"
          )
          for base in "${sites[@]}"; do
            echo "=========================================="
            echo "=== $base ==="
            code=$(curl -sL -o /tmp/home.html -w "%{http_code}" -m 10 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" "$base/" 2>/dev/null || echo "TIMEOUT")
            bytes=$(wc -c < /tmp/home.html 2>/dev/null || echo 0)
            echo "homepage HTTP:$code bytes:$bytes"
            grep -qi "cf-browser-verification\|Attention Required\|Cloudflare Ray ID\|Just a moment" /tmp/home.html 2>/dev/null && echo "!!! CLOUDFLARE DETECTED !!!"
            grep -oE '<title>[^<]*</title>' /tmp/home.html 2>/dev/null | head -1
            scode=$(curl -sL -o /tmp/sm.xml -w "%{http_code}" -m 10 -A "Mozilla/5.0" "$base/sitemap_index.xml" 2>/dev/null || echo "TIMEOUT")
            sbytes=$(wc -c < /tmp/sm.xml 2>/dev/null || echo 0)
            echo "sitemap_index.xml HTTP:$scode bytes:$sbytes"
            [ "$sbytes" -gt 100 ] 2>/dev/null && grep -oE '<loc>[^<]*</loc>' /tmp/sm.xml | head -5
            echo
          done
        continue-on-error: true
