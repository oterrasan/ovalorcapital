name: diag-radar-freshness-once
on:
  workflow_dispatch:
  push:
    branches: [claude/diag-radar-freshness-once2]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger futebol-live pipeline manually NOW
        run: |
          echo "=== manual trigger POST body.tipo=futebol ==="
          curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"tipo":"futebol","count":2}'
          echo
          echo "=== date now ==="
          date -u

      - name: Check latest radar futebol post right after
        run: |
          curl -s "https://www.ovalorcapital.com.br/api/portal-posts?curtinhas=true&tipo=radar&categoria=esportes&limit=5" -o /tmp/r.json
          node -e "
            const d = JSON.parse(require('fs').readFileSync('/tmp/r.json'));
            console.log('total:', d.total);
            (d.curtinhas||[]).forEach(x=>console.log(x.data, (x.titulo||'').slice(0,70)));
          "

      - name: Re-verify GE Globo feed alive right now
        run: |
          code=$(curl -s -o /tmp/f.xml -w "%{http_code}" -m 10 -A "Mozilla/5.0" "https://ge.globo.com/rss/ge/futebol/")
          bytes=$(wc -c < /tmp/f.xml)
          echo "HTTP:$code bytes:$bytes items:$(grep -oc '<item' /tmp/f.xml)"
