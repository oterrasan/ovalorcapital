name: diag-radar-freshness-once
on:
  workflow_dispatch:
  push:
    branches: [claude/diag-imgcheck-existing-sources]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup python deps
        run: pip install --quiet Pillow requests feedparser 2>&1 | tail -5

      - name: Fetch RSS + article + og:image, resize, base64 chunk (varios sources)
        run: |
          python3 << 'PYSCRIPT'
import re, base64, io, urllib.request
from PIL import Image

UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

SOURCES = [
    ("JOVEMPAN", "https://jovempan.com.br/feed/"),
    ("CNNPOLITICA", "https://www.cnnbrasil.com.br/politica/feed/"),
    ("GAZETADOPOVO", "https://www.gazetadopovo.com.br/feed/"),
    ("METROPOLES", "https://www.metropoles.com/feed"),
    ("VEJA", "https://veja.abril.com.br/feed/"),
    ("VALORECONOMICO", "https://www.valor.com.br/rss"),
    ("EXAME", "https://exame.com/feed/"),
    ("INFOMONEY", "https://www.infomoney.com.br/feed/"),
]

def fetch(url, timeout=10):
    req = urllib.request.Request(url, headers={"User-Agent": UA})
    with urllib.request.urlopen(req, timeout=timeout) as r:
        return r.read()

for tag, feedurl in SOURCES:
    print(f"=========================================")
    print(f"=== {tag} ({feedurl}) ===")
    try:
        xml = fetch(feedurl).decode("utf-8", errors="ignore")
    except Exception as e:
        print(f"FEED_ERROR: {e}")
        continue
    links = re.findall(r"<link>(.*?)</link>", xml)
    # primeiro link que nao seja o proprio feed/home
    article = None
    for l in links:
        l = l.strip()
        if l and "feed" not in l and l.rstrip("/") != feedurl.rstrip("/").replace("/feed","") :
            article = l
            break
    if not article and links:
        article = links[-1]
    print(f"ARTICLE: {article}")
    if not article:
        print("NO_ARTICLE_FOUND")
        continue
    try:
        html = fetch(article).decode("utf-8", errors="ignore")
    except Exception as e:
        print(f"ARTICLE_FETCH_ERROR: {e}")
        continue
    m = re.search(r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']', html)
    if not m:
        m = re.search(r'<meta[^>]*content=["\']([^"\']+)["\'][^>]*property=["\']og:image["\']', html)
    if not m:
        print("NO_OG_IMAGE")
        continue
    imgurl = m.group(1)
    print(f"IMG_URL: {imgurl}")
    try:
        imgbytes = fetch(imgurl, timeout=15)
        print(f"IMG_BYTES: {len(imgbytes)}")
        im = Image.open(io.BytesIO(imgbytes)).convert("RGB")
        w, h = im.size
        print(f"IMG_DIMS: {w}x{h}")
        # resize mantendo aspecto, largura max 480
        if w > 480:
            nh = int(h * 480 / w)
            im = im.resize((480, nh))
        buf = io.BytesIO()
        im.save(buf, format="JPEG", quality=65)
        small = buf.getvalue()
        print(f"RESIZED_BYTES: {len(small)}")
        b64 = base64.b64encode(small).decode("ascii")
        for i in range(0, len(b64), 1200):
            print(f"IMG_{tag}_C{i//1200:04d}:{b64[i:i+1200]}")
    except Exception as e:
        print(f"IMG_FETCH_ERROR: {e}")
    print()
PYSCRIPT
