name: Pipeline OVC — automático

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar pipeline (force)
        run: |
          RESP=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' \
            --max-time 120 \
            "https://www.ovalorcapital.com.br/api/run_portal")
          echo "Resposta: $RESP"

      - name: Segunda rodada
        run: |
          sleep 10
          RESP=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' \
            --max-time 120 \
            "https://www.ovalorcapital.com.br/api/run_portal")
          echo "Segunda rodada: $RESP"
