name: Pipeline OVC — a cada 5 minutos

on:
  schedule:
    # Horarios em UTC. Janela Sao Paulo: 07:00 ate 00:30.
    - cron: '*/5 10-23 * * *'
    - cron: '*/5 0-2 * * *'
    - cron: '0,5,10,15,20,25,30 3 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar materias
        run: |
          set -e
          RESP=$(curl -sS -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":3}' --max-time 120)
          echo "RESP: $RESP"
          echo "$RESP" | grep -q '"status":"ok"'
