name: Pipeline OVC — a cada 5 minutos

on:
  schedule:
    - cron: '*/5 10-23 * * *'
    - cron: '*/5 0-2 * * *'
    - cron: '0,5,10,15,20,25,30 3 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rodada 1
        run: |
          RESP=$(curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' --max-time 120)
          echo "R1: $RESP"

      - name: Rodada 2
        run: |
          sleep 5
          RESP=$(curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' --max-time 120)
          echo "R2: $RESP"
