name: Pipeline OVC — manual

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar pipeline (force)
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' \
            "https://www.ovalorcapital.com.br/api/run_portal"
