name: Run Setup Categories
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Criar categorias no banco
        run: |
          curl -s -X POST https://www.ovalorcapital.com.br/api/setup_categories \
            -H "Content-Type: application/json" \
            --max-time 55
