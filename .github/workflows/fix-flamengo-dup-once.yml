name: One-off — encontrar e rejeitar duplicatas Flamengo Hexa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fix-flamengo-dup-once.yml"]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar posts do Radar (tipo=radar, categoria=esportes)
        run: |
          curl -s --max-time 20 "https://www.ovalorcapital.com.br/api/portal-posts?curtinhas=true&tipo=radar&categoria=esportes&limit=50" \
            -o /tmp/radar.json
          echo "bytes baixados: $(wc -c < /tmp/radar.json)"

      - name: Achar e rejeitar duplicatas (mantém a mais recente)
        run: |
          python3 << 'PYEOF'
          import json, subprocess

          with open('/tmp/radar.json') as f:
              d = json.load(f)

          curtinhas = d.get('curtinhas', [])
          print('=== todos os posts do radar ===')
          for p in curtinhas:
              print(p.get('id'), '|', p.get('data') or p.get('published_at'), '|', p.get('titulo'))

          dupes = [
              p for p in curtinhas
              if 'flamengo' in (p.get('titulo') or '').lower()
              and 'hexa' in (p.get('titulo') or '').lower()
          ]
          dupes.sort(key=lambda p: p.get('data') or p.get('published_at') or '', reverse=True)
          print('')
          print('total duplicatas encontradas:', len(dupes))

          ids_to_reject = [p['id'] for p in dupes[1:]]
          print('ids a rejeitar (mantendo o mais recente):', ids_to_reject)

          if not ids_to_reject:
              print('Nada pra rejeitar.')
          else:
              payload = json.dumps({
                  'action': 'rejeitar_lote',
                  'token': 'ovc-admin-2026-secreto',
                  'ids': ids_to_reject
              })
              result = subprocess.run(
                  ['curl', '-s', '-X', 'POST', 'https://www.ovalorcapital.com.br/api/manage',
                   '-H', 'Content-Type: application/json', '-d', payload],
                  capture_output=True, text=True
              )
              print('resposta:', result.stdout)
          PYEOF
