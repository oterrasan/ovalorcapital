name: Diagnóstico único — Brasil ON reescrita simples

on:
  push:
    paths:
      - '.github/workflows/diag-brasilon-check2.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar deps mínimas (axios + cheerio)
        run: npm install axios cheerio --no-save --silent

      - name: Testar scrape() na matéria longa da Bacci (exemplo de Roberto)
        run: |
          node -e "
          import('./core/scraper.js').then(async (mod) => {
            const url = 'https://baccinoticias.com.br/governo-dos-estados-unidos-vai-interferir-nas-eleicoes-brasileiras/';
            const r = await mod.scrape(url);
            console.log('TITLE:', r.title);
            console.log('IMAGE:', r.image);
            console.log('TEXT_LENGTH:', r.text.length);
            console.log('TEXT_SAMPLE:', r.text.slice(0, 1500));
          }).catch(e => { console.error('ERRO:', e.message); process.exit(1); });
          "
