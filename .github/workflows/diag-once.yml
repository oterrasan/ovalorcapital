name: Diagnóstico único (placeholder — inerte até a próxima sessão precisar)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-once.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar pipeline direto — full response, sem truncar
        run: |
          RESP=$(curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","force":true,"count":1}')
          echo "MATERIA_FULL: $RESP"
