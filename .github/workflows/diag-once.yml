name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps (sharp) e fonte oficial
        run: |
          npm install sharp@0.33 axios@1 --no-save --silent
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
          ffmpeg -version | head -1
          which ffprobe || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          which ffprobe && ffprobe -version | head -1
      - name: Renderizar Reel de teste com video real do ndmais.com.br (sem publicar)
        run: |
          node << 'NODEEOF'
          const axios = require("axios");
          const { spawn } = require("child_process");
          const fs = require("fs");

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
          const ARTIGO_URL = "https://ndmais.com.br/seguranca/menina-atacada-por-abelhas-esta-internada-em-cti-apos-ser-atingida-por-enxame-em-frente-a-escola-mais-de-100-ferroadas/";
          const VIDEO_URL = "https://static.ndmais.com.br/2026/09/Veja-o-momento-em-que-motoqueiro-salva-adolescente-de-12-anos-de-ataque-de-abelhas-em-MG.mp4";

          function run(cmd, args) {
            return new Promise((resolve, reject) => {
              const child = spawn(cmd, args, { stdio: ["ignore", "pipe", "pipe"] });
              let out = "", err = "";
              child.stdout.on("data", d => out += d);
              child.stderr.on("data", d => err += d);
              child.on("exit", code => code === 0 ? resolve(out) : reject(new Error(`${cmd} exit ${code}: ${err.slice(-400)}`)));
            });
          }

          (async () => {
            console.log("=== 1) Baixando video real do ndmais.com.br ===");
            const videoRes = await axios.get(VIDEO_URL, { responseType: "arraybuffer", timeout: 60000, headers: { "User-Agent": UA, "Referer": ARTIGO_URL } });
            fs.writeFileSync("input-0.mp4", Buffer.from(videoRes.data));
            console.log("baixado:", fs.statSync("input-0.mp4").size, "bytes");

            console.log("\n=== 2) Montando job de teste (mesma manchete/resumo reais da materia) ===");
            const job = {
              title: "Menina é atacada por enxame de abelhas em frente à escola",
              body: "A criança levou mais de 100 ferroadas e está internada em estado grave na CTI de um hospital. O Corpo de Bombeiros foi acionado e concluiu a ocorrência após a retirada do enxame do local.",
              source_url: VIDEO_URL,
              template_version: "ovc-reels-2026-09-v2-TESTE"
            };
            fs.writeFileSync("job-0.json", JSON.stringify({ job }));
            console.log(JSON.stringify(job, null, 2));

            console.log("\n=== 3) Renderizando com o script real de produção (crop + overlay + fim promocional) ===");
            await run("node", ["scripts/render-instagram-reel.mjs", "job-0.json", "input-0.mp4", "output-0.mp4", "overlay-0.png"]);
            console.log("render OK:", fs.statSync("output-0.mp4").size, "bytes");

            const dur = parseFloat(await run("ffprobe", ["-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", "output-0.mp4"]));
            console.log("duracao final (s):", dur);
            const tempos = [0.5, 1.5, Math.max(2, dur / 2), Math.max(3, dur - 1.5)];
            for (let f = 0; f < tempos.length; f++) {
              await run("ffmpeg", ["-y", "-ss", String(tempos[f]), "-i", "output-0.mp4", "-frames:v", "1", "-vf", "scale=380:-1", `frame-0-${f}.jpg`]);
              const b64 = fs.readFileSync(`frame-0-${f}.jpg`).toString("base64");
              console.log(`\n===FRAME_0_${f}_START===`);
              console.log(b64);
              console.log(`===FRAME_0_${f}_END===`);
            }
            console.log("\n=== FIM DO TESTE — nada publicado, nenhuma escrita no banco/Instagram ===");
          })();
          NODEEOF
