name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Busca ampla por padroes de video no Bacci real
        run: |
          cat > _diag_video_amplo.mjs << 'JSEOF'
          import axios from "axios";

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
          const BACCI_EXCLUIR = /vi-no-instagram|categoria|category|\/tag\/|\/page\/|politica-editorial|politica-de-privacidade|\/contato\/?$|\/sobre\/?$|anuncie|quem-somos/i;

          async function fetchSitemapEntries(url) {
            const res = await axios.get(url, { timeout: 10000, headers: { "User-Agent": UA } });
            const xml = String(res.data || "");
            const blocos = [...xml.matchAll(/<url>([\s\S]*?)<\/url>/g)];
            return blocos.map(b => {
              const loc = (b[1].match(/<loc>(.*?)<\/loc>/) || [])[1] || "";
              const lastmod = (b[1].match(/<lastmod>(.*?)<\/lastmod>/) || [])[1] || "";
              return { loc, lastmod };
            }).filter(e => e.loc && !BACCI_EXCLUIR.test(e.loc));
          }

          // Padrões de vídeo ALÉM do iframe bacci.php?video= já conhecido — testando
          // hipóteses amplas: <video> nativo, players comuns (Bunny Stream direto,
          // YouTube, Vimeo, JW Player), data-attributes de lazy-load de vídeo.
          const PATTERNS = {
            bacci_iframe_conhecido: /estatico\/bacci\.php\?video=\d+/i,
            video_tag_nativo: /<video[\s>]/i,
            bunny_iframe_direto: /iframe\.mediadelivery\.net/i,
            youtube_embed: /youtube\.com\/embed|youtu\.be\//i,
            vimeo_embed: /player\.vimeo\.com/i,
            jwplayer: /jwplayer|jwplatform/i,
            data_video_attr: /data-video(-src|-url)?=/i,
            mp4_direto: /\.mp4(["'\s?])/i,
            video_wp_block: /wp-block-video|wp-video-shortcode/i,
            og_video_meta: /property=["']og:video/i
          };

          async function main() {
            const idxRes = await axios.get("https://baccinoticias.com.br/sitemap_index.xml", { timeout: 10000, headers: { "User-Agent": UA } });
            const idxXml = String(idxRes.data || "");
            const locs = [...idxXml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
            const postSitemaps = locs.filter(l => /\/post-sitemap\d*\.xml$/.test(l));
            const chunkAtual = postSitemaps[postSitemaps.length - 1];
            console.log(`chunk atual: ${chunkAtual}`);
            const entradas = await fetchSitemapEntries(chunkAtual);
            entradas.sort((a, b) => new Date(b.lastmod) - new Date(a.lastmod));
            const recentes = entradas.slice(0, 25);
            console.log(`checando os 25 artigos mais recentes do Bacci agora (${recentes[0]?.lastmod} até ${recentes[recentes.length - 1]?.lastmod})\n`);

            const contagem = {};
            for (const key of Object.keys(PATTERNS)) contagem[key] = 0;
            let semNenhumPadrao = 0;
            const semNenhumPadraoUrls = [];
            const achadosNovos = [];

            for (const e of recentes) {
              try {
                const res = await axios.get(e.loc, { timeout: 8000, headers: { "User-Agent": UA } });
                const html = String(res.data || "");
                let achouAlgo = false;
                const achadosDesteArtigo = [];
                for (const [key, re] of Object.entries(PATTERNS)) {
                  if (re.test(html)) {
                    contagem[key]++;
                    achouAlgo = true;
                    achadosDesteArtigo.push(key);
                  }
                }
                if (!achouAlgo) {
                  semNenhumPadrao++;
                  semNenhumPadraoUrls.push(e.loc);
                } else if (!achadosDesteArtigo.includes("bacci_iframe_conhecido")) {
                  achadosNovos.push({ url: e.loc, achados: achadosDesteArtigo });
                }
                console.log(`  ${achouAlgo ? "[TEM]" : "[   ]"} ${achadosDesteArtigo.join(",") || "-"} | ${e.loc}`);
              } catch (err) {
                console.log(`  [ERRO ${err?.response?.status || err.code || "?"}] ${e.loc}`);
              }
            }

            console.log(`\n=== CONTAGEM POR PADRÃO (de 25 artigos recentes) ===`);
            for (const [key, count] of Object.entries(contagem)) console.log(`  ${key}: ${count}`);
            console.log(`\nSem NENHUM padrão de vídeo detectado: ${semNenhumPadrao}/25`);

            console.log(`\n=== ARTIGOS QUE TÊM VÍDEO POR UM PADRÃO DIFERENTE DO JÁ CONHECIDO (achado novo real) ===`);
            achadosNovos.forEach(a => console.log(`  ${a.url}\n    -> ${a.achados.join(", ")}`));

            console.log(`\n=== amostra de HTML ao redor de qualquer ocorrência de ".mp4" ou "video" no 1º artigo SEM padrão nenhum (se houver) ===`);
            if (semNenhumPadraoUrls.length) {
              const res = await axios.get(semNenhumPadraoUrls[0], { timeout: 8000, headers: { "User-Agent": UA } });
              const html = String(res.data || "");
              const idx = html.toLowerCase().search(/\.mp4|video/i);
              if (idx >= 0) console.log(html.slice(Math.max(0, idx - 200), idx + 300));
              else console.log("(nenhuma ocorrência da palavra 'video' ou '.mp4' em lugar nenhum da página)");
            }
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });

          JSEOF
          node _diag_video_amplo.mjs
          rm -f _diag_video_amplo.mjs
