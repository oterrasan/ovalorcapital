name: Diagnóstico único (placeholder)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar hipótese — candidatos elegíveis do instagram_auto_publish (Brasil ON)
        run: |
          python3 << 'PYEOF'
          import urllib.request, json

          SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          def sb(path, params=""):
              url = f"{SUPABASE_URL}/rest/v1/{path}{params}"
              req = urllib.request.Request(url, headers={
                  "apikey": SUPABASE_KEY,
                  "Authorization": f"Bearer {SUPABASE_KEY}",
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          cats = "politica,policia,brasil-on,futebol"

          oldest50 = sb("brasilon_posts", f"?select=id,titulo,categoria,published_at&status=eq.publicado&categoria=in.({cats})&order=published_at.asc&limit=50")
          print("=== 1) Query real do auto_publish: 50 MAIS ANTIGOS (ascending) ===")
          print(f"total retornado: {len(oldest50)}")
          if oldest50:
              print(f"mais antigo: {oldest50[0]['published_at']} — {oldest50[0]['titulo'][:60]}")
              print(f"mais novo do lote de 50: {oldest50[-1]['published_at']} — {oldest50[-1]['titulo'][:60]}")

          ids = [p["id"] for p in oldest50]
          stamped = 0
          if ids:
              keys = ",".join(f"BON_IG_POSTED__{i}" for i in ids)
              rows = sb("config", f"?select=key&key=in.({keys})")
              stamped = len(rows)
          print("\n=== 2) Desses 50, quantos já têm carimbo BON_IG_POSTED (já postados/reivindicados)? ===")
          print(f"{stamped} de {len(oldest50)}")

          total = sb("brasilon_posts", f"?select=id&status=eq.publicado&categoria=in.({cats})")
          newest = sb("brasilon_posts", f"?select=id,titulo,categoria,published_at&status=eq.publicado&categoria=in.({cats})&order=published_at.desc&limit=5")
          print(f"\n=== 3) Total de posts publicados nas 4 categorias: {len(total)} ===")
          print("5 mais recentes (published_at desc):")
          for p in newest:
              print(f"  {p['published_at']} [{p['categoria']}] {p['titulo'][:60]}")

          all_stamps = sb("config", "?select=key&key=like.BON_IG_POSTED__*&limit=2000")
          print(f"\n=== 4) Total de carimbos BON_IG_POSTED no config: {len(all_stamps)} ===")
          PYEOF
