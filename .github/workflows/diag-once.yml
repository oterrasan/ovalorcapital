name: diag-once (colunas de ig_accounts — somente leitura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/ig_accounts?select=*&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
