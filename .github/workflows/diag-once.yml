name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Achar o post problemático e inspecionar o vídeo-fonte real
        env:
          SUPABASE_URL: https://yntwvfcxjardzafdqanj.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40
        run: |
          echo "== fila de reels (status != ready) =="
          curl -sS "$SUPABASE_URL/rest/v1/posts?select=id,titulo,metrics,video_url&metrics->instagram_reel_template->>status=neq.ready&order=updated_at.desc&limit=15" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o reel_queue.json
          jq -r '.[] | (if (.metrics|type)=="string" then (.metrics|fromjson) else .metrics end) as $m | ($m.instagram_reel_template // empty) as $t | select($t) | [.id, (.titulo // "")[0:55], $t.status, $t.attempts, ($t.last_error // ""), .video_url] | @tsv' reel_queue.json > reel_queue.tsv
          cat reel_queue.tsv
          echo ""
          echo "== instalando ffmpeg pra inspecionar o vídeo real =="
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          echo ""
          echo "== achando o post que mais falhou (maior número de attempts) =="
          video_url=$(sort -t$'\t' -k4 -rn reel_queue.tsv | head -1 | awk -F'\t' '{print $6}')
          echo "vídeo escolhido pra inspecionar: $video_url"
          if [ -z "$video_url" ]; then echo "nenhum candidato com attempts>=1 encontrado"; exit 0; fi
          curl -sS -L "$video_url" --max-time 120 -o source.mp4
          echo "tamanho do arquivo fonte: $(stat -c%s source.mp4) bytes"
          echo ""
          echo "== ffprobe -show_format -show_streams (JSON completo) =="
          ffprobe -v error -show_format -show_streams -print_format json source.mp4
          echo ""
          echo "== primeiros bytes do arquivo (assinatura/container real) =="
          xxd source.mp4 | head -5
