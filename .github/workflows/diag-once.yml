name: Diagnóstico único — comparar escopos reais do token (debug_token da Meta)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Comparar escopos reais via debug_token
        run: node .github/workflows/_diag_token_scopes.mjs
