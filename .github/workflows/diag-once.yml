name: Diagnóstico único — página oficial de rate limits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar rate limits oficiais do Gemini (texto puro)
        run: |
          curl -s "https://ai.google.dev/gemini-api/docs/rate-limits.md.txt" -o /tmp/limits.txt
          echo "=== tamanho do arquivo ==="
          wc -c /tmp/limits.txt
          echo "=== trechos com 'lite' ou 'RPD' ou 'Free' proximos ==="
          grep -n -i "lite\|free tier\|RPD" /tmp/limits.txt | head -100
