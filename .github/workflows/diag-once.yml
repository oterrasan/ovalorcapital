name: diag-once (limpeza real de config — GEMINI_BUDGET antigo)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          B="https://yntwvfcxjardzafdqanj.supabase.co/rest/v1"
          H1="apikey: $SB_KEY"; H2="Authorization: Bearer $SB_KEY"
          HOJE=$(TZ=America/Sao_Paulo date +%Y%m%d)
          echo "== ANTES =="
          echo "config total:"; curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&limit=1" | grep -i content-range
          echo "posts total (nao deve mudar):"; curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/posts?select=id&limit=1" | grep -i content-range
          echo "AUTOMATION (nao deve mudar):"; curl -s -H "$H1" -H "$H2" "$B/config?select=key,value&key=eq.AUTOMATION"

          echo "== DELETE (GEMINI_BUDGET_* menos hoje $HOJE) =="
          curl -s -o /tmp/del.json -w "HTTP:%{http_code}\n" -X DELETE \
            -H "$H1" -H "$H2" -H "Prefer: return=minimal" \
            "$B/config?key=like.GEMINI_BUDGET_*&key=not.like.GEMINI_BUDGET_${HOJE}*"
          cat /tmp/del.json

          echo "== DEPOIS =="
          echo "config total:"; curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&limit=1" | grep -i content-range
          echo "GEMINI_BUDGET restante (deve ser so de hoje):"; curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&key=like.GEMINI_BUDGET_*&limit=1" | grep -i content-range
          echo "GEMINI_BUDGET de hoje (deve ser igual ao de antes):"; curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&key=like.GEMINI_BUDGET_${HOJE}*&limit=1" | grep -i content-range
          echo "posts total (deve ser IDENTICO ao antes):"; curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/posts?select=id&limit=1" | grep -i content-range
          echo "AUTOMATION (deve ser IDENTICO ao antes):"; curl -s -H "$H1" -H "$H2" "$B/config?select=key,value&key=eq.AUTOMATION"
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
