name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inserir 8 matérias curtas do 7 de Setembro como pendentes
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          cat > /tmp/insert_posts.py << 'PYEOF'
          import json, hashlib, uuid, urllib.request, os
          
          SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY = os.environ["SB_KEY"]
          
          ARTICLES = [
              dict(
                  titulo="Lula e Janja Desfilam em Carro Oficial no 7 de Setembro em Meio a Baixa Adesão",
                  meta_title="Lula e Janja no Desfile do 7 de Setembro",
                  foco_keyword="desfile 7 de setembro Lula",
                  slug="lula-janja-desfile-7-de-setembro-baixa-adesao",
                  meta_descricao="Presidente e primeira-dama passaram pela Esplanada dos Ministérios em carro oficial durante o desfile da Independência, marcado por baixa presença popular.",
                  corpo="<p>O presidente Luiz Inácio Lula da Silva (PT) e a primeira-dama, Janja da Silva, atravessaram a Esplanada dos Ministérios em carro oficial na manhã desta segunda-feira (7), durante o desfile cívico-militar que marcou os 204 anos da Independência do Brasil.</p><p>O público acompanhou o trajeto de arquibancadas montadas ao longo da via, mas o comparecimento ficou abaixo da expectativa oficial do governo, que projetava cerca de 30 mil pessoas no local, segundo dados do próprio Executivo.</p><p>O desfile reuniu os chefes dos Três Poderes: o presidente do Supremo Tribunal Federal, Edson Fachin, o presidente do Senado, Davi Alcolumbre, e o presidente da Câmara, Hugo Motta, que acompanharam a cerimônia ao lado do presidente.</p><p>A programação teve como eixos temáticos a soberania nacional, o combate à violência contra a mulher e a Copa do Mundo Feminina de 2027, conforme divulgado pela organização do evento.</p><p>A baixa adesão repete um padrão observado em todas as edições do desfile de Independência desde o início do terceiro mandato de Lula, em janeiro de 2023, segundo registros de coberturas anteriores do mesmo evento.</p>",
              ),
              dict(
                  titulo="Nikolas Ferreira Desponta Como Um dos Principais Nomes do Ato da Paulista no 7 de Setembro",
                  meta_title="Nikolas Ferreira no Ato da Paulista",
                  foco_keyword="Nikolas Ferreira manifestação Paulista",
                  slug="nikolas-ferreira-lideranca-manifestacao-paulista-7-setembro",
                  meta_descricao="Deputado foi um dos nomes à frente da convocação para o ato da direita na Avenida Paulista, ao lado de Flávio Bolsonaro, Tarcísio e Malafaia.",
                  corpo="<p>O deputado federal Nikolas Ferreira (PL-MG) foi um dos nomes à frente da convocação para o ato da direita na Avenida Paulista nesta segunda-feira (7), Dia da Independência, ao lado do senador e pré-candidato à Presidência Flávio Bolsonaro (PL-RJ).</p><p>A manifestação teve início por volta das 15h, sob os gritos de \"Fora Lula\" e \"Fora Moraes\" e o mote \"é agora ou nunca\", segundo relatos do próprio ato. O pedido de impeachment do ministro do Supremo Tribunal Federal Alexandre de Moraes concentrou os discursos.</p><p>Também discursaram o governador de São Paulo, Tarcísio de Freitas (Republicanos), e o pastor Silas Malafaia, que cobrou do presidente do STF, Edson Fachin, um posicionamento sobre o afastamento de Moraes.</p><p>Durante o ato, foi anunciada a convocação de uma nova manifestação, desta vez em frente à casa do presidente do Senado, Davi Alcolumbre (União-AP), segundo registros feitos no local.</p><p>O evento na Paulista ocorreu em meio à repercussão de mensagens trocadas entre o empresário Daniel Vorcaro e o ministro Alexandre de Moraes, tema que tem dominado a pauta política das últimas semanas.</p>",
              ),
              dict(
                  titulo="PM Usa Bombas de Gás Contra Manifestantes Antes de Ato da Direita na Paulista",
                  meta_title="Confusão Antes do Ato na Avenida Paulista",
                  foco_keyword="confusão Avenida Paulista 7 de setembro",
                  slug="pm-bombas-gas-manifestantes-paulista-7-setembro",
                  meta_descricao="Polícia Militar dispersou com bombas de gás um grupo de manifestantes nas imediações da Paulista horas antes do ato da direita marcado para o local.",
                  corpo="<p>A Polícia Militar de São Paulo dispersou com bombas de gás lacrimogêneo um grupo de manifestantes nas imediações da Avenida Paulista na manhã desta segunda-feira (7), horas antes do início do ato da direita marcado para o mesmo local.</p><p>Segundo relatos de agentes que acompanhavam a ocorrência, o grupo disperso era formado por manifestantes identificados como de esquerda, que tentavam avançar em direção à Paulista antes da concentração dos apoiadores de Flávio Bolsonaro (PL-RJ).</p><p>De acordo com a corporação, as bombas foram utilizadas para impedir o deslocamento do grupo até a via, onde já havia estrutura montada para o ato marcado para as 15h.</p><p>Imagens registradas no momento mostram policiais e manifestantes em meio à fumaça, em ruas próximas à avenida. A ocorrência foi descrita como controlada por volta das 13h30.</p>",
              ),
              dict(
                  titulo="Tarcísio Cita Impeachment de Moraes em Discurso no Ato da Avenida Paulista",
                  meta_title="Tarcísio Discursa no Ato da Paulista",
                  foco_keyword="Tarcísio discurso Moraes Avenida Paulista",
                  slug="tarcisio-discurso-impeachment-moraes-paulista",
                  meta_descricao="Governador de São Paulo endureceu o tom contra o ministro Alexandre de Moraes durante discurso no ato da direita na Avenida Paulista.",
                  corpo="<p>O governador de São Paulo, Tarcísio de Freitas (Republicanos), discursou no ato da direita na Avenida Paulista nesta segunda-feira (7) e endureceu o tom contra o ministro do Supremo Tribunal Federal Alexandre de Moraes.</p><p>\"Ninguém está acima da lei e é hora de reagirmos\", disse Tarcísio, em referência ao pedido de impeachment de Moraes, segundo registros do próprio ato.</p><p>O governador discursou ao lado do senador e pré-candidato à Presidência Flávio Bolsonaro (PL-RJ), do deputado federal Nikolas Ferreira (PL-MG) e do pastor Silas Malafaia, em um dos principais atos da direita realizados nesta segunda-feira em pelo menos 15 cidades do país.</p><p>A manifestação ocorre em meio à repercussão de mensagens trocadas entre o empresário Daniel Vorcaro e o ministro Alexandre de Moraes, episódio que tem alimentado os pedidos por seu afastamento do STF.</p>",
              ),
              dict(
                  titulo="Vídeo Mostra Grupo Que se Diz Ex-BOPE Queimando Bandeira Com Imagem de Lula",
                  meta_title="Vídeo de Grupo Queimando Bandeira",
                  foco_keyword="vídeo grupo policiais bandeira Lula",
                  slug="video-grupo-ex-bope-bandeira-lula-7-setembro",
                  meta_descricao="Vídeo que circula nas redes mostra homens queimando bandeira com imagem de Lula durante evento de airsoft; vínculo policial não foi confirmado.",
                  corpo="<p>Um vídeo que circula nas redes sociais mostra um grupo de homens queimando uma bandeira com a imagem do presidente Luiz Inácio Lula da Silva (PT), durante um evento de airsoft realizado nesta segunda-feira (7), Dia da Independência.</p><p>Nas imagens, os homens ecoam palavras de baixo calão e gritos de repúdio dirigidos ao presidente enquanto a bandeira é queimada. Um dos participantes se identificou nas redes sociais como ex-integrante do BOPE, a tropa de elite da Polícia Militar do Rio de Janeiro.</p><p>A condição de ex-combatente da corporação, no entanto, não foi confirmada oficialmente até a publicação desta matéria. Também não há confirmação sobre o vínculo profissional atual dos demais homens que aparecem no vídeo.</p><p>O episódio ocorreu em meio a uma série de manifestações contra o presidente e o ministro do Supremo Tribunal Federal Alexandre de Moraes registradas em diferentes pontos do país nesta segunda-feira.</p>",
              ),
              dict(
                  titulo="Manifestantes Tomam Área Central de Brasília com Pedidos de Fora Lula e Fora Moraes",
                  meta_title="Manifestação Toma o Centro de Brasília",
                  foco_keyword="manifestação Brasília Fora Lula Fora Moraes",
                  slug="manifestacao-brasilia-fora-lula-fora-moraes-7-setembro",
                  meta_descricao="Multidão ocupou áreas do centro de Brasília no feriado da Independência com cartazes e gritos contra Lula e o ministro Alexandre de Moraes.",
                  corpo="<p>Uma multidão de manifestantes ocupou áreas do centro de Brasília nesta segunda-feira (7), feriado da Independência, em protesto contra o presidente Luiz Inácio Lula da Silva (PT) e o ministro do Supremo Tribunal Federal Alexandre de Moraes.</p><p>Vestidos majoritariamente em verde e amarelo, os participantes carregaram bandeiras do Brasil e cartazes com as mensagens \"Fora Lula\" e \"Fora Moraes\", cantaram o Hino Nacional e percorreram vias da capital federal.</p><p>Em frente ao Banco Central, um grupo se reuniu em ato que pede o impeachment de Moraes e faz críticas ao presidente do Senado, Davi Alcolumbre (União-AP). A convocação partiu do ex-desembargador Sebastião Coelho, candidato ao Senado pelo Distrito Federal.</p><p>Atos da direita foram registrados em pelo menos 15 cidades do país nesta segunda-feira, com discursos concentrados nas críticas a Lula e a Moraes, em meio à repercussão de mensagens trocadas entre o empresário Daniel Vorcaro e o ministro do STF.</p>",
              ),
              dict(
                  titulo="Esvaziamento se Repete e Desfile de Lula Volta a Registrar Baixo Público, Aponta Oposição",
                  meta_title="Desfile de Lula Tem Baixo Público de Novo",
                  foco_keyword="desfile Lula baixo público oposição",
                  slug="desfile-lula-baixo-publico-oposicao-7-setembro",
                  meta_descricao="Oposição vê no esvaziamento das arquibancadas do desfile de Independência um termômetro do sentimento popular às vésperas da eleição.",
                  corpo="<p>O desfile cívico-militar de 7 de Setembro em Brasília voltou a registrar baixa movimentação de público na Esplanada dos Ministérios nesta segunda-feira, repetindo um padrão observado em todas as edições realizadas durante o terceiro mandato do presidente Luiz Inácio Lula da Silva (PT).</p><p>Para a oposição, o esvaziamento das arquibancadas às vésperas do primeiro turno das eleições presidenciais, marcado para 4 de outubro, funciona como termômetro do sentimento da população em relação ao governo.</p><p>Houve manifestação de apoio, concentrada principalmente nas arquibancadas mais próximas às autoridades. Ao chegar ao local da cerimônia, Lula foi recebido por parte do público com o coro \"olê, olá, Lula\", segundo registros do momento.</p><p>O governo optou pela contenção institucional no uso do desfile, evitando repetir o precedente de 2022, quando o aproveitamento eleitoral do evento chegou a ser alvo de questionamento no Tribunal Superior Eleitoral.</p>",
              ),
              dict(
                  titulo="Fora Moraes é o Grito Mais Repetido nos Atos de 7 de Setembro Pelo País",
                  meta_title="Fora Moraes Domina Atos pelo Brasil",
                  foco_keyword="Fora Moraes atos 7 de setembro",
                  slug="fora-moraes-grito-atos-7-de-setembro-brasil",
                  meta_descricao="Pedido de impeachment de Alexandre de Moraes se consolidou como principal mote das manifestações de direita em pelo menos 15 cidades do país.",
                  corpo="<p>O pedido de impeachment do ministro do Supremo Tribunal Federal Alexandre de Moraes se consolidou como o principal mote das manifestações de direita realizadas nesta segunda-feira (7), Dia da Independência, em pelo menos 15 cidades do país.</p><p>De São Paulo a Brasília, passando por Belo Horizonte, o coro \"Fora Moraes\" se repetiu nos principais atos, ao lado de críticas ao presidente Luiz Inácio Lula da Silva (PT) e ao presidente do Senado, Davi Alcolumbre (União-AP).</p><p>A mobilização ocorre em meio à repercussão de mensagens trocadas entre o empresário Daniel Vorcaro e o ministro Alexandre de Moraes, episódio que tem alimentado os pedidos por seu afastamento da Corte.</p><p>Os atos reuniram nomes como o senador e pré-candidato à Presidência Flávio Bolsonaro (PL-RJ), o governador de São Paulo, Tarcísio de Freitas (Republicanos), o deputado federal Nikolas Ferreira (PL-MG) e o pastor Silas Malafaia, entre outros.</p>",
              ),
          ]
          
          results = []
          for art in ARTICLES:
              h = hashlib.md5((art["titulo"] + "_manual_video_" + str(uuid.uuid4())).encode()).hexdigest()
              payload = {
                  "titulo": art["titulo"],
                  "conteudo": art["corpo"],
                  "comentario_fixado": art["meta_descricao"],
                  "hash": h,
                  "status": "pendente",
                  "approved": False,
                  "publish_method": "portal",
                  "user_tags": json.dumps(["politica"]),
                  "subcategoria": "Eleições 2026",
                  "subcategoria_slug": "eleicoes-2026",
                  "metrics": {
                      "foco_keyword": art["foco_keyword"],
                      "seo_slug": art["slug"],
                      "meta_descricao": art["meta_descricao"],
                      "meta_title": art["meta_title"],
                      "views": 0,
                  },
              }
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/posts",
                  data=body,
                  method="POST",
                  headers={
                      "apikey": SB_KEY,
                      "Authorization": f"Bearer {SB_KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "return=representation",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      resp_body = json.loads(resp.read().decode("utf-8"))
                      new_id = resp_body[0]["id"] if isinstance(resp_body, list) and resp_body else None
                      results.append((art["titulo"], resp.status, new_id))
              except urllib.error.HTTPError as e:
                  results.append((art["titulo"], e.code, e.read().decode("utf-8")))
          
          print("\n=== RESULTADO ===")
          for titulo, status, info in results:
              print(f"{status} | {info} | {titulo}")
          PYEOF
          python3 /tmp/insert_posts.py
