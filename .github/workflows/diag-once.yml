name: Diagnóstico único (placeholder)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: fila PENDENTE do OVC por categoria (canal materias) + volume total
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, collections, datetime

          BASE = "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1"
          KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          HEADERS = {"apikey": KEY, "Authorization": "Bearer " + KEY}

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8") or "[]")

          def paginate(base_url, limit=1000):
              rows, offset = [], 0
              while True:
                  sep = "&" if "?" in base_url else "?"
                  chunk = get(f"{base_url}{sep}limit={limit}&offset={offset}")
                  rows.extend(chunk)
                  if len(chunk) < limit:
                      break
                  offset += limit
              return rows

          now = datetime.datetime.utcnow()
          cutoff_24h = (now - datetime.timedelta(hours=24)).isoformat()
          cutoff_48h = (now - datetime.timedelta(hours=48)).isoformat()

          print("=== OVC — TODOS os pendentes (status=pendente), sem filtro de data, por 1ª tag ===")
          pend_url = f"{BASE}/posts?select=user_tags,publish_method,created_at&status=eq.pendente&order=created_at.desc"
          pend_rows = paginate(pend_url)
          print("total pendentes (todos os tempos):", len(pend_rows))
          cat_count = collections.Counter()
          method_count = collections.Counter()
          for r in pend_rows:
              try:
                  tags = json.loads(r.get("user_tags") or "[]")
              except Exception:
                  tags = []
              cat = tags[0] if tags else "(sem tag)"
              cat_count[cat] += 1
              method_count[r.get("publish_method") or "(sem method)"] += 1
          for cat, n in cat_count.most_common():
              print(f"  {cat:15s} {n}")
          print("--- por publish_method ---")
          for m, n in method_count.most_common():
              print(f"  {m:20s} {n}")

          print()
          print("=== OVC — pendentes criados nas últimas 48h, por 1ª tag ===")
          pend_48 = [r for r in pend_rows if r.get("created_at") and r["created_at"] >= cutoff_48h]
          print("total pendentes últimas 48h:", len(pend_48))
          cat_48 = collections.Counter()
          for r in pend_48:
              try:
                  tags = json.loads(r.get("user_tags") or "[]")
              except Exception:
                  tags = []
              cat = tags[0] if tags else "(sem tag)"
              cat_48[cat] += 1
          for cat, n in cat_48.most_common():
              print(f"  {cat:15s} {n}")

          print()
          print("=== OVC — pendentes criados nas últimas 24h, por 1ª tag ===")
          pend_24 = [r for r in pend_rows if r.get("created_at") and r["created_at"] >= cutoff_24h]
          print("total pendentes últimas 24h:", len(pend_24))
          cat_24 = collections.Counter()
          for r in pend_24:
              try:
                  tags = json.loads(r.get("user_tags") or "[]")
              except Exception:
                  tags = []
              cat = tags[0] if tags else "(sem tag)"
              cat_24[cat] += 1
          for cat, n in cat_24.most_common():
              print(f"  {cat:15s} {n}")

          print()
          print("=== OVC — mais recente criado por cada categoria-alvo do canal materias (pendente OU publicado) ===")
          alvo_cats = ["economia","financas","negocios","tecnologia","industria","familia"]
          for c in alvo_cats:
              rows = paginate(f"{BASE}/posts?select=titulo,status,created_at&user_tags=ilike.*{c}*&order=created_at.desc")
              if rows:
                  r0 = rows[0]
                  print(f"  {c:12s} -> mais recente: {r0['created_at']}  status={r0['status']}  \"{r0['titulo'][:60]}\"  (total encontrados: {len(rows)})")
              else:
                  print(f"  {c:12s} -> NENHUM post encontrado (nunca gerado, ou tag não bate)")
          PYEOF
