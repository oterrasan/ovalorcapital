name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checar se Reel de esportes já foi publicado de verdade pro OVC
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          python3 << 'PYEOF'
          import os, urllib.request, urllib.parse, json

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}

          def get(path):
              req = urllib.request.Request(f"{url}/rest/v1/{path}", headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          q = urllib.parse.urlencode({
              "select": "id,titulo,published_at,metrics",
              "user_tags": "like.*esportes*",
              "metrics->instagram_reel->>ig_id": "not.is.null",
              "order": "published_at.desc",
              "limit": "15",
          }, safe=',.()[]*>')
          rows = get(f"posts?{q}")
          print(f"total_reels_esportes_ja_publicados_no_ovc={len(rows)}")
          for r in rows:
              m = r.get("metrics") or {}
              if isinstance(m, str):
                  try: m = json.loads(m)
                  except Exception: m = {}
              reel = (m or {}).get("instagram_reel") or {}
              print({"id": r["id"], "titulo": r["titulo"], "published_at": r["published_at"], "ig_id": reel.get("ig_id"), "username": reel.get("username")})
          PYEOF
