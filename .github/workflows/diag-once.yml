name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checar config real do OVC e do Brasil ON (automação Instagram)
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          echo "--- OVC: IG_AUTOMATION_ENABLED (todas as linhas, mais recente primeiro) ---"
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?key=eq.IG_AUTOMATION_ENABLED&select=key,value,updated_at&order=updated_at.desc&limit=5" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool
          echo ""
          echo "--- Brasil ON: BON_IG_ENABLED ---"
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?key=eq.BON_IG_ENABLED&select=key,value,updated_at&order=updated_at.desc&limit=5" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool
          echo ""
          echo "--- Hora atual do servidor (referência) ---"
          date -u
