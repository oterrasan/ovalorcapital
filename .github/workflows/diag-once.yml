name: Diagnóstico único (Brasil ON — redeploy produção com identidade visual nova)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  deploy_brasilon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Brasil ON em produção (código atualizado)
        working-directory: brasilon
        run: |
          npm install -g vercel@54.6.1
          vercel --token="${{ secrets.VERCEL_TOKEN }}" --yes --prod 2>&1 | tee /tmp/deploy_out.txt
          tail -3 /tmp/deploy_out.txt
