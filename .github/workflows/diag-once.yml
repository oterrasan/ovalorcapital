name: diag-once (placeholder)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Salvar BRAPI_TOKEN em config (Supabase)
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          BRAPI_TOKEN: "xAb6LvXrydZE98tEd7KjrJ"
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          TOKEN = os.environ["BRAPI_TOKEN"]
          print(f"::add-mask::{TOKEN}")

          def sb_get(path):
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/{path}",
                  headers={"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"},
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          def sb_write(path, method, payload):
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/{path}",
                  data=json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status

          existing = sb_get("config?select=key&key=eq.BRAPI_TOKEN")
          if existing:
              status = sb_write("config?key=eq.BRAPI_TOKEN", "PATCH", {"value": TOKEN})
              print(f"UPDATE BRAPI_TOKEN -> HTTP {status}")
          else:
              status = sb_write("config", "POST", {"key": "BRAPI_TOKEN", "value": TOKEN})
              print(f"INSERT BRAPI_TOKEN -> HTTP {status}")

          # confirma sem nunca imprimir o valor
          check = sb_get("config?select=key&key=eq.BRAPI_TOKEN")
          print(f"Confirmado no banco: {len(check)} linha(s) com key=BRAPI_TOKEN")
          PYEOF
