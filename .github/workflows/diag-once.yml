name: Diagnóstico único (imagens reais de saúde pro OPMED — temporário)

# One-off: Roberto pediu imagens REAIS (não aleatório/genérico) nos cards
# de exemplo do OPMED, temáticas por categoria (odontologia, bem-estar,
# ciência, saúde pública — Medicina já reaproveitou fotos reais do banner
# de saúde do OVC). Busca fotos reais e bem licenciadas no Wikimedia
# Commons (mesma fonte já usada e aprovada nesse projeto), baixa, e
# commita direto na branch do scaffold (feat/opmed-scaffold). Reset pro
# placeholder assim que confirmado.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opmed-scaffold

      - name: Busca e baixa fotos reais por categoria (Wikimedia Commons)
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, os

          UA = "OPMED-mock-image-fetch/1.0 (internal test; contact: n/a)"

          def api_get(params):
              url = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode())

          def download(url, dest):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=25) as r:
                  data = r.read()
              with open(dest, "wb") as f:
                  f.write(data)
              return len(data)

          queries = {
              "odontologia": ["dentist examining patient photograph", "dental clinic treatment photograph"],
              "bemestar": ["yoga practice photograph", "physical exercise fitness photograph", "person meditating photograph", "healthy lifestyle exercise photograph"],
              "ciencia": ["scientist laboratory research photograph", "microscope research scientist photograph"],
              "saudepublica": ["vaccination clinic photograph", "community health clinic photograph"],
          }

          os.makedirs("opmed/public/assets/mock", exist_ok=True)
          picked = []

          for slug, terms in queries.items():
              n = 0
              for term in terms:
                  if n >= 2:
                      break
                  try:
                      data = api_get({
                          "action": "query", "format": "json", "generator": "search",
                          "gsrsearch": term + " filetype:bitmap", "gsrnamespace": "6", "gsrlimit": "10",
                          "prop": "imageinfo", "iiprop": "url|extmetadata|mime", "iiurlwidth": "900",
                      })
                  except Exception as e:
                      print(f"ERRO busca {slug}/{term}: {e}")
                      continue
                  pages = data.get("query", {}).get("pages", {})
                  for pid, page in pages.items():
                      if n >= 2:
                          break
                      info = (page.get("imageinfo") or [{}])[0]
                      mime = info.get("mime", "")
                      if mime not in ("image/jpeg", "image/png"):
                          continue
                      url = info.get("thumburl") or info.get("url")
                      if not url:
                          continue
                      title = page.get("title", "")
                      license_short = (info.get("extmetadata", {}) or {}).get("LicenseShortName", {}).get("value", "?")
                      if not any(k in license_short.lower() for k in ["public domain", "cc0", "pd", "cc-by"]):
                          print(f"PULADO (licença {license_short}): {title}")
                          continue
                      dest = f"opmed/public/assets/mock/{slug}-{n+1}.jpg"
                      try:
                          size = download(url, dest)
                      except Exception as e:
                          print(f"ERRO download {title}: {e}")
                          continue
                      n += 1
                      print(f"OK {slug}-{n}.jpg <- {title} | licenca={license_short} | {size} bytes | {url}")
                      picked.append((slug, n, title, license_short, url))

          print("=== RESUMO ===")
          for p in picked:
              print(p)
          PYEOF

      - name: Lista arquivos baixados
        run: ls -la opmed/public/assets/mock/

      - name: Commit e push das imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opmed/public/assets/mock/
          git status
          git commit -m "feat(opmed): imagens reais de saude por categoria (mock) - Wikimedia Commons" || echo "nada novo pra commitar"
          git push origin HEAD:feat/opmed-scaffold
