name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Taxa real de vídeo nos candidatos ATUAIS do Bacci (sitemap ao vivo)
        run: |
          node --input-type=module -e '
            import { buscarCandidatosBrasilOn, descobrirPaginaVideoBacci } from "./core/brasilon.js";
            const candidatos = await buscarCandidatosBrasilOn();
            console.log(`candidatos reais agora (sitemap Bacci): ${candidatos.length}`);
            let comVideo = 0;
            for (const c of candidatos) {
              const urlVideo = await descobrirPaginaVideoBacci(c.link);
              const tem = !!urlVideo;
              if (tem) comVideo++;
              console.log(`  ${tem ? "[VIDEO]" : "[     ]"} ${c.link}`);
              if (tem) console.log(`           -> ${urlVideo}`);
            }
            console.log(`\nTOTAL: ${comVideo}/${candidatos.length} candidatos ATUAIS têm vídeo detectável agora`);
          '
