name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pausar TODAS as automacoes (AUTOMATION, IG/REELS do OVC e do Brasil ON)
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request

          SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
          }

          def req(method, path, body=None, extra_headers=None):
              url = f"{SUPABASE_URL}/rest/v1/{path}"
              h = dict(HEADERS)
              if extra_headers:
                  h.update(extra_headers)
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r) as resp:
                      raw = resp.read()
                      return resp.status, (json.loads(raw) if raw else [])
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  return e.code, (json.loads(raw) if raw else raw.decode(errors="replace"))

          FLAGS = [
              "AUTOMATION",
              "IG_AUTOMATION_ENABLED",
              "REELS_AUTOMATION_ENABLED",
              "BON_IG_ENABLED",
              "BON_REEL_ENABLED",
          ]

          print("=== ANTES ===")
          antes = {}
          for key in FLAGS:
              status, data = req("GET", f"config?key=eq.{key}&select=key,value")
              val = data[0]["value"] if data else "(nao existe)"
              antes[key] = val
              print(f"{key} = {val}")

          print("\n=== APLICANDO off ===")
          for key in FLAGS:
              status, data = req("GET", f"config?key=eq.{key}&select=key")
              if data:
                  s, d = req("PATCH", f"config?key=eq.{key}", {"value": "off"}, {"Prefer": "return=representation"})
              else:
                  s, d = req("POST", "config", {"key": key, "value": "off"}, {"Prefer": "return=representation"})
              print(f"{key}: HTTP {s}")

          print("\n=== DEPOIS ===")
          for key in FLAGS:
              status, data = req("GET", f"config?key=eq.{key}&select=key,value")
              val = data[0]["value"] if data else "(nao existe)"
              print(f"{key} = {val}")
          PYEOF
