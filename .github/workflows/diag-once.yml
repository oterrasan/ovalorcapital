name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Por que generated:0 em todos os 10 candidatos com vídeo do dia 20/09
        run: |
          cat > _diag_zero.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";
          import { scrape } from "./core/scraper.js";
          import { rewriteBrasilOn } from "./core/ai_portal.js";

          const supabase = createClient(
            "https://yntwvfcxjardzafdqanj.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          );

          async function main() {
            console.log("=== 1) Logs [brasilon] da última hora ===");
            const desde = new Date(Date.now() - 3600 * 1000).toISOString();
            const { data: logs, error: logsErr } = await supabase
              .from("logs")
              .select("created_at,level,message")
              .ilike("message", "%brasilon%")
              .gte("created_at", desde)
              .order("created_at", { ascending: true });
            if (logsErr) console.log("erro logs:", logsErr.message);
            else {
              console.log(`${logs.length} entradas encontradas:`);
              logs.forEach(l => console.log(`  ${l.created_at} [${l.level}] ${l.message}`));
            }

            console.log("\n=== 2) Reproduzindo o pipeline real pra 1 URL, passo a passo ===");
            const url = "https://baccinoticias.com.br/lua-de-mel-termina-em-tragedia-apos-explosao-de-churrasqueira-atingir-noiva/";
            console.log(`URL de teste: ${url}`);

            let a, sourceText;
            try {
              a = await scrape(url, { timeout: 3500 });
              console.log(`  scrape() OK — title:"${a.title?.slice(0,60)}" image:"${a.image || "(vazio)"}" text.length:${(a.text||"").length}`);
              sourceText = [a.text, "", ""].filter(Boolean).join("\n\n").trim();
              console.log(`  sourceText.length: ${sourceText.length}`);
            } catch (e) {
              console.log(`  scrape() FALHOU: ${e?.message || e}`);
              return;
            }

            if (!sourceText) {
              console.log("  sourceText vazio — pipeline real pararia AQUI (continue silencioso, sem log)");
              return;
            }

            const hash_test = "diagnostico-nao-usado";
            console.log("\n  Chamando rewriteBrasilOn() de verdade (mesma IA do pipeline)...");
            try {
              const content = await rewriteBrasilOn(sourceText, a.title || "", "");
              console.log(`  rewriteBrasilOn() retornou:`);
              console.log(`    titulo: "${content?.titulo || "(vazio)"}"`);
              console.log(`    corpo.length: ${(content?.corpo || "").length}`);
              console.log(`    corpo (primeiros 300 chars): ${(content?.corpo || "").slice(0, 300)}`);
              console.log(`    corpo (ÚLTIMOS 400 chars, onde ficam as hashtags): ${(content?.corpo || "").slice(-400)}`);

              // replica validarBrasilOn() aqui pra ver EXATAMENTE que erro bateria
              const plain = (h) => String(h || "").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim();
              const corpo = String(content?.corpo || "").trim();
              const texto = plain(corpo);
              const erros = [];
              const titulo = (content?.titulo || "").trim();
              if (!content?.titulo || !content?.corpo) erros.push("estrutura ausente");
              if (titulo.length < 20 || titulo.length > 120) erros.push(`titulo fora da faixa (len=${titulo.length})`);
              if (texto.length < 60) erros.push(`texto curto demais (len=${texto.length})`);
              if (/\*\*|^##|\n##|TITULO:|META_TITLE:|META_DESCRICAO:/m.test(corpo)) erros.push("markdown/metadados no corpo");
              if (!/<p\b/i.test(corpo)) erros.push("sem paragrafo html");
              if (/não foi possível|conteúdo insuficiente|não há informações suficientes|inconsistencia/i.test(texto)) erros.push("recusa vazou");
              if (!/<p>\s*<strong>\s*Reda[çc][aã]o\s*OVC\s*<\/strong>/i.test(corpo)) erros.push("cabecalho Redacao OVC ausente");
              const nHash = (corpo.match(/#\p{L}+/gu) || []).length;
              if (nHash < 8) erros.push(`menos de 10 hashtags (achou ${nHash})`);
              const VEICULO_CITADO_RE = /\bBacci(?:\s+Not[ií]cias)?\b|\bRevista\s+Oeste\b|\bJovem\s+Pan\b|\bBBC(?:\s+News)?\b|\bCNN\b|\bReuters\b|\bAFP\b|\bAssociated\s+Press\b|\bAP\s+News\b|\bAl\s+Jazeera\b|\bBloomberg\b|\bDeutsche\s+Welle\b|\bNew\s+York\s+Post\b|\bFolha\s+de\s+S[ãa]o\s+Paulo\b|\bO\s+Globo\b|\bG1\b|\bUOL\b|\bEstad[ãa]o\b|\bTerra\b|\bR7\b|\bSBT\b|\bBand\s+News\b|\bVeja\b|\bExame\b|\bCartaCapital\b|\bPoder360\b|\bGazeta\s+do\s+Povo\b|\bMetr[óo]poles\b|\bInfoMoney\b|\bOfuxico\b/i;
              if (VEICULO_CITADO_RE.test(texto)) erros.push("cita outro veiculo/jornalista no corpo");

              console.log(`\n  === RESULTADO validarBrasilOn() (replicado) ===`);
              console.log(`  erros: ${JSON.stringify(erros)}`);
              if (!erros.length) console.log("  -> PASSARIA na validação. O bloqueio deve estar em outra etapa (imagem, dedup, pautaParecida final).");
            } catch (e) {
              console.log(`  rewriteBrasilOn() FALHOU: ${e?.message || e}`);
            }
          }

          main().catch(e => { console.error("ERRO FATAL:", e); process.exit(1); });

          JSEOF
          node _diag_zero.mjs
          rm -f _diag_zero.mjs
