name: Diagnóstico único (placeholder) — verificação bruta de HTML (youtube presente?)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Checar HTML bruto (independente de regex) dos 40 artigos mais recentes
        run: |
          cat > _diag_raw.mjs << 'JSEOF'
          import axios from "axios";

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
          const BACCI_EXCLUIR = /vi-no-instagram|categoria|category|\/tag\/|\/page\/|politica-editorial|politica-de-privacidade|\/contato\/?$|\/sobre\/?$|anuncie|quem-somos/i;

          async function main() {
            const idxRes = await axios.get("https://baccinoticias.com.br/sitemap_index.xml", { timeout: 10000, headers: { "User-Agent": UA } });
            const idxXml = String(idxRes.data || "");
            const locs = [...idxXml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
            const postSitemaps = locs.filter(l => /\/post-sitemap\d*\.xml$/.test(l));
            const chunkAtual = postSitemaps[postSitemaps.length - 1];
            const smRes = await axios.get(chunkAtual, { timeout: 10000, headers: { "User-Agent": UA } });
            const smXml = String(smRes.data || "");
            const blocos = [...smXml.matchAll(/<url>([\s\S]*?)<\/url>/g)];
            const entradas = blocos.map(b => {
              const loc = (b[1].match(/<loc>(.*?)<\/loc>/) || [])[1] || "";
              const lastmod = (b[1].match(/<lastmod>(.*?)<\/lastmod>/) || [])[1] || "";
              return { loc, lastmod };
            }).filter(e => e.loc && !BACCI_EXCLUIR.test(e.loc));
            entradas.sort((a, b) => new Date(b.lastmod) - new Date(a.lastmod));

            console.log(`checando ${entradas.length > 40 ? 40 : entradas.length} artigos, procurando "youtube" cru no HTML (sem regex de extracao)...`);
            let comYoutube = 0;
            let exemplos = [];
            for (const e of entradas.slice(0, 40)) {
              const res = await axios.get(e.loc, { timeout: 8000, headers: { "User-Agent": UA } });
              const html = String(res.data || "");
              const temYoutube = /youtube|youtu\.be/i.test(html);
              if (temYoutube) {
                comYoutube++;
                const idx = html.toLowerCase().indexOf("youtube");
                const idx2 = html.toLowerCase().indexOf("youtu.be");
                const pos = idx >= 0 ? idx : idx2;
                const snippet = html.slice(Math.max(0, pos - 60), pos + 200).replace(/\s+/g, " ");
                if (exemplos.length < 3) exemplos.push({ url: e.loc, snippet });
              }
              console.log(`  [${temYoutube ? "TEM youtube no html" : "sem youtube"}] ${e.loc} (tamanho html: ${html.length})`);
            }
            console.log(`\ntotal com "youtube" em algum lugar do HTML: ${comYoutube} de ${entradas.slice(0,40).length}`);
            for (const ex of exemplos) {
              console.log(`\n--- exemplo: ${ex.url} ---`);
              console.log(ex.snippet);
            }
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });
          JSEOF
          node _diag_raw.mjs
          rm -f _diag_raw.mjs
