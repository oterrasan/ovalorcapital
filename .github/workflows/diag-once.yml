name: Diagnóstico único (placeholder)

# Este arquivo é reaproveitado sob demanda para diagnósticos pontuais em
# produção (ex.: consultar Supabase, testar um endpoint, disparar um
# redeploy manual). Fora de uso, fica assim — inerte, sem nenhuma ação real.
# Sempre resetar para este estado depois de qualquer uso pontual.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Corrigir pausa excessiva — religar AUTOMATION, manter só Instagram pausado
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY || '' }}"
        run: |
          set -e
          KEY="$SUPABASE_KEY"
          if [ -z "$KEY" ]; then
            KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          fi

          set_val () {
            local KEYNAME="$1"
            local VAL="$2"
            local EXISTE=$(curl -s "$SUPABASE_URL/rest/v1/config?select=key&key=eq.${KEYNAME}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if echo "$EXISTE" | grep -q "$KEYNAME"; then
              curl -s -o /dev/null -w "PATCH ${KEYNAME}=${VAL}: %{http_code}\n" -X PATCH \
                "$SUPABASE_URL/rest/v1/config?key=eq.${KEYNAME}" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" \
                -d "{\"value\":\"${VAL}\"}"
            else
              curl -s -o /dev/null -w "INSERT ${KEYNAME}=${VAL}: %{http_code}\n" -X POST \
                "$SUPABASE_URL/rest/v1/config" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" \
                -d "{\"key\":\"${KEYNAME}\",\"value\":\"${VAL}\"}"
            fi
          }

          echo "== ANTES =="
          curl -s "$SUPABASE_URL/rest/v1/config?select=key,value&key=in.(AUTOMATION,IG_AUTOMATION_ENABLED,BON_IG_ENABLED)" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo ""

          echo "== Corrigindo — só AUTOMATION volta a 'on', Instagram continua 'off' =="
          set_val "AUTOMATION" "on"

          echo "== DEPOIS =="
          curl -s "$SUPABASE_URL/rest/v1/config?select=key,value&key=in.(AUTOMATION,IG_AUTOMATION_ENABLED,BON_IG_ENABLED)" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo ""
