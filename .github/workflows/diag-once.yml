name: Diagnóstico único (investigação pontual)

on:
  workflow_dispatch:
  push:
    branches: [claude/ovc-atualizacao-ultimos-mds-6lo95i]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirma pos-deploy que Pipeline() e Configuracoes() agora enxergam AUTOMATION
        run: |
          set +e
          SB_URL="https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          echo "===== 1) valor real de AUTOMATION agora ====="
          curl -sS "$SB_URL/rest/v1/config?select=key,value,updated_at&key=eq.AUTOMATION" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"

          echo
          echo
          echo "===== 2) exatamente a query nova do Pipeline() ====="
          curl -sS "$SB_URL/rest/v1/config?select=*&key=in.(AUTOMATION,MAX_POSTS_DIA,INTERVALO)" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"

          echo
          echo
          echo "===== 3) admin/index.html em producao ja tem o fix (nao mais select('*') puro na linha do Pipeline)? ====="
          curl -sS "https://www.ovalorcapital.com.br/admin/index.html" -o /tmp/admin_live.html -w "HTTP:%{http_code}\n"
          grep -c "in('key', \['AUTOMATION','MAX_POSTS_DIA','INTERVALO'\])" /tmp/admin_live.html
          grep -c "not('key','like','GEMINI_BUDGET_%')" /tmp/admin_live.html
