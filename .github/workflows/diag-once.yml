name: diag-once (Meta — áudio x duração)
on:
  push:
    branches: [claude/adoring-edison-2pzu14]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund >/dev/null 2>&1
          curl -fsSL -o src.mp4 "https://yntwvfcxjardzafdqanj.supabase.co/storage/v1/object/public/post-videos/link-capture/LINK_JOB__1790397167778_bxm545.mp4"
          ls -la src.mp4
          V="scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30"
          P="-x264-params scenecut=0:open_gop=0:keyint=60:min-keyint=60 -profile:v high -level 5.1 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 48000 -movflags +faststart"
          P2="-x264-params scenecut=0:open_gop=0:keyint=60:min-keyint=60 -profile:v high -level 5.1 -pix_fmt yuv420p -movflags +faststart"
          ffmpeg -loglevel error -y -i src.mp4 -vf "$V" -t 60 -c:v libx264 -preset faster -crf 26 -maxrate 2M -bufsize 4M $P2 -an g_60s_sem_audio.mp4
          ffmpeg -loglevel error -y -i src.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo -vf "$V" -map 0:v -map 1:a -t 60 -c:v libx264 -preset faster -crf 26 -maxrate 2M -bufsize 4M $P2 -c:a aac -b:a 128k -shortest h_60s_audio_mudo.mp4
          ffmpeg -loglevel error -y -ss 40 -i src.mp4 -vf "$V" -t 30 -c:v libx264 -preset faster -crf 26 -maxrate 2M -bufsize 4M $P i_30s_a_partir_40s.mp4
          ls -la *.mp4
      - name: Enviar pra Meta (sem publicar)
        shell: bash {0}
        run: |
          for f in g_60s_sem_audio.mp4 h_60s_audio_mudo.mp4 i_30s_a_partir_40s.mp4; do node .github/diag/ig_upload_test.mjs $f; done
