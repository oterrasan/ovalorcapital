name: Diagnóstico único — testar jovempan_politica e internacional pós-fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  jovempan:
    runs-on: ubuntu-latest
    steps:
      - name: Testar tipo=jovempan_politica direto em produção
        run: |
          RESP=$(curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"jovempan_politica","force":true,"count":2}')
          echo "JOVEMPAN_POLITICA: $RESP"
  internacional:
    runs-on: ubuntu-latest
    steps:
      - name: Testar tipo=internacional direto em produção
        run: |
          RESP=$(curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"internacional","force":true,"count":2}')
          echo "INTERNACIONAL: $RESP"
