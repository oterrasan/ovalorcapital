name: diag-once (admin em produção — somente leitura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.47.0 && npx playwright install --with-deps chromium
      - run: node scripts/diag/admin-prod.cjs
