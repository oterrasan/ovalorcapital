name: diag-once
on:
  push:
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Custo real dos últimos 30 dias, por PROJETO (não só por item)
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
          TEAM: "team_eHk3adfD75A2B72VzpPgQHPy"
        run: |
          python3 -u << 'PYEOF'
          import os, urllib.request, json, datetime

          TOKEN = os.environ["VT"]
          TEAM = os.environ["TEAM"]
          now = datetime.datetime.now(datetime.UTC)
          start = now - datetime.timedelta(days=30)

          url = (f"https://api.vercel.com/v1/billing/charges"
                 f"?teamId={TEAM}&from={start.strftime('%Y-%m-%d')}&to={now.strftime('%Y-%m-%d')}")
          r = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
          with urllib.request.urlopen(r, timeout=30) as resp:
              body = resp.read().decode()

          linhas = [json.loads(l) for l in body.strip().split("\n") if l.strip()]
          print(f"TOTAL_LINHAS|{len(linhas)}")
          print("---SCHEMA_DA_PRIMEIRA_LINHA_COM_CUSTO---")
          for row in linhas:
              if (row.get("BilledCost") or 0) > 0:
                  print(json.dumps(row, indent=2))
                  break

          print("---TOTAL_POR_PROJETO (tentando varios nomes de campo)---")
          por_projeto = {}
          campos_candidatos = ["ProjectName", "ProjectId", "ResourceId", "ResourceName", "x_vercel_ProjectName"]
          campo_usado = None
          for row in linhas:
              custo = row.get("BilledCost") or 0
              if custo <= 0:
                  continue
              chave = None
              for campo in campos_candidatos:
                  if row.get(campo):
                      chave = row.get(campo)
                      campo_usado = campo
                      break
              if chave is None:
                  chave = "(sem campo de projeto identificavel)"
              por_projeto[chave] = por_projeto.get(chave, 0) + custo
          print(f"CAMPO_USADO|{campo_usado}")
          for k, v in sorted(por_projeto.items(), key=lambda x: -x[1]):
              print(f"PROJETO|{k}|{v:.2f}")

          print("---TOTAL_GERAL---")
          print(f"TOTAL|{sum((r.get('BilledCost') or 0) for r in linhas):.2f}")
          PYEOF
