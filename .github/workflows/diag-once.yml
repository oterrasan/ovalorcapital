name: Diagnóstico único — testar brasilon pós-fix Gemini

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Testar tipo=brasilon direto em produção
        run: |
          RESP=$(curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"brasilon","force":true,"count":2}')
          echo "BRASIL_ON: $RESP"
