name: Diagnóstico único — tabela completa de rate limits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump completo das linhas 1-200
        run: |
          curl -s "https://ai.google.dev/gemini-api/docs/rate-limits.md.txt" -o /tmp/limits.txt
          sed -n '1,200p' /tmp/limits.txt
