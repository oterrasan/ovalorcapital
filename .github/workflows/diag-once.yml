name: Diagnóstico único — status Brasil ON

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Rodar diagnóstico Brasil ON
        run: bash scripts/one-off/check_brasilon_status.sh
