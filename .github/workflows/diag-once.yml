name: diag-once (placeholder)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Checar permissoes reais dos tokens de Instagram
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request
          import urllib.parse

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          def sb_get(path):
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/{path}",
                  headers={"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"},
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          def graph_get(path, params):
              qs = urllib.parse.urlencode(params)
              req = urllib.request.Request(f"https://graph.facebook.com/v25.0/{path}?{qs}")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode())

          accounts = sb_get("ig_accounts?select=username,active,token,ig_user_id&active=eq.true")
          print(f"Contas ativas encontradas: {len(accounts)}")
          print("---")

          for acc in accounts:
              username = acc.get("username")
              token = acc.get("token")
              ig_user_id = acc.get("ig_user_id")
              print(f"CONTA: {username} | ig_user_id: {ig_user_id or 'AUSENTE'}")
              if not token:
                  print("  -> SEM TOKEN configurado")
                  print("---")
                  continue
              print(f"::add-mask::{token}")
              code, data = graph_get("debug_token", {"input_token": token, "access_token": token})
              if code != 200:
                  print(f"  -> ERRO ao checar token (HTTP {code}): {data}")
                  print("---")
                  continue
              info = data.get("data", {})
              scopes = info.get("scopes", [])
              tipo = info.get("type", "?")
              valido = info.get("is_valid", "?")
              tem_insights = "instagram_manage_insights" in scopes
              tem_engagement = "instagram_manage_engagement" in scopes
              print(f"  tipo: {tipo} | valido: {valido}")
              print(f"  instagram_manage_insights: {'SIM' if tem_insights else 'NAO'}")
              print(f"  instagram_manage_engagement: {'SIM' if tem_engagement else 'NAO'}")
              print(f"  scopes completos: {sorted(scopes)}")
              print("---")
          PYEOF
