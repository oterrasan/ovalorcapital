name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Isolar se brasilon_url está chegando no servidor
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request

          BASE = "https://www.ovalorcapital.com.br"
          PASS = "ovc-admin-2026-secreto"

          def get_json(url, timeout=30):
              req = urllib.request.Request(url, headers={"User-Agent": "diag-isolar"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          # brasilon_url = "teste" (não é URL válida de verdade, só pra ver
          # se candidates vira 1, provando que o parâmetro chegou)
          url1 = f"{BASE}/api/run_portal?tipo=brasilon&force=true&count=1&pass={PASS}&brasilon_url=teste"
          print("Teste 1 (brasilon_url=teste, deveria dar candidates:1):")
          try:
              print(" ", get_json(url1))
          except Exception as e:
              print("  ERRO:", e)

          print()
          url2 = f"{BASE}/api/run_portal?tipo=brasilon&force=true&count=1&pass={PASS}"
          print("Teste 2 (sem brasilon_url, baseline normal):")
          try:
              print(" ", get_json(url2))
          except Exception as e:
              print("  ERRO:", e)
          PYEOF
