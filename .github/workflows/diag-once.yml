name: Diagnóstico único — por que READY não publica (hipótese video_url nulo caiu)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Confirmar backlog real de Reels presos por video_url nulo
        run: node .github/workflows/_diag_video_null_check.mjs
