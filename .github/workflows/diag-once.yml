name: Diagnóstico único (Brasil ON — redeploy identidade visual nova)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Brasil ON em produção
        working-directory: brasilon
        run: |
          npm install -g vercel@54.6.1
          set +e
          vercel --token="${{ secrets.VERCEL_TOKEN }}" --yes --prod > /tmp/deploy_out.txt 2>&1
          code=$?
          cat /tmp/deploy_out.txt
          echo "EXIT_CODE:$code"
          echo "=== homepage pos-deploy ==="
          sleep 3
          curl -s --max-time 15 "https://www.obrasilon.com.br/" | head -c 800
          exit 0
