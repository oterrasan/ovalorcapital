name: diag-once
on:
  push:
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quando os projetos "zumbi" cobraram — ainda estão ativos ou é eco antigo?
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
          TEAM: "team_eHk3adfD75A2B72VzpPgQHPy"
        run: |
          python3 -u << 'PYEOF'
          import os, urllib.request, json, datetime

          TOKEN = os.environ["VT"]
          TEAM = os.environ["TEAM"]
          now = datetime.datetime.now(datetime.UTC)
          start = now - datetime.timedelta(days=30)

          url = (f"https://api.vercel.com/v1/billing/charges"
                 f"?teamId={TEAM}&from={start.strftime('%Y-%m-%d')}&to={now.strftime('%Y-%m-%d')}")
          r = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
          with urllib.request.urlopen(r, timeout=30) as resp:
              body = resp.read().decode()
          linhas = [json.loads(l) for l in body.strip().split("\n") if l.strip()]

          ZUMBIS = {"ovalorcapital-hubx-1790751781801-QARr", "ovalorcapital-1790751782553-KLYz"}
          por_dia = {}
          for row in linhas:
              custo = row.get("BilledCost") or 0
              if custo <= 0:
                  continue
              tags = row.get("Tags") or {}
              proj = tags.get("ProjectName")
              if proj not in ZUMBIS:
                  continue
              dia = row.get("ChargePeriodStart", "")[:10]
              por_dia.setdefault(proj, {})
              por_dia[proj][dia] = por_dia[proj].get(dia, 0) + custo

          for proj, dias in por_dia.items():
              print(f"-- {proj} --")
              for dia, v in sorted(dias.items()):
                  print(f"  DIA|{proj}|{dia}|{v:.2f}")
              print(f"  ULTIMO_DIA_COM_COBRANCA|{proj}|{max(dias.keys())}")
              print(f"  PRIMEIRO_DIA_COM_COBRANCA|{proj}|{min(dias.keys())}")

          print()
          print(f"HOJE_UTC|{now.strftime('%Y-%m-%d')}")

          print()
          print("---CONFIRMAR SE AINDA EXISTEM COMO PROJETO ATIVO (busca direta por nome)---")
          for nome in ZUMBIS:
              u2 = f"https://api.vercel.com/v9/projects/{nome}?teamId={TEAM}"
              req2 = urllib.request.Request(u2, headers={"Authorization": f"Bearer {TOKEN}"})
              try:
                  with urllib.request.urlopen(req2, timeout=15) as resp2:
                      d2 = json.loads(resp2.read().decode())
                      print(f"EXISTE|{nome}|id={d2.get('id')}|link={json.dumps(d2.get('link') or {})}")
              except urllib.error.HTTPError as e:
                  print(f"NAO_EXISTE_OU_ERRO|{nome}|HTTP_{e.code}|{e.read().decode()[:200]}")
          PYEOF
