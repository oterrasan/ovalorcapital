name: diag-once (pipeline stall check)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Investigar volume de publicação por dia/canal + erros recentes + orçamento Gemini
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, datetime

          BASE = "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1"
          KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          def get(path, headers_extra=None):
              url = BASE + path
              req = urllib.request.Request(url)
              req.add_header("apikey", KEY)
              req.add_header("Authorization", "Bearer " + KEY)
              if headers_extra:
                  for k, v in headers_extra.items():
                      req.add_header(k, v)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode())

          def get_all(path_base, select, order, days_back):
              cutoff = (datetime.datetime.utcnow() - datetime.timedelta(days=days_back)).strftime("%Y-%m-%dT%H:%M:%S")
              rows = []
              offset = 0
              page = 1000
              while True:
                  qs = urllib.parse.urlencode({
                      "select": select,
                      "created_at": f"gte.{cutoff}",
                      "order": order,
                      "limit": str(page),
                      "offset": str(offset),
                  })
                  chunk = get(f"{path_base}?{qs}")
                  rows.extend(chunk)
                  if len(chunk) < page:
                      break
                  offset += page
                  if offset > 20000:
                      break
              return rows

          print("=== VOLUME DE POSTS POR DIA (BRT) x publish_method — últimos 5 dias ===")
          posts = get_all("/posts", "created_at,publish_method,status", "created_at.asc", 5)
          print(f"total de posts brutos (criados nos ultimos 5 dias): {len(posts)}")
          byday = {}
          for p in posts:
              try:
                  dt = datetime.datetime.fromisoformat(p["created_at"].replace("Z", "+00:00"))
              except Exception:
                  continue
              dt_brt = dt - datetime.timedelta(hours=3)
              day = dt_brt.strftime("%Y-%m-%d")
              method = p.get("publish_method") or "null"
              byday.setdefault(day, {}).setdefault(method, 0)
              byday[day][method] += 1
          for day in sorted(byday.keys()):
              print(f"--- {day} (BRT) ---")
              total_day = sum(byday[day].values())
              for method, count in sorted(byday[day].items(), key=lambda x: -x[1]):
                  print(f"   {method}: {count}")
              print(f"   TOTAL DO DIA: {total_day}")

          print()
          print("=== LOGS DE ERRO/AVISO — últimas 72h ===")
          cutoff72 = (datetime.datetime.utcnow() - datetime.timedelta(hours=72)).strftime("%Y-%m-%dT%H:%M:%S")
          qs = urllib.parse.urlencode({
              "select": "created_at,level,message",
              "created_at": f"gte.{cutoff72}",
              "level": "in.(error,warn)",
              "order": "created_at.desc",
              "limit": "150",
          })
          logs = get(f"/logs?{qs}")
          print(f"total de linhas error/warn nas ultimas 72h: {len(logs)}")
          # agrupa por mensagem truncada pra ver padrao repetido
          from collections import Counter
          c = Counter()
          for l in logs:
              msg = (l.get("message") or "")[:120]
              c[msg] += 1
          print("--- top 20 mensagens mais repetidas ---")
          for msg, n in c.most_common(20):
              print(f"  [{n}x] {msg}")
          print("--- 15 mais recentes, completas ---")
          for l in logs[:15]:
              print(f"  {l.get('created_at')} [{l.get('level')}] {l.get('message')}")

          print()
          print("=== ORCAMENTO GEMINI — contagem por dia (ultimos 5 dias) ===")
          qs2 = urllib.parse.urlencode({
              "select": "key",
              "key": "like.GEMINI_BUDGET_%",
              "limit": "1000",
          })
          # pagina manualmente por nao ter created_at proprio nesse padrao (data embutida na key)
          all_keys = []
          offset = 0
          while True:
              qsx = urllib.parse.urlencode({
                  "select": "key",
                  "key": "like.GEMINI_BUDGET_%",
                  "limit": "1000",
                  "offset": str(offset),
              })
              chunk = get(f"/config?{qsx}")
              all_keys.extend(chunk)
              if len(chunk) < 1000:
                  break
              offset += 1000
              if offset > 50000:
                  break
          print(f"total de linhas GEMINI_BUDGET_* no banco: {len(all_keys)}")
          bykey_day = Counter()
          for row in all_keys:
              k = row.get("key", "")
              parts = k.split("_")
              # formato: GEMINI_BUDGET_{YYYYMMDD}_{modelo}__{ts}_{rand}
              if len(parts) >= 3:
                  bykey_day[parts[2][:8]] += 1
          print("--- contagem por dia (YYYYMMDD) ---")
          for day, n in sorted(bykey_day.items()):
              print(f"  {day}: {n}")

          print()
          print("=== config AUTOMATION / flags relevantes ===")
          for key in ["AUTOMATION", "IG_AUTOMATION_ENABLED", "REELS_AUTOMATION_ENABLED", "BON_IG_ENABLED"]:
              qsf = urllib.parse.urlencode({"select": "key,value", "key": f"eq.{key}"})
              r = get(f"/config?{qsf}")
              print(f"  {key}: {r}")
          PYEOF
