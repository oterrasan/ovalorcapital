name: Diagnóstico único (Brasil ON — deploy real na Vercel + domínio)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  deploy_brasilon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Brasil ON como projeto novo na Vercel (a partir de brasilon/)
        working-directory: brasilon
        run: |
          npm install -g vercel@54.6.1
          echo "=== Deploy (cria projeto novo 'brasilon' automaticamente, sem --scope) ==="
          vercel --token="${{ secrets.VERCEL_TOKEN }}" --yes --prod 2>&1 | tee /tmp/deploy_out.txt
          echo "=== URL de produção capturada ==="
          tail -5 /tmp/deploy_out.txt

      - name: Adicionar domínio obrasilon.com.br ao projeto
        working-directory: brasilon
        run: |
          echo "=== Tentativa: vercel domains add <dominio> <projeto> ==="
          vercel domains add obrasilon.com.br brasilon --token="${{ secrets.VERCEL_TOKEN }}" --yes 2>&1 || true
          echo "=== Tentativa www ==="
          vercel domains add www.obrasilon.com.br brasilon --token="${{ secrets.VERCEL_TOKEN }}" --yes 2>&1 || true
          echo "=== Inspecionar domínio (mostra o que falta configurar no DNS) ==="
          vercel domains inspect obrasilon.com.br --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 || true

      - name: Listar projetos (confirmação)
        working-directory: brasilon
        run: |
          vercel project ls --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 || true
