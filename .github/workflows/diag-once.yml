name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps (sharp) e fonte oficial + ffmpeg
        run: |
          npm install sharp@0.33 axios@1 --no-save --silent
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Testar sombra mais larga/suave (mesmo video horizontal de antes, sem publicar)
        run: |
          node << 'NODEEOF'
          const axios = require("axios");
          const { spawn } = require("child_process");
          const fs = require("fs");

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
          const ARTIGO_URL = "https://ndmais.com.br/seguranca/menina-atacada-por-abelhas-esta-internada-em-cti-apos-ser-atingida-por-enxame-em-frente-a-escola-mais-de-100-ferroadas/";
          const VIDEO_URL = "https://static.ndmais.com.br/2026/09/Veja-o-momento-em-que-motoqueiro-salva-adolescente-de-12-anos-de-ataque-de-abelhas-em-MG.mp4";

          function run(cmd, args) {
            return new Promise((resolve, reject) => {
              const child = spawn(cmd, args, { stdio: ["ignore", "pipe", "pipe"] });
              let out = "", err = "";
              child.stdout.on("data", d => out += d);
              child.stderr.on("data", d => err += d);
              child.on("exit", code => code === 0 ? resolve(out) : reject(new Error(`${cmd} exit ${code}: ${err.slice(-500)}`)));
            });
          }

          (async () => {
            console.log("=== 1) Baixando o MESMO video horizontal de teste ===");
            const videoRes = await axios.get(VIDEO_URL, { responseType: "arraybuffer", timeout: 60000, headers: { "User-Agent": UA, "Referer": ARTIGO_URL } });
            fs.writeFileSync("input-4.mp4", Buffer.from(videoRes.data));
            console.log("baixado:", fs.statSync("input-4.mp4").size, "bytes");

            const job = {
              title: "Menina é atacada por enxame de abelhas em frente à escola",
              body: "A criança levou mais de 100 ferroadas e está internada em estado grave na CTI de um hospital. O Corpo de Bombeiros foi acionado e concluiu a ocorrência após a retirada do enxame do local.",
              source_url: VIDEO_URL,
              template_version: "ovc-reels-2026-09-v5-sombra-mais-larga"
            };
            fs.writeFileSync("job-4.json", JSON.stringify({ job }));

            console.log("\n=== 2) Renderizando com o script REAL (sombra mais larga/suave) ===");
            const renderOut = await run("node", ["scripts/render-instagram-reel.mjs", "job-4.json", "input-4.mp4", "output-4.mp4", "overlay-4.png"]);
            console.log(renderOut);

            console.log("\n=== 3) Crop AMPLIADO da zona de transicao inteira (y=560 a y=1050 de 1920) ===");
            const dur = parseFloat(await run("ffprobe", ["-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", "output-4.mp4"]));
            console.log("duracao final (s):", dur);
            const tempos = [1, 5, 10, Math.max(15, dur / 3), Math.max(20, dur / 2)];
            for (let f = 0; f < tempos.length; f++) {
              await run("ffmpeg", ["-y", "-ss", String(tempos[f]), "-i", "output-4.mp4", "-frames:v", "1", "-vf", "crop=1080:490:0:560,scale=560:-1,eq=brightness=0.08", `crop-4-${f}.jpg`]);
              const b64 = fs.readFileSync(`crop-4-${f}.jpg`).toString("base64");
              console.log(`\n===CROP_4_${f}_START===`);
              console.log(b64);
              console.log(`===CROP_4_${f}_END===`);
            }

            console.log("\n=== 4) Frame completo (visao geral, sem realce) ===");
            await run("ffmpeg", ["-y", "-ss", "10", "-i", "output-4.mp4", "-frames:v", "1", "-vf", "scale=460:-1", "frame-4-full.jpg"]);
            const bFull = fs.readFileSync("frame-4-full.jpg").toString("base64");
            console.log("\n===FRAME_4_FULL_START===");
            console.log(bFull);
            console.log("===FRAME_4_FULL_END===");

            console.log("\n=== FIM DO TESTE — nada publicado ===");
          })();
          NODEEOF
