name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Escopo real - quantas imagens grandes em uploads/ sao capa de post publicado
        run: |
          set -e
          cat > /tmp/scan.py << 'PYEOF'
          import urllib.request, json

          SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          def req(url, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(url, data=data, method=method, headers={
                  "apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"
              })
              with urllib.request.urlopen(r, timeout=20) as resp:
                  return json.loads(resp.read().decode())

          files = req(f"{SUPABASE_URL}/storage/v1/object/list/posts-images", "POST", {"prefix": "uploads", "limit": 1000})
          big = [f for f in files if (f.get("metadata") or {}).get("size", 0) > 400000]
          print(f"TOTAL_ARQUIVOS_EM_UPLOADS: {len(files)}")
          print(f"ARQUIVOS_ACIMA_DE_400KB: {len(big)}")
          for f in sorted(big, key=lambda x: -(x.get("metadata") or {}).get("size", 0))[:30]:
              print(f"  {f['name']}  {(f.get('metadata') or {}).get('size',0)} bytes")

          big_names = set(f["name"] for f in big)

          offset = 0
          afetados = []
          while True:
              posts = req(f"{SUPABASE_URL}/rest/v1/posts?status=eq.publicado&imagem=like.*posts-images/uploads/*&select=id,titulo,imagem&order=created_at.desc&limit=1000&offset={offset}")
              if not posts:
                  break
              for p in posts:
                  nome = p["imagem"].rsplit("/", 1)[-1]
                  if nome in big_names:
                      afetados.append((p["id"], nome, p["titulo"]))
              if len(posts) < 1000:
                  break
              offset += 1000

          print(f"POSTS_PUBLICADOS_AFETADOS: {len(afetados)}")
          for pid, nome, titulo in afetados:
              print(f"  {pid}  {nome}  {titulo[:60]}")
          PYEOF
          python3 /tmp/scan.py
