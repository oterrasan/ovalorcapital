name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Investigar o erro 400 da chamada com url manual
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.error
          import urllib.parse

          BASE = "https://www.ovalorcapital.com.br"
          PASS = "ovc-admin-2026-secreto"
          URL_MATERIA = "https://baccinoticias.com.br/influenciador-e-sequestrado-e-revela-detalhes-chocantes-veja/"

          url_run = (
              f"{BASE}/api/run_portal?tipo=brasilon&force=true&count=1&pass={PASS}"
              f"&url={urllib.parse.quote(URL_MATERIA, safe='')}"
          )
          print("URL chamada:", url_run)
          req = urllib.request.Request(url_run, headers={"User-Agent": "diag-video-bacci"})
          try:
              with urllib.request.urlopen(req, timeout=70) as r:
                  print("HTTP OK:", r.status)
                  print(r.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"HTTP ERROR {e.code}")
              corpo = e.read().decode("utf-8", errors="replace")
              print("CORPO DO ERRO:", corpo)
          except Exception as e:
              print(f"ERRO GERAL: {e}")
          PYEOF
