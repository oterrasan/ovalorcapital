name: Diagnóstico único — curtida automática de collabs por perfil (24/09)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Ver padrão real de accept/like por perfil
        run: node .github/workflows/_diag_collab_likes.mjs
