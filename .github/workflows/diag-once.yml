name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checar se o Googlebot consegue acessar o site de verdade (cloaking / bloqueio / auth wall)
        run: |
          echo "=== 1) HOMEPAGE com navegador normal ==="
          curl -sS --max-time 15 -D /tmp/h1.txt -o /tmp/b1.html -w "HTTP:%{http_code} TIME:%{time_total}s SIZE:%{size_download}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0" \
            "https://www.ovalorcapital.com.br/"
          echo "-- headers relevantes --"
          grep -iE "^(set-cookie|x-robots-tag|cache-control|x-vercel|location|www-authenticate)" /tmp/h1.txt || echo "(nenhum header suspeito)"
          echo "-- primeiros 300 chars do corpo --"
          head -c 300 /tmp/b1.html
          echo ""
          echo "-- contem 'Vercel Authentication' ou 'Authentication Required'? --"
          grep -io "vercel authentication\|authentication required\|_vercel_sso" /tmp/b1.html || echo "NAO — pagina normal"
          echo "-- tem meta noindex? --"
          grep -io '<meta[^>]*robots[^>]*>' /tmp/b1.html || echo "nao achei meta robots (ok = index,follow implicito)"

          echo ""
          echo "=== 2) HOMEPAGE finguindo ser o Googlebot ==="
          curl -sS --max-time 15 -D /tmp/h2.txt -o /tmp/b2.html -w "HTTP:%{http_code} TIME:%{time_total}s SIZE:%{size_download}\n" \
            -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
            "https://www.ovalorcapital.com.br/"
          echo "-- headers relevantes --"
          grep -iE "^(set-cookie|x-robots-tag|cache-control|x-vercel|location|www-authenticate)" /tmp/h2.txt || echo "(nenhum header suspeito)"
          echo "-- tamanho do corpo recebido pelo Googlebot vs navegador normal --"
          wc -c /tmp/b2.html /tmp/b1.html

          echo ""
          echo "=== 3) Um artigo real, Googlebot ==="
          curl -sS --max-time 15 -D /tmp/h3.txt -o /tmp/b3.html -w "HTTP:%{http_code} TIME:%{time_total}s SIZE:%{size_download}\n" \
            -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
            "https://www.ovalorcapital.com.br/esportes/confira-as-odds-spreads-e-totais-para-todos-os-jogos-da-687e4736/"
          grep -iE "^(set-cookie|x-robots-tag|location|www-authenticate)" /tmp/h3.txt || echo "(nenhum header suspeito)"
          grep -io "vercel authentication\|authentication required" /tmp/b3.html || echo "NAO — pagina normal"

          echo ""
          echo "=== 4) robots.txt e sitemap.xml AGORA (nao reaproveitar check antigo) ==="
          curl -sS --max-time 10 "https://www.ovalorcapital.com.br/robots.txt"
          echo ""
          curl -sS --max-time 15 "https://www.ovalorcapital.com.br/sitemap.xml" | grep -o "<lastmod>[^<]*</lastmod>" | sort -r | head -3

      - name: Checar banco (Supabase) - conteudo realmente fresco chegando
        env:
          SB_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          echo "=== Supabase respondendo? (tempo de resposta) ==="
          curl -sS --max-time 15 -o /dev/null -w "HTTP:%{http_code} TIME:%{time_total}s\n" \
            "$SB_URL/rest/v1/posts?select=id&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"

          echo "=== Post publicado mais recente (hora de agora) ==="
          curl -sS --max-time 15 "$SB_URL/rest/v1/posts?select=titulo,published_at&status=eq.publicado&order=published_at.desc&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"
          echo ""
          date -u

      - name: Checar ultimos deploys de producao (Vercel via GitHub Actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== ultimas 5 execucoes do Deploy Production ==="
          gh api "repos/oterrasan/ovalorcapital/actions/workflows/265469199/runs?per_page=5" \
            --jq '.workflow_runs[] | "\(.created_at) status=\(.status) conclusion=\(.conclusion) run_id=\(.id)"'
