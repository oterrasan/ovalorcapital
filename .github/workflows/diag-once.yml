name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar mecanismo real de prioridade + proporção 60/40
        env:
          SUPABASE_URL: https://yntwvfcxjardzafdqanj.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, urllib.parse
          from datetime import datetime, timedelta, timezone

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}

          def get(path):
              req = urllib.request.Request(f"{url}/rest/v1/{path}", headers=headers)
              return urllib.request.urlopen(req, timeout=25).read()

          def count(path):
              req = urllib.request.Request(f"{url}/rest/v1/{path}", headers={**headers, "Prefer": "count=exact", "Range": "0-0"})
              res = urllib.request.urlopen(req, timeout=25)
              cr = res.headers.get("content-range", "")
              return int(cr.split("/")[-1]) if "/" in cr else None

          brt_now = datetime.now(timezone.utc) - timedelta(hours=3)
          dia_inicio_brt = brt_now.replace(hour=0, minute=0, second=0, microsecond=0)
          inicio_iso = (dia_inicio_brt + timedelta(hours=3)).isoformat().replace("+00:00", "Z")
          print(f"hoje BRT: {brt_now.date()} | início do dia em UTC: {inicio_iso}")

          # total feed hoje (posts.ig_id preenchido, updated_at >= inicio do dia BRT)
          q_feed = urllib.parse.quote(f"ig_id=not.is.null&updated_at=gte.{inicio_iso}", safe="=&.")
          total_feed = count(f"posts?{q_feed}")
          print(f"total_feed (posts.ig_id) hoje: {total_feed}")

          # total reels hoje (contador config REELS_AUTO_COUNT_{dia}__%)
          dia_str = brt_now.strftime("%Y%m%d")
          q_reels = urllib.parse.quote(f"key=ilike.REELS_AUTO_COUNT_{dia_str}__%", safe="=&.")
          total_reels = count(f"config?{q_reels}")
          print(f"total_reels (config REELS_AUTO_COUNT_{dia_str}__%) hoje: {total_reels}")

          total = (total_feed or 0) + (total_reels or 0)
          print(f"\ntotal publicado hoje (feed+reels): {total}")
          if total >= 3:
              feed_share = (total_feed or 0) / total
              print(f"fatia de feed: {feed_share*100:.1f}% (meta: feed <= 40%)")
              print(f"decisão de _igAutoFeedDeveEsperarReels(): {'ESPERA (pula ig_auto_publish)' if feed_share >= 0.40 else 'segue normal'}")
          else:
              print("amostra pequena (<3) — throttle ainda não entra em ação hoje")

          print("\n=== posts com vídeo real (não YouTube) e template de Reel ativo, não esgotado — agora RESERVADOS pro feed ===")
          data = json.loads(get("posts?select=id,titulo,video_url,metrics,ig_id&video_url=not.is.null&order=updated_at.desc&limit=200"))
          reservados = 0
          sem_template = 0
          exhausted = 0
          youtube = 0
          for p in data:
              vurl = p.get("video_url") or ""
              if "youtube" in vurl or "youtu.be" in vurl:
                  youtube += 1
                  continue
              m = p.get("metrics") or {}
              if isinstance(m, str):
                  try:
                      m = json.loads(m)
                  except Exception:
                      m = {}
              tpl = m.get("instagram_reel_template")
              if not tpl:
                  sem_template += 1
              elif tpl.get("exhausted"):
                  exhausted += 1
              else:
                  reservados += 1
          print(f"total com video_url (últimos 200): {len(data)}")
          print(f"  reservados pro Reel agora (template ativo, não esgotado): {reservados}")
          print(f"  sem template nenhum (continuam elegíveis pro feed): {sem_template}")
          print(f"  esgotados (voltaram a ser elegíveis pro feed): {exhausted}")
          print(f"  YouTube embutido (nunca reservado): {youtube}")
          PYEOF
