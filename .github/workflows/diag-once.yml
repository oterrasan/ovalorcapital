name: Diagnóstico único (placeholder) — inspecionar URL real com video confirmado por Roberto
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: "Consultar post real (Vovo tiktoker, id 30e67c20) - video_url e metrics"
        run: |
          cat > _diag_post.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";

          const SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co";
          const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40";
          const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

          async function main() {
            const { data, error } = await supabase
              .from("posts")
              .select("id,titulo,video_url,imagem,metrics,status,approved,publish_method,created_at,published_at,updated_at,user_tags")
              .ilike("titulo", "%tiktoker%")
              .limit(5);
            if (error) { console.error("ERRO SUPABASE:", error); process.exit(1); }
            console.log(`posts encontrados: ${data.length}`);
            for (const p of data) {
              console.log(`\n=== POST ${p.id} ===`);
              console.log(`titulo: ${p.titulo}`);
              console.log(`status: ${p.status} | approved: ${p.approved} | publish_method: ${p.publish_method}`);
              console.log(`user_tags: ${p.user_tags}`);
              console.log(`created_at: ${p.created_at} | published_at: ${p.published_at} | updated_at: ${p.updated_at}`);
              console.log(`imagem: ${p.imagem}`);
              console.log(`video_url: ${p.video_url}`);
              console.log(`metrics: ${JSON.stringify(p.metrics, null, 2)}`);
            }
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });
          JSEOF
          node _diag_post.mjs
          rm -f _diag_post.mjs
