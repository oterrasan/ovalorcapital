name: Diagnóstico único (por que o vídeo falha ao carregar)

on:
  workflow_dispatch:
  push:
    branches: [claude/diag-video-nao-aparece]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright + Chromium
        run: |
          npm init -y --silent >/dev/null
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
      - name: Capturar a URL do vídeo + o request real (status/erro) de quem carrega ele
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const failed = [];
            const responses = [];
            page.on('requestfailed', req => failed.push(req.url() + ' :: ' + (req.failure() && req.failure().errorText)));
            page.on('response', async res => {
              if (res.status() >= 400) responses.push(res.status() + ' :: ' + res.url());
            });
            await page.goto('https://www.ovalorcapital.com.br/tecnologia/robo-chines-supera-recorde-de-usain-bolt-nos-100-metros-7391ed1b/', { waitUntil: 'networkidle', timeout: 20000 });
            await page.waitForTimeout(2500);
            const videoHtml = await page.locator('video.ovc-art-video').first().evaluate(el => el.outerHTML).catch(() => 'NAO_ENCONTRADO_video.ovc-art-video');
            const rawHtml = await page.content();
            const preloadMatch = rawHtml.match(/window\.__OVC_ARTICLE__\s*=\s*(\{[\s\S]*?\});/);
            console.log('=== <video class=ovc-art-video> outerHTML ===');
            console.log(videoHtml);
            console.log('=== preload __OVC_ARTICLE__.video (campo cru) ===');
            if (preloadMatch) {
              try {
                const obj = JSON.parse(preloadMatch[1]);
                console.log(JSON.stringify({ video: obj.video, imagem: obj.imagem }, null, 2));
              } catch (e) { console.log('parse falhou: ' + e.message); }
            } else console.log('preload NAO encontrado no HTML');
            console.log('=== RESPONSES >= 400 ===');
            console.log(responses.join('\n') || '(nenhum)');
            console.log('=== REQUESTS FALHOS (requestfailed) ===');
            console.log(failed.join('\n') || '(nenhum)');
            await browser.close();
          })().catch(e => { console.error('FALHA PLAYWRIGHT:', e.message); process.exit(1); });
          "
