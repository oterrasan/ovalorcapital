name: Diagnóstico único — erro real do likeMedia (24/09, rodada 2)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Ver erro real que a Meta devolve pro likeMedia
        run: node .github/workflows/_diag_like_error.mjs
