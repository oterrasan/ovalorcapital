name: Diagnóstico único (placeholder)

on:
  push:
    paths:
      - ".github/workflows/diag-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Extrair JSON-LD VideoObject completo do G1
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import re
          import json

          url = "https://g1.globo.com/ms/mato-grosso-do-sul/video/em-video-e-possivel-escutar-desespero-de-vitima-durante-sequestro-em-bonito-14938018.ghtml"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml"
          })
          with urllib.request.urlopen(req, timeout=25) as r:
              html = r.read().decode("utf-8", errors="replace")

          # Pega todos os blocos <script type="application/ld+json">
          blocks = re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>', html, re.S)
          print(f"total de blocos ld+json: {len(blocks)}")
          for i, b in enumerate(blocks):
              try:
                  data = json.loads(b)
              except Exception as e:
                  print(f"[{i}] erro parse: {e}")
                  continue
              items = data if isinstance(data, list) else [data]
              for item in items:
                  if isinstance(item, dict) and item.get("@type") == "VideoObject":
                      print(f"[{i}] VideoObject completo:")
                      print(json.dumps(item, indent=2, ensure_ascii=False)[:2000])
                      print("=====")

          # também tenta achar mp4 mais próximo do maior bitrate (não só o primeiro match)
          mp4s = re.findall(r'https?://[^"\'\s]+\.mp4[^"\'\s]*', html)
          print()
          print(f"total de urls .mp4 no HTML: {len(mp4s)}")
          for m in mp4s[:10]:
              print(" -", m)
          PYEOF
