name: Diagnóstico único (placeholder) — inspecionar URL real com video confirmado por Roberto
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: "Remover video (ja com overlay queimado) do post 30e67c20 via API real de producao"
        run: |
          cat > _diag_fix.mjs << 'JSEOF'
          import axios from "axios";

          const BASE = "https://www.ovalorcapital.com.br";
          const TOKEN = "ovc-admin-2026-secreto";
          const POST_ID = "30e67c20-f96e-4eef-ab71-0cb6b3272abe";

          async function main() {
            console.log("Chamando action=reels_set_source com video_url vazio (remove do site E cancela o Reel pendente, ja que o arquivo fonte esta contaminado com overlay queimado)...");
            const res = await axios.post(`${BASE}/api/manage`, {
              action: "reels_set_source",
              token: TOKEN,
              post_id: POST_ID,
              video_url: ""
            }, { timeout: 15000, validateStatus: () => true });
            console.log(`HTTP ${res.status}`);
            console.log(JSON.stringify(res.data, null, 2));

            // confere direto no supabase que realmente sumiu
            const { createClient } = await import("@supabase/supabase-js");
            const supabase = createClient(
              "https://yntwvfcxjardzafdqanj.supabase.co",
              "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
            );
            const { data } = await supabase.from("posts").select("video_url,metrics").eq("id", POST_ID).maybeSingle();
            console.log("\n=== CONFIRMACAO DIRETA NO BANCO ===");
            console.log(`video_url agora: ${data?.video_url}`);
            console.log(`metrics agora: ${JSON.stringify(data?.metrics, null, 2)}`);
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.response?.data || e?.message || e); process.exit(1); });
          JSEOF
          node _diag_fix.mjs
          rm -f _diag_fix.mjs
