name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: pegar 6 artigos recentes reais e confirmar H1/corpo reais no HTML cru
        run: |
          curl -s "https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&limit=6" -o /tmp/recentes.json
          python3 << 'PYEOF'
          import json
          with open('/tmp/recentes.json') as f:
              d = json.load(f)
          posts = d.get('posts', [])
          urls = []
          for p in posts[:6]:
              url = p.get('url') or ''
              if url:
                  urls.append("https://www.ovalorcapital.com.br" + url)
          with open('/tmp/urls.txt', 'w') as f:
              f.write("\n".join(urls))
          print("\n".join(urls))
          PYEOF
      - name: baixar cada pagina e confirmar que o conteudo real esta no HTML servido pelo servidor (sem JS)
        run: |
          i=0
          while read -r url; do
            i=$((i+1))
            echo "=================================================="
            echo "ARTIGO $i: $url"
            echo "=================================================="
            curl -s "$url" -o /tmp/art_$i.html
            python3 << PYEOF
          import re
          with open('/tmp/art_$i.html', encoding='utf-8', errors='replace') as f:
              html = f.read()
          m = re.search(r'<title>(.*?)</title>', html, re.S)
          print("TITLE:", (m.group(1).strip() if m else "AUSENTE")[:200])
          m = re.search(r'<h1[^>]*>(.*?)</h1>', html, re.S)
          h1 = re.sub('<[^>]+>', '', m.group(1)).strip() if m else "AUSENTE"
          print("H1:", h1[:200])
          print("H1 ainda diz so o nome da categoria (bug antigo)?:", h1.strip() in ["Política","Economia","Finanças","Negócios","Tecnologia","Internacional","Indústria","Família","Esportes","Brasil On","Giro"])
          print("ainda tem a secao .ovc-section-hero no HTML?:", "ovc-section-hero" in html)
          print("ainda tem o texto fixo de template (bug antigo)?:", "Cobertura" in html and "leitura organizada" in html)
          paras = re.findall(r'<p[^>]*>(.*?)</p>', html, re.S)
          texto_paras = []
          for p in paras:
              t = re.sub('<[^>]+>', ' ', p)
              t = re.sub(r'\s+', ' ', t).strip()
              if len(t) > 30:
                  texto_paras.append(t)
          total_chars = sum(len(t) for t in texto_paras)
          print("QTD PARAGRAFOS REAIS (>30 chars):", len(texto_paras))
          print("TOTAL CHARS DE TEXTO:", total_chars)
          print("--- PRIMEIROS 2 PARAGRAFOS ---")
          for t in texto_paras[:2]:
              print("  >", t[:300])
          PYEOF
          done < /tmp/urls.txt
