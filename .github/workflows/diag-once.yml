name: Diagnóstico único (Brasil ON — associar domínio)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  domain_brasilon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3

      - name: Associar obrasilon.com.br ao projeto brasilon
        working-directory: brasilon
        run: |
          npm install -g vercel@54.6.1
          echo "=== add obrasilon.com.br ==="
          vercel domains add obrasilon.com.br brasilon --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 || true
          echo "=== add www.obrasilon.com.br ==="
          vercel domains add www.obrasilon.com.br brasilon --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 || true
          echo "=== inspect obrasilon.com.br (mostra os DNS records exatos que a Vercel espera) ==="
          vercel domains inspect obrasilon.com.br --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 || true
          echo "=== inspect www.obrasilon.com.br ==="
          vercel domains inspect www.obrasilon.com.br --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 || true
