name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Estado final da fila de reels
        run: |
          cat > _diag_final.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";

          const supabase = createClient(
            "https://yntwvfcxjardzafdqanj.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          );

          async function main() {
            console.log("=== 1) Post da churrasqueira — estado após o teste real ===");
            const { data: p } = await supabase.from("posts").select("metrics").eq("id", "ae62a0f9-6e56-463e-bda8-18c25db2b52f").single();
            const m = typeof p.metrics === "string" ? JSON.parse(p.metrics) : p.metrics;
            console.log(JSON.stringify(m.instagram_reel_template, null, 2));

            console.log("\n=== 2) Todos os posts com instagram_reel_template (visão geral da fila real) ===");
            const { data: all } = await supabase
              .from("posts")
              .select("id,titulo,status,metrics,updated_at")
              .not("metrics->instagram_reel_template", "is", null)
              .order("updated_at", { ascending: true });
            for (const post of all || []) {
              const mt = typeof post.metrics === "string" ? JSON.parse(post.metrics) : post.metrics;
              const t = mt?.instagram_reel_template || {};
              console.log(`\n${post.titulo?.slice(0, 60)}`);
              console.log(`  status:${t.status} attempts:${t.attempts} exhausted:${!!t.exhausted} last_error:${(t.last_error || "").slice(0, 80)}`);
            }
          }

          main().catch(e => { console.error("ERRO FATAL:", e); process.exit(1); });

          JSEOF
          node _diag_final.mjs
          rm -f _diag_final.mjs
