name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Estado real da fila de Reels (backlog, status, tentativas, erros)
        env:
          SUPABASE_URL: https://yntwvfcxjardzafdqanj.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os
          from collections import Counter
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          req = urllib.request.Request(
              f"{url}/rest/v1/posts?select=id,titulo,video_url,metrics,status,published_at,updated_at&video_url=not.is.null&order=updated_at.desc&limit=200",
              headers={"apikey": key, "Authorization": f"Bearer {key}"}
          )
          data = json.loads(urllib.request.urlopen(req, timeout=25).read())
          print(f"total com video_url (até 200 mais recentes): {len(data)}")
          status_count = Counter()
          erros = []
          for p in data:
              m = p.get("metrics") or {}
              if isinstance(m, str):
                  try:
                      m = json.loads(m)
                  except Exception:
                      m = {}
              reel = m.get("instagram_reel_template") or {}
              st = reel.get("status") or "SEM_TEMPLATE"
              status_count[st] += 1
              if reel.get("last_error"):
                  erros.append((p["id"][:8], p["titulo"][:45], reel.get("attempts"), reel.get("last_error")[:150]))
          print("\n=== contagem por status (instagram_reel_template.status) ===")
          for k, v in status_count.most_common():
              print(f"{k}: {v}")
          print(f"\n=== {len(erros)} com last_error registrado (mostrando até 15) ===")
          for eid, title, attempts, err in erros[:15]:
              print(f"- {eid} | tentativas={attempts} | {title!r}")
              print(f"  erro: {err}")
          PYEOF

      - name: Runs recentes do instagram-auto.yml — quantas tentaram render de verdade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS "https://api.github.com/repos/oterrasan/ovalorcapital/actions/workflows/instagram-auto.yml/runs?per_page=30" \
            -H "Authorization: Bearer ${GH_TOKEN}" > runs.json
          python3 << 'PYEOF'
          import json
          data = json.load(open("runs.json"))
          for r in data["workflow_runs"]:
              print(r["id"], r["event"], r["status"], r.get("conclusion"), r["created_at"])
          PYEOF
