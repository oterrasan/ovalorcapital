name: diag-once (Reels pendentes — descarte e remontagem REAIS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== EXECUÇÃO REAL (dry:false) =="
          curl -s -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "x-admin-password: $PASS" \
            -d '{"action":"reels_regenerar_nao_publicados","dry":false}' | python3 -m json.tool
        env:
          PASS: "ovc-admin-2026-secreto"
