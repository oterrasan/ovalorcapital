name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: medir espaço real do bucket post-images + amostras reais de imagem
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, datetime

          SB_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          def req(url, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(url, data=data, method=method, headers={
                  "apikey": SB_KEY,
                  "Authorization": f"Bearer {SB_KEY}",
                  "Content-Type": "application/json",
              })
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return json.loads(resp.read().decode())

          # 1) Amostras reais do campo "imagem" de posts com mais de 90 dias, pra entender o formato real
          cutoff = (datetime.datetime.now(datetime.UTC) - datetime.timedelta(days=90)).strftime("%Y-%m-%dT%H:%M:%S")
          amostra = req(f"{SB_URL}/rest/v1/posts?select=id,imagem&status=eq.publicado&published_at=lt.{cutoff}&limit=15&order=published_at.desc")
          print("=== AMOSTRA REAL DE imagem (15 posts >90 dias) ===")
          for p in amostra:
              print(f"  id={p.get('id')} imagem={p.get('imagem')}")

          # 2) Contagem por padrão de host na URL da imagem, pra entender a distribuição real
          hosts = {}
          offset = 0
          total_old = 0
          while True:
              url = f"{SB_URL}/rest/v1/posts?select=imagem&status=eq.publicado&published_at=lt.{cutoff}&limit=1000&offset={offset}"
              batch = req(url)
              if not batch:
                  break
              for p in batch:
                  total_old += 1
                  img = (p.get("imagem") or "").strip()
                  if not img:
                      key = "(vazio)"
                  elif "supabase.co" in img:
                      key = "supabase.co (algum bucket)"
                  else:
                      try:
                          key = img.split("/")[2]
                      except Exception:
                          key = "(formato estranho)"
                  hosts[key] = hosts.get(key, 0) + 1
              offset += 1000
              if len(batch) < 1000:
                  break
          print(f"\n=== DISTRIBUIÇÃO REAL DE HOST DA IMAGEM ({total_old} posts >90 dias) ===")
          for k, v in sorted(hosts.items(), key=lambda x: -x[1])[:25]:
              print(f"  {v:5d}  {k}")

          # 3) Tamanho real do bucket post-images (prefix era obrigatório, faltava)
          total_bytes = 0
          total_files = 0
          offset = 0
          page = 1000
          erro_list = None
          while True:
              body = {"prefix": "", "limit": page, "offset": offset, "sortBy": {"column": "name", "order": "asc"}}
              try:
                  items = req(f"{SB_URL}/storage/v1/object/list/post-images", method="POST", body=body)
              except urllib.error.HTTPError as e:
                  erro_list = f"HTTP {e.code}: {e.read().decode()[:300]}"
                  break
              if not items:
                  break
              for it in items:
                  meta = it.get("metadata") or {}
                  sz = meta.get("size") or 0
                  total_bytes += sz
                  total_files += 1
              offset += page
              if len(items) < page:
                  break
              if offset > 200000:
                  print("...parou em 200k arquivos pra nao rodar pra sempre, segue parcial")
                  break
          print(f"\n=== BUCKET post-images (raiz, sem subpastas) ===")
          if erro_list:
              print(f"  ERRO: {erro_list}")
          else:
              print(f"  ARQUIVOS: {total_files}")
              print(f"  TAMANHO TOTAL: {total_bytes} bytes = {total_bytes/1024/1024:.1f} MB")

          # 4) Mesmo teste, mas listando a pasta "imagens" dentro do bucket (prefix usado no upload real)
          total_bytes2 = 0
          total_files2 = 0
          offset = 0
          erro_list2 = None
          while True:
              body = {"prefix": "imagens", "limit": page, "offset": offset, "sortBy": {"column": "name", "order": "asc"}}
              try:
                  items = req(f"{SB_URL}/storage/v1/object/list/post-images", method="POST", body=body)
              except urllib.error.HTTPError as e:
                  erro_list2 = f"HTTP {e.code}: {e.read().decode()[:300]}"
                  break
              if not items:
                  break
              for it in items:
                  meta = it.get("metadata") or {}
                  sz = meta.get("size") or 0
                  total_bytes2 += sz
                  total_files2 += 1
              offset += page
              if len(items) < page:
                  break
              if offset > 200000:
                  break
          print(f"\n=== BUCKET post-images/imagens ===")
          if erro_list2:
              print(f"  ERRO: {erro_list2}")
          else:
              print(f"  ARQUIVOS: {total_files2}")
              print(f"  TAMANHO TOTAL: {total_bytes2} bytes = {total_bytes2/1024/1024:.1f} MB")
          PYEOF
