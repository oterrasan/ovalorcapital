name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps (sharp + ffmpeg)
        run: |
          npm install sharp@0.33 --no-save --silent
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Inspecionar pixel real do overlay (sem video, sem JPEG) na zona de transicao
        run: |
          node << 'NODEEOF'
          const sharp = require("sharp");
          const { spawn } = require("child_process");
          const fs = require("fs");

          function run(cmd, args, env) {
            return new Promise((resolvePromise, reject) => {
              const child = spawn(cmd, args, { stdio: ["ignore", "pipe", "pipe"], env: env || process.env });
              let out = "", err = "";
              child.stdout.on("data", d => out += d);
              child.stderr.on("data", d => err += d);
              child.on("exit", code => code === 0 ? resolvePromise(out) : reject(new Error(`${cmd} exit ${code}: ${err.slice(-500)}`)));
            });
          }

          (async () => {
            console.log("=== 1) Gerando video sintetico 1320x742 (forca o mesmo fitMode/altura do caso real) ===");
            await run("ffmpeg", ["-y", "-f", "lavfi", "-i", "color=c=gray:s=1320x742:d=1", "-frames:v", "30", "-r", "30", "input-3.mp4"]);

            const job = {
              title: "Teste de pixel da transicao",
              body: "Verificacao numerica da rampa de opacidade, sem JPEG no meio.",
              source_url: "https://exemplo.com/x.mp4",
              template_version: "diag-pixel"
            };
            fs.writeFileSync("job-3.json", JSON.stringify({ job }));

            console.log("\n=== 2) Gerando so o overlay (REEL_OVERLAY_ONLY=1), script REAL ===");
            const env = Object.assign({}, process.env, { REEL_OVERLAY_ONLY: "1" });
            const out = await run("node", ["scripts/render-instagram-reel.mjs", "job-3.json", "input-3.mp4", "output-3.mp4", "overlay-3.png"], env);
            console.log(out);

            console.log("\n=== 3) Lendo pixel real (canal alpha) ao longo de uma linha vertical ===");
            const { data, info } = await sharp("overlay-3.png").raw().ensureAlpha().toBuffer({ resolveWithObject: true });
            console.log("overlay dims:", info.width, info.height, info.channels);
            const x = 540;
            console.log("\ny | R,G,B,A | opacidade real (%)");
            for (let y = 560; y <= 950; y += 8) {
              const idx = (y * info.width + x) * info.channels;
              const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
              console.log(`${y} | ${r},${g},${b},${a} | ${(a / 255 * 100).toFixed(1)}%`);
            }
          })();
          NODEEOF
