name: diag-once (publicar materia e-Titulo)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save @supabase/supabase-js axios cheerio sharp
      - run: node scripts/one-off/publicar-e-titulo.mjs
