name: diag-once (Meta — tamanho do arquivo do Reel)
on:
  push:
    branches: [claude/adoring-edison-2pzu14]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund >/dev/null 2>&1
          curl -fsSL -o src.mp4 "https://yntwvfcxjardzafdqanj.supabase.co/storage/v1/object/public/post-videos/link-capture/LINK_JOB__1790397167778_bxm545.mp4"
          ls -la src.mp4
          V="scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30"
          P="-x264-params scenecut=0:open_gop=0:keyint=60:min-keyint=60 -profile:v high -level 5.1 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 48000 -movflags +faststart"
          ffmpeg -loglevel error -y -i src.mp4 -vf "$V" -t 88 -c:v libx264 -preset faster -crf 16 -maxrate 8M -bufsize 16M $P a_producao_88s.mp4
          ffmpeg -loglevel error -y -i src.mp4 -vf "$V" -t 88 -c:v libx264 -preset faster -crf 23 -maxrate 3500k -bufsize 7M $P b_leve_88s.mp4
          ffmpeg -loglevel error -y -i src.mp4 -vf "$V" -t 30 -c:v libx264 -preset faster -crf 16 -maxrate 8M -bufsize 16M $P c_producao_30s.mp4
          ls -la *.mp4
      - name: Enviar pra Meta (sem publicar)
        shell: bash {0}
        run: |
          for f in a_producao_88s.mp4 b_leve_88s.mp4 c_producao_30s.mp4; do node .github/diag/ig_upload_test.mjs $f; done
