name: diag-once (placeholder)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Investigar desde quando o Gemini está travado + estado real agora
        run: |
          SUPA="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          echo "=== HORA UTC AGORA ==="
          date -u

          echo ""
          echo "=== Testando as 3 chaves reais AGORA MESMO ==="
          for K in $(curl -s "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?key=like.GEMINI_API_KEY*&select=key,value" \
            -H "apikey: $SUPA" -H "Authorization: Bearer $SUPA" | python3 -c "import json,sys; [print(r['key']+'|'+r['value']) for r in json.load(sys.stdin)]"); do
            KEYNAME="${K%%|*}"
            KEYVAL="${K#*|}"
            echo "--- $KEYNAME ---"
            curl -s -o /tmp/resp.json -w "HTTP %{http_code}\n" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${KEYVAL}" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"diga apenas: ok"}]}]}'
            cat /tmp/resp.json | head -c 600
            echo ""
          done

          echo ""
          echo "=== Últimos 5 posts publicados no OVC (pra saber desde quando parou de verdade) ==="
          curl -s "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/posts?select=titulo,created_at,status&order=created_at.desc&limit=5" \
            -H "apikey: $SUPA" -H "Authorization: Bearer $SUPA"
          echo ""

          echo "=== Últimos erros reais registrados na tabela logs (se existir) ==="
          curl -s "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/logs?select=*&order=created_at.desc&limit=10" \
            -H "apikey: $SUPA" -H "Authorization: Bearer $SUPA"
          echo ""

          echo "=== AUTOMATION ligada? ==="
          curl -s "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?key=eq.AUTOMATION&select=key,value" \
            -H "apikey: $SUPA" -H "Authorization: Bearer $SUPA"
          echo ""

          echo "=== Últimos runs do pipeline-cron (GitHub Actions) ==="
