name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar posts recentes e detectar duplicados reais (título + fonte)
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          echo "--- buscando posts das ultimas 30h (paginado, sem cap de 250) ---"
          python3 << 'PYEOF'
          import urllib.request, json, os
          SB_KEY = os.environ['SB_KEY']
          base = "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/posts"
          headers = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}"}
          from datetime import datetime, timedelta, timezone
          cutoff = (datetime.now(timezone.utc) - timedelta(hours=30)).isoformat()
          all_rows = []
          offset = 0
          page = 1000
          while True:
              url = f"{base}?select=id,titulo,user_tags,publish_method,subcategoria_slug,created_at,metrics&created_at=gte.{cutoff}&order=created_at.desc&limit={page}&offset={offset}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  rows = json.loads(r.read())
              all_rows.extend(rows)
              if len(rows) < page:
                  break
              offset += page
          print("total de posts nas ultimas 30h:", len(all_rows))
          json.dump(all_rows, open('/tmp/posts.json', 'w'))
          from collections import Counter
          pm = Counter(r.get('publish_method') for r in all_rows)
          print("por publish_method:", dict(pm))
          PYEOF
          echo "--- detectando titulos duplicados/quase-identicos ---"
          python3 << 'PYEOF'
          import json, re, difflib
          rows = json.load(open('/tmp/posts.json'))

          def norm(t):
              t = (t or "").lower()
              t = re.sub(r'[^a-z0-9áéíóúâêôãõàçü\s]', ' ', t)
              return re.sub(r'\s+', ' ', t).strip()

          items = [(r['id'], r.get('titulo') or '', norm(r.get('titulo')), r.get('publish_method'), r.get('created_at')) for r in rows]

          # 1) duplicados EXATOS (titulo normalizado identico)
          seen = {}
          exatos = []
          for pid, titulo, n, pm, ts in items:
              if not n:
                  continue
              if n in seen:
                  exatos.append((seen[n], (pid, titulo, pm, ts)))
              else:
                  seen[n] = (pid, titulo, pm, ts)
          print(f"\n=== DUPLICADOS EXATOS (titulo normalizado identico): {len(exatos)} pares ===")
          for a, b in exatos[:20]:
              print(f"  A: [{a[2]}] {a[3]} -- {a[1]}")
              print(f"  B: [{b[2]}] {b[3]} -- {b[1]}")
              print()

          # 2) quase-duplicados (SequenceMatcher ratio alto), cross-channel incluso
          quase = []
          n = len(items)
          for i in range(n):
              for j in range(i+1, n):
                  if not items[i][2] or not items[j][2]:
                      continue
                  ratio = difflib.SequenceMatcher(None, items[i][2], items[j][2]).ratio()
                  if ratio >= 0.55 and items[i][2] != items[j][2]:
                      quase.append((ratio, items[i], items[j]))
          quase.sort(key=lambda x: -x[0])
          print(f"\n=== QUASE-DUPLICADOS (ratio >= 0.55, excluindo exatos): {len(quase)} pares ===")
          for ratio, a, b in quase[:30]:
              print(f"  ratio={ratio:.2f}")
              print(f"  A: [{a[3]}] {a[4]} -- {a[1]}")
              print(f"  B: [{b[3]}] {b[4]} -- {b[1]}")
              print()
          PYEOF
