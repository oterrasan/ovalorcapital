name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
      ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
    steps:
      - name: robots.txt
        run: |
          echo "=== robots.txt ==="
          curl -s -o /tmp/robots.txt -w "HTTP_CODE:%{http_code}\n" https://www.ovalorcapital.com.br/robots.txt
          cat /tmp/robots.txt
      - name: sitemap.xml
        run: |
          echo "=== sitemap.xml (head) ==="
          curl -s -o /tmp/sitemap.xml -w "HTTP_CODE:%{http_code} SIZE:%{size_download}\n" https://www.ovalorcapital.com.br/sitemap.xml
          head -c 1500 /tmp/sitemap.xml
          echo ""
          echo "=== total de <url> no sitemap ==="
          grep -c "<url>" /tmp/sitemap.xml || true
          echo "=== ultimos lastmod (10) ==="
          grep -o "<lastmod>[^<]*</lastmod>" /tmp/sitemap.xml | tail -10 || true
      - name: headers da home
        run: |
          echo "=== headers / ==="
          curl -sI https://www.ovalorcapital.com.br/
      - name: homepage - conteudo bruto (primeiras linhas uteis)
        run: |
          echo "=== HTML da home (title + primeiras materias) ==="
          curl -s https://www.ovalorcapital.com.br/ -o /tmp/home.html
          echo "tamanho: $(wc -c < /tmp/home.html) bytes"
          grep -o "<title>[^<]*</title>" /tmp/home.html | head -1
          grep -io "noindex" /tmp/home.html || echo "sem noindex no HTML da home"
      - name: pega 1 artigo publicado recente via API e checa headers dele
        run: |
          echo "=== posts mais recentes publicados (API) ==="
          curl -s "https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&limit=5" | head -c 2000
          echo ""
      - name: supabase - publicacoes por dia (ultimos 10 dias, publish_method=portal)
        run: |
          echo "=== contagem de posts publicados por dia (ultimos 10 dias) ==="
          python3 << 'PYEOF'
          import urllib.request, json, os
          from datetime import datetime, timedelta, timezone

          url = os.environ["SUPABASE_URL"]
          token = os.environ["ADMIN_TOKEN"]

          since = (datetime.now(timezone.utc) - timedelta(days=10)).strftime("%Y-%m-%dT00:00:00")
          endpoint = f"{url}/rest/v1/posts?select=created_at,status,publish_method&status=eq.publicado&created_at=gte.{since}&order=created_at.asc&limit=5000"
          req = urllib.request.Request(endpoint, headers={
              "apikey": token,
              "Authorization": f"Bearer {token}",
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rows = json.loads(resp.read().decode())
          except Exception as e:
              print(f"ERRO na consulta: {e}")
              rows = []

          by_day = {}
          for r in rows:
              day = r["created_at"][:10]
              by_day.setdefault(day, 0)
              by_day[day] += 1

          for day in sorted(by_day.keys()):
              print(f"{day}: {by_day[day]} posts publicados")

          print(f"\ntotal no periodo: {len(rows)}")
          PYEOF
      - name: supabase - estado atual das flags de automacao
        run: |
          echo "=== flags de automacao (config) ==="
          python3 << 'PYEOF'
          import urllib.request, json, os

          url = os.environ["SUPABASE_URL"]
          token = os.environ["ADMIN_TOKEN"]

          keys = ["AUTOMATION", "IG_AUTOMATION_ENABLED", "REELS_AUTOMATION_ENABLED", "BON_IG_ENABLED"]
          for k in keys:
              endpoint = f"{url}/rest/v1/config?select=key,value,updated_at&key=eq.{k}"
              req = urllib.request.Request(endpoint, headers={
                  "apikey": token,
                  "Authorization": f"Bearer {token}",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      rows = json.loads(resp.read().decode())
                  print(k, "->", rows)
              except Exception as e:
                  print(k, "-> ERRO:", e)
          PYEOF
      - name: supabase - ultimo post publicado de cada metodo
        run: |
          echo "=== ultimo post por publish_method ==="
          python3 << 'PYEOF'
          import urllib.request, json, os

          url = os.environ["SUPABASE_URL"]
          token = os.environ["ADMIN_TOKEN"]

          methods = ["portal", "brasilon", "internacional", "jovempan_politica", "esportes_radar", "fofocas", "link_manual"]
          for m in methods:
              endpoint = f"{url}/rest/v1/posts?select=titulo,created_at,status&publish_method=eq.{m}&order=created_at.desc&limit=1"
              req = urllib.request.Request(endpoint, headers={
                  "apikey": token,
                  "Authorization": f"Bearer {token}",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      rows = json.loads(resp.read().decode())
                  print(m, "->", rows)
              except Exception as e:
                  print(m, "-> ERRO:", e)
          PYEOF
      - name: supabase - posts editados depois de publicados (titulo pode ter mudado -> canonical muda)
        run: |
          echo "=== posts publicados com updated_at >> created_at (edicao pos-publicacao) ==="
          python3 << 'PYEOF'
          import urllib.request, json, os
          from datetime import datetime

          url = os.environ["SUPABASE_URL"]
          token = os.environ["ADMIN_TOKEN"]

          endpoint = f"{url}/rest/v1/posts?select=id,titulo,created_at,updated_at&status=eq.publicado&order=created_at.desc&limit=2000"
          req = urllib.request.Request(endpoint, headers={
              "apikey": token,
              "Authorization": f"Bearer {token}",
          })
          with urllib.request.urlopen(req, timeout=30) as resp:
              rows = json.loads(resp.read().decode())

          def parse(s):
              s = s.replace("Z", "+00:00")
              return datetime.fromisoformat(s)

          total = len(rows)
          editados_1h = 0
          editados_6h = 0
          exemplos = []
          for r in rows:
              try:
                  c = parse(r["created_at"])
                  u = parse(r["updated_at"])
              except Exception:
                  continue
              delta_min = (u - c).total_seconds() / 60
              if delta_min > 60:
                  editados_1h += 1
              if delta_min > 360:
                  editados_6h += 1
                  if len(exemplos) < 5:
                      exemplos.append((r["titulo"][:60], round(delta_min/60, 1)))

          print(f"amostra analisada (publicados mais recentes): {total}")
          print(f"editados mais de 1h depois de criados: {editados_1h} ({100*editados_1h/total:.1f}%)")
          print(f"editados mais de 6h depois de criados: {editados_6h} ({100*editados_6h/total:.1f}%)")
          print("\nexemplos (titulo, horas depois de criado):")
          for t, h in exemplos:
              print(f"  {h}h -> {t}")
          PYEOF
      - name: sitemap submetido no Search Console (verificacao manual pendente)
        run: echo "lembrar de pedir para Roberto confirmar status do sitemap em Search Console > Sitemaps"
