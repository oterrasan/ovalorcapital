name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar body real (sem pipe cortando o curl)
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          curl -sL -A "$UA" --max-time 15 -o /tmp/watch.html "https://www.youtube.com/watch?v=YE4oPGJS5z4" || echo "CURL_FALHOU"
          echo "--- tamanho do body ---"
          wc -c /tmp/watch.html || true
          echo "--- contem ytInitialPlayerResponse? ---"
          grep -c "ytInitialPlayerResponse" /tmp/watch.html || true
          echo "--- contem consent/unusual traffic/captcha? ---"
          grep -c -i "consent\|unusual traffic\|captcha" /tmp/watch.html || true
          echo "--- status real (se achar) ---"
          grep -oE '"playabilityStatus":\{"status":"[A-Z_]+"' /tmp/watch.html | head -3 || true
          echo "--- isLiveNow (se achar) ---"
          grep -oE '"isLiveNow":(true|false)' /tmp/watch.html | head -3 || true
