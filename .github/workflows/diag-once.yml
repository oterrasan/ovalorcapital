name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Testar manifest HLS real da TV Cultura
        run: |
          set +e
          echo "=== HEAD no manifest ==="
          curl -sS -I --max-time 15 "https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8"
          echo ""
          echo "=== GET no manifest (conteudo) ==="
          curl -sS --max-time 15 -o /tmp/manifest.m3u8 -w "HTTP:%{http_code} size:%{size_download}\n" "https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8"
          cat /tmp/manifest.m3u8
          echo ""
          echo "=== Se for playlist master, testar a 1a variante referenciada ==="
          first_variant=$(grep -v '^#' /tmp/manifest.m3u8 | head -1)
          echo "variante: $first_variant"
          if [ -n "$first_variant" ]; then
            case "$first_variant" in
              http*) full_url="$first_variant" ;;
              *) full_url="https://player-tvcultura.stream.uol.com.br/live/$first_variant" ;;
            esac
            echo "testando: $full_url"
            curl -sS -o /dev/null --max-time 15 -w "HTTP:%{http_code} size:%{size_download}\n" "$full_url"
          fi
