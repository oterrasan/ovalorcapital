name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar streams nativos institucionais (nao-YouTube)
        run: |
          cat > /tmp/diag_native.sh << 'DIAGEOF'
          #!/usr/bin/env bash
          set -uo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'

          check_page () {
            local nome="$1"
            local url="$2"
            echo "===== $nome ====="
            echo "URL: $url"
            local html
            html=$(curl -sL -A "$UA" --max-time 15 "$url" 2>&1 || true)
            local code
            code=$(curl -sL -o /dev/null -w "%{http_code}" -A "$UA" --max-time 15 "$url" 2>&1 || true)
            echo "HTTP: $code  tamanho: ${#html} bytes"
            echo "m3u8 encontrados:"
            echo "$html" | grep -oE 'https?://[^"'"'"' ]+\.m3u8[^"'"'"' ]*' | sort -u | head -5
            echo "iframe src encontrados:"
            echo "$html" | grep -oE '<iframe[^>]*src="[^"]+"' | head -5
            echo "video/source src encontrados:"
            echo "$html" | grep -oE '<(video|source)[^>]*src="[^"]+"' | head -5
            echo "menções a youtube embed:"
            echo "$html" | grep -oE 'youtube\.com/embed[^"'"'"' ]*' | sort -u | head -3
            echo
          }

          check_page "TV Senado (pagina ao vivo)" "https://www12.senado.leg.br/tv/programas/ao-vivo"
          check_page "TV Senado (home tv)" "https://www12.senado.leg.br/tv"
          check_page "TV Camara" "https://www.camara.leg.br/tv/"
          check_page "TV Justica" "https://www.tvjustica.jus.br"
          check_page "TV Brasil (EBC)" "https://tvbrasil.ebc.com.br/ao-vivo"
          check_page "TV Cultura" "https://tvcultura.com.br/tvcultura/ao-vivo"
          check_page "Radio e TV Camara" "https://www.camara.leg.br/radio/"
          DIAGEOF
          bash /tmp/diag_native.sh
