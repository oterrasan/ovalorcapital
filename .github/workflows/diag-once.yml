name: Diagnóstico único (placeholder)

# Este arquivo é reescrito sob demanda para investigações pontuais em produção
# (consultas diretas ao Supabase, testes de endpoint, etc.) e resetado a este
# placeholder inerte logo depois — nunca fica com lógica de diagnóstico ativa
# entre uma investigação e outra.

on:
  push:
    branches: [claude/ovc-atualizacao-ultimos-mds-6lo95i]
    paths: [".github/workflows/diag-once.yml"]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Roberto diz que nada apareceu no Giro há mais de 1h — investigação real
        run: |
          set +e
          SB_URL="https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          H_APIKEY="apikey: $SB_KEY"
          H_AUTH="Authorization: Bearer $SB_KEY"

          echo "=== 1) Posts giro no banco — mais recentes primeiro ==="
          curl -sS --max-time 15 -H "$H_APIKEY" -H "$H_AUTH" \
            "$SB_URL/rest/v1/posts?select=id,titulo,status,approved,published_at,created_at,user_tags&user_tags=ilike.*giro*&order=created_at.desc&limit=10" \
            -w "\nHTTP:%{http_code}\n"

          echo ""
          echo "=== 2) Logs [fofocas] da última 1h30 (UTC agora: $(date -u +%Y-%m-%dT%H:%M:%S)) ==="
          curl -sS --max-time 15 -H "$H_APIKEY" -H "$H_AUTH" \
            "$SB_URL/rest/v1/logs?select=created_at,level,message&message=ilike.*fofocas*&order=created_at.desc&limit=20" \
            -w "\nHTTP:%{http_code}\n"

          echo ""
          echo "=== 3) O que a API pública /api/portal-posts retorna pra categoria=giro (o que o front consome) ==="
          curl -sS --max-time 15 \
            "https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&categoria=giro&limit=10" \
            -w "\nHTTP:%{http_code}\n"

          echo ""
          echo "=== 4) HTML real de /giro/ — primeiros 3000 chars, pra ver se a página carrega e se tem algum erro visível ==="
          curl -sS --max-time 15 "https://www.ovalorcapital.com.br/giro/" -o /tmp/giro.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          head -c 3000 /tmp/giro.html

          echo ""
          echo ""
          echo "=== 5) Config GEMINI_BUDGET de hoje (pra ver se orçamento não zerou o Gemini) ==="
          curl -sS --max-time 15 -H "$H_APIKEY" -H "$H_AUTH" \
            "$SB_URL/rest/v1/config?select=key&key=ilike.*GEMINI_BUDGET*&order=key.desc&limit=5" \
            -w "\nHTTP:%{http_code}\n"
