name: Diagnóstico único (vídeo não aparece na matéria)

on:
  workflow_dispatch:
  push:
    branches: [claude/diag-video-nao-aparece]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright + Chromium
        run: |
          npm init -y --silent >/dev/null
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
      - name: Abrir a página real com navegador de verdade e inspecionar o DOM
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const consoleMsgs = [];
            page.on('console', msg => consoleMsgs.push(msg.type() + ': ' + msg.text()));
            page.on('pageerror', err => consoleMsgs.push('PAGEERROR: ' + err.message));
            await page.goto('https://www.ovalorcapital.com.br/tecnologia/robo-chines-supera-recorde-de-usain-bolt-nos-100-metros-7391ed1b/', { waitUntil: 'networkidle', timeout: 20000 });
            await page.waitForTimeout(2000);
            const videoCount = await page.locator('video').count();
            const heroHtml = await page.locator('[data-hero-card]').innerHTML().catch(() => 'HERO_NAO_ENCONTRADO');
            console.log('=== VIDEO TAGS NO DOM ===');
            console.log(videoCount);
            console.log('=== CONSOLE/ERROS JS ===');
            console.log(consoleMsgs.join('\n') || '(nenhum)');
            console.log('=== PRIMEIROS 3000 CHARS DO data-hero-card ===');
            console.log(String(heroHtml).slice(0, 3000));
            await browser.close();
          })().catch(e => { console.error('FALHA PLAYWRIGHT:', e.message); process.exit(1); });
          "
