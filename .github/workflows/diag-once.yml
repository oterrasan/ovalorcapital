name: Diagnóstico único — placeholder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Estado geral AGORA — site no ar, posts recentes, pipeline real
        run: |
          echo "=== Site no ar? ==="
          curl -s -o /dev/null -w "HTTP: %{http_code}\n" "https://www.ovalorcapital.com.br/"
          echo ""
          echo "=== Posts mais recentes do portal (recentes=true) ==="
          curl -s "https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&limit=10" | python3 -c "import json,sys; d=json.load(sys.stdin); posts=d.get('posts', d if isinstance(d,list) else []); [print(p.get('published_at') or p.get('created_at'), '|', p.get('categoria') or p.get('user_tags'), '|', (p.get('titulo') or '')[:70]) for p in posts[:10]]"
          echo ""
          echo "=== Teste real do pipeline agora (materias, force) ==="
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","force":true}'
          echo ""
