name: Diagnóstico único — placeholder

on:
  workflow_dispatch:
    inputs:
      groq_key:
        description: "Chave temporária (nunca commitada — só via input em runtime)"
        required: false
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Salvar GROQ_API_KEY no Supabase config + testar direto
        env:
          GROQ_KEY_NOVA: ${{ github.event.inputs.groq_key }}
        run: |
          if [ -z "$GROQ_KEY_NOVA" ]; then
            echo "Sem input groq_key — nada a fazer (disparo via push, ignorar)."
            exit 0
          fi
          echo "::add-mask::$GROQ_KEY_NOVA"
          SUPA_URL="https://yntwvfcxjardzafdqanj.supabase.co"
          SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          echo "=== Existe alguma linha GROQ_API_KEY? ==="
          EXISTING=$(curl -s "$SUPA_URL/rest/v1/config?key=eq.GROQ_API_KEY&select=key" -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY")
          echo "$EXISTING"
          if echo "$EXISTING" | grep -q "GROQ_API_KEY"; then
            echo "=== Ja existe, dando UPDATE ==="
            curl -s -X PATCH "$SUPA_URL/rest/v1/config?key=eq.GROQ_API_KEY" -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY" -H "Content-Type: application/json" -d "{\"value\":\"$GROQ_KEY_NOVA\"}"
          else
            echo "=== Nao existe, dando INSERT ==="
            curl -s -X POST "$SUPA_URL/rest/v1/config" -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY" -H "Content-Type: application/json" -d "{\"key\":\"GROQ_API_KEY\",\"value\":\"$GROQ_KEY_NOVA\"}"
          fi
          echo ""
          echo "=== Confirmando o que ficou salvo (so tamanho, nao expor valor) ==="
          curl -s "$SUPA_URL/rest/v1/config?key=eq.GROQ_API_KEY&select=key,value" -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['key'], 'len=', len(r['value'] or '')) for r in d]"
          echo ""
          echo "=== Testando a chave DIRETO na API do Groq (sem passar pelo pipeline) ==="
          curl -s -o /tmp/groq.json -w "HTTP_CODE: %{http_code}\n" "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_KEY_NOVA" \
            -d '{"model":"llama-3.3-70b-versatile","messages":[{"role":"system","content":"Responda em portugues."},{"role":"user","content":"Diga apenas: funcionando"}],"max_tokens":20}'
          cat /tmp/groq.json
          echo ""
