name: diag-once
on:
  push:
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Testar se existe endpoint real de Spend Management na API da Vercel
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
          TEAM: "team_eHk3adfD75A2B72VzpPgQHPy"
        run: |
          echo "--- tentativa 1: /v1/teams/{id}/spend-management ---"
          curl -sS -o /dev/null -w "HTTP:%{http_code}\n" -H "Authorization: Bearer $VT" "https://api.vercel.com/v1/teams/$TEAM/spend-management"

          echo "--- tentativa 2: /v2/teams/{id}/spend-management ---"
          curl -sS -o /dev/null -w "HTTP:%{http_code}\n" -H "Authorization: Bearer $VT" "https://api.vercel.com/v2/teams/$TEAM/spend-management"

          echo "--- tentativa 3: /v1/spend-management?teamId={id} ---"
          curl -sS -o /dev/null -w "HTTP:%{http_code}\n" -H "Authorization: Bearer $VT" "https://api.vercel.com/v1/spend-management?teamId=$TEAM"

          echo "--- tentativa 4: /v9/teams/{id}/spend-management ---"
          curl -sS -o /dev/null -w "HTTP:%{http_code}\n" -H "Authorization: Bearer $VT" "https://api.vercel.com/v9/teams/$TEAM/spend-management"

          echo "--- tentativa 5: campo de spend dentro do proprio objeto do time (/v2/teams/{id}) ---"
          curl -sS -H "Authorization: Bearer $VT" "https://api.vercel.com/v2/teams/$TEAM" -o /tmp/team_full.json
          python3 << 'PYEOF'
          import json
          with open('/tmp/team_full.json') as f:
              d = json.load(f)
          chaves = list(d.keys())
          print("CHAVES_DO_TIME|" + ",".join(chaves))
          for k in chaves:
              if 'spend' in k.lower() or 'budget' in k.lower() or 'billing' in k.lower() or 'pause' in k.lower():
                  print(f"CAMPO_RELEVANTE|{k}|{d[k]}")
          PYEOF

          echo "--- tentativa 6: endpoint generico de configuracoes de billing ---"
          curl -sS -o /dev/null -w "HTTP:%{http_code}\n" -H "Authorization: Bearer $VT" "https://api.vercel.com/v1/teams/$TEAM/billing"
