name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ovc-atualizacao-ultimos-mds-6lo95i

jobs:
  testar_fontes_fofocas:
    runs-on: ubuntu-latest
    steps:
      - name: Testar candidatos de fonte — fofocas/famosos (rodada 2)
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "=== OFUXICO post-sitemap.xml (chunk mais recente) ==="
          curl -s -o /tmp/ofx2.xml -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "$UA" "https://ofuxico.com.br/post-sitemap.xml" --max-time 20
          grep -oE '<loc>https://ofuxico\.com\.br/[a-z0-9-]{15,}/?</loc>' /tmp/ofx2.xml 2>/dev/null | sed -n '1,8p'
          echo "total urls:"; grep -c '<loc>' /tmp/ofx2.xml 2>/dev/null

          echo "=== HUGOGLOSS homepage bruta (achar padrão real de link) ==="
          curl -s -o /tmp/hg.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "$UA" "https://hugogloss.uol.com.br/" --max-time 10 || true
          grep -oE 'href="[^"]*hugogloss[^"]{10,80}"' /tmp/hg.html 2>/dev/null | sort -u | head -10

          echo "=== METROPOLES FAMOSOS sitemap_index ==="
          curl -s -o /tmp/metro.xml -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "$UA" "https://www.metropoles.com/sitemap_index.xml" --max-time 10 || true
          head -c 300 /tmp/metro.xml 2>/dev/null; echo
          echo "=== METROPOLES FAMOSOS homepage ==="
          curl -s -o /tmp/metro2.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "$UA" "https://www.metropoles.com/famosos" --max-time 10 || true
          grep -oE 'href="https://www\.metropoles\.com/famosos/[a-z0-9-]{10,}"' /tmp/metro2.html 2>/dev/null | sort -u | head -10

          echo "=== NOTICIAS DA TV (uol) ==="
          curl -s -o /tmp/ntv.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "$UA" "https://noticiasdatv.uol.com.br/" --max-time 10 || true
          grep -oE 'href="https://noticiasdatv\.uol\.com\.br/[a-z0-9-]{15,}/?"' /tmp/ntv.html 2>/dev/null | sort -u | head -10

          echo "=== ESTRELANDO sitemap_index ==="
          curl -s -o /tmp/estr.xml -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "$UA" "https://estrelando.com.br/sitemap_index.xml" --max-time 10 || true
          head -c 300 /tmp/estr.xml 2>/dev/null; echo

          echo "=== TERRA DIVERSAO ==="
          curl -s -o /tmp/terra.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" -A "$UA" "https://www.terra.com.br/diversao/gente/" --max-time 10 || true
          grep -oE 'href="[^"]*terra\.com\.br/diversao/gente/[a-z0-9-]{10,}[^"]*"' /tmp/terra.html 2>/dev/null | sort -u | head -10
