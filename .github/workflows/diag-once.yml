name: Diagnóstico único — inspecionar HTML real ao redor do widget de vídeo duplicado
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Inspecionar HTML real das 2 materias
        run: node .github/workflows/_diag_video_null_check.mjs
