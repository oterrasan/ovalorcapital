name: Diagnóstico único (placeholder)

on:
  push:
    paths:
      - ".github/workflows/diag-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Investigar estrutura de vídeo da página G1
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import re

          url = "https://g1.globo.com/ms/mato-grosso-do-sul/video/em-video-e-possivel-escutar-desespero-de-vitima-durante-sequestro-em-bonito-14938018.ghtml"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml"
          })
          with urllib.request.urlopen(req, timeout=25) as r:
              status = r.status
              ct = r.headers.get("Content-Type")
              html = r.read().decode("utf-8", errors="replace")

          print("HTTP status:", status)
          print("Content-Type:", ct)
          print("HTML length:", len(html))
          print()

          # og:video / og:video:url
          for m in re.finditer(r'<meta[^>]+property="og:video[^"]*"[^>]*>', html, re.I):
              print("OG VIDEO TAG:", m.group(0)[:300])

          # JSON-LD VideoObject
          for m in re.finditer(r'"@type"\s*:\s*"VideoObject".{0,400}', html, re.S):
              print("JSON-LD VideoObject:", m.group(0)[:400])
              print("---")

          # padrões comuns de manifest/CDN de vídeo Globo
          for pat in [r'https?://[^"\'\s]+\.m3u8[^"\'\s]*', r'https?://[^"\'\s]+\.mp4[^"\'\s]*',
                      r'"videoId"\s*:\s*"?\d+', r'"videosID"\s*:\s*"?\d+',
                      r'glbvid\.com\S*', r'globoplay\.globo\.com\S*']:
              found = re.findall(pat, html)
              if found:
                  print(f"PATTERN {pat} -> {len(found)} matches, ex:", found[:3])

          print()
          print("=== primeiros 800 chars do HTML ===")
          print(html[:800])
          PYEOF
