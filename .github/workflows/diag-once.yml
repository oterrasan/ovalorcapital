name: diag-once (placeholder)
on:
  push:
    paths:
      - ".github/workflows/diag-once.yml"
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: uso real e detalhado de cobrança na Vercel (JSONL agregado por serviço)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, urllib.request, json, datetime, collections

          TOKEN = os.environ["VERCEL_TOKEN"]
          TEAM = "team_eHk3adfD75A2B72VzpPgQHPy"

          def call_raw(path):
              url = f"https://api.vercel.com{path}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:1500]

          # período de cobrança real confirmado no diagnóstico anterior:
          # period.start=1790665200000 (ms), period.end=1793257200000 (ms)
          start_ms, end_ms = 1790665200000, 1793257200000
          from_date = datetime.datetime.utcfromtimestamp(start_ms/1000).date().isoformat()
          to_date = datetime.datetime.utcfromtimestamp(end_ms/1000).date().isoformat()
          print(f"Período de cobrança real do time: {from_date} até {to_date}")

          # também pega os últimos 40 dias, pra cobrir o ciclo anterior se necessário
          from_date_wide = (datetime.date.today() - datetime.timedelta(days=45)).isoformat()
          to_date_wide = datetime.date.today().isoformat()

          for label, f, t in [("PERIODO_DE_COBRANCA_ATUAL", from_date, to_date),
                              ("ULTIMOS_45_DIAS", from_date_wide, to_date_wide)]:
              print(f"\n{'='*70}\n{label} ({f} a {t})\n{'='*70}")
              status, body = call_raw(f"/v1/billing/charges?teamId={TEAM}&from={f}&to={t}")
              print("HTTP status:", status)
              if status != 200:
                  print(body[:2000])
                  continue

              total_geral = 0.0
              por_servico = collections.defaultdict(lambda: {"cost": 0.0, "qty": 0.0, "unit": ""})
              linhas_com_custo = 0
              linhas_total = 0

              for line in body.strip().split("\n"):
                  if not line.strip():
                      continue
                  linhas_total += 1
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  cost = float(row.get("BilledCost") or 0)
                  svc = row.get("ServiceName", "?")
                  cat = row.get("ServiceCategory", "?")
                  key = f"{cat} / {svc}"
                  por_servico[key]["cost"] += cost
                  por_servico[key]["qty"] += float(row.get("ConsumedQuantity") or 0)
                  por_servico[key]["unit"] = row.get("ConsumedUnit", "")
                  total_geral += cost
                  if cost > 0:
                      linhas_com_custo += 1

              print(f"linhas totais: {linhas_total} | linhas com custo > 0: {linhas_com_custo}")
              print(f"TOTAL GERAL (BilledCost somado): USD {total_geral:.2f}")
              print("\n--- por serviço, ordenado do mais caro pro mais barato ---")
              for key, v in sorted(por_servico.items(), key=lambda kv: -kv[1]["cost"]):
                  if v["cost"] > 0.001:
                      print(f"  USD {v['cost']:>10.2f}  | qty={v['qty']:.2f} {v['unit']:<12} | {key}")

              print("\n--- TODOS os serviços vistos (mesmo com custo 0, pra saber o que existe) ---")
              for key, v in sorted(por_servico.items()):
                  print(f"  {key}: qty={v['qty']:.2f} {v['unit']}")
          PYEOF
