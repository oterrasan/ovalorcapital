name: diag-once (reels erros reais)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Reels com erro - motivo real
        env:
          T: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          curl -s "https://www.ovalorcapital.com.br/api/manage?action=reels_erros&pass=$T" | python3 -m json.tool
