name: Diagnóstico único (placeholder)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: materias — economia
        run: |
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","categoria":"economia","force":true}' \
            -w "\nHTTP_CODE:%{http_code}\n"
      - name: materias — financas
        run: |
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","categoria":"financas","force":true}' \
            -w "\nHTTP_CODE:%{http_code}\n"
      - name: materias — tecnologia
        run: |
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","categoria":"tecnologia","force":true}' \
            -w "\nHTTP_CODE:%{http_code}\n"
      - name: materias — industria
        run: |
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","categoria":"industria","force":true}' \
            -w "\nHTTP_CODE:%{http_code}\n"
      - name: materias — familia
        run: |
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","categoria":"familia","force":true}' \
            -w "\nHTTP_CODE:%{http_code}\n"
      - name: materias — negocios
        run: |
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"materias","categoria":"negocios","force":true}' \
            -w "\nHTTP_CODE:%{http_code}\n"
