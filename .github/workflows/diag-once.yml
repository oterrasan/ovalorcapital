name: diag-once (placeholder)
on:
  push:
    paths:
      - ".github/workflows/diag-once.yml"
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: confirmar origem de cada deploy (CLI/Actions vs Git nativo da Vercel)
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
          TEAM: "team_eHk3adfD75A2B72VzpPgQHPy"
        run: |
          python3 << 'PYEOF'
          import os, urllib.request, json, datetime

          TOKEN = os.environ["VT"]
          TEAM = os.environ["TEAM"]

          def get(path):
              url = f"https://api.vercel.com{path}"
              sep = "&" if "?" in url else "?"
              url = f"{url}{sep}teamId={TEAM}"
              r = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return json.loads(resp.read())

          ids = {
              "ovalorcapital-xuhw": "prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b",
              "ovalorcapital-hubx": "prj_zW6nDsScVWCPkRLYLpAptEP5duoR",
              "ovalorcapital":      "prj_xsVkTIYEEZWcBiCl8WW7AzXrP6ZD",
          }

          print("=== SETTINGS DE GIT (autoExpose / autoJobCancelation / ignoreCommand) ===")
          for name, pid in ids.items():
              p = get(f"/v10/projects/{pid}")
              print(f"\n{name}")
              print(f"  autoAssignCustomDomains={p.get('autoAssignCustomDomains')}")
              print(f"  gitForkProtection={p.get('gitForkProtection')}")
              print(f"  autoExposeSystemEnvs={p.get('autoExposeSystemEnvs')}")
              cs = p.get("customerSupportCodeVisibility")
              link = p.get("link") or {}
              print(f"  link.deployHooks={link.get('deployHooks')}")
              print(f"  link.productionBranch={link.get('productionBranch')}")
              print(f"  buildCommand={p.get('buildCommand')}")
              print(f"  ignoreCommand(root)={p.get('rootDirectory')}")

          print("\n\n=== DETALHE DOS 8 DEPLOYS MAIS RECENTES DE CADA PROJETO (quem/o que disparou) ===")
          for name, pid in ids.items():
              d = get(f"/v6/deployments?projectId={pid}&limit=8")
              deploys = d.get("deployments", [])
              print(f"\n--- {name} ---")
              for x in deploys:
                  ts = datetime.datetime.fromtimestamp(x.get("createdAt",0)/1000, datetime.UTC)
                  creator = x.get("creator") or {}
                  meta = x.get("meta") or {}
                  print(f"  {ts} target={x.get('target')} state={x.get('state')} source={x.get('source')} creator_username={creator.get('username')} meta_githubCommitMessage={str(meta.get('githubCommitMessage',''))[:60]!r}")
          PYEOF
