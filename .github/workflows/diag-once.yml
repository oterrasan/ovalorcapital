name: Diagnóstico — quais chaves Gemini estão configuradas em produção
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Quais chaves Gemini estão em produção agora
        run: node .github/workflows/_diag_gemini_keys.mjs
