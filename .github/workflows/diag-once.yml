name: diag-once
on:
  push:
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checar estado real dos reels aprovados recentemente
        run: |
          SB_URL="https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          curl -sS "${SB_URL}/rest/v1/posts?select=id,titulo,ig_id,updated_at,metrics&metrics-%3Einstagram_reel_template-%3E%3Eaprovado=eq.true&order=updated_at.desc&limit=10" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -o /tmp/reels.json

          python3 << 'PYEOF'
          import json
          with open('/tmp/reels.json') as f:
              rows = json.load(f)
          print(f"TOTAL_ENCONTRADOS|{len(rows)}")
          for r in rows:
              m = r.get('metrics') or {}
              if isinstance(m, str):
                  m = json.loads(m)
              tpl = m.get('instagram_reel_template') or {}
              reel = m.get('instagram_reel') or {}
              print(f"ID|{r['id']}|TITULO|{(r.get('titulo') or '')[:50]}|TPL_STATUS|{tpl.get('status')}|CONTA|{tpl.get('conta_publicacao')}|IG_ID_REEL|{reel.get('ig_id')}|UPDATED|{r.get('updated_at')}")
          PYEOF
