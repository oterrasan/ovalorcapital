name: Diagnóstico único (placeholder)

on:
  push:
    paths:
      - ".github/workflows/diag-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Investigar ig_accounts, config de categorias e posts recentes por conta
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request
          import urllib.parse

          SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          def sb(path, params=None):
              url = f"{SUPABASE_URL}/rest/v1/{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params, safe=",.()*")
              req = urllib.request.Request(url, headers={
                  "apikey": SUPABASE_KEY,
                  "Authorization": f"Bearer {SUPABASE_KEY}",
                  "Content-Type": "application/json"
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode())

          print("=== ig_accounts (sem token exposto) ===")
          code, rows = sb("ig_accounts", {"select": "id,username,active,distribuicao_automatica,limite_diario,ig_user_id,token,posts_hoje,ultima_atividade"})
          print("HTTP", code)
          for r in rows or []:
              r2 = dict(r)
              r2["token"] = "PRESENTE" if r2.get("token") else "AUSENTE"
              print(json.dumps(r2, ensure_ascii=False))

          print()
          print("=== config: IG_AUTOMATION_CATEGORIES (mais recentes) ===")
          code, rows = sb("config", {"select": "key,value,updated_at", "key": "eq.IG_AUTOMATION_CATEGORIES", "order": "updated_at.desc", "limit": "3"})
          print("HTTP", code, json.dumps(rows, ensure_ascii=False))

          print()
          print("=== config: BON_IG_CATEGORIES (mais recentes) ===")
          code, rows = sb("config", {"select": "key,value,updated_at", "key": "eq.BON_IG_CATEGORIES", "order": "updated_at.desc", "limit": "3"})
          print("HTTP", code, json.dumps(rows, ensure_ascii=False))

          print()
          print("=== posts com ig_account_id preenchido, últimos 20 (qualquer conta) ===")
          code, rows = sb("posts", {
              "select": "id,titulo,ig_account_id,ig_id,metrics,updated_at",
              "ig_account_id": "not.is.null",
              "order": "updated_at.desc",
              "limit": "20"
          })
          print("HTTP", code)
          for r in rows or []:
              metrics = r.get("metrics") or {}
              ig = metrics.get("instagram") if isinstance(metrics, dict) else None
              resumo = {
                  "id": r.get("id"),
                  "titulo": (r.get("titulo") or "")[:50],
                  "ig_account_id": r.get("ig_account_id"),
                  "updated_at": r.get("updated_at"),
              }
              if isinstance(ig, dict):
                  resumo["ig_username"] = ig.get("username")
                  resumo["published_via"] = ig.get("published_via")
                  resumo["first_comment_id"] = ig.get("first_comment_id")
                  resumo["first_comment_error"] = ig.get("first_comment_error")
                  resumo["self_like_success"] = ig.get("self_like_success")
                  resumo["self_like_error"] = ig.get("self_like_error")
              print(json.dumps(resumo, ensure_ascii=False))

          print()
          print("=== brasilon_posts: categorias distintas presentes (amostra 300) ===")
          code, rows = sb("brasilon_posts", {"select": "categoria", "order": "published_at.desc", "limit": "300"})
          print("HTTP", code)
          from collections import Counter
          c = Counter([r.get("categoria") for r in (rows or [])])
          print(dict(c))
          PYEOF
