name: Diagnóstico único (Brasil ON — redeploy pós-fix package.json + testar sync)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  deploy_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Brasil ON em produção
        working-directory: brasilon
        run: |
          npm install -g vercel@54.6.1
          vercel --token="${{ secrets.VERCEL_TOKEN }}" --yes --prod 2>&1 | tee /tmp/deploy_out.txt
          tail -5 /tmp/deploy_out.txt
      - name: Testar sync e status pós-deploy
        run: |
          echo "=== dispara sync ==="
          curl -s --max-time 20 -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            "https://www.obrasilon.com.br/api/manage?action=sync&pass=ovc-admin-2026-secreto" || true
          echo "=== status ==="
          curl -s --max-time 10 -w "\nHTTP_CODE:%{http_code}\n" \
            "https://www.obrasilon.com.br/api/manage?action=status&pass=ovc-admin-2026-secreto" || true
