name: Diagnóstico único — posts da Reescrita por Link
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Diagnosticar captura de link (YouTube, Instagram, Bacci)
        run: node .github/workflows/_diag_link_manual.mjs
