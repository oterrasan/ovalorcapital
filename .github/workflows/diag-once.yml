name: diag-once (placeholder)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Volume de conteudo x views reais (ultimos 30 dias)
        run: |
          cat > /tmp/relatorio.mjs << 'NODEEOF'
          const SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co";
          const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40";
          const headers = { apikey: KEY, Authorization: `Bearer ${KEY}` };

          async function fetchAll(sinceIso) {
            let all = [];
            let offset = 0;
            const limit = 1000;
            while (true) {
              const url = `${SUPABASE_URL}/rest/v1/posts?select=publish_method,user_tags,metrics,status,created_at&created_at=gte.${encodeURIComponent(sinceIso)}&order=created_at.asc&limit=${limit}&offset=${offset}`;
              const r = await fetch(url, { headers });
              const batch = await r.json();
              if (!Array.isArray(batch)) { console.log("ERRO_FETCH:", JSON.stringify(batch).slice(0, 300)); break; }
              all = all.concat(batch);
              if (batch.length < limit) break;
              offset += limit;
            }
            return all;
          }

          function parseJsonMaybe(v) {
            if (v && typeof v === "object") return v;
            try { return JSON.parse(v || "{}"); } catch (_) { return {}; }
          }
          function parseViews(m) {
            const obj = parseJsonMaybe(m);
            return parseInt(obj.views || 0, 10) || 0;
          }
          function primeiraCategoria(userTags) {
            try {
              const arr = Array.isArray(userTags) ? userTags : JSON.parse(userTags || "[]");
              return arr[0] || "(sem categoria)";
            } catch (_) { return "(sem categoria)"; }
          }

          (async () => {
            const since30 = new Date(Date.now() - 30 * 24 * 3600 * 1000).toISOString();
            const rows = await fetchAll(since30);
            console.log("TOTAL_POSTS_30D:", rows.length);

            const byMethod = {};
            const byCategoria = {};
            for (const r of rows) {
              const method = r.publish_method || "(sem publish_method)";
              const views = parseViews(r.metrics);
              const publicado = r.status === "publicado";
              if (!byMethod[method]) byMethod[method] = { total: 0, publicados: 0, pendentes: 0, views: 0 };
              byMethod[method].total++;
              byMethod[method].views += views;
              if (publicado) byMethod[method].publicados++; else byMethod[method].pendentes++;

              const cat = primeiraCategoria(r.user_tags);
              if (!byCategoria[cat]) byCategoria[cat] = { total: 0, publicados: 0, pendentes: 0, views: 0 };
              byCategoria[cat].total++;
              byCategoria[cat].views += views;
              if (publicado) byCategoria[cat].publicados++; else byCategoria[cat].pendentes++;
            }

            const fmt = (obj) => Object.entries(obj).map(([k, v]) => ({
              nome: k, total: v.total, publicados: v.publicados, pendentes: v.pendentes,
              views_total: v.views,
              views_media_por_publicado: v.publicados ? +(v.views / v.publicados).toFixed(2) : null
            })).sort((a, b) => b.total - a.total);

            console.log("=== POR CANAL (publish_method) ===");
            console.log(JSON.stringify(fmt(byMethod), null, 2));
            console.log("=== POR CATEGORIA (1a tag) ===");
            console.log(JSON.stringify(fmt(byCategoria), null, 2));

            // distribuição de views entre os publicados: quantos tem 0 views
            const publicados = rows.filter(r => r.status === "publicado");
            const zeroViews = publicados.filter(r => parseViews(r.metrics) === 0).length;
            console.log("PUBLICADOS_30D:", publicados.length, "| COM_ZERO_VIEWS:", zeroViews, "| PCT_ZERO:", publicados.length ? +(100 * zeroViews / publicados.length).toFixed(1) : null);
          })();
          NODEEOF
          node /tmp/relatorio.mjs
