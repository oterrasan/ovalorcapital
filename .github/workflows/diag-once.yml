name: Diag Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar fix ?categoria=esportes em producao pos-deploy
        run: |
          cat > /tmp/diag.py << 'PYEOF'
          import urllib.request, json

          def http(url):
              req = urllib.request.Request(url, headers={"User-Agent":"diag"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          print("=== SEM categoria (comportamento antigo, pra comparar) ===")
          d1 = http("https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&limit=300")
          posts1 = d1.get("posts", [])
          esp1 = [p for p in posts1 if p.get("categoria") == "esportes"]
          print("TOTAL:", len(posts1), "ESPORTES:", len(esp1))

          print("=== COM categoria=esportes (fix novo) ===")
          d2 = http("https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&categoria=esportes&limit=300")
          posts2 = d2.get("posts", [])
          print("TOTAL_RETORNADO:", len(posts2))
          nao_esportes = [p for p in posts2 if p.get("categoria") != "esportes"]
          print("QUALQUER_ITEM_FORA_DE_ESPORTES (deve ser 0):", len(nao_esportes))
          for p in posts2[:20]:
              print(json.dumps({"id":p.get("id"),"titulo":p.get("titulo"),"subcategoria":p.get("subcategoria"),"data":p.get("data") or p.get("published_at")}, ensure_ascii=False))
          PYEOF
          python3 /tmp/diag.py
