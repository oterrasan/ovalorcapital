name: Diagnóstico único — candidatos a fonte de vídeo (Roberto, 24/09)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Testar candidatos reais de fonte de vídeo
        run: node .github/workflows/_diag_video_sources.mjs
