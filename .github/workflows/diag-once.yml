name: Diagnóstico único (placeholder)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirma arquivo de verificação Google no ar
        run: |
          curl -s -o /tmp/body.txt -w "HTTP_CODE:%{http_code}\n" \
            "https://www.obrasilon.com.br/google2387e8258ddf2033.html"
          echo "--- BODY ---"
          cat /tmp/body.txt
