name: Diagnóstico único (placeholder) — checar duracao por stream
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps + ffmpeg
        run: |
          npm ci --omit=dev
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
      - name: Checar duracao por stream (video vs audio) no arquivo renderizado
        run: |
          cat > _diag_streams.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";
          import { spawn } from "node:child_process";
          import { writeFile, stat } from "node:fs/promises";

          const supabase = createClient(
            "https://yntwvfcxjardzafdqanj.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          );

          function runCapture(cmd, args, opts = {}) {
            return new Promise((resolve, reject) => {
              const child = spawn(cmd, args, { stdio: ["ignore", "pipe", "pipe"], ...opts });
              const out = []; const err = [];
              child.stdout.on("data", d => out.push(d));
              child.stderr.on("data", d => err.push(d));
              child.on("error", reject);
              child.on("exit", code => resolve({ code, stdout: Buffer.concat(out).toString(), stderr: Buffer.concat(err).toString() }));
            });
          }

          function stripHtml(html) {
            return String(html || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          }

          async function main() {
            const { data: post } = await supabase
              .from("posts")
              .select("id,titulo,conteudo,metrics")
              .eq("id", "896aad2b-5996-40d1-b68c-1e22245c8ae3")
              .single();
            const m = typeof post.metrics === "string" ? JSON.parse(post.metrics) : post.metrics;
            const t = m.instagram_reel_template;

            console.log("checando o video-FONTE (antes do render) primeiro...");
            const dlSource = await runCapture("curl", ["--fail", "--location", "-sS", t.source_url, "--max-time", "120", "-o", "/tmp/reel-source"]);
            if (dlSource.code !== 0) { console.log("FALHA no download da fonte"); return; }
            const probeSource = await runCapture("ffprobe", ["-v", "error", "-show_entries", "stream=index,codec_type,duration,start_time,nb_frames,sample_rate:format=duration,nb_streams", "-of", "json", "/tmp/reel-source"]);
            console.log("ffprobe da FONTE (antes do render):");
            console.log(probeSource.stdout);

            const jobPayload = { job: { title: post.titulo, body: stripHtml(post.conteudo), source_url: t.source_url, template_version: "diag-streams" } };
            await writeFile("/tmp/render-job.json", JSON.stringify(jobPayload));

            console.log("\nrenderizando (ffmpeg real, mesmo pipeline de producao)...");
            const t0 = Date.now();
            const render = await runCapture("node", ["scripts/render-instagram-reel.mjs", "/tmp/render-job.json", "/tmp/reel-source", "/tmp/reel-final.mp4", "/tmp/reel-overlay.png"]);
            console.log(`render levou ${((Date.now() - t0) / 1000).toFixed(1)}s | exit=${render.code}`);
            if (render.code !== 0) { console.log(`FALHA no render: ${render.stderr.slice(-800)}`); return; }
            console.log(render.stdout.trim());

            const probeOut = await runCapture("ffprobe", ["-v", "error", "-show_entries", "stream=index,codec_type,codec_name,duration,start_time,nb_frames,sample_rate,channels:format=duration,nb_streams,size", "-of", "json", "/tmp/reel-final.mp4"]);
            console.log("\nffprobe DETALHADO do arquivo RENDERIZADO (video vs audio duration):");
            console.log(probeOut.stdout);
            if (probeOut.stderr) console.log("ffprobe stderr:", probeOut.stderr);
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e, e?.stack); process.exit(1); });

          JSEOF
          node _diag_streams.mjs
          rm -f _diag_streams.mjs
