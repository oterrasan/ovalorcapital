name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: rodar limpeza real e confirmar antes/depois
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          echo "=== saude do banco ANTES ==="
          curl -sS "https://www.ovalorcapital.com.br/api/manage?action=relatorio_canais&pass=ovc-admin-2026-secreto" --max-time 20 > /dev/null 2>&1 || true
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?select=key&limit=1" \
            -H "apikey: sb_publishable_3SXiMraMn_oaubinB2Wn5w_Iqj7W2yf" \
            -H "Range: 0-0" -H "Prefer: count=exact" -D - -o /dev/null --max-time 20 2>&1 | grep -i content-range || true
          echo ""
          echo "=== chamando limpar_gemini_budget_antigo ==="
          curl -sS "https://www.ovalorcapital.com.br/api/manage?action=limpar_gemini_budget_antigo" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" --max-time 100 > resultado.json
          cat resultado.json
          echo ""
          echo "=== saude do banco DEPOIS ==="
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?select=key&limit=1" \
            -H "apikey: sb_publishable_3SXiMraMn_oaubinB2Wn5w_Iqj7W2yf" \
            -H "Range: 0-0" -H "Prefer: count=exact" -D - -o /dev/null --max-time 20 2>&1 | grep -i content-range || true
