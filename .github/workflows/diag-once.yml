name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Investigar r7.com — sitemap, estrutura de video, watermark, rede de afiliadas
        run: |
          node << 'NODEEOF'
          const https = require("https");

          function get(url, extraHeaders) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: Object.assign({
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                }, extraHeaders || {}),
                timeout: 12000
              }, (res) => {
                let data = "";
                res.on("data", (c) => data += c);
                res.on("end", () => resolve({ status: res.statusCode, headers: res.headers, body: data }));
              });
              req.on("error", reject);
              req.on("timeout", () => { req.destroy(); reject(new Error("timeout")); });
            });
          }

          (async () => {
            console.log("=== 1) robots.txt — procurando sitemap ===");
            try {
              const robots = await get("https://www.r7.com/robots.txt");
              console.log("status:", robots.status);
              console.log(robots.body.slice(0, 2000));
            } catch (e) { console.log("erro robots.txt:", e.message); }

            console.log("\n=== 2) sitemap.xml raiz ===");
            let sitemapUrls = [];
            try {
              const sm = await get("https://www.r7.com/sitemap.xml");
              console.log("status:", sm.status, "tamanho:", sm.body.length);
              sitemapUrls = [...sm.body.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
              console.log("sub-sitemaps encontrados:", sitemapUrls.length);
              console.log(sitemapUrls.slice(0, 30).join("\n"));
            } catch (e) { console.log("erro sitemap.xml:", e.message); }

            console.log("\n=== 3) procurando sitemap de video especifico ===");
            const videoSitemapCandidatos = sitemapUrls.filter(u => /video/i.test(u));
            console.log("candidatos com 'video' no nome:", videoSitemapCandidatos.length);
            console.log(videoSitemapCandidatos.slice(0, 10).join("\n"));

            console.log("\n=== 4) homepage de videos (videos.r7.com) ===");
            try {
              const vh = await get("https://videos.r7.com/");
              console.log("status:", vh.status, "tamanho:", vh.body.length);
              const links = [...vh.body.matchAll(/href="(https:\/\/videos\.r7\.com\/[a-z0-9\-\/]{10,}\.html)"/g)].map(m => m[1]);
              console.log("links de video encontrados na home:", [...new Set(links)].length);
              console.log([...new Set(links)].slice(0, 15).join("\n"));
            } catch (e) { console.log("erro videos.r7.com:", e.message); }

            console.log("\n=== 5) checando a pagina do video real que o Roberto mandou (via WebSearch nao disponivel aqui — testando padrao comum) ===");
            // Vamos varrer a homepage principal do r7.com procurando qualquer link de video
            try {
              const home = await get("https://www.r7.com/");
              console.log("status home:", home.status, "tamanho:", home.body.length);
              const videoLinks = [...home.body.matchAll(/href="(https?:\/\/[a-z0-9.\-]*r7\.com\/[^"]{5,120})"/g)]
                .map(m => m[1])
                .filter(u => /video/i.test(u));
              console.log("links contendo 'video' na home:", [...new Set(videoLinks)].length);
              console.log([...new Set(videoLinks)].slice(0, 20).join("\n"));
            } catch (e) { console.log("erro home r7.com:", e.message); }

            console.log("\n=== 6) procurando pagina/rede de afiliadas regionais ===");
            try {
              const afil = await get("https://www.r7.com/institucional/afiliadas");
              console.log("status /institucional/afiliadas:", afil.status);
            } catch (e) { console.log("erro afiliadas 1:", e.message); }
            try {
              const afil2 = await get("https://recordtv.r7.com/");
              console.log("status recordtv.r7.com:", afil2.status, "tamanho:", afil2.body ? afil2.body.length : 0);
            } catch (e) { console.log("erro recordtv.r7.com:", e.message); }

            console.log("\n=== FIM DA VARREDURA INICIAL (sem download de video, sem publicar nada) ===");
          })();
          NODEEOF
