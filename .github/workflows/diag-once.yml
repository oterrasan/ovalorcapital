name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checar volume real de posts gerados hoje (BRT) + brasilon_posts
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          echo "--- posts do OVC criados desde meia-noite BRT (03:00 UTC de hoje) ---"
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/posts?created_at=gte.2026-09-08T03:00:00&select=id,titulo,status,created_at,publish_method,user_tags&order=created_at.desc&limit=20" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Prefer: count=exact" -D /tmp/headers.txt | python3 -m json.tool
          echo "--- content-range (total real) ---"
          grep -i content-range /tmp/headers.txt || true
          echo ""
          echo "--- brasilon_posts com published_at de hoje ---"
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/brasilon_posts?published_at=gte.2026-09-08T03:00:00&select=id,titulo,categoria,published_at&order=published_at.desc&limit=20" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool
          echo ""
          echo "--- último post publicado no OVC (categoria/tag), independente de hoje ---"
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/posts?status=eq.publicado&select=id,titulo,user_tags,created_at,published_at&order=created_at.desc&limit=5" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -m json.tool
