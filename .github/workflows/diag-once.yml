name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Testar canal novo economia_mercado em producao real
        run: |
          curl -sS -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"economia_mercado","force":true,"count":2}' \
            --max-time 55
