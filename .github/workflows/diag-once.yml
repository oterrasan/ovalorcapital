name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-once.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa HTML de /videos + IDs de vídeo do YouTube encontrados nas thumbnails
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://sbtnews.sbt.com.br/videos" -o /tmp/sbt.html
          echo "=== IDs de vídeo do YouTube (i.ytimg.com/vi/ID/...) ==="
          grep -oE 'ytimg\.com/vi/[A-Za-z0-9_-]{11}' /tmp/sbt.html | sed 's#.*/vi/##' | sort -u > /tmp/ids.txt
          cat /tmp/ids.txt
      - name: Baixa thumbnail HD do 1º e 2º vídeo pra inspeção visual
        run: |
          mkdir -p /tmp/thumbs
          i=0
          while read -r id; do
            i=$((i+1))
            [ $i -gt 2 ] && break
            curl -sL "https://i.ytimg.com/vi/${id}/maxresdefault.jpg" -o "/tmp/thumbs/${id}.jpg"
            echo "baixado: ${id}.jpg ($(wc -c < /tmp/thumbs/${id}.jpg) bytes)"
          done < /tmp/ids.txt
      - name: Verifica se o canal/vídeo tem título/branding "SBT News" via oEmbed público do YouTube
        run: |
          while read -r id; do
            echo "=== $id ==="
            curl -s "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json"
            echo ""
          done < /tmp/ids.txt
      - name: Upload das thumbnails como artifact pra eu examinar
        uses: actions/upload-artifact@v4
        with:
          name: sbt-thumbs
          path: /tmp/thumbs/*.jpg
          retention-days: 1
