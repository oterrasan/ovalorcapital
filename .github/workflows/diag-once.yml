name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Teste final de verdade — publicar matéria de ontem com vídeo
        run: |
          python3 << 'PYEOF'
          import json
          import time
          import urllib.request
          import urllib.error
          import urllib.parse

          BASE = "https://www.ovalorcapital.com.br"
          PASS = "ovc-admin-2026-secreto"
          URL_MATERIA = "https://baccinoticias.com.br/influenciador-e-sequestrado-e-revela-detalhes-chocantes-veja/"

          def get_json(url, timeout=70):
              req = urllib.request.Request(url, headers={"User-Agent": "diag-video-bacci"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          url_run = (
              f"{BASE}/api/run_portal?tipo=brasilon&force=true&count=1&pass={PASS}"
              f"&brasilon_url={urllib.parse.quote(URL_MATERIA, safe='')}"
          )
          try:
              resultado = get_json(url_run)
              print("RESULTADO run_portal:", json.dumps(resultado, ensure_ascii=False))
          except urllib.error.HTTPError as e:
              print(f"HTTP ERROR {e.code}: {e.read().decode('utf-8', errors='replace')}")
          except Exception as e:
              print(f"ERRO: {e}")

          time.sleep(3)

          url_lista = f"{BASE}/api/portal-posts?recentes=true&categoria=brasil-on&limit=3"
          lista = get_json(url_lista, timeout=20)
          posts = lista.get("posts") or lista.get("data") or []

          for p in posts[:3]:
              post_id = p.get("id")
              um = get_json(f"{BASE}/api/portal-posts?id={post_id}", timeout=20)
              metrics = um.get("metrics") or {}
              template = metrics.get("instagram_reel_template")
              print(f"\n--- {um.get('titulo')} ---")
              print("  url completa:", BASE + str(um.get("url")))
              print("  imagem exposta:", bool(um.get("imagem")))
              print("  campo 'video' exposto ao publico (deve ser vazio):", repr(um.get("video")))
              print("  metrics.instagram_reel_template:", json.dumps(template, ensure_ascii=False) if template else "NENHUM (matéria sem vídeo)")
          PYEOF
