name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: achar o post e inspecionar o video real
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          echo "=== buscando post 'matinal' ==="
          curl -sS "https://www.ovalorcapital.com.br/api/manage?action=diag_achar_post&termo=matinal" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" --max-time 30 | tee post.json
          echo ""
          echo "=== video_url do primeiro resultado ==="
          VURL=$(python3 -c "import json; d=json.load(open('post.json')); p=d['posts'][0] if d.get('posts') else None; print(p.get('video_url') or p.get('source_url') or '' if p else '')")
          echo "URL: $VURL"
          if [ -z "$VURL" ]; then echo "NENHUMA URL ENCONTRADA"; exit 0; fi
          echo "=== baixando pra inspecionar ==="
          curl -sS -o video.mp4 "$VURL" --max-time 60 -A "Mozilla/5.0" || echo "falha no download"
          ls -la video.mp4 2>/dev/null || echo "arquivo nao existe"
          echo "=== ffprobe (codec real) ==="
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          ffprobe -v error -show_format -show_streams video.mp4 2>&1 || echo "ffprobe falhou"
          echo "=== primeiros bytes (magic number) ==="
          xxd video.mp4 2>/dev/null | head -5 || true
