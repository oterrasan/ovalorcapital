name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar geração real (aciona mirrorPostToBrasilOn) e conferir brasilon_posts
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          echo "--- disparando POST /api/run_portal tipo=brasilon (Bacci, publica direto) ---"
          curl -sS -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"brasilon","force":true,"count":1}' \
            --max-time 55 -w "\nHTTP_STATUS:%{http_code}\n"
          echo "--- post OVC mais recente publish_method=brasilon (últimos 3min) ---"
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/posts?publish_method=eq.brasilon&order=created_at.desc&limit=1&select=id,titulo,created_at" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" > /tmp/latest.json
          cat /tmp/latest.json
          echo
          echo "--- checando se esse mesmo id já existe em brasilon_posts (origem_post_id) ---"
          python3 << 'PYEOF'
          import json, subprocess
          rows = json.load(open('/tmp/latest.json'))
          if not rows:
              print('NENHUM post publish_method=brasilon encontrado')
          else:
              pid = rows[0]['id']
              print('id do post OVC mais recente:', pid, rows[0]['titulo'])
              open('/tmp/pid.txt', 'w').write(pid)
          PYEOF
          if [ -f /tmp/pid.txt ]; then
            PID=$(cat /tmp/pid.txt)
            echo "--- consultando brasilon_posts com origem_post_id=$PID ---"
            curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/brasilon_posts?origem_post_id=eq.$PID&select=id,titulo,categoria,created_at" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -w "\nHTTP_STATUS:%{http_code}\n"
          fi
