name: Diagnóstico único (status real do Brasil ON)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checar status real do Brasil ON
        run: bash scripts/one-off/check_brasilon_status_v2.sh
