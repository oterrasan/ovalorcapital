name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar campo video no HTML real (extração correta, sem cortar em ';')
        run: |
          URL="https://www.ovalorcapital.com.br/politica/video-mostra-grupo-ex-bope-queimando-bandeira-com-imagem-de--f1e07b70/"
          echo "--- headers ---"
          curl -sSI "$URL" | grep -iE "^(age|cache-control|x-vercel-cache):" || true
          echo ""
          curl -sS "$URL" -o /tmp/page.html
          python3 << 'PYEOF'
          import re, json
          html = open('/tmp/page.html', encoding='utf-8').read()
          m = re.search(r'window\.__OVC_ARTICLE__\s*=\s*(\{.*?\});', html, re.DOTALL)
          if not m:
              print('NAO ACHOU window.__OVC_ARTICLE__ no HTML')
          else:
              obj = json.loads(m.group(1))
              print('campo video presente:', 'video' in obj)
              print('valor de video:', obj.get('video'))
              print('id:', obj.get('id'))
          PYEOF
