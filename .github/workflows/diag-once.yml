name: Diagnóstico único — placeholder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Retestar pipeline real (503 transiente esperado passar)
        run: |
          for i in 1 2 3; do
            echo "Tentativa $i..."
            RESP=$(curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
              -H "Content-Type: application/json" \
              -d '{"tipo":"materias","force":true}')
            echo "$RESP"
            sleep 5
          done
