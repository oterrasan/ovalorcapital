name: Diagnóstico único (origem da matéria Geórgia primárias republicanas)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar post por titulo
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          echo "=== busca por 'Georgia' + 'primarias' no titulo (varios acentos/grafias) ==="
          curl -s "$SUPABASE_URL/rest/v1/posts?select=id,titulo,user_tags,publish_method,status,hash,published_at,created_at,comentario_fixado&or=(titulo.ilike.%25georgia%25primarias%25,titulo.ilike.%25georgia%25prim%C3%A1rias%25,titulo.ilike.%25pr%C3%A1rias%2520republicanas%2520georgia%25)&limit=10" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o /tmp/r1.json
          cat /tmp/r1.json | jq '.'
          echo
          echo "=== fallback: busca so por 'georgia' no titulo (case insensitive) ==="
          curl -s "$SUPABASE_URL/rest/v1/posts?select=id,titulo,user_tags,publish_method,status,hash,published_at,created_at&titulo=ilike.*georgia*&order=published_at.desc&limit=15" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o /tmp/r2.json
          cat /tmp/r2.json | jq '.'
