name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Investigar como o Bacci embute vídeo nas matérias
        run: |
          python3 << 'PYEOF'
          import re
          import urllib.request

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          URLS = [
              "https://baccinoticias.com.br/camera-corporal-registra-momento-em-que-medico-confirma-morte-da-pm-gisele/",
          ]

          def fetch(url, timeout=15):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "pt-BR,pt;q=0.9"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="replace")

          def descobrir_mais_urls(limite=4):
              try:
                  idx = fetch("https://baccinoticias.com.br/sitemap_index.xml", timeout=10)
                  locs = re.findall(r'<loc>(.*?)</loc>', idx)
                  post_sitemaps = [l for l in locs if re.search(r'/post-sitemap\d*\.xml$', l)]
                  if not post_sitemaps:
                      return []
                  chunk = post_sitemaps[-1]
                  sm = fetch(chunk, timeout=10)
                  blocos = re.findall(r'<url>([\s\S]*?)</url>', sm)
                  entradas = []
                  for b in blocos:
                      loc_m = re.search(r'<loc>(.*?)</loc>', b)
                      lastmod_m = re.search(r'<lastmod>(.*?)</lastmod>', b)
                      loc = loc_m.group(1) if loc_m else ""
                      lastmod = lastmod_m.group(1) if lastmod_m else ""
                      if loc and not re.search(r'vi-no-instagram|categoria|category|/tag/|/page/', loc, re.I):
                          entradas.append((loc, lastmod))
                  entradas.sort(key=lambda e: e[1], reverse=True)
                  return [e[0] for e in entradas[:limite]]
              except Exception as e:
                  print(f"ERRO ao descobrir mais URLs via sitemap: {e}")
                  return []

          def find_patterns(html, url):
              print(f"\n===== {url} =====")
              print(f"tamanho html: {len(html)} bytes")

              for m in re.finditer(r'<meta[^>]+property=["\']og:video[^"\']*["\'][^>]*>', html, re.I):
                  print("OG:VIDEO META:", m.group(0)[:300])

              for m in re.finditer(r'<video\b[^>]*>.*?</video>', html, re.I | re.S):
                  print("VIDEO TAG:", m.group(0)[:500])
              for m in re.finditer(r'<source\b[^>]*>', html, re.I):
                  if 'video' in m.group(0).lower() or '.mp4' in m.group(0).lower():
                      print("SOURCE TAG:", m.group(0)[:300])

              for m in re.finditer(r'https?://[^\s"\'<>]+\.mp4[^\s"\'<>]*', html, re.I):
                  print("MP4 LINK:", m.group(0)[:300])

              for m in re.finditer(r'<iframe\b[^>]*src=["\']([^"\']+)["\'][^>]*>', html, re.I):
                  print("IFRAME:", m.group(1)[:300])

              for pat in [r'jwplayer', r'videojs', r'bunnycdn', r'wp-video', r'mediaelement', r'\.m3u8']:
                  hits = re.findall(pat, html, re.I)
                  if hits:
                      print(f"PADRAO '{pat}' encontrado {len(hits)}x")

              for m in re.finditer(r'<(figure|div)[^>]*class=["\'][^"\']*video[^"\']*["\'][^>]*>', html, re.I):
                  print("BLOCO CLASSE VIDEO:", m.group(0)[:300])

              idx = html.lower().find('<video')
              if idx >= 0:
                  print("CONTEXTO ANTES/DEPOIS DE <video>:")
                  print(html[max(0, idx-200):idx+800])

          mais = descobrir_mais_urls(4)
          print(f"URLs adicionais descobertas via sitemap: {len(mais)}")
          todas = URLS + [u for u in mais if u not in URLS]
          com_video = 0
          for url in todas:
              try:
                  html = fetch(url)
                  achou_antes = ('<video' in html.lower()) or ('og:video' in html.lower()) or ('.mp4' in html.lower())
                  if achou_antes:
                      com_video += 1
                  find_patterns(html, url)
              except Exception as e:
                  print(f"ERRO ao buscar {url}: {e}")
          print(f"\n\nRESUMO: {com_video}/{len(todas)} páginas tinham algum sinal de vídeo (video tag / og:video / .mp4)")
          PYEOF
