name: Diagnóstico único — reteste de curtida horas depois (propagação vs bloqueio estrutural)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Retestar likeMedia horas depois do accept original
        run: node .github/workflows/_diag_like_retest_hours_later.mjs
