name: Diagnóstico único (por que o request do vídeo aborta)

on:
  workflow_dispatch:
  push:
    branches: [claude/diag-video-nao-aparece]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Testar a URL do vídeo direto (sem Range, com Range, e checar o bucket)
        run: |
          URL="https://yntwvfcxjardzafdqanj.supabase.co/storage/v1/object/public/post-videos/videos/1788291566365-vr6om3.mp4"
          echo "=== GET sem Range (só headers) ==="
          curl -sS -D - -o /dev/null -m 20 "$URL"
          echo
          echo "=== GET com Range (como um <video> pede) ==="
          curl -sS -D - -o /dev/null -m 20 -H "Range: bytes=0-1023" "$URL"
          echo
          echo "=== Info do bucket post-videos (config pública/privada real) ==="
          curl -sS -m 20 "https://yntwvfcxjardzafdqanj.supabase.co/storage/v1/bucket/post-videos" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          echo
