name: Diagnóstico único (placeholder — inerte)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: "Estado real da fila de Reels nas ultimas 20-24h"
        run: |
          cat > _diag_fila.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";

          const SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co";
          const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40";
          const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

          function parseJsonMaybe(v, fb) {
            if (v && typeof v === "object") return v;
            try { return JSON.parse(v || ""); } catch (_) { return fb; }
          }

          async function main() {
            console.log("=== CONFIG (automacao ligada?) ===");
            const { data: cfg } = await supabase.from("config").select("key,value,updated_at").in("key", ["REELS_AUTOMATION_ENABLED","REELS_AUTOMATION_LAST_RUN","IG_AUTOMATION_ENABLED"]);
            for (const c of (cfg||[])) console.log(`${c.key} = ${c.value} (updated_at: ${c.updated_at})`);

            console.log("\n=== POSTS COM instagram_reel_template (todos, sem filtro de data) ===");
            const { data: posts, error } = await supabase
              .from("posts")
              .select("id,titulo,metrics,updated_at,created_at")
              .not("metrics->instagram_reel_template", "is", null)
              .order("updated_at", { ascending: false })
              .limit(500);
            if (error) { console.error("ERRO:", error); process.exit(1); }
            console.log(`total com template: ${posts.length}`);

            const now = Date.now();
            const porStatus = {};
            let maisRecenteReady = null;
            let maisRecentePublicado = null;
            for (const p of posts) {
              const m = parseJsonMaybe(p.metrics, {});
              const t = m.instagram_reel_template || {};
              const status = t.status || "???";
              porStatus[status] = (porStatus[status]||0) + 1;
              if (status === "ready" && (!maisRecenteReady || t.ready_at > maisRecenteReady.ready_at)) {
                maisRecenteReady = { id: p.id, titulo: p.titulo, ready_at: t.ready_at };
              }
              if (m.instagram_reel?.ig_id && (!maisRecentePublicado || m.instagram_reel.claimed_at > maisRecentePublicado.claimed_at)) {
                maisRecentePublicado = { id: p.id, titulo: p.titulo, claimed_at: m.instagram_reel.claimed_at, published_at: m.instagram_reel.published_at };
              }
            }
            console.log("distribuicao por status:", JSON.stringify(porStatus, null, 2));
            console.log("\nultimo que ficou READY:", JSON.stringify(maisRecenteReady, null, 2));
            console.log("\nultimo REEL de fato publicado:", JSON.stringify(maisRecentePublicado, null, 2));

            console.log("\n=== DETALHE de cada item error/processing/pending (mais recentes 15) ===");
            for (const p of posts.slice(0, 15)) {
              const m = parseJsonMaybe(p.metrics, {});
              const t = m.instagram_reel_template || {};
              const idadeH = ((now - new Date(p.updated_at).getTime()) / 3600000).toFixed(1);
              console.log(`[${t.status}] attempts=${t.attempts} exhausted=${t.exhausted} idade_updated_at=${idadeH}h — ${p.titulo} — last_error=${t.last_error||''}`);
            }

            console.log("\n=== LOGS reels-render/reel ultimas entradas ===");
            const { data: logs } = await supabase
              .from("logs")
              .select("level,message,created_at")
              .ilike("message", "%reel%")
              .order("created_at", { ascending: false })
              .limit(25);
            for (const l of (logs||[])) console.log(`${l.created_at} [${l.level}] ${l.message}`);
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });
          JSEOF
          node _diag_fila.mjs
          rm -f _diag_fila.mjs
