name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Contagem REAL por dia (teste anterior truncou em 1000 linhas, ficou so em 23-26/10) - agora via count=exact por dia
        env:
          SB_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          python3 << 'PYEOF'
          import urllib.request, os, datetime
          SB_URL = os.environ["SB_URL"]
          SB_KEY = os.environ["SB_KEY"]
          def count_day(day_str):
              start = day_str + "T00:00:00"
              end_dt = datetime.date.fromisoformat(day_str) + datetime.timedelta(days=1)
              end = end_dt.isoformat() + "T00:00:00"
              url = (f"{SB_URL}/rest/v1/posts?select=id&status=eq.publicado"
                     f"&published_at=gte.{start}&published_at=lt.{end}&limit=1")
              req = urllib.request.Request(url, headers={
                  "apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}",
                  "Prefer": "count=exact", "Range-Unit": "items", "Range": "0-0"
              })
              with urllib.request.urlopen(req, timeout=20) as resp:
                  cr = resp.headers.get("Content-Range", "")
              # formato: "0-0/1234"
              total = cr.split("/")[-1] if "/" in cr else "?"
              return total
          print("=== Posts publicados por dia (contagem exata via Content-Range, sem cap de 1000) ===")
          d = datetime.date(2026, 10, 20)
          end_d = datetime.date(2026, 11, 6)
          while d <= end_d:
              ds = d.isoformat()
              try:
                  total = count_day(ds)
              except Exception as e:
                  total = f"ERRO: {e}"
              print(f"{ds}: {total}")
              d += datetime.timedelta(days=1)
          PYEOF
      - name: Contagem por hora especificamente em 27/10-03/11 (zoom na janela do gap do watchdog)
        env:
          SB_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          python3 << 'PYEOF'
          import urllib.request, os, datetime
          SB_URL = os.environ["SB_URL"]
          SB_KEY = os.environ["SB_KEY"]
          def count_hour(start_dt):
              end_dt = start_dt + datetime.timedelta(hours=1)
              url = (f"{SB_URL}/rest/v1/posts?select=id&status=eq.publicado"
                     f"&published_at=gte.{start_dt.isoformat()}&published_at=lt.{end_dt.isoformat()}&limit=1")
              req = urllib.request.Request(url, headers={
                  "apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}",
                  "Prefer": "count=exact", "Range-Unit": "items", "Range": "0-0"
              })
              with urllib.request.urlopen(req, timeout=20) as resp:
                  cr = resp.headers.get("Content-Range", "")
              return cr.split("/")[-1] if "/" in cr else "?"
          print("=== Posts por hora, 27/10 12h -> 03/11 00h (zoom no periodo do gap do watchdog) ===")
          t = datetime.datetime(2026, 10, 27, 12, 0, 0)
          end_t = datetime.datetime(2026, 11, 3, 0, 0, 0)
          zero_hours = []
          while t < end_t:
              try:
                  total = count_hour(t)
              except Exception as e:
                  total = f"ERRO:{e}"
              marker = "  <<<< ZERO" if total == "0" else ""
              print(f"{t.isoformat()}: {total}{marker}")
              if total == "0":
                  zero_hours.append(t.isoformat())
              t += datetime.timedelta(hours=1)
          print(f"\nTotal de horas com ZERO posts nessa janela: {len(zero_hours)}")
          PYEOF
