on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Testar brapi.dev v2 currency e crypto com o token real
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          def sb_get(path):
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/{path}",
                  headers={"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"},
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          def test(url, label):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read().decode()
                      print(f"{label}: HTTP {r.status}")
                      print(f"  {body[:600]}")
              except urllib.error.HTTPError as e:
                  print(f"{label}: ERRO HTTP {e.code} | {e.read().decode()[:300]}")
              except Exception as e:
                  print(f"{label}: ERRO -> {type(e).__name__}: {e}")
              print("---")

          rows = sb_get("config?select=value&key=eq.BRAPI_TOKEN")
          token = rows[0]["value"] if rows else None

          test(f"https://brapi.dev/api/v2/currency?currency=USD-BRL,EUR-BRL,GBP-BRL&token={token}", "brapi v2 currency")
          test(f"https://brapi.dev/api/v2/crypto?coin=BTC&currency=BRL&token={token}", "brapi v2 crypto BTC")
          PYEOF
