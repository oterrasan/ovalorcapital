name: Diagnóstico único (placeholder) — checar campo exhausted
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Checar campo exhausted dos 2 posts com erro
        run: |
          cat > _diag_exh.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";
          const supabase = createClient(
            "https://yntwvfcxjardzafdqanj.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          );
          const ids = ["896aad2b-5996-40d1-b68c-1e22245c8ae3", "67d4cf81-f159-4fcd-a9b1-1e850325fb32"];
          for (const id of ids) {
            const { data: post } = await supabase.from("posts").select("id,titulo,metrics").eq("id", id).single();
            const m = typeof post.metrics === "string" ? JSON.parse(post.metrics) : post.metrics;
            console.log(post.titulo, "=>", JSON.stringify(m.instagram_reel_template, null, 2));
          }
          JSEOF
          node _diag_exh.mjs
          rm -f _diag_exh.mjs
