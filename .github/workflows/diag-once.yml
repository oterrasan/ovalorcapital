name: Diag Once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test outros_esportes e futebol pos-fix GEMINI_DAILY_BUDGET
        run: |
          echo "=== outros_esportes ==="
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" -H "Content-Type: application/json" -d '{"tipo":"outros_esportes","force":true,"count":2}' | head -c 2000
          echo
          echo "=== futebol ==="
          curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" -H "Content-Type: application/json" -d '{"tipo":"futebol","force":true,"count":2}' | head -c 2000
          echo
          echo "=== FIM ==="
