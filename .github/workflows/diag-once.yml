name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Achar uma matéria de ontem do Bacci que tenha vídeo
        run: |
          python3 << 'PYEOF'
          import re
          import urllib.request
          from datetime import datetime, timedelta, timezone

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          def fetch(url, timeout=10):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="replace")

          idx = fetch("https://baccinoticias.com.br/sitemap_index.xml")
          locs = re.findall(r'<loc>(.*?)</loc>', idx)
          post_sitemaps = [l for l in locs if re.search(r'/post-sitemap\d*\.xml$', l)]
          chunk = post_sitemaps[-1]
          print("chunk atual:", chunk)
          sm = fetch(chunk)
          blocos = re.findall(r'<url>([\s\S]*?)</url>', sm)

          agora = datetime.now(timezone.utc)
          ontem_ini = agora - timedelta(hours=48)
          ontem_fim = agora - timedelta(hours=6)

          candidatos = []
          for b in blocos:
              loc_m = re.search(r'<loc>(.*?)</loc>', b)
              lastmod_m = re.search(r'<lastmod>(.*?)</lastmod>', b)
              if not loc_m or not lastmod_m:
                  continue
              loc = loc_m.group(1)
              lastmod = lastmod_m.group(1)
              if re.search(r'vi-no-instagram|categoria|category|/tag/|/page/', loc, re.I):
                  continue
              try:
                  dt = datetime.fromisoformat(lastmod.replace("Z", "+00:00"))
              except Exception:
                  continue
              if ontem_ini <= dt <= ontem_fim:
                  candidatos.append((loc, lastmod))

          candidatos.sort(key=lambda c: c[1], reverse=True)
          print(f"candidatos na janela 6h-48h atras: {len(candidatos)}")

          achou = None
          for loc, lastmod in candidatos[:25]:
              try:
                  html = fetch(loc, timeout=8)
              except Exception as e:
                  print(f"  erro ao buscar {loc}: {e}")
                  continue
              if re.search(r'estatico/bacci\.php\?video=\d+', html):
                  print(f"COM VIDEO: {loc} ({lastmod})")
                  if not achou:
                      achou = loc
              else:
                  print(f"sem video: {loc} ({lastmod})")

          print("\n\nMELHOR CANDIDATO PRA TESTE:", achou or "NENHUM ACHADO")
          PYEOF
