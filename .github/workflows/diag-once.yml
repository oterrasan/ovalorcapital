name: Diagnóstico único (placeholder)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar em produção — home mostra histórico completo de novo
        run: |
          curl -sS "https://www.obrasilon.com.br/api/portal-posts?limit=10" \
            -w "\nHTTP_STATUS:%{http_code}\n" --max-time 20 || echo "FALHOU"
