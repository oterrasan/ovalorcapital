name: Diagnóstico — o que o Instagram devolve de verdade pro nosso scraper
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: O que o Instagram devolve pro nosso scraper (link real de Roberto)
        run: node .github/workflows/_diag_instagram_scrape.mjs
