name: Diagnóstico único (checar token real do Instagram — ig_accounts)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checar ig_accounts + debug_token
        run: python3 scripts/one-off/check_ig_token.py
