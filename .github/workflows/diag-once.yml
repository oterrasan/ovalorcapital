name: Diagnóstico único — comparar conteúdo real (hash+frame) dos 2 vídeos do print
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Comparar conteudo real dos 2 videos
        run: node .github/workflows/_diag_video_null_check.mjs
      - name: Upload dos frames extraidos
        uses: actions/upload-artifact@v4
        with:
          name: frames-comparacao
          path: |
            rick-frame.jpg
            dentista-frame.jpg
          retention-days: 1
