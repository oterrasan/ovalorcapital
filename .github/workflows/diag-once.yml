name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Localizar posts recentes com video_url
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          curl -sS "${SUPABASE_URL}/rest/v1/posts?select=id,titulo,status,video_url,metrics,updated_at,created_at&video_url=not.is.null&order=created_at.desc&limit=20" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" -o posts.json
          cat posts.json | node -e '
            const posts = JSON.parse(require("fs").readFileSync("posts.json","utf8"));
            console.log("total com video_url:", posts.length);
            for (const p of posts) {
              let m = null;
              try { m = typeof p.metrics === "string" ? JSON.parse(p.metrics) : p.metrics; } catch(_) {}
              console.log(JSON.stringify({
                id: p.id, titulo: p.titulo, status: p.status,
                video_url: p.video_url,
                has_template: !!m?.instagram_reel_template,
                template: m?.instagram_reel_template || null,
                created_at: p.created_at
              }));
            }
          '
