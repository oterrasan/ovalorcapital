name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Reset do post + confirma peek com o fix deployado
        run: |
          cat > _diag_reset.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";
          import axios from "axios";

          const supabase = createClient(
            "https://yntwvfcxjardzafdqanj.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          );

          const POST_ID = "ae62a0f9-6e56-463e-bda8-18c25db2b52f";

          async function main() {
            console.log("=== 1) Estado ANTES do reset ===");
            const { data: before } = await supabase.from("posts").select("metrics").eq("id", POST_ID).single();
            const metricsBefore = typeof before.metrics === "string" ? JSON.parse(before.metrics) : before.metrics;
            console.log(JSON.stringify(metricsBefore.instagram_reel_template, null, 2));

            console.log("\n=== 2) Resetando pra estado 'pending' limpo (source_url preservado) ===");
            const sourceUrl = metricsBefore.instagram_reel_template.source_url;
            const metricsNovo = {
              ...metricsBefore,
              instagram_reel_template: {
                version: "ovc-reels-2026-09-v2",
                status: "pending",
                source_url: sourceUrl,
                queued_at: new Date().toISOString(),
                attempts: 0
              }
            };
            const { error } = await supabase.from("posts").update({ metrics: metricsNovo, updated_at: new Date().toISOString() }).eq("id", POST_ID);
            if (error) { console.log("erro no reset:", error.message); return; }
            console.log("reset OK");

            console.log("\n=== 3) Confirmando via peek na API real (já com o fix deployado) ===");
            // pequena espera pra garantir propagação
            await new Promise(r => setTimeout(r, 2000));
            const r = await axios.post("https://www.ovalorcapital.com.br/api/manage",
              { action: "reels_render_job", peek: true, token: "ovc-admin-2026-secreto" },
              { timeout: 20000, headers: { "Content-Type": "application/json" } }
            );
            console.log(JSON.stringify(r.data));
          }

          main().catch(e => {
            if (e.response) console.error("ERRO HTTP:", e.response.status, JSON.stringify(e.response.data));
            else console.error("ERRO FATAL:", e?.message || e);
            process.exit(1);
          });

          JSEOF
          node _diag_reset.mjs
          rm -f _diag_reset.mjs
