name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar captura automática de vídeo do Bacci em produção
        run: |
          python3 << 'PYEOF'
          import json
          import time
          import urllib.request

          BASE = "https://www.ovalorcapital.com.br"
          PASS = "ovc-admin-2026-secreto"

          def get_json(url, timeout=60):
              req = urllib.request.Request(url, headers={"User-Agent": "diag-video-bacci"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          print("Disparando autoBrasilOn (count=1) em producao real...")
          url_run = f"{BASE}/api/run_portal?tipo=brasilon&force=true&count=2&pass={PASS}"
          try:
              resultado = get_json(url_run, timeout=70)
              print("RESULTADO run_portal:", json.dumps(resultado, ensure_ascii=False))
          except Exception as e:
              print(f"ERRO ao chamar run_portal: {e}")
              resultado = None

          time.sleep(3)

          print("\nConsultando posts recentes de brasil-on via API publica...")
          url_lista = f"{BASE}/api/portal-posts?recentes=true&categoria=brasil-on&limit=5"
          try:
              lista = get_json(url_lista, timeout=20)
              posts = lista.get("posts") or lista.get("data") or []
              print(f"total de posts retornados: {len(posts)}")
              for p in posts[:5]:
                  print(f"  id={p.get('id')} titulo={str(p.get('titulo'))[:60]!r} publicado_em={p.get('data')}")
          except Exception as e:
              print(f"ERRO ao listar posts: {e}")
              posts = []

          for p in posts[:5]:
              post_id = p.get("id")
              print(f"\nConsultando artigo individual: {post_id} — {str(p.get('titulo'))[:60]!r}")
              url_um = f"{BASE}/api/portal-posts?id={post_id}"
              try:
                  um = get_json(url_um, timeout=20)
                  metrics = um.get("metrics") or {}
                  template = metrics.get("instagram_reel_template")
                  print("  CAMPO 'video' exposto ao publico:", repr(um.get("video")))
                  print("  metrics.instagram_reel_template:", json.dumps(template, ensure_ascii=False) if template else None)
              except Exception as e:
                  print(f"  ERRO ao buscar artigo individual: {e}")
          PYEOF
