name: diag-once (contagens reais — somente leitura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://yntwvfcxjardzafdqanj.supabase.co/rest/v1"
          H1="apikey: $SB_KEY"; H2="Authorization: Bearer $SB_KEY"
          echo "== config total =="
          curl -s -o /dev/null -w "%{http_code}\n" -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&limit=1"
          curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&limit=1" | grep -i content-range
          echo "== config GEMINI_BUDGET (todas as datas) =="
          curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&key=like.GEMINI_BUDGET_*&limit=1" | grep -i content-range
          HOJE=$(TZ=America/Sao_Paulo date +%Y%m%d)
          echo "== config GEMINI_BUDGET de hoje ($HOJE) =="
          curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/config?select=key&key=like.GEMINI_BUDGET_${HOJE}*&limit=1" | grep -i content-range
          INICIO7=$(TZ=UTC date -u -d "-7 days" +%Y-%m-%dT%H:%M:%S)
          echo "== posts últimos 7 dias =="
          curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/posts?select=id&created_at=gte.${INICIO7}&limit=1" | grep -i content-range
          echo "== logs últimos 7 dias =="
          curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/logs?select=level&created_at=gte.${INICIO7}&limit=1" | grep -i content-range
          echo "== logs level=error últimos 7 dias =="
          curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/logs?select=level&created_at=gte.${INICIO7}&level=eq.error&limit=1" | grep -i content-range
          echo "== logs total (sem filtro de data) =="
          curl -sI -H "$H1" -H "$H2" -H "Prefer: count=exact" "$B/logs?select=level&limit=1" | grep -i content-range
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
