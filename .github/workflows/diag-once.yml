name: Diagnóstico único (temporário — será resetado ao placeholder após uso)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar artigos reais de futebol publicados (evidencia final)
        run: |
          curl -s --max-time 20 "https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&categoria=esportes&limit=300" \
            | python3 -c "
import json,sys
d=json.load(sys.stdin)
posts=d.get('posts') or d.get('items') or []
fut=[p for p in posts if 'futebol' in json.dumps(p.get('subcategoria') or p.get('user_tags') or '').lower() or 'futebol' in (p.get('titulo') or '').lower()]
print('TOTAL_ESPORTES:', len(posts))
for p in posts[:8]:
  print(p.get('published_at') or p.get('created_at'), '|', p.get('titulo'))
"
