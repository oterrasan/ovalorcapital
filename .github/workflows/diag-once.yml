name: Diagnóstico — verificar GEMINI_API_KEY_3 real no Supabase
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Verificar e testar GEMINI_API_KEY_3
        run: node .github/workflows/_diag_verify_gemini_key3.mjs
