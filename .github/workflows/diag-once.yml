name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnostico - sistema parado as 18h18 BRT
        run: python3 scripts/one-off/diag-sistema-parado.py
