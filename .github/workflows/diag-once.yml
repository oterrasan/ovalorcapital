name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-once.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Investiga SBT News Shorts — HTML bruto e possíveis URLs de vídeo
        run: |
          echo "=== HTML bruto de /videos ==="
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            "https://sbtnews.sbt.com.br/videos" -o /tmp/sbt.html
          wc -c /tmp/sbt.html
          echo "--- content-type real (via -I) ---"
          curl -sI -A "Mozilla/5.0" "https://sbtnews.sbt.com.br/videos" | head -20

          echo ""
          echo "=== Tem __NEXT_DATA__? ==="
          grep -o "__NEXT_DATA__" /tmp/sbt.html | head -1 || echo "não achou __NEXT_DATA__"

          echo ""
          echo "=== URLs .mp4 soltas no HTML ==="
          grep -oE 'https?://[^"'"'"'\\ ]+\.mp4[^"'"'"'\\ ]*' /tmp/sbt.html | sort -u | head -20

          echo ""
          echo "=== URLs .m3u8 (HLS) soltas no HTML ==="
          grep -oE 'https?://[^"'"'"'\\ ]+\.m3u8[^"'"'"'\\ ]*' /tmp/sbt.html | sort -u | head -20

          echo ""
          echo "=== Domínios de CDN de vídeo mencionados (globo, cloudfront, akamai, etc) ==="
          grep -oE '[a-zA-Z0-9.-]*(cdn|video|stream|media|akamai|cloudfront|globo)[a-zA-Z0-9.-]*\.[a-z]{2,}' /tmp/sbt.html | sort -u | head -30

          echo ""
          echo "=== primeiros 3000 chars do HTML (visual geral) ==="
          head -c 3000 /tmp/sbt.html
      - name: Tenta achar API JSON de listagem de vídeos (Next.js costuma expor /_next/data ou API própria)
        run: |
          python3 << 'PYEOF'
          import re
          html = open("/tmp/sbt.html", encoding="utf-8", errors="ignore").read()
          m = re.search(r'"buildId":"([^"]+)"', html)
          print("buildId:", m.group(1) if m else "não achado")
          # procura qualquer coisa parecida com endpoint de API
          apis = set(re.findall(r'https?://[a-zA-Z0-9._-]+api[a-zA-Z0-9._/-]*', html))
          print("possiveis APIs:", list(apis)[:20])
          PYEOF
