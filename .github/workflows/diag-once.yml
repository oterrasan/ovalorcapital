name: Diagnóstico único — limpar os 3 reel_template quebrados (live_stream)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Consultar reel templates com source_url live_stream
        run: node .github/workflows/_diag_livestream.mjs
