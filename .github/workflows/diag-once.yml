name: Diagnóstico único (forçar 10 publicações no Instagram — comando manual)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar ig_auto_publish 10 vezes em produção
        run: |
          URL="https://www.ovalorcapital.com.br/api/manage"
          TOKEN="ovc-admin-2026-secreto"
          OK=0
          for i in $(seq 1 10); do
            echo "=== Tentativa $i ==="
            RESP=$(curl -s --max-time 60 -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"ig_auto_publish\",\"token\":\"$TOKEN\"}")
            echo "$RESP" | jq '.' 2>/dev/null || echo "$RESP"
            OK_FLAG=$(echo "$RESP" | jq -r '.ok // false' 2>/dev/null)
            SKIPPED=$(echo "$RESP" | jq -r '.skipped // false' 2>/dev/null)
            if [ "$OK_FLAG" = "true" ] && [ "$SKIPPED" != "true" ]; then
              OK=$((OK+1))
            fi
            if [ "$SKIPPED" = "true" ]; then
              echo "Parando — sem mais candidatos elegíveis ou limite atingido."
              break
            fi
          done
          echo "=== RESUMO: $OK publicações reais confirmadas ==="
