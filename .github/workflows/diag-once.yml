name: Diagnóstico único (corrige 4 imagens mock do OPMED — temporário)

# One-off: revisão visual das 8 imagens baixadas em rodada anterior achou
# 4 problemáticas — uma é gravura histórica a lápis (não fotografia real,
# "A tooth-drawer examining..." Wellcome), e três têm contexto militar
# americano muito explícito (fardas, crachá "Guantanamo Bay", camiseta
# "ARMY" grande) — deslocado de um portal brasileiro de saúde/notícias.
# Substitui só essas 4 (odontologia-2, bemestar-1, bemestar-2,
# saudepublica-2) por fotos reais e neutras. Reset pro placeholder assim
# que confirmado (com verificação visual de novo antes de considerar
# fechado).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opmed-scaffold

      - name: Substitui as 4 imagens problemáticas (Wikimedia Commons)
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, os

          UA = "OPMED-mock-image-fetch/1.0 (internal test; contact: n/a)"
          BAD_WORDS = ["military", "army", "navy", "marine", "guantanamo", "soldier", "air force", "national guard", "wellcome"]

          def api_get(params):
              url = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode())

          def download(url, dest):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=25) as r:
                  data = r.read()
              with open(dest, "wb") as f:
                  f.write(data)
              return len(data)

          # dest_name -> lista de termos de busca (tenta cada um até achar 1 válido)
          targets = {
              "odontologia-2": ["modern dental clinic photograph", "dentist smiling patient photograph", "dental checkup photograph"],
              "bemestar-1": ["woman stretching park photograph", "outdoor yoga class photograph", "person walking exercise park photograph"],
              "bemestar-2": ["gym workout photograph", "runner jogging park photograph", "fitness class photograph"],
              "saudepublica-2": ["nurse patient hospital photograph", "community health worker photograph", "family doctor consultation photograph"],
          }

          os.makedirs("opmed/public/assets/mock", exist_ok=True)
          done = []

          for dest_name, terms in targets.items():
              found = False
              for term in terms:
                  if found:
                      break
                  try:
                      data = api_get({
                          "action": "query", "format": "json", "generator": "search",
                          "gsrsearch": term + " filetype:bitmap", "gsrnamespace": "6", "gsrlimit": "15",
                          "prop": "imageinfo", "iiprop": "url|extmetadata|mime", "iiurlwidth": "900",
                      })
                  except Exception as e:
                      print(f"ERRO busca {dest_name}/{term}: {e}")
                      continue
                  pages = data.get("query", {}).get("pages", {})
                  for pid, page in pages.items():
                      if found:
                          break
                      info = (page.get("imageinfo") or [{}])[0]
                      mime = info.get("mime", "")
                      if mime not in ("image/jpeg", "image/png"):
                          continue
                      url = info.get("thumburl") or info.get("url")
                      if not url:
                          continue
                      title = page.get("title", "")
                      title_low = title.lower()
                      if any(bw in title_low for bw in BAD_WORDS):
                          print(f"PULADO (palavra bloqueada) {dest_name}: {title}")
                          continue
                      license_short = (info.get("extmetadata", {}) or {}).get("LicenseShortName", {}).get("value", "?")
                      if not any(k in license_short.lower() for k in ["public domain", "cc0", "pd", "cc-by"]):
                          print(f"PULADO (licença {license_short}) {dest_name}: {title}")
                          continue
                      dest = f"opmed/public/assets/mock/{dest_name}.jpg"
                      try:
                          size = download(url, dest)
                      except Exception as e:
                          print(f"ERRO download {title}: {e}")
                          continue
                      found = True
                      print(f"OK {dest_name}.jpg <- {title} | licenca={license_short} | {size} bytes | {url}")
                      done.append((dest_name, title, license_short, url))
              if not found:
                  print(f"AVISO: nenhuma imagem válida encontrada pra {dest_name} — mantendo a anterior")

          print("=== RESUMO ===")
          for d in done:
              print(d)
          PYEOF

      - name: Lista arquivos finais
        run: ls -la opmed/public/assets/mock/

      - name: Commit e push das imagens corrigidas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opmed/public/assets/mock/
          git status
          git commit -m "fix(opmed): substitui imagens mock militares/gravura por fotos reais e neutras" || echo "nada novo pra commitar"
          git push origin HEAD:feat/opmed-scaffold
