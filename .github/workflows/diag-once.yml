name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Só LEITURA — checar se a publicação automática de Reels está ligada
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request

          SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"

          def sb_get(path):
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/{path}",
                  headers={"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"}
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode("utf-8"))

          print("=== SOMENTE LEITURA — nada é alterado neste diagnóstico ===\n")

          rows = sb_get("config?key=in.(REELS_AUTOMATION_ENABLED,REELS_AUTOMATION_LAST_RUN)&select=key,value,updated_at&order=updated_at.desc")
          print("Linhas de config encontradas:")
          for r in rows:
              print(f"  {r['key']} = {r['value']!r} (atualizado em {r['updated_at']})")

          latest = {}
          for r in rows:
              if r["key"] not in latest:
                  latest[r["key"]] = r["value"]

          enabled = latest.get("REELS_AUTOMATION_ENABLED") == "on"
          print(f"\nRESULTADO: publicação automática de Reels está {'LIGADA' if enabled else 'DESLIGADA'} agora.")
          PYEOF
