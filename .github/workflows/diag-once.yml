name: Diagnóstico único (placeholder) — inspecionar URL real com video confirmado por Roberto
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: "Seguir a cadeia real ate o video: bacci.php?video=97693 - existe link /videos/ dentro dele?"
        run: |
          cat > _diag_real2.mjs << 'JSEOF'
          import axios from "axios";

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          async function main() {
            const urlIframe = "https://baccinoticias.com.br/estatico/bacci.php?video=97693&limit=1&v=1.0";
            const res = await axios.get(urlIframe, { timeout: 10000, headers: { "User-Agent": UA } });
            const html = String(res.data || "");
            console.log(`tamanho total do HTML do iframe: ${html.length}`);
            console.log(`\n=== HTML COMPLETO ===`);
            console.log(html);

            console.log(`\n\n=== TESTANDO REGEX _BACCI_VIDEOS_PAGE_RE contra este HTML ===`);
            const _BACCI_VIDEOS_PAGE_RE = /href="(https:\/\/baccinoticias\.com\.br\/videos\/[^"]+)"/i;
            const linkM = html.match(_BACCI_VIDEOS_PAGE_RE);
            if (linkM) {
              console.log(`MATCH ENCONTRADO: ${linkM[1]}`);
            } else {
              console.log(`SEM MATCH — regex nao encontrou nenhum href de /videos/ neste HTML`);
            }

            // fallback: qualquer href de /videos/ com regex mais solta (aspas simples tb)
            const looseM = [...html.matchAll(/(?:href|src)=['"]([^'"]*\/videos\/[^'"]+)['"]/gi)];
            console.log(`\n=== BUSCA SOLTA por /videos/ em qualquer atributo href/src (${looseM.length} match(es)) ===`);
            for (const m of looseM) console.log(m[1]);

            // qualquer bunny/mp4/b-cdn direto neste html
            for (const termo of ["bunny", "b-cdn", "mediadelivery", "vz-", ".mp4", "iframe", "data-video"]) {
              const idx = html.toLowerCase().indexOf(termo.toLowerCase());
              if (idx >= 0) {
                console.log(`\n--- ocorrencia de "${termo}" em pos ${idx} ---`);
                console.log(html.slice(Math.max(0, idx - 150), idx + 350).replace(/\s+/g, " "));
              } else {
                console.log(`"${termo}": NAO encontrado`);
              }
            }
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });
          JSEOF
          node _diag_real2.mjs
          rm -f _diag_real2.mjs
