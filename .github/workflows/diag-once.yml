name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Inspecionar bytes reais dos vídeos com ProcessingFailedError
        run: |
          cat > _diag_video_quebrado.mjs << 'JSEOF'
          import { createClient } from "@supabase/supabase-js";
          import { spawn } from "node:child_process";
          import { writeFile } from "node:fs/promises";
          import axios from "axios";

          const supabase = createClient(
            "https://yntwvfcxjardzafdqanj.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          );

          function runCapture(cmd, args) {
            return new Promise((resolve, reject) => {
              const child = spawn(cmd, args, { stdio: ["ignore", "pipe", "pipe"] });
              const out = []; const err = [];
              child.stdout.on("data", d => out.push(d));
              child.stderr.on("data", d => err.push(d));
              child.on("error", reject);
              child.on("exit", code => resolve({ code, stdout: Buffer.concat(out).toString(), stderr: Buffer.concat(err).toString() }));
            });
          }

          async function main() {
            console.log("=== Posts com erro ProcessingFailedError — inspecionando o vídeo real armazenado ===");
            const { data: posts } = await supabase
              .from("posts")
              .select("id,titulo,video_url,metrics")
              .not("metrics->instagram_reel_template", "is", null);

            let algumComErro = false;
            for (const p of posts || []) {
              const m = typeof p.metrics === "string" ? JSON.parse(p.metrics) : p.metrics;
              const t = m?.instagram_reel_template || {};
              if (t.status !== "error") continue;
              algumComErro = true;
              console.log(`\n--- ${p.titulo?.slice(0, 70)} ---`);
              console.log(`post_id: ${p.id}`);
              console.log(`source_url: ${t.source_url}`);
              console.log(`attempts: ${t.attempts} | last_error: ${(t.last_error || "").slice(0, 200)}`);

              try {
                const res = await axios.get(t.source_url, { responseType: "arraybuffer", timeout: 30000, maxContentLength: 50 * 1024 * 1024 });
                const buf = Buffer.from(res.data);
                await writeFile("/tmp/check.bin", buf);
                console.log(`tamanho real baixado: ${buf.length} bytes | content-type do servidor: ${res.headers["content-type"]}`);
                console.log(`primeiros 32 bytes (hex): ${buf.slice(0, 32).toString("hex")}`);
                console.log(`primeiros 200 bytes como texto (pra ver se é HTML): ${buf.slice(0, 200).toString("utf8").replace(/\n/g, "\\n")}`);
                const probe = await runCapture("ffprobe", ["-v", "error", "-show_entries", "format=format_name,duration,size:stream=codec_type,codec_name,width,height,pix_fmt", "-of", "default=noprint_wrappers=0", "/tmp/check.bin"]);
                console.log(`ffprobe exit code: ${probe.code}`);
                console.log(`ffprobe stdout:\n${probe.stdout}`);
                if (probe.stderr) console.log(`ffprobe stderr: ${probe.stderr.slice(0, 500)}`);
              } catch (e) {
                console.log(`ERRO ao baixar/analisar: ${e?.message || e}`);
              }
            }
            if (!algumComErro) console.log("Nenhum post com status:error encontrado agora.");
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });

          JSEOF
          node _diag_video_quebrado.mjs
          rm -f _diag_video_quebrado.mjs
