name: Diagnóstico único — round 2, parâmetros exatos de produção sem overlay
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: |
          npm ci --omit=dev
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Probe isolado do upload resumível de Reel
        run: node .github/workflows/_diag_reels_probe.mjs
