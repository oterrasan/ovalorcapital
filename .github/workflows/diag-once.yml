name: Diagnóstico único (placeholder — inerte)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: "Testar descobrirPaginaVideoBacci contra amostra real de materias recentes"
        run: |
          cat > _diag_captura.mjs << 'JSEOF'
          import axios from "axios";
          import { descobrirPaginaVideoBacci } from "./core/brasilon.js";

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          async function pegarUrlsRecentes(n) {
            const idxRes = await axios.get("https://baccinoticias.com.br/sitemap_index.xml", { timeout: 10000, headers: { "User-Agent": UA } });
            const chunks = [...String(idxRes.data).matchAll(/<loc>([^<]*post-sitemap(\d+)\.xml)<\/loc>/g)]
              .map(m => ({ url: m[1], n: Number(m[2]) }))
              .sort((a, b) => b.n - a.n);
            const latest = chunks[0];
            console.log(`chunk mais recente: ${latest.url}`);
            const chunkRes = await axios.get(latest.url, { timeout: 10000, headers: { "User-Agent": UA } });
            const entries = [...String(chunkRes.data).matchAll(/<url>\s*<loc>([^<]+)<\/loc>\s*<lastmod>([^<]+)<\/lastmod>/g)]
              .map(m => ({ url: m[1], lastmod: m[2] }))
              .filter(e => /^https:\/\/baccinoticias\.com\.br\/[a-z0-9-]+\/?$/i.test(e.url)) // artigo real, nao pagina/categoria
              .sort((a, b) => new Date(b.lastmod) - new Date(a.lastmod));
            return entries.slice(0, n);
          }

          async function main() {
            const artigos = await pegarUrlsRecentes(30);
            console.log(`\ntestando ${artigos.length} artigos reais e recentes...\n`);
            let youtube = 0, bunny = 0, nenhum = 0;
            const detalhes = [];
            for (const a of artigos) {
              const t0 = Date.now();
              const resultado = await descobrirPaginaVideoBacci(a.url);
              const ms = Date.now() - t0;
              if (!resultado) { nenhum++; detalhes.push(`SEM VIDEO  (${ms}ms) — ${a.url}`); continue; }
              if (resultado.kind === "youtube") youtube++;
              if (resultado.kind === "bunny") bunny++;
              detalhes.push(`${resultado.kind.toUpperCase().padEnd(8)} (${ms}ms) — ${a.url} -> ${resultado.url}`);
            }
            console.log(detalhes.join("\n"));
            console.log(`\n=== RESUMO REAL ===`);
            console.log(`total testado: ${artigos.length}`);
            console.log(`youtube: ${youtube} | bunny/mp4: ${bunny} | sem video detectado: ${nenhum}`);
            console.log(`taxa de captura (youtube+bunny)/total: ${(((youtube + bunny) / artigos.length) * 100).toFixed(1)}%`);
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });
          JSEOF
          node _diag_captura.mjs
          rm -f _diag_captura.mjs
