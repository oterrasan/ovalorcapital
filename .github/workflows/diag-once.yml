name: diag-once (achar vídeo real do Metrópoles com marca — somente leitura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://yntwvfcxjardzafdqanj.supabase.co/rest/v1"
          H1="apikey: $SB_KEY"; H2="Authorization: Bearer $SB_KEY"
