name: Diagnóstico único (placeholder)

on:
  push:
    paths:
      - ".github/workflows/diag-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Extrai e baixa na mesma execução, sem delay — testa hipótese de token de curta duração
        run: |
          node << 'NODEEOF'
          const paginaUrl = "https://g1.globo.com/ms/mato-grosso-do-sul/video/em-video-e-possivel-escutar-desespero-de-vitima-durante-sequestro-em-bonito-14938018.ghtml";

          (async () => {
            const t0 = Date.now();
            const pageRes = await fetch(paginaUrl, {
              headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" }
            });
            const html = await pageRes.text();
            const m = html.match(/https?:\/\/[^"'\s<>]+\.mp4[^"'\s<>]*/i);
            const mp4Url = m ? m[0] : null;
            console.log("tempo até extrair:", Date.now() - t0, "ms");
            console.log("mp4Url:", mp4Url);
            if (!mp4Url) { console.log("nenhum mp4 achado"); return; }

            const t1 = Date.now();
            const vidRes = await fetch(mp4Url, {
              headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" }
            });
            console.log("tempo do fetch do mp4:", Date.now() - t1, "ms");
            console.log("status:", vidRes.status);
            console.log("headers:", JSON.stringify([...vidRes.headers.entries()]));
            const body = vidRes.ok ? "" : await vidRes.text().catch(() => "");
            if (!vidRes.ok) console.log("body:", body.slice(0, 500));
            else {
              const ab = await vidRes.arrayBuffer();
              console.log("bytes baixados:", ab.byteLength);
            }
          })().catch(e => console.log("ERRO GERAL:", e.message));
          NODEEOF
