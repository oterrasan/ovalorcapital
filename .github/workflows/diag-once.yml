name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências do projeto
        run: npm install --no-save @supabase/supabase-js sharp
      - name: Publicar matéria + vídeo + Reel no Instagram
        run: node _oneoff/publish.mjs
