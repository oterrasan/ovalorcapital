name: Diagnóstico único (placeholder) — inspecionar widget bacci.php?limit=15
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: "Buscar conteudo real do widget bacci.php?limit=15 (achado: presente em toda pagina)"
        run: |
          cat > _diag_widget.mjs << 'JSEOF'
          import axios from "axios";

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

          async function main() {
            const url = "https://baccinoticias.com.br/estatico/bacci.php?limit=15&v=1.0";
            const res = await axios.get(url, { timeout: 8000, headers: { "User-Agent": UA, "Referer": "https://baccinoticias.com.br/" } });
            const html = String(res.data || "");
            console.log(`tamanho do HTML do widget: ${html.length}`);
            console.log(`\n--- PRIMEIROS 6000 CHARS ---\n`);
            console.log(html.slice(0, 6000));

            console.log(`\n--- links/videos encontrados no widget ---`);
            const links = [...html.matchAll(/href=["']([^"']+)["']/gi)].map(m => m[1]);
            const uniqLinks = [...new Set(links)].slice(0, 30);
            for (const l of uniqLinks) console.log(`  href=${l}`);

            const ytIds = [...html.matchAll(/(?:youtube(?:-nocookie)?\.com\/(?:embed|watch\?v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/gi)].map(m => m[1]);
            console.log(`\nids de youtube encontrados no widget: ${JSON.stringify([...new Set(ytIds)])}`);
          }

          main().catch(e => { console.error("ERRO FATAL:", e?.message || e); process.exit(1); });
          JSEOF
          node _diag_widget.mjs
          rm -f _diag_widget.mjs
