name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Volume real publicado por canal, ultimos 10 dias BRT
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timedelta, timezone

          SUPABASE_URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          HEADERS = {"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"}

          def count(params):
              qs = urllib.parse.urlencode(params, safe=",.:")
              url = f"{SUPABASE_URL}/rest/v1/posts?{qs}"
              h = dict(HEADERS)
              h["Prefer"] = "count=exact"
              h["Range-Unit"] = "items"
              h["Range"] = "0-0"
              r = urllib.request.Request(url, headers=h, method="GET")
              with urllib.request.urlopen(r) as resp:
                  cr = resp.headers.get("Content-Range", "0/0")
                  total = cr.split("/")[-1]
                  return int(total) if total.isdigit() else 0

          METHODS = ["portal", "link_manual", "esportes_radar", "brasilon",
                     "jovempan_politica", "internacional", "fofocas", "colunista"]

          hoje_brt = datetime.now(timezone.utc) - timedelta(hours=3)
          dias = [(hoje_brt.date() - timedelta(days=i)) for i in range(1, 11)]  # ultimos 10 dias FECHADOS (ignora hoje, parcial)

          print("dia_brt     ; " + " ; ".join(f"{m:>17}" for m in METHODS) + " ;    TOTAL")
          totais_por_canal = {m: 0 for m in METHODS}
          grand_total = 0
          for d in dias:
              ini = datetime(d.year, d.month, d.day, 3, 0, 0, tzinfo=timezone.utc)
              fim = ini + timedelta(days=1)
              linha = []
              soma_dia = 0
              for m in METHODS:
                  c2 = count({
                      "select": "id",
                      "status": "eq.publicado",
                      "publish_method": f"eq.{m}",
                      "and": f"(published_at.gte.{ini.isoformat()},published_at.lt.{fim.isoformat()})",
                  })
                  totais_por_canal[m] += c2
                  soma_dia += c2
                  linha.append(f"{c2:>17}")
              grand_total += soma_dia
              print(f"{d.isoformat()} ; " + " ; ".join(linha) + f" ; {soma_dia:>8}")

          print("\n=== MEDIA/DIA POR CANAL (10 dias) ===")
          for m in METHODS:
              print(f"{m:>20}: total={totais_por_canal[m]:>5}  media/dia={totais_por_canal[m]/10:.1f}")
          print(f"\nTOTAL GERAL (10 dias): {grand_total}  —  media/dia: {grand_total/10:.1f}")

          # pendentes acumulados agora (fila de aprovacao manual)
          print("\n=== PENDENTES ACUMULADOS AGORA (fila de aprovacao) ===")
          for m in ["portal", "link_manual"]:
              c = count({"select": "id", "status": "eq.pendente", "publish_method": f"eq.{m}"})
              print(f"{m}: {c} pendentes")
          PYEOF
