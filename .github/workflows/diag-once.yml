name: Diagnóstico único — placeholder
# Reutilizado sob demanda para testes pontuais via GitHub Actions (este
# sandbox de sessão não tem acesso de rede a ovalorcapital.com.br/Supabase).
# Sempre resetado para este estado inerte depois do uso — nunca deixar um
# diagnóstico "vivo" commitado.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Listar TODA a tabela config, procurando valor tipo chave Gemini (AQ.)
        run: |
          SUPA_URL="https://yntwvfcxjardzafdqanj.supabase.co"
          SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          echo "=== TODAS as linhas da tabela config (key + inicio do value) ==="
          curl -s "$SUPA_URL/rest/v1/config?select=key,value&order=key" -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['key'], '->', (r['value'] or '')[:25]) for r in d]"
          echo ""
          echo "=== Procurando qualquer value que comece com AQ. (formato de chave Gemini) ==="
          curl -s "$SUPA_URL/rest/v1/config?select=key,value&value=ilike.AQ.*" -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['key'], '->', (r['value'] or '')[:25]) for r in d]"
