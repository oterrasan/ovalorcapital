name: Diagnóstico único — token do @oterrasan em ig_accounts (24/09)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Confirmar token do @oterrasan
        run: node .github/workflows/_diag_oterrasan_token.mjs
