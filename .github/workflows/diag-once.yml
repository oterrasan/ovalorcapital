name: diag-once
on:
  push:
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Custo real dos últimos 30 dias, por PROJETO e por item dentro de cada projeto
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
          TEAM: "team_eHk3adfD75A2B72VzpPgQHPy"
        run: |
          python3 -u << 'PYEOF'
          import os, urllib.request, json, datetime

          TOKEN = os.environ["VT"]
          TEAM = os.environ["TEAM"]
          now = datetime.datetime.now(datetime.UTC)
          start = now - datetime.timedelta(days=30)

          url = (f"https://api.vercel.com/v1/billing/charges"
                 f"?teamId={TEAM}&from={start.strftime('%Y-%m-%d')}&to={now.strftime('%Y-%m-%d')}")
          r = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
          with urllib.request.urlopen(r, timeout=30) as resp:
              body = resp.read().decode()

          linhas = [json.loads(l) for l in body.strip().split("\n") if l.strip()]

          por_projeto = {}
          por_projeto_item = {}
          sem_tag = 0.0
          for row in linhas:
              custo = row.get("BilledCost") or 0
              if custo <= 0:
                  continue
              tags = row.get("Tags") or {}
              proj = tags.get("ProjectName") or "(sem projeto — conta/assinatura em si)"
              item = f"{row.get('ServiceCategory','?')} / {row.get('ServiceName','?')}"
              por_projeto[proj] = por_projeto.get(proj, 0) + custo
              por_projeto_item.setdefault(proj, {})
              por_projeto_item[proj][item] = por_projeto_item[proj].get(item, 0) + custo
              if not tags.get("ProjectName"):
                  sem_tag += custo

          print("---TOTAL_POR_PROJETO---")
          for proj, total in sorted(por_projeto.items(), key=lambda x: -x[1]):
              print(f"PROJETO|{proj}|{total:.2f}")

          print()
          print("---DETALHE_DOS_2_MAIORES_PROJETOS---")
          top2 = sorted(por_projeto.items(), key=lambda x: -x[1])[:2]
          for proj, _ in top2:
              print(f"-- {proj} --")
              for item, v in sorted(por_projeto_item[proj].items(), key=lambda x: -x[1]):
                  print(f"  ITEM|{proj}|{item}|{v:.2f}")

          print()
          print(f"TOTAL_GERAL|{sum(por_projeto.values()):.2f}")
          print(f"TOTAL_SEM_PROJETO_TAGGEADO|{sem_tag:.2f}")
          PYEOF
