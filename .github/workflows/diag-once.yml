name: Diagnóstico único (placeholder)

# Workflow one-off inerte. Convenção do projeto: escrever uma tarefa real
# aqui, dar push (dispara mesmo em branch de feature com PR aberto), conferir
# o resultado nos Actions, e resetar para este estado inerte depois. Nunca
# deixar uma tarefa real ativa aqui.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder — nenhuma tarefa ativa"
