name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Investigar sitemap Arc/video da r7.com e mecanismo de player
        run: |
          node << 'NODEEOF'
          const https = require("https");

          function get(url, extraHeaders) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: Object.assign({
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                }, extraHeaders || {}),
                timeout: 12000
              }, (res) => {
                let data = "";
                res.on("data", (c) => data += c);
                res.on("end", () => resolve({ status: res.statusCode, headers: res.headers, body: data }));
              });
              req.on("error", reject);
              req.on("timeout", () => { req.destroy(); reject(new Error("timeout")); });
            });
          }

          (async () => {
            console.log("=== 1) sitemap-news-index (Arc Publishing) ===");
            try {
              const r = await get("https://www.r7.com/arc/outboundfeeds/sitemap-news-index/");
              console.log("status:", r.status, "tamanho:", r.body.length);
              console.log(r.body.slice(0, 3000));
            } catch (e) { console.log("erro:", e.message); }

            console.log("\n=== 2) sitemap-index-byday (Arc Publishing) ===");
            let daySitemaps = [];
            try {
              const r = await get("https://www.r7.com/arc/outboundfeeds/sitemap-index-byday/");
              console.log("status:", r.status, "tamanho:", r.body.length);
              daySitemaps = [...r.body.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
              console.log("entradas:", daySitemaps.length);
              console.log(daySitemaps.slice(0, 10).join("\n"));
              console.log("...");
              console.log(daySitemaps.slice(-5).join("\n"));
            } catch (e) { console.log("erro:", e.message); }

            console.log("\n=== 3) checando o ULTIMO sitemap do dia (mais recente) por <video:video> ===");
            if (daySitemaps.length) {
              try {
                const last = daySitemaps[daySitemaps.length - 1];
                console.log("usando:", last);
                const r = await get(last);
                console.log("status:", r.status, "tamanho:", r.body.length);
                const hasVideoTag = /<video:video>/.test(r.body);
                console.log("tem tag <video:video>?", hasVideoTag);
                const urls = [...r.body.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
                console.log("total de URLs nesse sitemap do dia:", urls.length);
                const videoUrls = urls.filter(u => /\/video\//.test(u));
                console.log("URLs com /video/ no caminho:", videoUrls.length);
                console.log(videoUrls.slice(0, 10).join("\n"));
              } catch (e) { console.log("erro:", e.message); }
            }

            console.log("\n=== 4) abrindo pagina de video real e procurando mecanismo ===");
            const videoPageUrl = "https://noticias.r7.com/record-news/link-record-news/video/mulher-se-pendura-em-varanda-no-13-andar-de-predio-para-limpar-veja-17092026/";
            try {
              const r = await get(videoPageUrl);
              console.log("status:", r.status, "tamanho:", r.body.length);
              const marcadores = ["jwplayer", "anvato", "brightcove", "hls", ".m3u8", ".mp4", "VideoObject", "og:video", "contentUrl", "embedUrl", "videojs", "video-js", "player.r7", "arcplayer", "arc-player", "powaBoot"];
              for (const m of marcadores) {
                const count = (r.body.match(new RegExp(m.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi")) || []).length;
                if (count) console.log(`  "${m}": ${count} ocorrencias`);
              }
              const diretas = [...r.body.matchAll(/https?:\/\/[^"'\s]+\.(mp4|m3u8)[^"'\s]*/gi)].map(m => m[0]);
              console.log("\nURLs diretas de midia encontradas:", [...new Set(diretas)].length);
              console.log([...new Set(diretas)].slice(0, 10).join("\n"));
              const jsonLdBlocks = [...r.body.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)].map(m => m[1]);
              console.log("\nblocos JSON-LD encontrados:", jsonLdBlocks.length);
              for (const block of jsonLdBlocks) {
                if (/VideoObject/.test(block)) {
                  console.log("--- bloco com VideoObject ---");
                  console.log(block.slice(0, 1500));
                }
              }
            } catch (e) { console.log("erro pagina de video:", e.message); }

            console.log("\n=== FIM (sem download de video, sem publicar nada) ===");
          })();
          NODEEOF
