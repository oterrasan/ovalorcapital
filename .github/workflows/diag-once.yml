name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checar estado da fila de reels após o fix do cap de 88s
        env:
          SUPABASE_URL: https://yntwvfcxjardzafdqanj.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40
        run: |
          curl -sS "$SUPABASE_URL/rest/v1/posts?select=id,titulo,metrics,video_url&metrics->instagram_reel_template->>status=neq.ready&order=updated_at.desc&limit=10" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o reel_posts.json
          jq -r '.[] | (if (.metrics|type)=="string" then (.metrics|fromjson) else .metrics end) as $m | ($m.instagram_reel_template // empty) as $t | select($t) | [.id, (.titulo // "")[0:60], $t.status, $t.attempts, ($t.last_error // ""), .video_url] | @tsv' reel_posts.json
