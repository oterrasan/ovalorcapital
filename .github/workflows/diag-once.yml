name: Diagnóstico único — confirmar fix de curtida em caso real pós-deploy
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Ver se algum evento real ja rodou pos-deploy
        run: node .github/workflows/_diag_verify_like_fix.mjs
