name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Testar candidatos reais de feed RSS para economia/mercado/financas
        run: |
          set -e
          UA="Mozilla/5.0 (compatible; OVCBot/1.0)"
          test_feed() {
            name="$1"; url="$2"
            echo "=== $name — $url ==="
            code=$(curl -sS -o /tmp/feed.xml -w "%{http_code}" -A "$UA" --max-time 15 "$url" || echo "ERRO")
            echo "HTTP: $code"
            if [ "$code" = "200" ]; then
              bytes=$(wc -c < /tmp/feed.xml)
              echo "bytes: $bytes"
              echo "--- primeiros 3 titulos+datas ---"
              python3 -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('/tmp/feed.xml')
              items = tree.findall('.//item')[:3]
              if not items:
                  items = tree.findall('.//{http://www.w3.org/2005/Atom}entry')[:3]
              for it in items:
                  t = it.find('title')
                  d = it.find('pubDate')
                  if d is None: d = it.find('{http://www.w3.org/2005/Atom}updated')
                  print('  -', (t.text or '').strip()[:80] if t is not None else '(sem titulo)', '|', (d.text or '') if d is not None else '(sem data)')
          except Exception as e:
              print('  erro parseando XML:', e)
          "
            fi
            echo
          }
          test_feed "InfoMoney - Ultimas Noticias"   "https://www.infomoney.com.br/ultimas-noticias/feed/"
          test_feed "Money Times - Mercados"         "https://www.moneytimes.com.br/mercados/feed"
          test_feed "Seu Dinheiro"                   "https://www.seudinheiro.com/feed/"
          test_feed "Valor Economico - geral"        "https://www.valor.com.br/rss"
          test_feed "Valor Economico - Financas"     "https://www.valor.com.br/financas/rss"
          test_feed "Agencia Brasil - Economia"      "https://agenciabrasil.ebc.com.br/rss/economia/feed.xml"
          test_feed "Brazil Journal - feed generico" "https://braziljournal.com/feed/"
