name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checar status real dos posts recentes vindos do robo de TikTok
        env:
          SUPABASE_URL: "https://yntwvfcxjardzafdqanj.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
        run: |
          set -e
          echo "=== contagem por status (publish_method=link_manual, ultimas 48h) ==="
          curl -sS "${SUPABASE_URL}/rest/v1/posts?publish_method=eq.link_manual&created_at=gte.$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%S)&select=status&limit=1000" \
            -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" \
            | node -e 'const d=JSON.parse(require("fs").readFileSync(0)); const c={}; d.forEach(r=>c[r.status]=(c[r.status]||0)+1); console.log(JSON.stringify(c)); console.log("total="+d.length)'
          echo ""
          echo "=== amostra de 10 publicados (se houver) ==="
          curl -sS "${SUPABASE_URL}/rest/v1/posts?publish_method=eq.link_manual&status=eq.publicado&select=id,titulo,user_tags,status,approved,created_at,published_at&order=created_at.desc&limit=10" \
            -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}"
          echo ""
          echo "=== amostra de 10 pendentes (se houver) ==="
          curl -sS "${SUPABASE_URL}/rest/v1/posts?publish_method=eq.link_manual&status=eq.pendente&select=id,titulo,user_tags,status,approved,created_at&order=created_at.desc&limit=10" \
            -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}"
          echo ""
