name: diag-once (lista reels recentes com marca do metropoles)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > /tmp/parse.py << 'PYEOF'
          import json, sys
          for p in json.load(sys.stdin):
              m = p.get('metrics') or {}
              t = m.get('instagram_reel_template') or {}
              print(p['id'], '|', p['titulo'])
              print('  fonte_link_manual:', m.get('fonte_link_manual'))
              print('  source_url:', t.get('source_url'))
              print('  status:', t.get('status'), 'exhausted:', t.get('exhausted'), 'attempts:', t.get('attempts'))
              print('  layout:', t.get('layout'))
              print()
          PYEOF
          B="https://yntwvfcxjardzafdqanj.supabase.co/rest/v1"
          H1="apikey: $SB_KEY"; H2="Authorization: Bearer $SB_KEY"
          curl -s -H "$H1" -H "$H2" \
            "$B/posts?select=id,titulo,metrics&metrics->>fonte_link_manual=ilike.*metropoles*&order=updated_at.desc&limit=15" \
            | python3 /tmp/parse.py
        env:
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
