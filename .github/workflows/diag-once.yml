name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 << 'PYEOF'
          import urllib.request, json

          URL = "https://yntwvfcxjardzafdqanj.supabase.co"
          KEY = ("eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4"
                 "amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoy"
                 "MDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40")

          def get(path):
              req = urllib.request.Request(URL + path, headers={
                  "apikey": KEY, "Authorization": "Bearer " + KEY
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          print("=== todos os posts publicados via ig_priority_publish ===")
          rows = get("/rest/v1/posts?select=id,titulo,imagem,comentario_fixado,metrics&metrics->instagram->>published_via=eq.ig_priority_publish&order=updated_at.asc")
          print("total:", len(rows))
          for p in rows:
              m = json.loads(p["metrics"]) if isinstance(p["metrics"], str) else p["metrics"]
              ig = (m or {}).get("instagram", {})
              print("---")
              print("id:", p["id"])
              print("titulo:", p["titulo"])
              print("imagem:", p.get("imagem"))
              print("ig_id:", ig.get("ig_id"))
              print("account_id:", ig.get("account_id"))
              print("first_comment_id:", ig.get("first_comment_id"))
              print("first_comment_text atual:", repr(ig.get("first_comment_text")))
              print("comentario_fixado real:", repr(p.get("comentario_fixado")))

          print()
          print("=== fila restante ===")
          fila = get("/rest/v1/posts?select=id,titulo&metrics->>instagram_priority=not.is.null&limit=50")
          print("total na fila:", len(fila))
          for p in fila:
              print(" -", p["id"], p["titulo"][:70])

          print()
          print("=== conta ig ativa pra distribuição (sem expor token) ===")
          accs = get("/rest/v1/ig_accounts?select=id,username,active,distribuicao_automatica,token&active=eq.true&distribuicao_automatica=eq.true")
          for a in accs:
              print(a["id"], a["username"], "token_presente:", bool(a.get("token")))
          PYEOF
