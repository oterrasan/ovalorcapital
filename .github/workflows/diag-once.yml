name: Diagnóstico único (placeholder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ligar automação de Instagram (feed de imagem) do Brasil ON
        run: |
          echo "antes:"
          curl -sS "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?key=eq.BON_IG_ENABLED&select=key,value" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"
