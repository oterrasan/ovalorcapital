name: Diagnóstico único — investigar ProcessingFailedError da Meta a fundo
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        run: npm ci --omit=dev
      - name: Instalar ffmpeg e fonte oficial (mesmo setup de produção)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Investigar o ProcessingFailedError com dado real
        run: node .github/workflows/_diag_reel_probe.mjs
