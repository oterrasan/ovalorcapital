name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Forçar uma rodada real do Brasil ON e conferir captura de vídeo
        run: |
          python3 << 'PYEOF'
          import json
          import time
          import urllib.request

          BASE = "https://www.ovalorcapital.com.br"
          PASS = "ovc-admin-2026-secreto"

          def get_json(url, timeout=70):
              req = urllib.request.Request(url, headers={"User-Agent": "diag-video-bacci"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          print("Disparando autoBrasilOn (count=3) em producao real...")
          url_run = f"{BASE}/api/run_portal?tipo=brasilon&force=true&count=3&pass={PASS}"
          try:
              resultado = get_json(url_run)
              print("RESULTADO run_portal:", json.dumps(resultado, ensure_ascii=False))
          except Exception as e:
              print(f"ERRO ao chamar run_portal: {e}")

          time.sleep(3)

          print("\nConsultando posts recentes de brasil-on via API publica...")
          url_lista = f"{BASE}/api/portal-posts?recentes=true&categoria=brasil-on&limit=6"
          try:
              lista = get_json(url_lista, timeout=20)
              posts = lista.get("posts") or lista.get("data") or []
              print(f"total de posts retornados: {len(posts)}")
          except Exception as e:
              print(f"ERRO ao listar posts: {e}")
              posts = []

          for p in posts[:6]:
              post_id = p.get("id")
              url_um = f"{BASE}/api/portal-posts?id={post_id}"
              try:
                  um = get_json(url_um, timeout=20)
                  metrics = um.get("metrics") or {}
                  template = metrics.get("instagram_reel_template")
                  print(f"\n--- {um.get('titulo')} ---")
                  print("  url:", um.get("url"))
                  print("  imagem exposta:", bool(um.get("imagem")))
                  print("  campo 'video' exposto ao publico (deve ser vazio/None):", repr(um.get("video")))
                  print("  metrics.instagram_reel_template:", json.dumps(template, ensure_ascii=False) if template else "NENHUM (matéria sem vídeo)")
              except Exception as e:
                  print(f"  ERRO ao buscar artigo individual {post_id}: {e}")
          PYEOF
