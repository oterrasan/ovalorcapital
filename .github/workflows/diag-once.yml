name: diag-once (extrai quadros reais pra ver onde a marca aparece)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          URL="https://yntwvfcxjardzafdqanj.supabase.co/storage/v1/object/public/post-videos/link-capture/LINK_JOB__1790594267199_073ugn.mp4"
          curl -sS -o src.mp4 "$URL"
          ls -la src.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of default=noprint_wrappers=1 src.mp4
          mkdir -p frames
          ffmpeg -hide_banner -loglevel error -i src.mp4 -vf "fps=1" frames/f_%03d.png
          ls frames | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames/*.png
          retention-days: 1
