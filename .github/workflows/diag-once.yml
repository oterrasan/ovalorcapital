name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: achar o link original dos videos so-audio
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          curl -sS "https://www.ovalorcapital.com.br/api/manage?action=diag_achar_post&recentes=1" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" --max-time 30 > posts.json
          python3 << 'PYEOF'
          import json
          d = json.load(open('posts.json'))
          alvos = {"fd276cee", "929a623b"}
          for p in d.get('posts', []):
              if p['id'][:8] in alvos:
                  print(p['id'][:8], "->", p.get('fonte_link_manual', '(vazio)'))
          PYEOF
