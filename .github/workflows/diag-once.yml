name: Diagnóstico único (placeholder)
on:
  push:
    paths:
      - '.github/workflows/diag-once.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checar estado real da fila de reels agora
        env:
          SUPABASE_URL: https://yntwvfcxjardzafdqanj.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40
        run: |
          echo "== fila (status != ready) =="
          curl -sS "$SUPABASE_URL/rest/v1/posts?select=id,titulo,metrics,video_url&metrics->instagram_reel_template->>status=neq.ready&order=updated_at.desc&limit=15" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o reel_queue.json
          jq -r '.[] | (if (.metrics|type)=="string" then (.metrics|fromjson) else .metrics end) as $m | ($m.instagram_reel_template // empty) as $t | select($t) | [.id, (.titulo // "")[0:55], $t.status, $t.attempts, ($t.last_error // "")] | @tsv' reel_queue.json
          echo ""
          echo "== ready (últimos 10) =="
          curl -sS "$SUPABASE_URL/rest/v1/posts?select=id,titulo,metrics&metrics->instagram_reel_template->>status=eq.ready&order=updated_at.desc&limit=10" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o reel_ready.json
          jq -r '.[] | (if (.metrics|type)=="string" then (.metrics|fromjson) else .metrics end) as $m | ($m.instagram_reel_template // empty) as $t | select($t) | [.id, (.titulo // "")[0:55], $t.status, $t.ready_at, ($t.end_trim.output_duration_seconds // ""), ($t.end_trim.capped_by_reels_limit // "")] | @tsv' reel_ready.json
          echo ""
          echo "== o post do vídeo de Moraes especificamente =="
          curl -sS "$SUPABASE_URL/rest/v1/posts?select=id,titulo,metrics,video_url&id=eq.77226730-45e8-4fd6-af5a-40917de3e604" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"
