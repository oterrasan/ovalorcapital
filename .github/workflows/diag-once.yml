name: Diagnóstico único (temporário — será resetado ao placeholder após uso)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-once.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-teste pos-deploy do fix allowCompetitorImage (GE Globo)
        run: |
          RESP=$(curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"futebol","force":true,"count":4}')
          echo "FUTEBOL_1: $RESP"
      - name: Aguardar 5s
        run: sleep 5
      - name: Testar de novo (segunda amostra)
        run: |
          RESP=$(curl -s --max-time 55 -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"futebol","force":true,"count":4}')
          echo "FUTEBOL_2: $RESP"
