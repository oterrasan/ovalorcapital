name: diag-once (temporario)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Retestar com -L (seguir redirect) + inspecionar InfoMoney vazio
        run: |
          set -e
          UA="Mozilla/5.0 (compatible; OVCBot/1.0)"
          test_feed() {
            name="$1"; url="$2"
            echo "=== $name — $url ==="
            code=$(curl -sS -L -o /tmp/feed.xml -w "%{http_code}" -A "$UA" --max-time 15 "$url" || echo "ERRO")
            final=$(curl -sS -o /dev/null -w "%{url_effective}" -L -A "$UA" --max-time 15 "$url" || echo "?")
            echo "HTTP final: $code | URL final: $final"
            if [ "$code" = "200" ]; then
              bytes=$(wc -c < /tmp/feed.xml)
              echo "bytes: $bytes"
              echo "--- primeiros 3 titulos+datas ---"
              python3 -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('/tmp/feed.xml')
              items = tree.findall('.//item')[:3]
              if not items:
                  items = tree.findall('.//{http://www.w3.org/2005/Atom}entry')[:3]
              for it in items:
                  t = it.find('title')
                  d = it.find('pubDate')
                  if d is None: d = it.find('{http://www.w3.org/2005/Atom}updated')
                  print('  -', (t.text or '').strip()[:80] if t is not None else '(sem titulo)', '|', (d.text or '') if d is not None else '(sem data)')
          except Exception as e:
              print('  erro parseando XML:', e)
          "
            fi
            echo
          }
          test_feed "Money Times - Mercados"      "https://www.moneytimes.com.br/mercados/feed"
          test_feed "Valor Economico - geral"     "https://www.valor.com.br/rss"
          test_feed "Valor Economico - Financas"  "https://www.valor.com.br/financas/rss"
          test_feed "Brazil Journal - feed"       "https://braziljournal.com/feed/"

          echo "=== INFOMONEY — corpo bruto (feed veio so com 1323 bytes) ==="
          curl -sS -L -A "$UA" --max-time 15 "https://www.infomoney.com.br/ultimas-noticias/feed/"
