name: Validar antes de merge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Verificar arquivos críticos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AJUSTADO 12/08/2026 — o limite de 700 linhas foi calibrado em mai/2026
      # para o index.html daquela época (741 linhas, 302KB). O arquivo cresceu
      # em conteúdo real (novos scripts, widgets, interruptores) mas com HTML
      # mais compacto por linha — hoje tem ~648 linhas para ~297KB, ou seja,
      # MAIS bytes de conteúdo real por linha, não menos conteúdo. O check
      # antigo travava TODO PR (mesmo sem tocar em index.html) sem sinal
      # nenhum de corrupção real. Substituído por 3 sinais independentes,
      # todos precisam falhar juntos para bloquear por engano — e qualquer
      # um sozinho pega os incidentes reais já documentados (corte de 734
      # linhas por merge ruim, corrupção base64 via revert no GitHub Web):
      #   1. linhas   >= 400  (bem abaixo do real ~648, mas bem acima de um
      #                        corte/corrupção real, que zerou ou foi p/ 1)
      #   2. bytes    >= 150000 (bem abaixo do real ~297000, pega qualquer
      #                        versão vazia/stub/placeholder)
      #   3. começa com <!DOCTYPE html> literal (pega corrupção base64 — o
      #                        conteúdo corrompido começa com "PCFET0NUWVBF")
      #   4. termina com </html> nos últimos bytes (pega truncamento no meio)
      - name: index.html — tamanho e integridade
        run: |
          LINES=$(wc -l < public/index.html)
          BYTES=$(wc -c < public/index.html)
          FIRST=$(head -c 15 public/index.html)
          LAST=$(tail -c 300 public/index.html)
          echo "public/index.html: $LINES linhas, $BYTES bytes"
          FAIL=0

          if [ "$LINES" -lt 400 ]; then
            echo "❌ menos de 400 linhas ($LINES)"
            FAIL=1
          fi
          if [ "$BYTES" -lt 150000 ]; then
            echo "❌ menos de 150000 bytes ($BYTES)"
            FAIL=1
          fi
          if [ "$FIRST" != "<!DOCTYPE html>" ]; then
            echo "❌ não começa com <!DOCTYPE html> — pode estar corrompido (base64 ou vazio)"
            echo "Início detectado: $FIRST"
            FAIL=1
          fi
          case "$LAST" in
            *"</html>"*) ;;
            *) echo "❌ não termina com </html> — pode estar truncado"; FAIL=1 ;;
          esac

          if [ "$FAIL" -eq 1 ]; then
            echo "BLOQUEADO: O portal ficará offline com este arquivo!"
            exit 1
          fi
          echo "✅ OK"

      - name: api/ — máximo 10 arquivos (limite Vercel Hobby)
        run: |
          COUNT=$(ls api/*.js 2>/dev/null | wc -l)
          echo "api/ tem $COUNT arquivo(s)"
          if [ "$COUNT" -gt 10 ]; then
            echo "❌ BLOQUEADO: api/ tem $COUNT arquivos (máximo 10)"
            echo "O deploy vai quebrar silenciosamente no Vercel Hobby!"
            exit 1
          fi
          echo "✅ OK"

      - name: Supabase — nenhum arquivo pode apontar para banco morto
        run: |
          DEAD="bfsegqdgscudtdgwdyci.supabase.co"
          FAILED=0

          for FILE in api/portal-posts.js api/article.js api/manage.js api/category.js api/run_portal.js public/admin/index.html; do
            if [ -f "$FILE" ]; then
              if grep -q "$DEAD" "$FILE"; then
                echo "❌ $FILE aponta para o banco MORTO ($DEAD)"
                FAILED=1
              else
                echo "✅ $FILE OK"
              fi
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "BLOQUEADO: um ou mais arquivos estão conectados ao banco antigo."
            echo "O portal ou admin vão falhar silenciosamente!"
            exit 1
          fi

      - name: vercel.json — deve ser JSON válido
        run: |
          if ! python3 -c "import json; json.load(open('vercel.json'))" 2>&1; then
            echo "❌ BLOQUEADO: vercel.json não é JSON válido"
            echo "O deploy vai falhar completamente!"
            exit 1
          fi
          echo "✅ vercel.json OK"

      - name: Resumo final
        run: echo "✅ Todos os checks passaram — seguro para merge."
