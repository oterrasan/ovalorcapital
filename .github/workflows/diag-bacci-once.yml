name: DIAG ONE-OFF — Bacci sitemap check

on:
  push:
    branches:
      - claude/diag-bacci-once
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check sitemap options
        run: |
          node -e '
          const https = require("https");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
          function fetchUrl(url) {
            return new Promise((resolve) => {
              https.get(url, { headers: { "User-Agent": UA } }, (res) => {
                let data = "";
                res.on("data", (c) => data += c);
                res.on("end", () => resolve({ status: res.statusCode, len: data.length, body: data }));
              }).on("error", (e) => resolve({ status: "ERROR", err: e.message }));
            });
          }
          (async () => {
            const urls = [
              "https://baccinoticias.com.br/sitemap.xml",
              "https://baccinoticias.com.br/sitemap_index.xml",
              "https://baccinoticias.com.br/wp-sitemap.xml",
              "https://baccinoticias.com.br/feed/",
              "https://baccinoticias.com.br/wp-json/wp/v2/posts?per_page=10&orderby=date&order=desc"
            ];
            for (const u of urls) {
              const r = await fetchUrl(u);
              console.log("===", u, "=== status:", r.status, "len:", r.len);
              if (r.body) console.log(r.body.slice(0, 1200));
              console.log("");
            }
          })();
          '
