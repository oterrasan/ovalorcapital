name: DIAG ONE-OFF — Bacci post-sitemap32 (chunk mais recente real)

on:
  push:
    branches:
      - claude/diag-bacci-once
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch post-sitemap32.xml
        run: |
          node -e '
          const https = require("https");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
          https.get("https://baccinoticias.com.br/post-sitemap32.xml", { headers: { "User-Agent": UA } }, (res) => {
            console.log("status:", res.statusCode);
            let data = "";
            res.on("data", (c) => data += c);
            res.on("end", () => {
              console.log("len:", data.length);
              const locs = [...data.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
              const lastmods = [...data.matchAll(/<lastmod>(.*?)<\/lastmod>/g)].map(m => m[1]);
              console.log("total entries:", locs.length);
              console.log("--- last 25 (most recent) ---");
              for (let i = Math.max(0, locs.length-25); i < locs.length; i++) console.log(lastmods[i], "-", locs[i]);
            });
          }).on("error", (e) => console.log("ERROR:", e.message));
          '
