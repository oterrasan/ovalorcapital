name: DIAG ONE-OFF — testar buscarCandidatosBrasilOn real

on:
  push:
    branches:
      - claude/diag-bacci-once
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (só axios)
        run: npm install axios --no-save --silent
      - name: Testar buscarCandidatosBrasilOn real
        run: |
          node -e '
          import("./core/brasilon.js").then(async (mod) => {
            const t0 = Date.now();
            const candidatos = await mod.buscarCandidatosBrasilOn();
            console.log("tempo (ms):", Date.now() - t0);
            console.log("total candidatos:", candidatos.length);
            candidatos.forEach(c => console.log(c.pubDate, "-", c.link));
          }).catch(e => { console.log("ERRO:", e.message); process.exit(1); });
          '
