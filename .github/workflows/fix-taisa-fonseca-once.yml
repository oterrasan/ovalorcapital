name: Corrigir posição da imagem — coluna Taísa da Fonseca (one-off)

# Uso único, a pedido de Roberto (08/08/2026) — corrige a matéria já publicada
# (id c8d23fad-c8cd-4f3e-8136-3563040054c6): remove o float da imagem no topo
# (quebrava o padrão de layout) e insere a foto da autora do livro (Flávia
# Abeche — NÃO é foto da Taísa nem de Roberto, é a autora entrevistada) como
# figure full-width no meio do corpo, entre parágrafos. Este arquivo e o
# HTML/script em scripts/one-off/ são removidos assim que confirmado.
#
# Mesmo padrão de diag-once.yml / publicar-taisa-fonseca-once.yml: roda em
# runner do GitHub Actions (rede real) — este sandbox de sessão não alcança
# www.ovalorcapital.com.br. Action e token vão dentro do corpo JSON (não
# query string) — lições da publicação original.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fix-taisa-fonseca-once.yml"]

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Montar payload da correção
        run: python3 scripts/one-off/build_fix_payload_taisa.py

      - name: Corrigir matéria (editar_aprovar)
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload_fix.json
          echo ""
