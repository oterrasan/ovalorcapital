name: DEPLOY + PIPELINE — tudo em um

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Vercel (build do zero)
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b

      - name: Aguardar Vercel ficar live
        run: sleep 30

      - name: Rodada 1
        run: |
          RESP=$(curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' --max-time 120)
          echo "R1: $RESP"

      - name: Rodada 2
        run: |
          sleep 5
          RESP=$(curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' --max-time 120)
          echo "R2: $RESP"

      - name: Rodada 3
        run: |
          sleep 5
          RESP=$(curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            -d '{"force":true,"count":8}' --max-time 120)
          echo "R3: $RESP"
