name: One-off — reconhecimento Bacci Notícias e Revista Oeste (Brasil ON)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-brasilon-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Testar feeds RSS candidatos
        run: |
          for url in \
            "https://baccinoticias.com.br/feed/" \
            "https://baccinoticias.com.br/rss" \
            "https://www.revistaoeste.com/feed/" \
            "https://www.revistaoeste.com/rss" \
            ; do
            echo "=== $url ==="
            HTTP_CODE=$(curl -s -o /tmp/body.xml -w "%{http_code}" --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (compatible; OVC-Diag/1.0)" \
              "$url")
            echo "HTTP: $HTTP_CODE"
            echo "bytes: $(wc -c < /tmp/body.xml)"
            echo "content-type guess (primeiros 200 bytes):"
            head -c 200 /tmp/body.xml
            echo ""
            echo "titulos encontrados (grep <title>):"
            grep -o '<title>[^<]*</title>' /tmp/body.xml | head -6
            echo ""
          done

      - name: Testar homepage bruta (para achar padrão de imagem)
        run: |
          for url in "https://baccinoticias.com.br/" "https://www.revistaoeste.com/"; do
            echo "=== $url ==="
            curl -s -o /tmp/home.html --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (compatible; OVC-Diag/1.0)" \
              "$url"
            echo "bytes: $(wc -c < /tmp/home.html)"
            echo "og:image do primeiro artigo linkado (se achar):"
            grep -o 'property="og:image"[^>]*content="[^"]*"' /tmp/home.html | head -3
            echo "primeiras 5 URLs de imagem (wp-content/uploads):"
            grep -oE 'https://[^"'"'"']*wp-content/uploads/[^"'"'"']*\.(jpg|jpeg|png|webp)' /tmp/home.html | head -5
            echo ""
          done

      - name: Pegar 1 artigo de cada site e checar og:image + dimensões
        run: |
          for pair in \
            "baccinoticias.com.br|https://baccinoticias.com.br/" \
            "revistaoeste.com|https://www.revistaoeste.com/" \
            ; do
            domain="${pair%%|*}"
            home="${pair##*|}"
            echo "=== $domain ==="
            curl -s -o /tmp/home2.html --max-time 15 -H "User-Agent: Mozilla/5.0" "$home"
            # pega o primeiro link de artigo que pareça ser matéria (heurística simples)
            article=$(grep -oE 'href="https://[^"]*'"$domain"'/[a-z0-9-]{15,}/?"' /tmp/home2.html | head -1 | sed 's/href="//;s/"$//')
            echo "artigo candidato: $article"
            if [ -n "$article" ]; then
              curl -s -o /tmp/art.html --max-time 15 -H "User-Agent: Mozilla/5.0" "$article"
              echo "og:image do artigo:"
              grep -o 'property="og:image"[^>]*content="[^"]*"' /tmp/art.html | head -2
            fi
            echo ""
          done
