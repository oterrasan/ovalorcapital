name: One-off — reconhecimento Bacci Notícias e Revista Oeste (Brasil ON) — rodada 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-brasilon-once.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Bacci — seguir redirect do /feed/ e achar artigo real (fora de vi-no-instagram)
        run: |
          echo "=== segue redirect de https://baccinoticias.com.br/feed/ ==="
          curl -sL -o /tmp/bacci_feed.xml --max-time 15 -w "HTTP final: %{http_code} | URL final: %{url_effective}\n" \
            -H "User-Agent: Mozilla/5.0 (compatible; OVC-Diag/1.0)" \
            "https://baccinoticias.com.br/feed/"
          echo "bytes: $(wc -c < /tmp/bacci_feed.xml)"
          echo "primeiros 300 bytes:"
          head -c 300 /tmp/bacci_feed.xml
          echo ""
          echo "titulos (se RSS valido):"
          grep -o '<title>[^<]*</title>' /tmp/bacci_feed.xml | head -8
          echo ""
          echo "=== homepage bacci — links de artigo (excluindo vi-no-instagram/categoria/tag) ==="
          curl -s -o /tmp/bacci_home.html --max-time 15 -H "User-Agent: Mozilla/5.0" "https://baccinoticias.com.br/"
          grep -oE 'href="https://baccinoticias\.com\.br/[a-z0-9-]{15,}/?"' /tmp/bacci_home.html \
            | grep -v -E 'vi-no-instagram|categoria|category|/tag/|/page/' \
            | sort -u | head -5

      - name: Bacci — abrir 1 artigo real e checar og:image + dimensões da imagem
        run: |
          article=$(grep -oE 'href="https://baccinoticias\.com\.br/[a-z0-9-]{15,}/?"' /tmp/bacci_home.html \
            | grep -v -E 'vi-no-instagram|categoria|category|/tag/|/page/' \
            | sed 's/href="//;s/"$//' | sort -u | head -1)
          echo "artigo escolhido: $article"
          if [ -n "$article" ]; then
            curl -s -o /tmp/bacci_art.html --max-time 15 -H "User-Agent: Mozilla/5.0" "$article"
            echo "og:image:"
            grep -o 'property="og:image"[^>]*content="[^"]*"' /tmp/bacci_art.html | head -2
            echo "og:image:width / og:image:height (se existir):"
            grep -oE 'property="og:image:(width|height)"[^>]*content="[^"]*"' /tmp/bacci_art.html
            imgurl=$(grep -o 'property="og:image"[^>]*content="[^"]*"' /tmp/bacci_art.html | head -1 | grep -oE 'https://[^"]*')
            if [ -n "$imgurl" ]; then
              echo "baixando imagem pra medir dimensao real: $imgurl"
              curl -s -o /tmp/bacci_img -w "bytes baixados: %{size_download}\n" --max-time 15 "$imgurl"
              file /tmp/bacci_img || true
            fi
          fi

      - name: Revista Oeste — pegar 1 artigo real do RSS (não a homepage, que tem proteção Cloudflare) e checar og:image + dimensões
        run: |
          curl -s -o /tmp/oeste_feed.xml --max-time 15 -H "User-Agent: Mozilla/5.0 (compatible; OVC-Diag/1.0)" "https://www.revistaoeste.com/feed/"
          echo "1o <link> de artigo no feed:"
          article=$(grep -oE '<link>https://www\.revistaoeste\.com/[^<]+</link>' /tmp/oeste_feed.xml | head -2 | tail -1 | sed 's/<link>//;s/<\/link>//')
          echo "artigo: $article"
          echo "checando se o feed tem imagem embutida (media:content / enclosure):"
          grep -oE '<(media:content|enclosure)[^>]*/?>' /tmp/oeste_feed.xml | head -3
          if [ -n "$article" ]; then
            curl -s -o /tmp/oeste_art.html --max-time 15 -H "User-Agent: Mozilla/5.0 (compatible; OVC-Diag/1.0)" "$article"
            echo "bytes do artigo: $(wc -c < /tmp/oeste_art.html)"
            echo "og:image:"
            grep -o 'property="og:image"[^>]*content="[^"]*"' /tmp/oeste_art.html | head -2
            echo "og:image:width / og:image:height (se existir):"
            grep -oE 'property="og:image:(width|height)"[^>]*content="[^"]*"' /tmp/oeste_art.html
            imgurl=$(grep -o 'property="og:image"[^>]*content="[^"]*"' /tmp/oeste_art.html | head -1 | grep -oE 'https://[^"]*')
            if [ -n "$imgurl" ]; then
              echo "baixando imagem pra medir dimensao real: $imgurl"
              curl -s -o /tmp/oeste_img -w "bytes baixados: %{size_download}\n" --max-time 15 "$imgurl"
              file /tmp/oeste_img || true
            fi
          fi
