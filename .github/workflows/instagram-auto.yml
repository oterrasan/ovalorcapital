name: Instagram - Publicação Automática

# Disparador externo independente do Codex: executa a cada 20 minutos.
# O backend filtra matérias das últimas 12 horas, evita duplicações e aplica as
# categorias e o limite diário configurados no Admin.
#
# ⚠️ Este arquivo controla SOMENTE o agendamento de publicação no Instagram.
# NUNCA usar como referência pra horário do portal/pipeline de conteúdo —
# aquilo é `vercel.json` (cron nativo, canais de geração: jovempan_politica,
# materias, brasilon, internacional, fofocas — pausam 00h-06h BRT) e
# `futebol`/`outros_esportes` (nunca pausam, Regra Zero "Radar do Esporte
# não toca jamais"). Instagram tem janela própria, independente do resto.
#
# 02/09/2026 (tarde) — Roberto pediu intervalos estratégicos SÓ no Instagram:
# ativo 08h–22h BRT (corte seco às 22h, sem post a partir das 22:00), pausa
# total 22h–08h BRT, ritmo de 1 post a cada 20 minutos dentro da janela ativa.
# Substitui a janela 06h-00h BRT (pausa 00h-06h) de mais cedo no mesmo dia.
#
# Cron é sempre UTC (não existe opção de timezone, nem no Actions nem na
# Vercel — já confirmado nesta mesma sessão pro cron nativo da Vercel).
# BRT = UTC-3. Ativo 08h–21:59 BRT = 11h–24h59 UTC = horas UTC 11-23 e 0
# (a hora BRT 21 vira UTC 0 do dia seguinte). Pausa 22h-08h BRT = horas
# UTC 1-10 (10 horas).
on:
  schedule:
    - cron: '*/20 0,11-23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-auto.yml'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar ig_auto_publish
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_auto_publish"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
