name: Instagram - Publicação Automática

# Disparador externo independente do Codex: executa a cada 20 minutos.
# O backend filtra matérias das últimas 12 horas, evita duplicações e aplica as
# categorias e o limite diário configurados no Admin.
#
# ⚠️ Este arquivo controla SOMENTE o agendamento de publicação no Instagram.
# NUNCA usar como referência pra horário do portal/pipeline de conteúdo —
# aquilo é `vercel.json` (cron nativo, canais de geração: jovempan_politica,
# materias, brasilon, internacional, fofocas — pausam 00h-06h BRT) e
# `futebol`/`outros_esportes` (nunca pausam, Regra Zero "Radar do Esporte
# não toca jamais"). Instagram tem janela própria, independente do resto.
#
# 02/09/2026 (tarde) — Roberto pediu intervalos estratégicos SÓ no Instagram:
# ativo 08h–22h BRT (corte seco às 22h, sem post a partir das 22:00), pausa
# total 22h–08h BRT, ritmo de 1 post a cada 20 minutos dentro da janela ativa.
# Substitui a janela 06h-00h BRT (pausa 00h-06h) de mais cedo no mesmo dia.
#
# 04/09/2026 — Roberto pediu pausa de almoço: ativo 9h-12h BRT, pausa
# 12h-13h BRT, ativo de novo 13h-22h BRT (corte seco às 22h). Gate redundante
# em api/manage.js (_igAutoDentroDaJanelaAtiva) precisa ficar EXATAMENTE em
# sincronia com este cron — se Roberto pedir pra mudar de novo, atualizar
# os dois juntos.
#
# 04/09/2026 (mesmo dia, 3 ajustes seguidos) — 1º pedido: retorno às
# 13h30 (só OVC). 2º pedido (correção): 14h00, nas duas automações (OVC
# e Brasil ON). 3º pedido: Roberto pediu pra POSTERGAR só o OVC — o
# Brasil ON continua liberado às 14h00 (`brasilon/vercel.json`/
# `brasilon/api/manage.js`, INTOCADOS nesta 3ª rodada, não fazem parte
# deste arquivo). ESTADO daquele dia (só OVC): ativo 9h-12h BRT, pausa
# 12h-15h BRT, ativo de novo 15h-22h BRT — as duas automações ficaram
# dessincronizadas de propósito.
#
# 08/09/2026 — Roberto pediu de novo, RESSINCRONIZANDO as duas automações
# (OVC e Brasil ON): ativo 07h-12h BRT, pausa 12h-14h BRT, ativo de novo
# 14h-22h BRT (corte seco às 22h). Gate redundante em api/manage.js
# (_igAutoDentroDaJanelaAtiva) e em brasilon/api/manage.js atualizados
# junto, no mesmo pedido.
#
# 10/09/2026 (manhã) — janela 08h-12h/14h30-19h BRT — SUBSTITUÍDA no mesmo dia.
#
# 10/09/2026 (tarde) — Roberto: "pause as automações dos Instagrams /
# retorne as 14hrs apenas". Janela única, sem bloco de manhã nem pausa de
# meio-dia: ativo 14h-19h BRT (corte seco às 19h). Gate redundante em
# api/manage.js e em brasilon/api/manage.js atualizados junto, no mesmo
# pedido (os dois voltaram pro cálculo simples de horas inteiras — não
# há mais nenhum limite em minuto quebrado).
#
# 11/09/2026 — Roberto: "voce só ligou as janelas da tarde. e esqueceu as
# da manha. comecam as 08hrs e param meio dia. retornam as 14h00" — o
# bloco da manhã (removido por engano em 10/09/2026 tarde) volta a
# existir. ESTADO ATUAL, vigente: ativo 08h-12h BRT, pausa 12h-14h BRT,
# ativo de novo 14h-19h BRT (corte seco às 19h). Gate redundante em
# api/manage.js e em brasilon/api/manage.js atualizados junto, no mesmo
# pedido. Novo schedule `*/20 11-14 * * *` cobre o bloco da manhã.
#
# Cron é sempre UTC (não existe opção de timezone, nem no Actions nem na
# Vercel — já confirmado nesta mesma sessão pro cron nativo da Vercel).
# BRT = UTC-3 (some 3 pra converter BRT→UTC). Ativo 08h-12h BRT = 11h-14h
# UTC (horas 11,12,13,14 inteiras — 14:59 UTC ainda é 11:59 BRT, dentro do
# bloco). Pausa 12h-14h BRT = 15h-16h UTC. Ativo 14h-19h BRT = 17h-22h UTC
# (horas 17,18,19,20,21 inteiras). Corte 19h-08h BRT = 22h-11h UTC (todo o
# resto do dia).
#
# 10/09/2026 (fila prioritária) — cron dedicado `*/5 * * * *` criado aqui
# nesta mesma janela, SÓ pra publicar a fila que Roberto monta manualmente
# no admin (selecionar N matérias → "Publicar no Instagram" → 1 a cada
# ~5min, na ordem escolhida).
#
# 11/09/2026 — 🔴 REMOVIDO daqui, MIGRADO pra cron nativo da Vercel
# (vercel.json: action=ig_priority_publish, */5 * * * *). Causa raiz real
# confirmada: Roberto enfileirou 8 matérias reais às 18:54 UTC e 36+
# minutos depois nenhuma tinha sido publicada — o schedule */5 deste
# workflow simplesmente não disparou nesse intervalo (list_workflow_jobs
# real mostrou runs espaçados ~1.5-2h entre si, não a cada 5min).
# Comportamento documentado do GitHub Actions quando um workflow acumula
# múltiplos cron schedules (aqui: */20 17-21, */5, */10 concorrendo) —
# disparos são dropados sob carga. Cron nativo da Vercel Pro (usado pelos
# outros 8 crons de vercel.json) não tem esse histórico de falha neste
# projeto. github.event.schedule continua usado pra gatear os 2 jobs que
# sobraram (publicar/*20 17-21, processar_collabs/*10) pro seu próprio
# cron — sem isso os dois rodariam em TODO disparo.
on:
  schedule:
    - cron: '*/20 17-21 * * *'
    - cron: '*/20 11-14 * * *'
    - cron: '*/10 * * * *'
  workflow_dispatch:
  # TEMPORÁRIO — 20/09/2026 — só pra forçar rodada real e capturar o
  # motivo verdadeiro do 400 no upload. REMOVER logo em seguida.
  push:
    paths:
      - '.github/workflows/instagram-auto.yml'

concurrency:
  group: instagram-automatico-ovc
  cancel-in-progress: false

jobs:
  processar_collabs:
    if: github.event_name != 'schedule' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Processar convites de collab autorizados
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_collab_auto_process"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"

  publicar:
    if: github.event_name != 'schedule' || github.event.schedule == '*/20 17-21 * * *' || github.event.schedule == '*/20 11-14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Chamar ig_auto_publish
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_auto_publish"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
      - name: Verificar fila de vídeos brutos
        id: render_queue
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"reels_render_job","peek":true}' --max-time 45)
          has_job=$(RESPONSE="$response" node -e 'const d=JSON.parse(process.env.RESPONSE); process.stdout.write(d.ok&&d.job?"yes":"no")')
          echo "has_job=$has_job" >> "$GITHUB_OUTPUT"

      - name: Preparar renderizador de Reels
        if: steps.render_queue.outputs.has_job == 'yes'
        uses: actions/checkout@v4

      - name: Preparar Node
        if: steps.render_queue.outputs.has_job == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências e fonte oficial
        if: steps.render_queue.outputs.has_job == 'yes'
        run: |
          npm ci --omit=dev
          # 20/09/2026 — causa raiz real confirmada via log de produção
          # (job 106132952031, run 35531558225): esta etapa SEMPRE falhava
          # com "ffmpeg: command not found" (exit 127) — o runner
          # ubuntu-latest não vem com ffmpeg pré-instalado, e o passo só
          # checava a versão (`ffmpeg -version`), nunca instalava de
          # verdade. Isso travava TODO Reel em "Aguardando acabamento",
          # sem exceção — não era específico de nenhum vídeo. Fix: instala
          # de fato antes de checar.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      # A Vercel apenas controla a fila. O processamento pesado roda aqui,
      # preservando o arquivo bruto.
      #
      # 18/09/2026 — a pedido de Roberto ("isso não precisa ficar no
      # supabase, os reels podem ir só pro instagram"): o vídeo final
      # renderizado NUNCA mais é hospedado em lugar nenhum nosso (o teto de
      # 50MB do Supabase Storage bloqueava vídeo maior) — os bytes vão
      # DIRETO daqui, o runner, pro rupload.facebook.com (protocolo de
      # upload resumível da própria Meta pra Reels). O container já nasce
      # com upload_type=resumable em handleReelsRenderJob, que devolve a
      # URL/token de upload — a Meta processa e confirmamos via polling.
      - name: Aplicar layout OVC e enviar direto pra Meta (sem Supabase)
        if: steps.render_queue.outputs.has_job == 'yes'
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          post_id=""
          claim_id=""
          # 20/09/2026 — antes, qualquer falha só gravava "render_failed_exit_N"
          # (código de saída do curl, sem nenhum detalhe) em last_error — real
          # e concreto: um upload que a Meta recusa com HTTP 400 tinha o motivo
          # real escondido, só visível cavando o log do CI. Quando um passo
          # específico já sabe o motivo (ex: corpo da resposta HTTP da Meta),
          # ele grava em $error_detail antes de falhar — report_failure usa
          # isso se disponível, senão cai no genérico de sempre.
          error_detail=""
          report_failure() {
            exit_code=$?
            if [ -n "$post_id" ] && [ -n "$claim_id" ]; then
              POST_ID="$post_id" CLAIM_ID="$claim_id" ERROR_TEXT="${error_detail:-render_failed_exit_${exit_code}}" node --input-type=module -e '
                import { writeFileSync } from "node:fs";
                writeFileSync("render-fail.json", JSON.stringify({action:"reels_render_fail",post_id:process.env.POST_ID,claim_id:process.env.CLAIM_ID,error:process.env.ERROR_TEXT}));
              '
              curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                --data-binary @render-fail.json --max-time 30 >/dev/null || true
            fi
            exit "$exit_code"
          }
          trap report_failure ERR

          curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"reels_render_job"}' \
            --max-time 45 -o render-job.json

          post_id=$(node -p 'require("./render-job.json").job.post_id')
          claim_id=$(node -p 'require("./render-job.json").job.claim_id')
          source_url=$(node -p 'require("./render-job.json").job.source_url')
          ig_upload_url=$(node -p 'require("./render-job.json").job.ig_upload_url')
          ig_upload_token=$(node -p 'require("./render-job.json").job.ig_upload_token')
          echo "::add-mask::${ig_upload_token}"

          curl --fail --location -sS "$source_url" --max-time 300 -o reel-source
          node scripts/render-instagram-reel.mjs render-job.json reel-source reel-final.mp4 reel-overlay.png > render-result.json
          cat render-result.json

          # Upload resumível direto pra Meta — nenhum storage nosso no meio.
          # SEM --fail aqui de propósito (20/09/2026): --fail engolia o corpo
          # da resposta em qualquer erro não-2xx, escondendo o motivo real
          # que a Meta manda de volta (confirmado real: um upload com vídeo
          # de fonte longa, mesmo já cortado em 88s pelo cap acima, seguia
          # voltando HTTP 400 sem nenhuma pista de por quê).
          file_size=$(stat -c%s reel-final.mp4)
          echo "Tamanho do vídeo final (pós-corte/render): ${file_size} bytes"
          upload_http_code=$(curl -sS -o upload-response.json -w "%{http_code}" -X POST "$ig_upload_url" \
            -H "Authorization: OAuth ${ig_upload_token}" \
            -H "offset: 0" \
            -H "file_size: ${file_size}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @reel-final.mp4 --max-time 300)
          echo "HTTP do upload pra Meta: ${upload_http_code}"
          cat upload-response.json; echo ""
          if [ "$upload_http_code" != "200" ]; then
            error_detail="upload_http_${upload_http_code}: $(tr -d '\n' < upload-response.json | cut -c1-400)"
            echo "Upload recusado pela Meta — motivo real: ${error_detail}"
            false
          fi

          POST_ID="$post_id" CLAIM_ID="$claim_id" node -e '
            const fs = require("node:fs");
            const render = JSON.parse(fs.readFileSync("render-result.json", "utf8"));
            fs.writeFileSync("render-complete.json", JSON.stringify({
              action: "reels_render_complete",
              post_id: process.env.POST_ID,
              claim_id: process.env.CLAIM_ID,
              end_trim: render.end_trim || null
            }));
          '

          # reels_render_complete não tenta de novo sozinho (é uma function
          # serverless, orçamento curto) — o loop de espera pela Meta
          # terminar de processar o vídeo fica aqui, que tem tempo de sobra
          # (timeout do job é 20min). Meta documenta até ~5min de
          # processamento no pior caso — 5 tentativas de 60s cobrem isso.
          ready="no"
          for attempt in 1 2 3 4 5; do
            curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
              --data-binary @render-complete.json --max-time 45 -o render-complete-response.json
            cat render-complete-response.json; echo ""
            state=$(node -p 'const d=require("./render-complete-response.json"); d.ok===true ? (d.still_processing===true ? "still" : "ready") : "rejected"')
            if [ "$state" = "ready" ]; then ready="yes"; break; fi
            if [ "$state" = "rejected" ]; then false; fi
            sleep 60
          done
          if [ "$ready" != "yes" ]; then
            echo "Vídeo ainda em processamento pela Meta após 5min de espera — marca falha pra retentar com container novo na próxima rodada."
            false
          fi
          echo "Reel pronto — vídeo já está direto na Meta, sem Supabase no meio."
          trap - ERR

      - name: Chamar reels_auto_publish
        if: always()
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"reels_auto_publish"}' \
            --max-time 115 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
