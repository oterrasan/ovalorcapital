name: Instagram - Publicação Automática

# Chama a cada ~15 minutos, 24 horas por dia, a ação ig_auto_publish (api/manage.js).
# Escopo e limite definidos por Roberto: matérias publicadas nas últimas 12 horas,
# sem duplicação e respeitando o limite diário configurado no backend.
# A própria função controla o limite diário via tabela config — este cron só dispara a
# chamada; se o limite já foi atingido ou não há candidato elegível, a resposta vem com
# skipped:true e nada é publicado.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar ig_auto_publish
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_auto_publish"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n" || true
