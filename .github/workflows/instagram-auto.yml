name: Instagram - Publicação Automática

# Disparador externo independente do Codex: executa a cada 20 minutos.
# O backend filtra matérias das últimas 12 horas, evita duplicações e aplica as
# categorias e o limite diário configurados no Admin.
#
# ⚠️ Este arquivo controla SOMENTE o agendamento de publicação no Instagram.
# NUNCA usar como referência pra horário do portal/pipeline de conteúdo —
# aquilo é `vercel.json` (cron nativo, canais de geração: jovempan_politica,
# materias, brasilon, internacional, fofocas — pausam 00h-06h BRT) e
# `futebol`/`outros_esportes` (nunca pausam, Regra Zero "Radar do Esporte
# não toca jamais"). Instagram tem janela própria, independente do resto.
#
# 02/09/2026 (tarde) — Roberto pediu intervalos estratégicos SÓ no Instagram:
# ativo 08h–22h BRT (corte seco às 22h, sem post a partir das 22:00), pausa
# total 22h–08h BRT, ritmo de 1 post a cada 20 minutos dentro da janela ativa.
# Substitui a janela 06h-00h BRT (pausa 00h-06h) de mais cedo no mesmo dia.
#
# 04/09/2026 — Roberto pediu pausa de almoço: ativo 9h-12h BRT, pausa
# 12h-13h BRT, ativo de novo 13h-22h BRT (corte seco às 22h). Gate redundante
# em api/manage.js (_igAutoDentroDaJanelaAtiva) precisa ficar EXATAMENTE em
# sincronia com este cron — se Roberto pedir pra mudar de novo, atualizar
# os dois juntos.
#
# 04/09/2026 (mesmo dia, 3 ajustes seguidos) — 1º pedido: retorno às
# 13h30 (só OVC). 2º pedido (correção): 14h00, nas duas automações (OVC
# e Brasil ON). 3º pedido: Roberto pediu pra POSTERGAR só o OVC — o
# Brasil ON continua liberado às 14h00 (`brasilon/vercel.json`/
# `brasilon/api/manage.js`, INTOCADOS nesta 3ª rodada, não fazem parte
# deste arquivo). ESTADO daquele dia (só OVC): ativo 9h-12h BRT, pausa
# 12h-15h BRT, ativo de novo 15h-22h BRT — as duas automações ficaram
# dessincronizadas de propósito.
#
# 08/09/2026 — Roberto pediu de novo, RESSINCRONIZANDO as duas automações
# (OVC e Brasil ON): ativo 07h-12h BRT, pausa 12h-14h BRT, ativo de novo
# 14h-22h BRT (corte seco às 22h). Gate redundante em api/manage.js
# (_igAutoDentroDaJanelaAtiva) e em brasilon/api/manage.js atualizados
# junto, no mesmo pedido.
#
# 10/09/2026 (manhã) — janela 08h-12h/14h30-19h BRT — SUBSTITUÍDA no mesmo dia.
#
# 10/09/2026 (tarde) — Roberto: "pause as automações dos Instagrams /
# retorne as 14hrs apenas". Janela única, sem bloco de manhã nem pausa de
# meio-dia: ativo 14h-19h BRT (corte seco às 19h). Gate redundante em
# api/manage.js e em brasilon/api/manage.js atualizados junto, no mesmo
# pedido (os dois voltaram pro cálculo simples de horas inteiras — não
# há mais nenhum limite em minuto quebrado).
#
# 11/09/2026 — Roberto: "voce só ligou as janelas da tarde. e esqueceu as
# da manha. comecam as 08hrs e param meio dia. retornam as 14h00" — o
# bloco da manhã (removido por engano em 10/09/2026 tarde) volta a
# existir. ESTADO ATUAL, vigente: ativo 08h-12h BRT, pausa 12h-14h BRT,
# ativo de novo 14h-19h BRT (corte seco às 19h). Gate redundante em
# api/manage.js e em brasilon/api/manage.js atualizados junto, no mesmo
# pedido. Novo schedule `*/20 11-14 * * *` cobre o bloco da manhã.
#
# Cron é sempre UTC (não existe opção de timezone, nem no Actions nem na
# Vercel — já confirmado nesta mesma sessão pro cron nativo da Vercel).
# BRT = UTC-3 (some 3 pra converter BRT→UTC). Ativo 08h-12h BRT = 11h-14h
# UTC (horas 11,12,13,14 inteiras — 14:59 UTC ainda é 11:59 BRT, dentro do
# bloco). Pausa 12h-14h BRT = 15h-16h UTC. Ativo 14h-19h BRT = 17h-22h UTC
# (horas 17,18,19,20,21 inteiras). Corte 19h-08h BRT = 22h-11h UTC (todo o
# resto do dia).
#
# 10/09/2026 (fila prioritária) — cron dedicado `*/5 * * * *` criado aqui
# nesta mesma janela, SÓ pra publicar a fila que Roberto monta manualmente
# no admin (selecionar N matérias → "Publicar no Instagram" → 1 a cada
# ~5min, na ordem escolhida).
#
# 11/09/2026 — 🔴 REMOVIDO daqui, MIGRADO pra cron nativo da Vercel
# (vercel.json: action=ig_priority_publish, */5 * * * *). Causa raiz real
# confirmada: Roberto enfileirou 8 matérias reais às 18:54 UTC e 36+
# minutos depois nenhuma tinha sido publicada — o schedule */5 deste
# workflow simplesmente não disparou nesse intervalo (list_workflow_jobs
# real mostrou runs espaçados ~1.5-2h entre si, não a cada 5min).
# Comportamento documentado do GitHub Actions quando um workflow acumula
# múltiplos cron schedules (aqui: */20 17-21, */5, */10 concorrendo) —
# disparos são dropados sob carga. Cron nativo da Vercel Pro (usado pelos
# outros 8 crons de vercel.json) não tem esse histórico de falha neste
# projeto. github.event.schedule continua usado pra gatear os 2 jobs que
# sobraram (publicar/*20 17-21, processar_collabs/*10) pro seu próprio
# cron — sem isso os dois rodariam em TODO disparo.
on:
  schedule:
    - cron: '*/20 17-21 * * *'
    - cron: '*/20 11-14 * * *'
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      prioridade:
        description: '1 = só remontar Reels pedidos no admin (via rápida, sem esperar a fila)'
        required: false
        default: ''

# 25/09/2026 — via prioritária: um ajuste feito no admin (reels_set_layout)
# dispara este workflow com prioridade=1, que roda num grupo SEPARADO — não
# espera a fila normal de remontagens nem os outros jobs.
concurrency:
  group: instagram-automatico-ovc${{ github.event.inputs.prioridade == '1' && '-prioridade' || '' }}
  cancel-in-progress: false

jobs:
  processar_collabs:
    if: github.event.inputs.prioridade != '1' && (github.event_name != 'schedule' || github.event.schedule == '*/10 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Processar convites de collab autorizados
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_collab_auto_process"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"

  # 21/09/2026 — 🔴 causa raiz real confirmada com dado de produção: o
  # backlog de Reels só crescia porque o processamento pesado (ffmpeg +
  # upload pra Meta) vivia dentro do job `publicar`, gated pelas mesmas
  # janelas de POSTAGEM (08h-12h/14h-19h BRT, ~9h/dia) — mas a geração de
  # vídeo (Brasil ON) roda quase 24h/dia. Preparar/renderizar um Reel NÃO
  # publica nada visível (handleReelsRenderJob/Complete/Fail não checam
  # _igAutoDentroDaJanelaAtiva — só o publish de verdade, handleIgAutoPublish
  # e handleReelsAutoPublish, checam isso, server-side, já eram seguros
  # mesmo fora de qualquer janela deste workflow). Só quem posta de fato
  # continua restrito à janela — preparar agora roda o dia inteiro, junto
  # com processar_collabs (mesmo schedule */10), fechando o gargalo real.
  # Concurrency própria (instagram-render-reels-ovc, não a mesma de
  # publicar/processar_collabs) — um render longo (download+ffmpeg+upload+
  # poll até 5min) nunca deve atrasar um post real do Instagram.
  preparar_reels:
    if: github.event_name != 'schedule' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: instagram-render-reels-ovc${{ github.event.inputs.prioridade == '1' && '-prioridade' || '' }}
      cancel-in-progress: false
    steps:
      - name: Verificar fila de vídeos brutos
        id: render_queue
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
          PRIORIDADE: ${{ github.event.inputs.prioridade == '1' && 'true' || 'false' }}
        run: |
          response=$(curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d "{\"action\":\"reels_render_job\",\"peek\":true,\"prioridade\":${PRIORIDADE}}" --max-time 45)
          has_job=$(RESPONSE="$response" node -e 'const d=JSON.parse(process.env.RESPONSE); process.stdout.write(d.ok&&d.job?"yes":"no")')
          echo "has_job=$has_job" >> "$GITHUB_OUTPUT"

      - name: Preparar renderizador de Reels
        if: steps.render_queue.outputs.has_job == 'yes'
        uses: actions/checkout@v4

      - name: Preparar Node
        if: steps.render_queue.outputs.has_job == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências e fonte oficial
        if: steps.render_queue.outputs.has_job == 'yes'
        run: |
          npm ci --omit=dev
          # 20/09/2026 — causa raiz real confirmada via log de produção
          # (job 106132952031, run 35531558225): esta etapa SEMPRE falhava
          # com "ffmpeg: command not found" (exit 127) — o runner
          # ubuntu-latest não vem com ffmpeg pré-instalado, e o passo só
          # checava a versão (`ffmpeg -version`), nunca instalava de
          # verdade. Isso travava TODO Reel em "Aguardando acabamento",
          # sem exceção — não era específico de nenhum vídeo. Fix: instala
          # de fato antes de checar.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      # A Vercel apenas controla a fila. O processamento pesado roda aqui,
      # preservando o arquivo bruto.
      #
      # 18/09/2026 — a pedido de Roberto ("isso não precisa ficar no
      # supabase, os reels podem ir só pro instagram"): o vídeo final
      # renderizado NUNCA mais é hospedado em lugar nenhum nosso (o teto de
      # 50MB do Supabase Storage bloqueava vídeo maior) — os bytes vão
      # DIRETO daqui, o runner, pro rupload.facebook.com (protocolo de
      # upload resumível da própria Meta pra Reels). O container já nasce
      # com upload_type=resumable em handleReelsRenderJob, que devolve a
      # URL/token de upload — a Meta processa e confirmamos via polling.
      #
      # 22/09/2026 — 🔴 causa raiz real confirmada com dado de produção:
      # esta etapa processava UM job por execução, e a execução real do
      # `schedule: */10 * * * *` do GitHub Actions está MUITO abaixo do
      # configurado — runs reais espaçados 2-5+ HORAS entre si (confirmado
      # comparando timestamps reais de runs consecutivos, não suposição),
      # já documentado como comportamento conhecido do Actions sob carga
      # (ver comentário de 11/09/2026 acima, mesmo padrão, workflow
      # diferente). Um post real de Roberto (Renner/Rick) ficou pending,
      # attempts:0 por quase 1h sem UMA ÚNICA tentativa — não é erro de
      # render, é o gatilho do workflow simplesmente não disparando no
      # ritmo esperado. Como este job precisa de ffmpeg/yt-dlp (binário
      # nativo, só roda aqui, nunca migra pra cron Vercel — mesma cautela
      # documentada em core/storage.js), a mitigação real e imediata é
      # multiplicar o QUANTO cada execução processa: até 3 jobs em
      # sequência por rodada (antes: 1), com corte de segurança por tempo
      # decorrido (não inicia um job novo depois de 12min dos 20min de
      # timeout — sobra folga de verdade pro pior caso, download+render+
      # upload+poll de até 5min do job que já estiver em andamento). Um
      # job travado em "processing" sem nunca reportar completar/falhar
      # (ex: o runner sendo morto por timeout no meio) NÃO fica preso pra
      # sempre — handleReelsRenderJob já reclama itens "processing" com
      # mais de 2h (staleBefore), então o pior caso é uma demora extra, não
      # trava permanente. Falha de UM job (reportada via reels_render_fail)
      # não aborta os demais do loop — cada job roda isolado numa subshell
      # com o próprio trap ERR. 🔴 CUIDADO — testado isolado antes de subir:
      # `if ( set -e; ...; false; ... ); then` NÃO funciona aqui — bash
      # trata todo o corpo do subshell como "contexto de condição" e
      # SUPRIME o errexit mesmo com `set -e` explícito lá dentro (falha
      # real vira "sucesso" silencioso pro `if`, o trap nunca dispara).
      # Por isso o subshell roda como comando PLANO (nunca dentro de um
      # if/while), e o status real é capturado depois via `$?` — só então
      # comparado.
      - name: Aplicar layout OVC e enviar direto pra Meta (sem Supabase)
        if: steps.render_queue.outputs.has_job == 'yes'
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          PRIORIDADE: ${{ github.event.inputs.prioridade == '1' && 'true' || 'false' }}
        run: |
          MAX_JOBS_POR_RODADA=3
          MAX_SEGUNDOS_ANTES_DE_INICIAR_NOVO_JOB=720
          SECONDS=0

          for job_num in $(seq 1 "$MAX_JOBS_POR_RODADA"); do
            if [ "$SECONDS" -ge "$MAX_SEGUNDOS_ANTES_DE_INICIAR_NOVO_JOB" ]; then
              echo "=== ${SECONDS}s decorridos — parando o loop pra deixar folga dentro do timeout de 20min. ==="
              break
            fi

            echo "=== Verificando fila antes do job #${job_num} de até ${MAX_JOBS_POR_RODADA} nesta rodada (${SECONDS}s decorridos) ==="
            peek_response=$(curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
              -d "{\"action\":\"reels_render_job\",\"peek\":true,\"prioridade\":${PRIORIDADE}}" --max-time 45) || peek_response=""
            has_job=$(RESPONSE="$peek_response" node -e 'try{const d=JSON.parse(process.env.RESPONSE||"{}");process.stdout.write(d.ok&&d.job?"yes":"no")}catch(_){process.stdout.write("no")}')
            if [ "$has_job" != "yes" ]; then
              echo "Fila de Reels vazia — nada mais pra renderizar nesta rodada."
              break
            fi

            (
              set -euo pipefail
              post_id=""
              claim_id=""
              # 20/09/2026 — antes, qualquer falha só gravava "render_failed_exit_N"
              # (código de saída do curl, sem nenhum detalhe) em last_error — real
              # e concreto: um upload que a Meta recusa com HTTP 400 tinha o motivo
              # real escondido, só visível cavando o log do CI. Quando um passo
              # específico já sabe o motivo (ex: corpo da resposta HTTP da Meta),
              # ele grava em $error_detail antes de falhar — report_failure usa
              # isso se disponível, senão cai no genérico de sempre.
              error_detail=""
              report_failure() {
                exit_code=$?
                if [ -n "$post_id" ] && [ -n "$claim_id" ]; then
                  POST_ID="$post_id" CLAIM_ID="$claim_id" ERROR_TEXT="${error_detail:-render_failed_exit_${exit_code}}" node --input-type=module -e '
                    import { writeFileSync } from "node:fs";
                    writeFileSync("render-fail.json", JSON.stringify({action:"reels_render_fail",post_id:process.env.POST_ID,claim_id:process.env.CLAIM_ID,error:process.env.ERROR_TEXT}));
                  '
                  curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                    --data-binary @render-fail.json --max-time 30 >/dev/null || true
                fi
                exit "$exit_code"
              }
              trap report_failure ERR

              curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                -d "{\"action\":\"reels_render_job\",\"prioridade\":${PRIORIDADE}}" \
                --max-time 45 -o render-job.json

              post_id=$(node -p 'require("./render-job.json").job.post_id')
              claim_id=$(node -p 'require("./render-job.json").job.claim_id')
              source_url=$(node -p 'require("./render-job.json").job.source_url')
              ig_upload_url=$(node -p 'require("./render-job.json").job.ig_upload_url')
              ig_upload_token=$(node -p 'require("./render-job.json").job.ig_upload_token')
              echo "::add-mask::${ig_upload_token}"

              # 21/09/2026 — Bacci migrou o player de vídeo pra embed do YouTube
              # (confirmado com dado real: 25/25 matérias recentes testadas usam
              # youtube.com/embed ou youtu.be, 0 usam o padrão antigo). YouTube
              # não expõe link de arquivo direto — curl sozinho não baixa nada
              # de lá. yt-dlp instalado sob demanda (só quando a fonte é
              # YouTube, não em toda rodada) via pip --break-system-packages
              # (Ubuntu 24.04 do runner bloqueia pip global sem essa flag,
              # PEP 668) — a versão do apt costuma ficar desatualizada demais
              # pra acompanhar mudanças frequentes da API do YouTube.
              # 24/09/2026 — instagram.com adicionado: a Engrenagem de
              # Reescrita por Link (core/linkCapture.js + handleLinkManual em
              # api/run_portal.js) enfileira link direto de Instagram do
              # mesmo jeito que YouTube (source_kind:"instagram", nunca
              # baixado no servidor — mesmo motivo de sempre, sem arquivo
              # direto exposto, precisa de yt-dlp). yt-dlp já suporta
              # Instagram (posts/reels/TV) nativamente, mesma invocação.
              # 26/09/2026 — Globo (g1/ge/globoplay) adicionada: o vídeo é
              # protegido, mas o yt-dlp baixa pelo código "globo:<id>"
              # (testado de verdade no runner, 2/2 matérias do g1).
              # YouTube ganha runtime JS (Deno) + servidor de token (bgutil),
              # sem os quais boa parte dos vídeos cai em "confirme que não é
              # robô".
              if echo "$source_url" | grep -qE 'globoplay\.globo\.com/v/[0-9]+'; then
                source_url="globo:$(echo "$source_url" | grep -oE 'globoplay\.globo\.com/v/[0-9]+' | grep -oE '[0-9]+$')"
              fi
              if echo "$source_url" | grep -qE '^globo:|youtube\.com|youtu\.be|instagram\.com'; then
                pip install --quiet --break-system-packages -U "yt-dlp[default]"
                if echo "$source_url" | grep -qE 'youtube\.com|youtu\.be'; then
                  pip install --quiet --break-system-packages -U bgutil-ytdlp-pot-provider || true
                  docker run -d --rm -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider >/dev/null 2>&1 || true
                  curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
                  export PATH="$HOME/.deno/bin:$PATH"
                  sleep 5
                fi
                # 25/09/2026 — cookies da conta de apoio (se configurados):
                # sem login, Instagram/YouTube recusam o servidor.
                cookies_opt=""
                if [ -n "${YTDLP_COOKIES:-}" ]; then
                  printf '%s\n' "$YTDLP_COOKIES" > "$RUNNER_TEMP/ytdlp-cookies.txt"
                  cookies_opt="--cookies $RUNNER_TEMP/ytdlp-cookies.txt"
                fi
                if ! yt-dlp --no-progress $cookies_opt -f "bv*[ext=mp4][height<=1080]+ba[ext=m4a]/b[ext=mp4]/best" \
                  --merge-output-format mp4 -o reel-source "$source_url" 2> ytdlp-error.log; then
                  error_detail="ytdlp_falhou: $(tr -d '\n' < ytdlp-error.log | cut -c1-400)"
                  false
                fi
              else
                curl --fail --location -sS "$source_url" --max-time 300 -o reel-source
              fi
              node scripts/render-instagram-reel.mjs render-job.json reel-source reel-final.mp4 reel-overlay.png > render-result.json
              cat render-result.json

              # 25/09/2026 — Roberto: "preciso visualizar como ficou a montagem,
              # só assim posso aprovar". Cópia de visualização leve (540x960,
              # bitrate baixo) sobe pro nosso Storage via URL assinada — o vídeo
              # final em qualidade cheia continua indo só pra Meta. Best-effort:
              # dentro de "if", falha aqui nunca derruba o Reel.
              preview_upload_url=$(node -p 'require("./render-job.json").job.preview_upload_url || ""')
              preview_uploaded="false"
              if [ -n "$preview_upload_url" ]; then
                echo "::add-mask::${preview_upload_url}"
                if ffmpeg -y -loglevel error -i reel-final.mp4 -vf "scale=540:960" \
                     -c:v libx264 -preset veryfast -crf 30 -maxrate 1200k -bufsize 2400k -pix_fmt yuv420p \
                     -c:a aac -b:a 64k -movflags +faststart reel-preview.mp4 \
                   && curl --fail -sS -X PUT "$preview_upload_url" \
                     -H "Content-Type: video/mp4" \
                     -H "Cache-Control: max-age=3600" \
                     -H "x-upsert: true" \
                     --upload-file reel-preview.mp4 --max-time 120 >/dev/null; then
                  preview_uploaded="true"
                  echo "Prévia da montagem enviada ($(stat -c%s reel-preview.mp4) bytes)."
                  # Mostra a prévia no admin JÁ, antes do envio pra Meta.
                  curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                    -d "{\"action\":\"reels_render_preview\",\"post_id\":\"${post_id}\",\"claim_id\":\"${claim_id}\"}" \
                    --max-time 30 || true
                  echo ""
                else
                  echo "Prévia da montagem não foi gerada/enviada (não afeta o Reel)."
                fi
              fi

              # 26/09/2026 — capa própria pra grade do perfil. O Instagram mostra só
              # o miolo da capa, então o TOPO do Reel (logo do VC até a manchete,
              # 1080x1440) vai centralizado numa capa 1080x1920. A Meta baixa a
              # capa na criação do container: sobe a imagem e pede um container
              # novo com capa. Qualquer falha aqui mantém o container original.
              cover_upload_url=$(node -p 'require("./render-job.json").job.cover_upload_url || ""')
              if [ -n "$cover_upload_url" ]; then
                echo "::add-mask::${cover_upload_url}"
                if ffmpeg -y -loglevel error -ss 1 -i reel-final.mp4 -frames:v 1 \
                     -vf "scale=1080:1920,crop=1080:1440:0:0,pad=1080:1920:0:240:black" -q:v 2 reel-cover.jpg \
                   && curl --fail -sS -X PUT "$cover_upload_url" \
                     -H "Content-Type: image/jpeg" -H "x-upsert: true" \
                     --upload-file reel-cover.jpg --max-time 60 >/dev/null \
                   && curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                     -H "Content-Type: application/json" \
                     -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                     -d "{\"action\":\"reels_render_capa\",\"post_id\":\"${post_id}\",\"claim_id\":\"${claim_id}\"}" \
                     --max-time 45 -o capa.json \
                   && [ "$(node -p 'require("./capa.json").ok === true')" = "true" ]; then
                  ig_upload_url=$(node -p 'require("./capa.json").ig_upload_url')
                  ig_upload_token=$(node -p 'require("./capa.json").ig_upload_token')
                  echo "::add-mask::${ig_upload_token}"
                  echo "Capa da grade aplicada."
                else
                  echo "Capa da grade não aplicada (o Reel segue sem capa própria)."
                  cat capa.json 2>/dev/null || true; echo ""
                fi
              fi

              # Upload resumível direto pra Meta — nenhum storage nosso no meio.
              # SEM --fail aqui de propósito (20/09/2026): --fail engolia o corpo
              # da resposta em qualquer erro não-2xx, escondendo o motivo real
              # que a Meta manda de volta (confirmado real: um upload com vídeo
              # de fonte longa, mesmo já cortado em 88s pelo cap acima, seguia
              # voltando HTTP 400 sem nenhuma pista de por quê).
              file_size=$(stat -c%s reel-final.mp4)
              echo "Tamanho do vídeo final (pós-corte/render): ${file_size} bytes"
              upload_http_code=$(curl -sS -o upload-response.json -w "%{http_code}" -X POST "$ig_upload_url" \
                -H "Authorization: OAuth ${ig_upload_token}" \
                -H "offset: 0" \
                -H "file_size: ${file_size}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @reel-final.mp4 --max-time 300)
              echo "HTTP do upload pra Meta: ${upload_http_code}"
              cat upload-response.json; echo ""
              # 26/09/2026 — causa real do ProcessingFailedError (teste no
              # runner): a Meta recusa quando reconhece música com direito
              # autoral por tempo suficiente; o mesmo vídeo sem o áudio passa.
              # Tira o áudio (troca por silêncio), pede container novo e
              # reenvia. O admin mostra "áudio removido".
              if [ "$upload_http_code" = "400" ] && grep -q "ProcessingFailedError" upload-response.json; then
                echo "Meta recusou com o áudio original — reenviando sem áudio."
                ffmpeg -hide_banner -loglevel error -y -i reel-final.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo \
                  -map 0:v -map 1:a -c:v copy -c:a aac -b:a 128k -shortest -movflags +faststart reel-final-mudo.mp4
                curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                  -d "{\"action\":\"reels_render_sem_audio\",\"post_id\":\"${post_id}\",\"claim_id\":\"${claim_id}\"}" \
                  --max-time 45 -o sem-audio.json
                ig_upload_url=$(node -p 'require("./sem-audio.json").ig_upload_url')
                ig_upload_token=$(node -p 'require("./sem-audio.json").ig_upload_token')
                echo "::add-mask::${ig_upload_token}"
                mv reel-final-mudo.mp4 reel-final.mp4
                file_size=$(stat -c%s reel-final.mp4)
                upload_http_code=$(curl -sS -o upload-response.json -w "%{http_code}" -X POST "$ig_upload_url" \
                  -H "Authorization: OAuth ${ig_upload_token}" \
                  -H "offset: 0" \
                  -H "file_size: ${file_size}" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @reel-final.mp4 --max-time 300)
                echo "HTTP do reenvio sem áudio: ${upload_http_code}"
                cat upload-response.json; echo ""
              fi
              if [ "$upload_http_code" != "200" ]; then
                error_detail="upload_http_${upload_http_code}: $(tr -d '\n' < upload-response.json | cut -c1-400)"
                echo "Upload recusado pela Meta — motivo real: ${error_detail}"
                false
              fi

              POST_ID="$post_id" CLAIM_ID="$claim_id" PREVIEW_UPLOADED="$preview_uploaded" node -e '
                const fs = require("node:fs");
                const render = JSON.parse(fs.readFileSync("render-result.json", "utf8"));
                fs.writeFileSync("render-complete.json", JSON.stringify({
                  action: "reels_render_complete",
                  post_id: process.env.POST_ID,
                  claim_id: process.env.CLAIM_ID,
                  end_trim: render.end_trim || null,
                  source_dimensions: render.source_dimensions || null,
                  layout_auto: render.layout_auto || null,
                  preview_uploaded: process.env.PREVIEW_UPLOADED === "true"
                }));
              '

              # reels_render_complete não tenta de novo sozinho (é uma function
              # serverless, orçamento curto) — o loop de espera pela Meta
              # terminar de processar o vídeo fica aqui. Meta documenta até
              # ~5min de processamento no pior caso — 5 tentativas de 60s
              # cobrem isso.
              ready="no"
              for attempt in 1 2 3 4 5; do
                curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                  --data-binary @render-complete.json --max-time 45 -o render-complete-response.json
                cat render-complete-response.json; echo ""
                state=$(node -p 'const d=require("./render-complete-response.json"); d.ok===true ? (d.still_processing===true ? "still" : "ready") : "rejected"')
                if [ "$state" = "ready" ]; then ready="yes"; break; fi
                if [ "$state" = "rejected" ]; then false; fi
                sleep 60
              done
              if [ "$ready" != "yes" ]; then
                echo "Vídeo ainda em processamento pela Meta após 5min de espera — marca falha pra retentar com container novo na próxima rodada."
                false
              fi
              echo "Reel pronto — vídeo já está direto na Meta, sem Supabase no meio."
              trap - ERR
            )
            job_status=$?
            if [ "$job_status" -eq 0 ]; then
              echo "=== Job #${job_num} concluído com sucesso (${SECONDS}s decorridos no total). ==="
            else
              echo "=== Job #${job_num} falhou (status=${job_status}) — já reportado via reels_render_fail, seguindo pro próximo (${SECONDS}s decorridos no total). ==="
            fi
          done


  # 25/09/2026 — Captura automática de links do Instagram/YouTube colados na
  # tela "Reescrita por Link" (pedidos config LINK_JOB__*, ver
  # handleLinkManual em api/run_portal.js). Sem login, Instagram e YouTube
  # recusam o servidor (testado de verdade) — por isso usa os cookies da
  # conta de apoio de Roberto (secret YTDLP_COOKIES, formato cookies.txt).
  # Não publica nada: só gera a matéria pendente + enfileira o Reel.
  capturar_links:
    if: github.event.inputs.prioridade != '1' && (github.event_name != 'schedule' || github.event.schedule == '*/10 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: instagram-capturar-links-ovc
      cancel-in-progress: false
    steps:
      # 26/09/2026 — robô do TikTok do Metrópoles: lista os vídeos recentes do
      # perfil (yt-dlp imitando navegador — o tikwm bloqueia listagem de perfil)
      # e manda pro sistema, que cria os pedidos de captura só dos vídeos novos.
      # Nada é publicado: tudo cai como pendente. Best-effort, nunca derruba o job.
      - name: Buscar vídeos novos do Metrópoles (TikTok)
        continue-on-error: true
        timeout-minutes: 4
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          pip install --quiet --break-system-packages -U "yt-dlp[default,curl-cffi]" >/dev/null 2>&1 || true
          timeout 150 yt-dlp --impersonate chrome --flat-playlist --playlist-end 15 -j "https://www.tiktok.com/@metropolesoficial" > tt.jsonl 2> tt.err || true
          tail -2 tt.err || true
          node -e '
            const fs = require("node:fs");
            const linhas = fs.readFileSync("tt.jsonl", "utf8").split("\n").filter(Boolean);
            const videos = [];
            for (const l of linhas) { try { const d = JSON.parse(l); videos.push({ id: String(d.id || ""), timestamp: Number(d.timestamp || 0), title: String(d.title || d.description || "").slice(0, 120) }); } catch (_) {} }
            fs.writeFileSync("tt.json", JSON.stringify({ action: "metropoles_tiktok_registrar", videos }));
            console.log("Vídeos listados:", videos.length);
          '
          curl -sS -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            --data @tt.json --max-time 45 || true
          echo ""

      - name: Verificar pedidos de captura
        id: link_queue
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"link_jobs_pendentes","peek":true}' --max-time 45) || response=""
          has_job=$(RESPONSE="$response" node -e 'try{const d=JSON.parse(process.env.RESPONSE||"{}");process.stdout.write(d.ok&&d.count>0?"yes":"no")}catch(_){process.stdout.write("no")}')
          echo "Pedidos: $response"
          echo "has_job=$has_job" >> "$GITHUB_OUTPUT"

      - name: Baixar código
        if: steps.link_queue.outputs.has_job == 'yes'
        uses: actions/checkout@v4

      - name: Preparar Node
        if: steps.link_queue.outputs.has_job == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar yt-dlp, ffmpeg e Deno
        if: steps.link_queue.outputs.has_job == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet --break-system-packages -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          # 26/09/2026 — servidor de token do YouTube (bgutil) e biblioteca de
          # login do Instagram (conta de captura cadastrada no admin).
          docker run -d --rm -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider >/dev/null 2>&1 || true
          npm install --no-save --no-audit --no-fund instagram-private-api@1.45.3 >/dev/null 2>&1 || true
          # YouTube exige um runtime de JavaScript pro yt-dlp resolver o player.
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Capturar links (Instagram/YouTube/TikTok)
        if: steps.link_queue.outputs.has_job == 'yes'
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s\n' "$YTDLP_COOKIES" > "$RUNNER_TEMP/ytdlp-cookies.txt"
            export YTDLP_COOKIES_FILE="$RUNNER_TEMP/ytdlp-cookies.txt"
          fi
          node scripts/capture-link-jobs.mjs
          rm -f "$RUNNER_TEMP/ytdlp-cookies.txt"

  publicar:
    if: github.event.inputs.prioridade != '1' && (github.event_name != 'schedule' || github.event.schedule == '*/20 17-21 * * *' || github.event.schedule == '*/20 11-14 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar ig_auto_publish
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_auto_publish"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
      - name: Chamar reels_auto_publish
        if: always()
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"reels_auto_publish"}' \
            --max-time 115 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
