name: Instagram - Publicação Automática

# Disparador externo independente do Codex: executa a cada 20 minutos.
# O backend filtra matérias das últimas 12 horas, evita duplicações e aplica as
# categorias e o limite diário configurados no Admin.
#
# ⚠️ Este arquivo controla SOMENTE o agendamento de publicação no Instagram.
# NUNCA usar como referência pra horário do portal/pipeline de conteúdo —
# aquilo é `vercel.json` (cron nativo, canais de geração: jovempan_politica,
# materias, brasilon, internacional, fofocas — pausam 00h-06h BRT) e
# `futebol`/`outros_esportes` (nunca pausam, Regra Zero "Radar do Esporte
# não toca jamais"). Instagram tem janela própria, independente do resto.
#
# 02/09/2026 (tarde) — Roberto pediu intervalos estratégicos SÓ no Instagram:
# ativo 08h–22h BRT (corte seco às 22h, sem post a partir das 22:00), pausa
# total 22h–08h BRT, ritmo de 1 post a cada 20 minutos dentro da janela ativa.
# Substitui a janela 06h-00h BRT (pausa 00h-06h) de mais cedo no mesmo dia.
#
# 04/09/2026 — Roberto pediu pausa de almoço: ativo 9h-12h BRT, pausa
# 12h-13h BRT, ativo de novo 13h-22h BRT (corte seco às 22h). Gate redundante
# em api/manage.js (_igAutoDentroDaJanelaAtiva) precisa ficar EXATAMENTE em
# sincronia com este cron — se Roberto pedir pra mudar de novo, atualizar
# os dois juntos.
#
# 04/09/2026 (mesmo dia, 3 ajustes seguidos) — 1º pedido: retorno às
# 13h30 (só OVC). 2º pedido (correção): 14h00, nas duas automações (OVC
# e Brasil ON). 3º pedido: Roberto pediu pra POSTERGAR só o OVC — o
# Brasil ON continua liberado às 14h00 (`brasilon/vercel.json`/
# `brasilon/api/manage.js`, INTOCADOS nesta 3ª rodada, não fazem parte
# deste arquivo). ESTADO daquele dia (só OVC): ativo 9h-12h BRT, pausa
# 12h-15h BRT, ativo de novo 15h-22h BRT — as duas automações ficaram
# dessincronizadas de propósito.
#
# 08/09/2026 — Roberto pediu de novo, RESSINCRONIZANDO as duas automações
# (OVC e Brasil ON): ativo 07h-12h BRT, pausa 12h-14h BRT, ativo de novo
# 14h-22h BRT (corte seco às 22h). Gate redundante em api/manage.js
# (_igAutoDentroDaJanelaAtiva) e em brasilon/api/manage.js atualizados
# junto, no mesmo pedido. ESTADO ATUAL, vigente.
#
# Cron é sempre UTC (não existe opção de timezone, nem no Actions nem na
# Vercel — já confirmado nesta mesma sessão pro cron nativo da Vercel).
# BRT = UTC-3 (some 3 pra converter BRT→UTC). Ativo 07h-12h BRT = 10h-15h UTC
# (horas 10,11,12,13,14). Pausa 12h-14h BRT = 15h-17h UTC (horas 15,16). Ativo
# 14h-22h BRT = 17h-01h UTC do dia seguinte (horas 17-23 e 0). Pausa
# 22h-07h BRT = 01h-10h UTC (horas 1-9).
on:
  schedule:
    - cron: '*/20 0,10-14,17-23 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-automatico-ovc
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Chamar ig_auto_publish
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_auto_publish"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
      - name: Verificar fila de vídeos brutos
        id: render_queue
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"reels_render_job","peek":true}' --max-time 45)
          has_job=$(RESPONSE="$response" node -e 'const d=JSON.parse(process.env.RESPONSE); process.stdout.write(d.ok&&d.job?"yes":"no")')
          echo "has_job=$has_job" >> "$GITHUB_OUTPUT"

      - name: Preparar renderizador de Reels
        if: steps.render_queue.outputs.has_job == 'yes'
        uses: actions/checkout@v4

      - name: Preparar Node
        if: steps.render_queue.outputs.has_job == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências e fonte oficial
        if: steps.render_queue.outputs.has_job == 'yes'
        run: |
          npm ci --omit=dev
          mkdir -p "$HOME/.local/share/fonts"
          cp public/assets/fonts/Inter-Variable.ttf "$HOME/.local/share/fonts/Inter-Variable.ttf"
          fc-cache -f
          ffmpeg -version >/dev/null

      # A Vercel apenas controla a fila. O processamento pesado roda aqui,
      # preservando o arquivo bruto e sem introduzir ffmpeg no servidor web.
      - name: Aplicar layout OVC ao próximo vídeo bruto
        if: steps.render_queue.outputs.has_job == 'yes'
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          post_id=""
          claim_id=""
          report_failure() {
            exit_code=$?
            if [ -n "$post_id" ] && [ -n "$claim_id" ]; then
              POST_ID="$post_id" CLAIM_ID="$claim_id" ERROR_TEXT="render_failed_exit_${exit_code}" node --input-type=module -e '
                import { writeFileSync } from "node:fs";
                writeFileSync("render-fail.json", JSON.stringify({action:"reels_render_fail",post_id:process.env.POST_ID,claim_id:process.env.CLAIM_ID,error:process.env.ERROR_TEXT}));
              '
              curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
                --data-binary @render-fail.json --max-time 30 >/dev/null || true
            fi
            exit "$exit_code"
          }
          trap report_failure ERR

          curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"reels_render_job"}' \
            --max-time 45 -o render-job.json

          post_id=$(node -p 'require("./render-job.json").job.post_id')
          claim_id=$(node -p 'require("./render-job.json").job.claim_id')
          source_url=$(node -p 'require("./render-job.json").job.source_url')
          upload_url=$(node -p 'require("./render-job.json").job.upload_url')
          public_url=$(node -p 'require("./render-job.json").job.public_url')

          curl --fail --location -sS "$source_url" --max-time 300 -o reel-source
          node scripts/render-instagram-reel.mjs render-job.json reel-source reel-final.mp4 reel-overlay.png
          curl --fail -sS -X PUT "$upload_url" \
            -H "Content-Type: video/mp4" \
            -H "Cache-Control: max-age=31536000" \
            -H "x-upsert: false" \
            --upload-file reel-final.mp4 --max-time 300 >/dev/null

          POST_ID="$post_id" CLAIM_ID="$claim_id" PUBLIC_URL="$public_url" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("render-complete.json", JSON.stringify({action:"reels_render_complete",post_id:process.env.POST_ID,claim_id:process.env.CLAIM_ID,public_url:process.env.PUBLIC_URL}));
          '
          curl --fail -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            --data-binary @render-complete.json --max-time 45 -o render-complete-response.json
          node -e 'const d=require("./render-complete-response.json"); if(!d.ok) throw new Error(d.error||"render_complete_failed"); console.log("Layout OVC aplicado e vídeo final armazenado.")'
          trap - ERR

      - name: Chamar reels_auto_publish
        if: always()
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"reels_auto_publish"}' \
            --max-time 115 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
