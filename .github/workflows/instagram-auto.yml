name: Instagram - Publicação Automática

# Disparador externo independente do Codex: executa a cada 15 minutos.
# O backend filtra matérias das últimas 12 horas, evita duplicações e aplica as
# categorias e o limite diário configurados no Admin.
#
# 02/09/2026 — Roberto: pausa geral da automação 00h-06h horário de Brasília
# (BRT = UTC-3), Instagram incluído explicitamente ("ATENCAO NISSO, É 00H00
# HORARIO DE BRASILIA... voltamos as 6 da manha em tudo"). Cron é sempre UTC
# (não existe opção de timezone, nem no Actions nem na Vercel — já confirmado
# nesta mesma sessão pro cron nativo da Vercel). 00:00 BRT = 03:00 UTC,
# 06:00 BRT = 09:00 UTC — pausa nas horas UTC 3,4,5,6,7,8, ativo em 9-23,0-2.
on:
  schedule:
    - cron: '*/15 0-2,9-23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-auto.yml'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar ig_auto_publish
        env:
          OVC_ADMIN_TOKEN: ${{ secrets.OVC_ADMIN_TOKEN }}
        run: |
          response=$(curl -sS -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OVC_ADMIN_TOKEN}" \
            -d '{"action":"ig_auto_publish"}' \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          status=$(echo "$response" | sed -n 's/^HTTP_STATUS://p')
          test "$status" = "200"
