name: DIAG ONE-OFF — Radar do Esporte pos-fix v2 (posicao real, producao)
on:
  push:
    branches:
      - claude/diag-radaresporte-v2-once
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar playwright + chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install playwright@latest --no-save --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Medir posicao real do widget na producao (iPhone 13)
        run: |
          node -e '
          const { chromium, devices } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const iphone = devices["iPhone 13"];
            const context = await browser.newContext({ ...iphone, bypassCSP: true });
            const page = await context.newPage();
            const consoleMsgs = [];
            page.on("console", msg => { if (msg.type() === "error") consoleMsgs.push(msg.text()); });
            page.on("pageerror", err => consoleMsgs.push("[pageerror] " + err.message));

            await page.goto("https://www.ovalorcapital.com.br/", { waitUntil: "networkidle", timeout: 30000 });
            await page.waitForTimeout(2500);

            const scriptTag = await page.evaluate(() => {
              const s = document.querySelector("script[src*=\"ovc-radar-esporte\"]");
              return s ? s.getAttribute("src") : null;
            });
            console.log("script tag carregado:", scriptTag);

            const info = await page.evaluate(() => {
              const hero = document.querySelector(".hero-region");
              const widget = document.getElementById("ovc-radar-esporte");
              const cardsSection = document.getElementById("ovc-cards-section");
              function absoluteTop(el) { if (!el) return null; const r = el.getBoundingClientRect(); return r.top + window.scrollY; }
              return {
                heroAbsTop: absoluteTop(hero),
                cardsAbsTop: absoluteTop(cardsSection),
                widgetAbsTop: absoluteTop(widget),
                widgetExists: !!widget,
                widgetVisible: widget ? (widget.offsetParent !== null) : false,
                widgetIsFirstChildOfCards: cardsSection && widget ? (cardsSection.firstElementChild === widget) : null,
                widgetClassList: widget ? widget.className : null,
                widgetParentClass: widget && widget.parentElement ? widget.parentElement.className || widget.parentElement.id : null,
                viewportHeight: window.innerHeight,
                scrollsToSeeWidget: widget ? Math.ceil(absoluteTop(widget) / window.innerHeight) : null
              };
            });
            console.log("=== MEDICOES REAIS (iPhone 13 emulado, producao) ===");
            console.log(JSON.stringify(info, null, 2));

            if (info.widgetExists) {
              const tabs = await page.$$("#ovc-radar-esporte .ovc-esporte-tab");
              console.log("abas encontradas:", tabs.length);
              if (tabs.length > 3) {
                await tabs[3].click();
                await page.waitForTimeout(500);
                const txt = await page.$eval("#ovc-radar-esporte", n => n.innerText.slice(0,150));
                console.log("apos clicar 4a aba:", txt.replace(/\n+/g," | "));
              }
            }

            console.log("erros JS:", consoleMsgs.slice(0,20));
            await browser.close();
          })().catch(e => { console.log("ERRO GERAL:", e.message, e.stack); process.exit(1); });
          '
