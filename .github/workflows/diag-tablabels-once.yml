name: DIAG ONE-OFF — screenshot do Radar do Esporte pos-fix labels
on:
  push:
    branches:
      - claude/diag-tablabels-once
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar playwright + chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install playwright@latest --no-save --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Tirar screenshot do widget em producao
        run: |
          node -e '
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
            await page.goto("https://www.ovalorcapital.com.br/", { waitUntil: "networkidle", timeout: 30000 });
            await page.waitForTimeout(2500);

            const scriptTag = await page.evaluate(() => {
              const s = document.querySelector("script[src*=\"ovc-radar-esporte\"]");
              return s ? s.getAttribute("src") : null;
            });
            console.log("script tag:", scriptTag);

            const widget = await page.$("#ovc-radar-esporte");
            if (!widget) { console.log("WIDGET NAO ENCONTRADO"); await browser.close(); return; }
            const box = await widget.boundingBox();
            console.log("boundingBox:", JSON.stringify(box));

            await widget.screenshot({ path: "widget.png" });
            const buf = fs.readFileSync("widget.png");
            console.log("PNG bytes:", buf.length);
            console.log("BASE64_START");
            console.log(buf.toString("base64"));
            console.log("BASE64_END");

            await browser.close();
          })().catch(e => { console.log("ERRO GERAL:", e.message, e.stack); process.exit(1); });
          '
