name: DIAG ONE-OFF — screenshot pequeno das abas do Radar do Esporte
on:
  push:
    branches:
      - claude/diag-tablabels-once
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar playwright + chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install playwright@latest --no-save --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Screenshot pequeno so das abas
        run: |
          node -e '
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
            await page.goto("https://www.ovalorcapital.com.br/", { waitUntil: "networkidle", timeout: 30000 });
            await page.waitForTimeout(2500);

            const tabs = await page.$("#ovc-radar-esporte .ovc-esporte-tabs");
            if (!tabs) { console.log("TABS NAO ENCONTRADO"); await browser.close(); return; }
            const box = await tabs.boundingBox();
            console.log("boundingBox tabs:", JSON.stringify(box));

            await tabs.screenshot({ path: "tabs.png" });
            const buf = fs.readFileSync("tabs.png");
            console.log("PNG bytes:", buf.length);
            const b64 = buf.toString("base64");
            const CHUNK = 1200;
            console.log("TOTAL_CHUNKS:" + Math.ceil(b64.length / CHUNK));
            for (let i = 0; i < b64.length; i += CHUNK) {
              console.log("C" + String(i / CHUNK).padStart(4, "0") + ":" + b64.slice(i, i + CHUNK));
            }

            await browser.close();
          })().catch(e => { console.log("ERRO GERAL:", e.message, e.stack); process.exit(1); });
          '
