name: DIAG ONE-OFF — commitar screenshot das abas do Radar do Esporte
on:
  push:
    branches:
      - claude/diag-tablabels-once
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar playwright + chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm install playwright@latest --no-save --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Screenshot das abas + widget completo
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
            await page.goto("https://www.ovalorcapital.com.br/", { waitUntil: "networkidle", timeout: 30000 });
            await page.waitForTimeout(2500);

            const tabs = await page.$("#ovc-radar-esporte .ovc-esporte-tabs");
            if (tabs) { await tabs.screenshot({ path: "diag-tabs.png" }); console.log("tabs OK"); }
            else { console.log("TABS NAO ENCONTRADO"); }

            const widget = await page.$("#ovc-radar-esporte");
            if (widget) { await widget.screenshot({ path: "diag-widget.png" }); console.log("widget OK"); }
            else { console.log("WIDGET NAO ENCONTRADO"); }

            await browser.close();
          })().catch(e => { console.log("ERRO GERAL:", e.message, e.stack); process.exit(1); });
          '
      - name: Commitar screenshots no branch de diagnostico
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add -f diag-tabs.png diag-widget.png
          git commit -m "diag: screenshots do Radar do Esporte pos-fix labels"
          git push origin HEAD:claude/diag-tablabels-once
