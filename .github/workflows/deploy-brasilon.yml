name: Deploy Brasil ON (Vercel)

# Deploy automático do portal Brasil ON (projeto Vercel separado, pasta
# brasilon/ do monorepo) — substitui o padrão anterior de sessões manuais
# via diag-once.yml (ver histórico em brasilon/CLAUDE.md). Dispara sozinho
# em qualquer push a main que toque brasilon/**. Também aceita
# workflow_dispatch para quem tiver permissão de disparo manual pela UI do
# GitHub — mas a integração MCP usada nas sessões automáticas deste projeto
# recebe 403 nesse endpoint, então o retry automático da cota da Vercel usa
# um push real em vez de workflow_dispatch (ver brasilon/CLAUDE.md).

on:
  push:
    branches: [main]
    paths:
      - 'brasilon/**'
  workflow_dispatch:

concurrency:
  group: brasilon-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Brasil ON para produção na Vercel
        working-directory: brasilon
        run: |
          npm install -g vercel@54.6.1
          vercel --token="${{ secrets.VERCEL_TOKEN }}" --yes --prod

      - name: Disparar sync pós-deploy
        run: |
          sleep 10
          RESP=$(curl -s --max-time 20 -X POST "https://www.obrasilon.com.br/api/manage?action=sync&pass=ovc-admin-2026-secreto")
          echo "BRASIL_ON_SYNC: $RESP" | head -c 300
