name: diag-manual-saopaulo2
on:
  push:
    paths:
      - '.github/workflows/diag-manual-saopaulo2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install axios cheerio sharp @supabase/supabase-js --no-save
      - run: |
          cat > $GITHUB_WORKSPACE/diag-manual2.mjs << 'EOF'
          import { createClient } from "@supabase/supabase-js";
          import crypto from "crypto";
          import { scrape } from "/home/runner/work/ovalorcapital/ovalorcapital/core/scraper.js";
          import { processAndSaveImage } from "/home/runner/work/ovalorcapital/ovalorcapital/core/image_processor.js";

          const supabase = createClient("https://yntwvfcxjardzafdqanj.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40");

          const url = "https://www.cnnbrasil.com.br/esportes/futebol/sao-paulo/onibus-que-transportaria-sao-paulo-e-apreendido-com-865-kg-de-maconha/";
          const BODY_B64 = "";
          const corpo = Buffer.from(BODY_B64, "base64").toString("utf-8").trim();

          const titulo = "Ônibus que Levaria São Paulo na Bolívia é Apreendido com 86 kg de Maconha";
          const meta_title = "Ônibus do São Paulo é Apreendido com Maconha";
          const meta_descricao = "Veículo que transportaria a delegação do São Paulo na Bolívia foi apreendido em Cochabamba com 86,55 kg de maconha antes do duelo contra o Bolívar.";
          const foco_keyword = "ônibus São Paulo Bolívia";
          const slug = "onibus-que-levaria-sao-paulo-e-apreendido-com-maconha-na-bolivia";
          const categoria = "esportes";
          const subcategoria = "Futebol";

          const hash = crypto.createHash("md5").update(url.slice(0, 300) + "_manual").digest("hex");
          const { data: dup } = await supabase.from("posts").select("id").eq("hash", hash).maybeSingle();
          if (dup) { console.log("JA EXISTE — id:", dup.id); process.exit(0); }

          console.log("Fazendo scrape de:", url);
          const a = await scrape(url);
          console.log("scrape() -> image:", a.image || "(vazio)", "| title:", (a.title||"").slice(0,80), "| text.length:", (a.text||"").length);

          let img = null;
          if (a.image) {
            try {
              img = await processAndSaveImage(a.image, hash.slice(0, 12), Date.now(), {});
              console.log("Imagem processada:", img || "(falhou)");
            } catch (e) { console.log("Erro ao processar imagem:", e.message); }
          }

          const post = {
            titulo, conteudo: corpo, comentario_fixado: meta_descricao, imagem: img, hash,
            status: "pendente", approved: false, publish_method: "portal", published_at: null,
            user_tags: JSON.stringify([categoria]), subcategoria, subcategoria_slug: "futebol", collaborators: "[]",
            metrics: {
              foco_keyword, seo_slug: slug, meta_descricao, meta_title, tipo_conteudo: "manual",
              source_url: url, source_title: a.title || "", source_image_url: a.image || "",
              image_strategy: img ? "source_article" : "none", image_original_url: a.image || ""
            },
            priority: 1, retry_count: 0, max_retries: 3
          };

          const { data: saved, error } = await supabase.from("posts").insert(post).select("id").maybeSingle();
          if (error) { console.log("ERRO INSERT:", error); process.exit(1); }
          console.log("PUBLICADO COMO PENDENTE — id:", saved?.id);
          console.log("URL provavel apos aprovacao: https://www.ovalorcapital.com.br/esportes/" + slug.slice(0,55) + "-" + String(saved.id).slice(0,8) + "/");
          EOF
          node $GITHUB_WORKSPACE/diag-manual2.mjs
