name: Force 10 materias especiais — Roberto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-materias-especiais.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "1 - Seguros"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Mercado de seguros no Brasil em 2026. Seguros de vida, residencial, automovel e empresarial. Crescimento do setor, principais coberturas, melhores seguradoras e como proteger patrimonio e renda da familia brasileira.","force":true}' \
            --max-time 90
          sleep 8

      - name: "2 - Previdencia Privada"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Previdencia privada no Brasil: PGBL e VGBL, rentabilidade, beneficios fiscais e estrategias para aposentadoria complementar em 2026. Como planejar renda no longo prazo e escolher o melhor plano previdenciario.","force":true}' \
            --max-time 90
          sleep 8

      - name: "3 - Consorcios de Automoveis"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Consorcios de automoveis no Brasil crescem em 2026. Vantagens sobre o financiamento, taxas administrativas, lances e contemplacao. Como funciona o consorcio de veiculos e quais sao as melhores administradoras do mercado.","force":true}' \
            --max-time 90
          sleep 8

      - name: "4 - Estado de Saude Bolsonaro"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Estado de saude do ex-presidente Jair Bolsonaro em 2026. Atualizacoes sobre internacoes, tratamentos medicos e boletins clinicos. Impactos politicos e repercussao nacional sobre a saude do lider da direita brasileira.","force":true}' \
            --max-time 90
          sleep 8

      - name: "5 - Copa do Mundo 2026"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Copa do Mundo 2026 nos Estados Unidos, Canada e Mexico. Grupos, favoritos, sedes e formato do torneio com 48 selecoes. Maior Copa da historia e a batalha das nacoes pelo titulo mundial de futebol.","force":true}' \
            --max-time 90
          sleep 8

      - name: "6 - Selecao Brasileira"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Selecao Brasileira de futebol rumo a Copa do Mundo 2026. Convocacoes, jogadores em destaque, tecnico, formacao tatica e desempenho nas Eliminatorias Sul-Americanas. Chances do Brasil conquistar o hexacampeonato mundial.","force":true}' \
            --max-time 90
          sleep 8

      - name: "7 - Investimento em Dolar"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Investimento em dolar como protecao cambial e diversificacao de portfolio em 2026. Estrategias para exposicao ao dolar: fundos cambiais, ETFs, BDRs e contas em moeda estrangeira. Riscos e oportunidades para o investidor brasileiro.","force":true}' \
            --max-time 90
          sleep 8

      - name: "8 - Mercado de Cripto"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Mercado de criptomoedas em 2026. Bitcoin, Ethereum e altcoins: analise de precos, regulacao no Brasil pela Receita Federal e Banco Central, perspectivas e estrategias de investimento em ativos digitais para investidores brasileiros.","force":true}' \
            --max-time 90
          sleep 8

      - name: "9 - Chevrolet Omega O Absoluto"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Chevrolet Omega O Absoluto: historia do lendario sedao brasileiro. Versoes, motorizacoes V8, Omega A, B, C e series especiais. Legado cultural do icone automotivo nacional que dominou estradas brasileiras por decadas e encerrou producao deixando saudades.","force":true}' \
            --max-time 90
          sleep 8

      - name: "10 - Consorcios de Imoveis"
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"texto":"Consorcios de imoveis no Brasil em 2026: alternativa inteligente ao financiamento imobiliario. Como funciona, taxas administrativas, contemplacao por lance e sorteio, e por que o consorcio imobiliario pode ser a melhor opcao para conquistar casa propria.","force":true}' \
            --max-time 90
