name: DIAG once - jovempan falhas 3
on:
  push:
    branches:
      - claude/diag-jovempan-falhas-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify saved posts via public API
        run: |
          RESP=$(curl -s "https://www.ovalorcapital.com.br/api/portal-posts?recentes=true&categoria=politica&limit=8")
          echo "POLITICA_RECENTES: $RESP" | head -c 4000
