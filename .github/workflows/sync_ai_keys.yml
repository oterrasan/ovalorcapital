name: Sincronizar chave oficial de IA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync_ai_keys.yml"
  workflow_dispatch:

jobs:
  sync-ai-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Puxar variaveis de producao da Vercel
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b

      - name: Sincronizar somente OPENAI_API_KEY
        shell: bash
        run: |
          set -euo pipefail

          OPENAI_VALUE=$(node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'fs';
          function loadEnv(path) {
            if (!existsSync(path)) return;
            const raw = readFileSync(path, 'utf8');
            for (const line of raw.split(/\r?\n/)) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#')) continue;
              const idx = trimmed.indexOf('=');
              if (idx <= 0) continue;
              const key = trimmed.slice(0, idx).trim();
              let value = trimmed.slice(idx + 1).trim();
              if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
              if (!process.env[key]) process.env[key] = value;
            }
          }
          loadEnv('.vercel/.env.production.local');
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_KEY;
          if (!url || !key) throw new Error('Supabase env ausente');
          const r = await fetch(`${url}/rest/v1/config?select=value&key=eq.OPENAI_API_KEY`, { headers: { apikey: key, Authorization: `Bearer ${key}` } });
          const d = await r.json();
          const value = d?.[0]?.value || '';
          if (!value || !String(value).startsWith('sk-')) throw new Error('OPENAI_API_KEY ausente no config');
          process.stdout.write(String(value));
          NODE
          )

          for target in production preview development; do
            echo "Sincronizando ambiente: $target"
            vercel env rm GEMINI_API_KEY "$target" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
            vercel env rm GROQ_API_KEY "$target" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
            vercel env rm ANTHROPIC_API_KEY "$target" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
            vercel env rm GOOGLE_API_KEY "$target" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
            vercel env rm OPENAI_KEY "$target" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
            vercel env rm OPENAI_API_KEY "$target" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
            printf "%s" "$OPENAI_VALUE" | vercel env add OPENAI_API_KEY "$target" --token=${{ secrets.VERCEL_TOKEN }}
          done
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b
