name: OVC Pipeline Instagram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Executar pipeline Instagram
        run: |
          curl -s -X POST https://www.ovalorcapital.com.br/api/run \
            -H "Content-Type: application/json" \
            --max-time 55 \
            -o /tmp/result.json 2>&1
          cat /tmp/result.json
