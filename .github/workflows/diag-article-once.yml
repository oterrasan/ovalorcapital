name: DIAG ONE-OFF — dump corpo completo em base64

on:
  push:
    branches:
      - claude/diag-article-once
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dump corpo completo (base64, evita problema de encoding no log)
        run: |
          node -e '
          const https = require("https");
          https.get("https://www.ovalorcapital.com.br/negocios/justica-autoriza-americanas-a-vender-rede-hortifruti-natural-4bd12bdf/", (res) => {
            let data = "";
            res.on("data", c => data += c);
            res.on("end", () => {
              const m = data.match(/window\.__OVC_ARTICLE__=(\{[\s\S]*?\});window\.SUPABASE_ANON_KEY/);
              if (!m) { console.log("NAO ACHOU"); return; }
              const obj = JSON.parse(m[1]);
              console.log("B64_START");
              console.log(Buffer.from(obj.corpo, "utf8").toString("base64"));
              console.log("B64_END");
            });
          }).on("error", e => console.log("ERROR:", e.message));
          '
