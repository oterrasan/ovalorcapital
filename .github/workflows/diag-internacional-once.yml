name: DIAG once - internacional round 2
on:
  push:
    branches:
      - claude/diag-internacional-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect sitemaps and article link patterns
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "=== Al Jazeera sitemap.xml content (first 800 chars) ==="
          curl -s -A "$UA" "https://www.aljazeera.com/sitemap.xml" | head -c 800
          echo ""
          echo "=== Al Jazeera news homepage article links (loose pattern) ==="
          curl -s -A "$UA" "https://www.aljazeera.com/news/" -o /tmp/aj.html
          grep -oE 'href="/news/[0-9]{4}/[0-9]{1,2}/[0-9]{1,2}/[a-z0-9-]+"' /tmp/aj.html | sort -u | head -8

          echo ""
          echo "=== Euronews sitemap articles.xml (first 1000 chars) ==="
          curl -s -A "$UA" "https://www.euronews.com/sitemaps/en/articles.xml" | head -c 1000
          echo ""
          echo "=== Euronews homepage article links ==="
          curl -s -A "$UA" "https://www.euronews.com/my-europe" -o /tmp/eu.html
          grep -oE 'href="https://www.euronews.com/[a-z0-9/.-]{20,}"' /tmp/eu.html | sort -u | head -8

          echo ""
          echo "=== DW retry with corrected URL ==="
          curl -s -o /dev/null -w "dw.com/en/ homepage: %{http_code}\n" -A "$UA" -L "https://www.dw.com/en/"
          curl -s -A "$UA" -L "https://www.dw.com/en/" -o /tmp/dw2.html -w "size: %{size_download} bytes\n"
          grep -oE 'href="/en/[a-z0-9-]{10,}/a-[0-9]+"' /tmp/dw2.html | sort -u | head -8
