name: DIAG once - internacional candidates
on:
  push:
    branches:
      - claude/diag-internacional-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test sitemap/reachability of candidate sites
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "=== Al Jazeera ==="
          curl -s -o /dev/null -w "sitemap_index: %{http_code}\n" -A "$UA" "https://www.aljazeera.com/sitemap.xml"
          curl -s -A "$UA" "https://www.aljazeera.com/news/" -o /tmp/aj.html -w "homepage: %{http_code} %{size_download} bytes\n"
          grep -oE 'https://www.aljazeera.com/news/[0-9]{4}/[0-9]{1,2}/[0-9]{1,2}/[a-z0-9-]+' /tmp/aj.html | sort -u | head -5

          echo "=== Reuters ==="
          curl -s -o /dev/null -w "sitemap: %{http_code}\n" -A "$UA" "https://www.reuters.com/arc/outboundfeeds/sitemap-index/?outputType=xml"
          curl -s -A "$UA" "https://www.reuters.com/world/" -o /tmp/reu.html -w "homepage: %{http_code} %{size_download} bytes\n"

          echo "=== DW (Deutsche Welle) ==="
          curl -s -o /dev/null -w "sitemap: %{http_code}\n" -A "$UA" "https://www.dw.com/en/top-stories/s-9097/sitemap.xml"
          curl -s -A "$UA" "https://www.dw.com/en/top-stories/world/s-1433" -o /tmp/dw.html -w "homepage: %{http_code} %{size_download} bytes\n"
          grep -oE 'https://www.dw.com/en/[a-z0-9-]{15,}/a-[0-9]+' /tmp/dw.html | sort -u | head -5

          echo "=== Euronews ==="
          curl -s -o /dev/null -w "sitemap: %{http_code}\n" -A "$UA" "https://www.euronews.com/sitemaps/en/articles.xml"
          curl -s -A "$UA" "https://www.euronews.com/my-europe" -o /tmp/eu.html -w "homepage: %{http_code} %{size_download} bytes\n"

          echo "=== France24 ==="
          curl -s -o /dev/null -w "sitemap: %{http_code}\n" -A "$UA" "https://www.france24.com/en/sitemap.xml"
          curl -s -A "$UA" "https://www.france24.com/en/" -o /tmp/f24.html -w "homepage: %{http_code} %{size_download} bytes\n"
          grep -oE 'https://www.france24.com/en/[a-z0-9/-]{20,}' /tmp/f24.html | sort -u | head -5
