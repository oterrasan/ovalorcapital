name: DIAG once - BBC world section
on:
  push:
    branches:
      - claude/diag-internacional-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test BBC /news/world section
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -s -A "$UA" "https://www.bbc.com/news/world" -o /tmp/bbcw.html -w "homepage: %{http_code} %{size_download} bytes\n"
          grep -oE 'href="/news/articles/[a-z0-9]+"' /tmp/bbcw.html | sort -u | head -10
