name: DIAG once - CNN fresh links plus image
on:
  push:
    branches:
      - claude/diag-internacional-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Get fresh CNN links from world + sample image
        run: |
          python3 -m pip install --quiet Pillow requests
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -s -A "$UA" "https://www.cnn.com/world" -o /tmp/cnn.html
          echo "=== links matching 2026/08 ==="
          grep -oE 'href="/2026/08/[0-9]{2}/[a-zA-Z0-9/._-]+"' /tmp/cnn.html | sort -u | head -10
          echo "=== any /2026/ links (any month) ==="
          grep -oE 'href="/2026/[0-9]{2}/[0-9]{2}/[a-zA-Z0-9/._-]+"' /tmp/cnn.html | sort -u | head -15

          python3 << 'PYEOF'
          import requests, re, base64, io
          from PIL import Image
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          headers = {"User-Agent": UA}
          # try to find a link from the html and test it directly
          with open("/tmp/cnn.html") as f:
              html = f.read()
          m = re.search(r'href="(/2026/08/\d{2}/[a-zA-Z0-9/._-]+)"', html)
          if not m:
              m = re.search(r'href="(/2026/\d{2}/\d{2}/[a-zA-Z0-9/._-]+)"', html)
          if not m:
              print("CNN: no article link found at all")
          else:
              url = "https://www.cnn.com" + m.group(1)
              print("CNN testing article:", url)
              r = requests.get(url, headers=headers, timeout=15)
              print("CNN article status:", r.status_code, "len:", len(r.text))
              im = re.search(r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"', r.text)
              if not im:
                  im = re.search(r'<meta[^>]+content="([^"]+)"[^>]+property="og:image"', r.text)
              if not im:
                  print("CNN: no og:image")
              else:
                  img_url = im.group(1)
                  print("CNN og:image =", img_url)
                  ir = requests.get(img_url, headers=headers, timeout=15)
                  img = Image.open(io.BytesIO(ir.content)).convert("RGB")
                  img.thumbnail((420, 420))
                  buf = io.BytesIO()
                  img.save(buf, format="JPEG", quality=58)
                  b64 = base64.b64encode(buf.getvalue()).decode()
                  print("CNN_B64_LEN:", len(b64))
                  for i in range(0, len(b64), 1200):
                      print(f"CNN_C{i//1200:04d}: {b64[i:i+1200]}")
          PYEOF
