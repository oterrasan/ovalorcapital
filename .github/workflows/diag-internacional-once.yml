name: DIAG once - BBC NYPost images
on:
  push:
    branches:
      - claude/diag-internacional-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        run: pip install --quiet Pillow requests
      - name: Sample images from BBC and NY Post real articles
        run: |
          python3 << 'PYEOF'
          import requests, re, base64, io
          from PIL import Image

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          headers = {"User-Agent": UA}

          articles = {
            "BBC": "https://www.bbc.com/news/articles/c5y49xp2wrno",
            "NYPOST": "https://nypost.com/2026/08/12/world-news/astonishing-video-shows-baby-rescued-from-rubble-as-colombian-quake-toll-tops-250/",
          }

          for tag, url in articles.items():
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  m = re.search(r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"', r.text)
                  if not m:
                      m = re.search(r'<meta[^>]+content="([^"]+)"[^>]+property="og:image"', r.text)
                  if not m:
                      print(f"{tag}: NO og:image found, html len={len(r.text)}, status={r.status_code}")
                      continue
                  img_url = m.group(1)
                  print(f"{tag}: og:image = {img_url}")
                  ir = requests.get(img_url, headers=headers, timeout=15)
                  img = Image.open(io.BytesIO(ir.content)).convert("RGB")
                  img.thumbnail((460, 460))
                  buf = io.BytesIO()
                  img.save(buf, format="JPEG", quality=62)
                  b64 = base64.b64encode(buf.getvalue()).decode()
                  print(f"{tag}_B64_LEN: {len(b64)}")
                  for i in range(0, len(b64), 1200):
                      print(f"{tag}_C{i//1200:04d}: {b64[i:i+1200]}")
              except Exception as e:
                  print(f"{tag}: ERROR {e}")
          PYEOF
