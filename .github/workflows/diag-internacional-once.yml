name: DIAG once - BBC CNN Bloomberg
on:
  push:
    branches:
      - claude/diag-internacional-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test BBC, CNN, Bloomberg reachability + article links
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "=== BBC News ==="
          curl -s -o /dev/null -w "sitemap: %{http_code}\n" -A "$UA" "https://www.bbc.com/sitemap.xml"
          curl -s -A "$UA" "https://www.bbc.com/news" -o /tmp/bbc.html -w "homepage: %{http_code} %{size_download} bytes\n"
          grep -oE 'href="/news/articles/[a-z0-9]+"' /tmp/bbc.html | sort -u | head -6
          grep -oE 'href="/news/world[a-z0-9/-]*-[0-9]{6,}"' /tmp/bbc.html | sort -u | head -6

          echo ""
          echo "=== CNN International ==="
          curl -s -o /dev/null -w "sitemap: %{http_code}\n" -A "$UA" "https://www.cnn.com/sitemap.xml"
          curl -s -A "$UA" "https://www.cnn.com/world" -o /tmp/cnn.html -w "homepage: %{http_code} %{size_download} bytes\n"
          grep -oE 'href="/2026/[0-9]{2}/[0-9]{2}/[a-z-]+/[a-z0-9.-]+/index.html"' /tmp/cnn.html | sort -u | head -6

          echo ""
          echo "=== Bloomberg ==="
          curl -s -o /dev/null -w "sitemap: %{http_code}\n" -A "$UA" "https://www.bloomberg.com/feeds/sitemap_news.xml"
          curl -s -A "$UA" "https://www.bloomberg.com/world" -o /tmp/bb.html -w "homepage: %{http_code} %{size_download} bytes\n"
          grep -oE 'href="/news/articles/2026-[0-9]{2}-[0-9]{2}/[a-z0-9-]+"' /tmp/bb.html | sort -u | head -6
