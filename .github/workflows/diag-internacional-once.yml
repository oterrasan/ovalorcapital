name: DIAG once - CNN NYPost link patterns
on:
  push:
    branches:
      - claude/diag-internacional-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Find real article link patterns for CNN and NY Post
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "=== CNN world page - loose href scan ==="
          curl -s -A "$UA" "https://www.cnn.com/world" -o /tmp/cnn.html
          grep -oE 'href="/2026/[0-9]{2}/[0-9]{2}/[a-zA-Z0-9/._-]+"' /tmp/cnn.html | sort -u | head -10
          echo "--- fallback loose ---"
          grep -oE 'href="[^"]*2026[^"]*"' /tmp/cnn.html | sort -u | head -10

          echo ""
          echo "=== NY Post sitemap (follow redirect) ==="
          curl -sL -A "$UA" "https://nypost.com/sitemap.xml" | head -c 800
          echo ""
          echo "=== NY Post world-news homepage - loose href scan ==="
          curl -s -A "$UA" "https://nypost.com/world-news/" -o /tmp/nyp.html
          grep -oE 'href="https://nypost\.com/[0-9]{4}/[0-9]{2}/[0-9]{2}/[a-zA-Z0-9/._-]+"' /tmp/nyp.html | sort -u | head -10
