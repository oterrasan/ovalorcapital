name: Smoke test pós-deploy

on:
  push:
    branches: [main]

jobs:
  smoke-test:
    name: Verificar portal ao vivo
    runs-on: ubuntu-latest

    steps:
      - name: Aguardar deploy Vercel (~3 min)
        run: |
          echo "Aguardando deploy Vercel completar..."
          sleep 180

      - name: Verificar homepage
        id: check_home
        run: |
          HTTP_CODE=$(curl -s -o /tmp/homepage.html -w "%{http_code}" \
            --max-time 20 \
            -H "User-Agent: Mozilla/5.0 (compatible; OVC-HealthCheck/1.0)" \
            "https://www.ovalorcapital.com.br")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "result=fail" >> $GITHUB_OUTPUT
            echo "reason=Homepage retornou HTTP $HTTP_CODE" >> $GITHUB_OUTPUT
            exit 1
          fi

          if grep -qi "em breve\|coming soon\|under construction" /tmp/homepage.html; then
            echo "result=fail" >> $GITHUB_OUTPUT
            echo "reason=Homepage mostrando página vazia ou placeholder (sem artigos)" >> $GITHUB_OUTPUT
            exit 1
          fi

          if ! grep -q "O Valor Capital" /tmp/homepage.html; then
            echo "result=fail" >> $GITHUB_OUTPUT
            echo "reason=Homepage não contém conteúdo esperado do portal" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "result=ok" >> $GITHUB_OUTPUT
          echo "✅ Homepage OK (HTTP 200, conteúdo válido)"

      - name: Verificar página de categoria
        id: check_cat
        if: success()
        run: |
          HTTP_CODE=$(curl -s -o /tmp/categoria.html -w "%{http_code}" \
            --max-time 20 \
            -H "User-Agent: Mozilla/5.0 (compatible; OVC-HealthCheck/1.0)" \
            "https://www.ovalorcapital.com.br/politica/")

          echo "HTTP status /politica/: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "result=fail" >> $GITHUB_OUTPUT
            echo "reason=Página /politica/ retornou HTTP $HTTP_CODE" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "result=ok" >> $GITHUB_OUTPUT
          echo "✅ /politica/ OK"

      - name: Criar issue de alerta se falhar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.sha.slice(0, 7);
            const hora = new Date().toLocaleString('pt-BR', {
              timeZone: 'America/Sao_Paulo',
              day: '2-digit', month: '2-digit', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 PORTAL FORA DO AR — detectado automaticamente`,
              body: [
                '## Portal OVC com problema detectado automaticamente',
                '',
                `**Commit:** \`${commit}\``,
                `**Horário:** ${hora} (Brasília)`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**Verificar imediatamente:** https://www.ovalorcapital.com.br',
                '',
                '---',
                '_Issue criada automaticamente pelo smoke test pós-deploy._'
              ].join('\n'),
              labels: ['bug']
            });

            console.log('🚨 Issue de alerta criada no GitHub!');
