name: OVC Pipeline — Schedule BRT

on:
  schedule:
    # Bloco 1: 07:00–10:00 BRT (10:00–12:50 UTC)
    - cron: '*/10 10,11,12 * * *'
    # Bloco 2: 10:40–12:40 BRT (13:40–15:40 UTC)
    - cron: '40,50 13 * * *'
    - cron: '*/10 14 * * *'
    - cron: '0,10,20,30,40 15 * * *'
    # Bloco 3: 14:00–16:30 BRT (17:00–19:30 UTC)
    - cron: '*/10 17,18 * * *'
    - cron: '0,10,20,30 19 * * *'
    # Bloco 4: 18:00–00:00 BRT (21:00–02:50 UTC)
    - cron: '*/10 21,22,23 * * *'
    - cron: '*/10 0,1,2 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gerar artigo
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"count":1}' \
            --max-time 90
          echo "done"
