name: OVC Pipeline — 08h-00h BRT, a cada 5min

on:
  schedule:
    - cron: '*/5 11-23 * * *'  # 08:00–20:55 BRT (11:00–23:55 UTC)
    - cron: '*/5 0-2 * * *'    # 21:00–23:55 BRT (00:00–02:55 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gerar artigo
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"count":1}' \
            --max-time 90
          echo "done"
