name: OVC Pipeline — a cada 2min

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gerar artigo
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"count":1}' \
            --max-time 90
          echo "done"
