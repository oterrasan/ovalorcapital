name: OVC Pipeline Portal

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Executar pipeline em paralelo
        run: |
          set +e
          URL="https://www.ovalorcapital.com.br/api/run_portal"
          H="Content-Type: application/json"

          # Rodada 1
          for i in 1 2 3 4 5 6; do
            curl -s -X POST "$URL" -H "$H" --max-time 50 &
          done
          wait
          sleep 5

          # Rodada 2
          for i in 1 2 3 4 5 6; do
            curl -s -X POST "$URL" -H "$H" --max-time 50 &
          done
          wait
          sleep 5

          # Rodada 3
          for i in 1 2 3 4 5 6; do
            curl -s -X POST "$URL" -H "$H" --max-time 50 &
          done
          wait

          exit 0
