name: OVC Pipeline Portal

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Executar pipeline
        run: |
          set +e
          i=1
          while [ $i -le 55 ]; do
            curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
              -H "Content-Type: application/json" \
              --max-time 50 || true
            echo ""
            i=$((i+1))
            sleep 60
          done
          exit 0
