name: OVC Pipeline Portal

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Executar pipeline portal
        run: |
          curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
            -H "Content-Type: application/json" \
            --max-time 55 \
            -o /tmp/result.json 2>&1
          cat /tmp/result.json
