name: OVC Pipeline Portal

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Executar pipeline
        run: |
          set +e
          for i in 1 2 3 4 5 6; do
            curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal \
              -H "Content-Type: application/json" \
              --max-time 55 || true
            sleep 50
          done
          exit 0
