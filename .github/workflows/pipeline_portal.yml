name: OVC Pipeline Portal

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Loop pipeline portal
        shell: bash
        run: |
          set +e
          for i in $(seq 1 55); do
            RESULT=$(curl -s -X POST https://www.ovalorcapital.com.br/api/run_portal -H "Content-Type: application/json" --max-time 50 2>/dev/null)
            echo "[$i] $RESULT"
            case "$RESULT" in
              *limit_reached*) echo "Limite atingido, encerrando."; break ;;
            esac
            sleep 60
          done
          exit 0
