name: DIAG once - seen links internacional
on:
  push:
    branches: [diag/internacional-seen]
    paths:
      - '.github/workflows/diag-seen-internacional.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar os 3 canais em produção real e olhar brutosLen/prontosLen
        run: |
          for TIPO in internacional brasilon jovempan_politica; do
            echo "=== $TIPO ==="
            RESP=$(curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
              -H "Content-Type: application/json" \
              -d "{\"tipo\":\"$TIPO\",\"force\":true,\"count\":2}")
            echo "$RESP"
            echo ""
          done
