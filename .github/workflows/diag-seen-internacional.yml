name: DIAG once - seen links internacional
on:
  push:
    branches: [diag/internacional-seen]
    paths:
      - '.github/workflows/diag-seen-internacional.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query all 3 SEEN_LINKS_* config rows from Supabase
        run: |
          for K in SEEN_LINKS_INTERNACIONAL SEEN_LINKS_BRASILON SEEN_LINKS_JOVEMPAN_POLITICA; do
            echo "=== $K ==="
            curl -s "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?key=eq.$K&select=key,value,updated_at" \
              -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40" \
              -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40" \
              -o "seen_$K.json" -w "HTTP:%{http_code} BYTES:%{size_download}\n"
            wc -c "seen_$K.json"
            head -c 600 "seen_$K.json"
            echo ""
          done

      - name: Try a manual upsert to SEEN_LINKS_INTERNACIONAL (does write actually work here?)
        run: |
          curl -s -X POST "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d '{"key":"DIAG_TEST_UPSERT","value":"{\"a\":1}","updated_at":"2026-08-13T23:00:00Z"}' \
            -o upsert_result.json -w "HTTP:%{http_code}\n"
          echo "=== upsert_result.json ==="
          cat upsert_result.json
          echo ""
          echo "=== read back DIAG_TEST_UPSERT ==="
          curl -s "https://yntwvfcxjardzafdqanj.supabase.co/rest/v1/config?key=eq.DIAG_TEST_UPSERT&select=key,value" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40"
          echo ""
