name: DIAG once - seen links internacional
on:
  push:
    branches: [diag/internacional-seen]
    paths:
      - '.github/workflows/diag-seen-internacional.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar internacional em produção e ver o campo debug (erro real do Supabase)
        run: |
          RESP=$(curl -s -X POST "https://www.ovalorcapital.com.br/api/run_portal" \
            -H "Content-Type: application/json" \
            -d '{"tipo":"internacional","force":true,"count":2}')
          echo "$RESP"
