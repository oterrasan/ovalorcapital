name: diag-brasilon-db
on:
  push:
    paths:
      - '.github/workflows/diag-brasilon-db.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js --no-save
      - run: |
          node -e '
          import("@supabase/supabase-js").then(async ({ createClient }) => {
            const supabase = createClient("https://yntwvfcxjardzafdqanj.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InludHd2ZmN4amFyZHphZmRxYW5qIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NTMwMywiZXhwIjoyMDk1OTMxMzAzfQ.BX1N_0wHoICwK5V8-96KXaMMbA8tQManVelxS1-pO40");
            const { data, error } = await supabase.from("posts").select("id,titulo,imagem,created_at,hash").eq("subcategoria_slug", "brasil-on").order("created_at", { ascending: false });
            if (error) { console.log("ERRO:", error); return; }
            console.log("TOTAL brasil-on:", data.length);
            const semImg = data.filter(p => !p.imagem);
            const comImg = data.filter(p => p.imagem);
            console.log("SEM imagem:", semImg.length);
            console.log("COM imagem:", comImg.length);
            console.log("--- SEM IMAGEM (id | created_at | titulo) ---");
            semImg.forEach(p => console.log(p.id, "|", p.created_at, "|", p.titulo));
            console.log("--- COM IMAGEM (id | created_at | titulo) ---");
            comImg.forEach(p => console.log(p.id, "|", p.created_at, "|", p.titulo));
          });
          '
