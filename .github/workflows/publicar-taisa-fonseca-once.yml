name: Publicar coluna Taísa da Fonseca (one-off)

# Uso único, a pedido de Roberto (08/08/2026) — sobe a coluna "O empreendedorismo
# começa pela identidade" no perfil da colunista já cadastrada (taisa-da-fonseca).
# Este arquivo e os assets em scripts/one-off/ são removidos assim que a
# publicação for confirmada.
#
# Trigger via push+paths (mesmo padrão de diag-once.yml) em vez de só
# workflow_dispatch: a integração usada nesta sessão não tem permissão
# "workflows: write" pra disparar workflow_dispatch pela API — 403 "Resource
# not accessible by integration". Qualquer push em main que toque este
# arquivo dispara a run automaticamente.
#
# NÃO mexe na foto de perfil da colunista — Roberto confirmou que ela já
# tem foto padrão cadastrada. As duas imagens enviadas por ele são só desta
# matéria: uma como capa (campo imagem do post) e a outra embutida no corpo
# do texto (ver scripts/one-off/*.html).
#
# Fix 08/08/2026 (1/2): a primeira tentativa passava a ação via "?action=..."
# na URL, mas o endpoint POST só lê a ação de dentro do corpo JSON
# (const action = String(body.action || "") em api/manage.js) — sem o
# campo "action" no JSON, tudo caía no fallback genérico
# "acao_indisponivel_no_modo_emergencia". Corrigido: action agora vai no
# corpo, montado por build_payload_taisa.py.
#
# Fix 08/08/2026 (2/2): segunda tentativa avançou até checkAdmin(), mas usava
# a chave "pass" no corpo — checkAdmin() só lê body.token/body.admin_token/
# req.query.pass, nunca body.pass. Corrigido para "token".
#
# Fix 08/08/2026 (3/3): este toque é só pra disparar o push+paths de novo —
# o commit anterior só mudou scripts/one-off/build_payload_taisa.py, não
# este arquivo, então o trigger não disparou sozinho.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/publicar-taisa-fonseca-once.yml"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Montar payload da matéria
        run: python3 scripts/one-off/build_payload_taisa.py

      - name: Publicar matéria
        run: |
          curl -s -X POST "https://www.ovalorcapital.com.br/api/manage" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json
          echo ""
