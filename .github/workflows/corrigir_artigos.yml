name: Corrigir Artigos com Markdown

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir_artigos.yml'

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Processar todos os artigos quebrados
        run: |
          RODADA=0
          MAX_RODADAS=600
          ERROS_CONSECUTIVOS=0

          echo "Iniciando correcao de artigos com markdown..."

          while [ "$RODADA" -lt "$MAX_RODADAS" ]; do
            RODADA=$((RODADA + 1))

            RESP=$(curl -s --max-time 20 \
              "https://www.ovalorcapital.com.br/api/run_portal?action=regenerar&limit=1")

            RESTANTES=$(echo "$RESP" | grep -o '"restantes":[0-9]*' | grep -o '[0-9]*$')
            OK=$(echo "$RESP" | grep -o '"ok":[0-9]*' | grep -o '[0-9]*$')
            STATUS=$(echo "$RESP" | grep -o '"status":"[^"]*"' | head -1 | sed 's/"status"://;s/"//g')

            echo "[Rodada $RODADA] status=$STATUS ok=$OK restantes=$RESTANTES"

            if [ -z "$RESTANTES" ] || [ "$STATUS" = "error" ]; then
              ERROS_CONSECUTIVOS=$((ERROS_CONSECUTIVOS + 1))
              echo "  Resposta invalida (tentativa $ERROS_CONSECUTIVOS): $RESP"
              if [ "$ERROS_CONSECUTIVOS" -ge 5 ]; then
                echo "5 erros consecutivos — abortando"
                exit 1
              fi
              sleep 30
              continue
            fi

            ERROS_CONSECUTIVOS=0

            if [ "$RESTANTES" = "0" ]; then
              echo "TODOS OS ARTIGOS CORRIGIDOS apos $RODADA rodadas!"
              break
            fi

            sleep 13
          done

          echo "Fim: $RODADA rodadas executadas"
