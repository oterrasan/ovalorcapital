name: DIAG once - ranking.org.br investigation
on:
  push:
    branches:
      - claude/diag-ranking-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Investigate ranking.org.br structure
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "=== Homepage ==="
          curl -s -A "$UA" "https://ranking.org.br/" -o /tmp/rk.html -w "status: %{http_code} bytes: %{size_download}\n"
          echo "--- title/meta ---"
          grep -oE '<title>[^<]+</title>' /tmp/rk.html | head -3
          grep -oE '<meta name="description"[^>]+>' /tmp/rk.html | head -3
          echo "--- nav/menu links ---"
          grep -oE 'href="/[a-z0-9/-]+"' /tmp/rk.html | sort -u | head -30
          echo "--- scripts loaded (framework hint) ---"
          grep -oE '<script[^>]+src="[^"]+"' /tmp/rk.html | head -10
          echo "--- api/data hints in html ---"
          grep -oE '"[a-zA-Z0-9_/-]*api[a-zA-Z0-9_/-]*"' /tmp/rk.html | sort -u | head -20
          echo "--- size ---"
          wc -c /tmp/rk.html
