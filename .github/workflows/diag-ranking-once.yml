name: DIAG once - ranking.org.br methodology + data source
on:
  push:
    branches:
      - claude/diag-ranking-once
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Investigate methodology and data source
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "=== /criterios-e-metodologia ==="
          curl -s -A "$UA" "https://ranking.org.br/criterios-e-metodologia" -o /tmp/crit.html -w "status: %{http_code}\n"
          python3 -c "
import re
html = open('/tmp/crit.html').read()
text = re.sub(r'<script[^>]*>.*?</script>', '', html, flags=re.S)
text = re.sub(r'<style[^>]*>.*?</style>', '', text, flags=re.S)
text = re.sub(r'<[^>]+>', ' ', text)
text = re.sub(r'\s+', ' ', text).strip()
print(text[:3000])
"
          echo ""
          echo "=== /ranking/politicos sample ==="
          curl -s -A "$UA" "https://ranking.org.br/ranking/politicos" -o /tmp/rkp.html -w "status: %{http_code} bytes: %{size_download}\n"
          grep -oE 'href="/perfil/[a-z-]+"' /tmp/rkp.html | sort -u | head -10
          echo ""
          echo "=== /nossa-atuacao/radar-politico ==="
          curl -s -A "$UA" "https://ranking.org.br/nossa-atuacao/radar-politico" -o /tmp/radar.html -w "status: %{http_code}\n"
          python3 -c "
import re
html = open('/tmp/radar.html').read()
text = re.sub(r'<script[^>]*>.*?</script>', '', html, flags=re.S)
text = re.sub(r'<style[^>]*>.*?</style>', '', text, flags=re.S)
text = re.sub(r'<[^>]+>', ' ', text)
text = re.sub(r'\s+', ' ', text).strip()
print(text[:2000])
"
