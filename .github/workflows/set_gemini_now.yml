name: Set Gemini Key Agora

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set_gemini_now.yml'

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar GEMINI_API_KEY no Vercel
        run: |
          PROJECT_ID="prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b"
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          KEY_VALUE="AIzaSyD0QBNrsr7OsVGJxqcBHhl9XvIxhTLuV0Y"

          echo "Buscando envs existentes..."
          RESP=$(curl -s "https://api.vercel.com/v9/projects/${PROJECT_ID}/env" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "Resposta: $RESP"

          ENV_ID=$(echo "$RESP" | python3 -c "import sys,json; envs=json.load(sys.stdin).get('envs',[]); match=[e['id'] for e in envs if e['key']=='GEMINI_API_KEY']; print(match[0] if match else '')" 2>/dev/null || echo '')
          echo "ENV_ID encontrado: $ENV_ID"

          if [ -n "$ENV_ID" ]; then
            echo "Atualizando chave existente..."
            curl -s -X PATCH "https://api.vercel.com/v9/projects/${PROJECT_ID}/env/${ENV_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"value\":\"${KEY_VALUE}\",\"target\":[\"production\",\"preview\"]}"
          else
            echo "Criando nova chave..."
            curl -s -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "[{\"key\":\"GEMINI_API_KEY\",\"value\":\"${KEY_VALUE}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}]"
          fi
          echo "Chave configurada."

      - name: Trigger redeploy
        run: |
          PROJECT_ID="prj_ACuRPH3NLCgzsFysuSqnUqSjBr5b"
          TOKEN="${{ secrets.VERCEL_TOKEN }}"

          echo "Buscando ultimo deployment de producao..."
          DEPLOY_RESP=$(curl -s "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&limit=1&target=production" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "Deployments: $DEPLOY_RESP"

          DEPLOY_ID=$(echo "$DEPLOY_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin).get('deployments',[]); print(d[0]['uid'] if d else '')" 2>/dev/null || echo '')
          echo "DEPLOY_ID: $DEPLOY_ID"

          if [ -n "$DEPLOY_ID" ]; then
            echo "Disparando redeploy..."
            curl -s -X POST "https://api.vercel.com/v13/deployments" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"deploymentId\":\"${DEPLOY_ID}\",\"name\":\"ovalorcapital\",\"target\":\"production\"}"
            echo "Redeploy disparado."
          fi
