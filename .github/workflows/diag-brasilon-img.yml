name: Diagnóstico único — Brasil ON pipeline de imagem

on:
  push:
    paths:
      - '.github/workflows/diag-brasilon-img.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar deps (axios, cheerio, sharp, supabase-js)
        run: npm install axios cheerio sharp @supabase/supabase-js --no-save --silent

      - name: Testar scrape + processAndSaveImage em links reais da Bacci
        run: |
          node -e "
          import('./core/brasilon.js').then(async (brasilon) => {
            const scraper = await import('./core/scraper.js');
            const imgProc = await import('./core/image_processor.js');
            const candidatos = await brasilon.buscarCandidatosBrasilOn();
            const bacci = candidatos.filter(c => c.source === 'Bacci Notícias').slice(0, 5);
            console.log('CANDIDATOS_BACCI:', bacci.length);
            for (const item of bacci) {
              console.log('---');
              console.log('LINK:', item.link);
              try {
                const a = await scraper.scrape(item.link);
                console.log('SCRAPE_IMAGE:', a.image || '(vazio)');
                console.log('SCRAPE_TEXT_LEN:', a.text.length);
                if (a.image) {
                  const start = Date.now();
                  const hash = 'diag' + Date.now();
                  const result = await imgProc.processAndSaveImage(a.image, hash.slice(0,12), start, { watermarkLabel: '', skipVision: true });
                  console.log('PROCESS_RESULT:', result || '(null — falhou)');
                }
              } catch (e) {
                console.log('ERRO:', e.message);
              }
            }
          }).catch(e => { console.error('ERRO_FATAL:', e.message); process.exit(1); });
          "
